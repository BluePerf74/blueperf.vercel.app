<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Blueperf Académie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EFF2F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --line:#DCE2EA; --line-2:#C9D1DD;
  --ink:#0E1A2C; --ink-2:#3B495D; --muted:#667386;
  --accent:#1B46C9; --accent-ink:#FFFFFF; --accent-soft:#E4EBFB;
  --s2:#0C8A8A; --s3:#8A5CC7;
  --good:#1D8752; --good-soft:#DDF1E5; --warn:#B7760A; --warn-soft:#FBEFD6; --crit:#C23A2E; --crit-soft:#F9E0DD;
  --nav:#0E1A2C; --nav-ink:#C7D1E0; --nav-ink-2:#8190A6; --nav-active:#1B2B45;
  --shadow:0 1px 2px rgba(14,26,44,.06),0 4px 14px rgba(14,26,44,.05);
  --fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#090E16; --surface:#111925; --surface-2:#0D141E; --line:#213046; --line-2:#2D3F58;
    --ink:#E6ECF4; --ink-2:#B6C1D0; --muted:#8392A7;
    --accent:#7B9BFF; --accent-ink:#08101E; --accent-soft:#18264A;
    --s2:#3CC4C0; --s3:#B792F0;
    --good:#43C283; --good-soft:#12301F; --warn:#E3AA3E; --warn-soft:#33260C; --crit:#F16B5E; --crit-soft:#3A1714;
    --nav:#060A10; --nav-ink:#B9C4D4; --nav-ink-2:#6F7E94; --nav-active:#15213A;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#090E16; --surface:#111925; --surface-2:#0D141E; --line:#213046; --line-2:#2D3F58;
  --ink:#E6ECF4; --ink-2:#B6C1D0; --muted:#8392A7;
  --accent:#7B9BFF; --accent-ink:#08101E; --accent-soft:#18264A;
  --s2:#3CC4C0; --s3:#B792F0;
  --good:#43C283; --good-soft:#12301F; --warn:#E3AA3E; --warn-soft:#33260C; --crit:#F16B5E; --crit-soft:#3A1714;
  --nav:#060A10; --nav-ink:#B9C4D4; --nav-ink-2:#6F7E94; --nav-active:#15213A;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:block;min-height:100%}
/* NAV — barre horizontale en haut */
.nav{background:var(--nav);color:var(--nav-ink);padding:8px 14px;position:sticky;top:0;z-index:30;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 10px}
.brand{padding:0 10px 0 0;margin-right:4px;flex:none;display:flex;flex-direction:column;justify-content:center;line-height:1}
.brand b{font-family:var(--fd);font-size:19px;letter-spacing:.02em;color:#fff;display:block;line-height:1}
.brand span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--nav-ink-2)}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:row;flex-wrap:wrap;gap:2px 3px;align-items:center}
.nav li{position:relative;flex:none}
.nav button.ni{width:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;background:none;border:0;color:var(--nav-ink);padding:8px 11px;border-radius:7px;cursor:pointer;text-align:left;font-weight:500;white-space:nowrap}
.nav button.ni:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.ni.on{background:var(--nav-active);color:#fff;box-shadow:inset 0 -3px 0 #6E8FFF}
.nav .sub{position:absolute;top:100%;left:0;margin-top:4px;background:var(--nav);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:6px;min-width:170px;box-shadow:0 10px 26px rgba(0,0,0,.5);z-index:40;display:flex;flex-direction:column}
.nav .sub button.ni{font-size:13px;padding:7px 10px;width:100%}
.nav .chev{font-size:10px;opacity:.7;transition:transform .15s}
.nav .open .chev{transform:rotate(90deg)}
.badge{font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;border-radius:20px;background:rgba(255,255,255,.1)}
.badge.crit{background:#C23A2E;color:#fff}
.badge.warn{background:#B7760A;color:#fff}
.navfoot{margin-left:auto;font-size:11px;color:var(--nav-ink-2);padding:4px 8px;white-space:nowrap;flex:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.ok{background:#43C283}.dot.loc{background:#E3AA3E}
/* MAIN */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:static;background:transparent;border-bottom:1px solid var(--line);padding-block:12px;padding-inline:24px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.top h1{font-family:var(--fd);font-weight:700;font-size:28px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.top .ctx{font-size:12px;color:var(--muted);margin-top:3px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.content{padding-block:20px 60px;padding-inline:24px;display:flex;flex-direction:column;gap:18px;max-width:1500px;width:100%}
.banner{border:1px solid var(--line-2);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.banner p{margin:0;max-width:75ch}
/* CARDS & GRID */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card h2,.card h3{margin:0 0 10px;font-family:var(--fd);font-weight:600;letter-spacing:.01em}
.card h2{font-size:20px}
.card h3{font-size:17px}
.hrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 12px;margin-bottom:10px}
.hrow h2,.hrow h3{margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--fd);font-size:34px;font-weight:700;line-height:1.05}
.kpi .v small{font-size:16px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.muted{color:var(--muted)}
.small{font-size:12px}
.note{font-size:12px;color:var(--muted);max-width:80ch}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sb{justify-content:space-between}
/* PILLS */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.pill .ic{width:7px;height:7px;border-radius:50%;background:currentColor}
/* TABLES */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.wrap{white-space:normal;min-width:220px}
.plink{background:none;border:0;padding:0;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.plink:hover{color:var(--accent);text-decoration-color:var(--accent)}
.hm td.c{text-align:center;font-size:12px;font-weight:600;min-width:38px;padding:5px 4px}
/* FORMS */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--crit)}
.btn.danger.arm{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,.ni:focus-visible,.plink:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.flabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.gridin input,.gridin select{padding:4px 6px;width:66px;border-radius:5px}
.gridin input.w{width:130px}
.gridin td{padding:4px 6px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:8px}
.subtabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.subtabs button.on{background:var(--surface);border-color:var(--line-2);color:var(--accent);box-shadow:var(--shadow)}
/* CHARTS */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--fb)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;max-width:260px;white-space:pre-line;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
/* TRAINING */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px;display:flex;flex-direction:column;gap:7px;min-height:160px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.day .dh b{font-family:var(--fd);font-size:17px}
.jx{font-family:var(--fd);font-weight:700;font-size:14px;color:var(--accent)}
.jx.m{color:var(--crit)}
.ent{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:6px 7px;font-size:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:3px}
.ent.match{border-left-color:var(--crit)}
.ent.rec{border-left-color:var(--s2)}
.ent.salle{border-left-color:var(--s3)}
.ent b{font-size:12.5px}
.ent .acts{display:flex;gap:4px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .ch{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px}
.cal .cd{background:var(--surface);border:1px solid var(--line);border-radius:7px;min-height:84px;padding:5px;font-size:11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .cd.out{opacity:.4}
.cal .cd.today{border-color:var(--accent)}
.cal .cd .t{font-weight:700;font-size:12px}
.cal .tag{border-radius:4px;padding:1px 4px;background:var(--accent-soft);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .tag.match{background:var(--crit-soft)}
.cal .tag.done::before{content:"✓ ";color:var(--good);font-weight:700}
.phases{position:relative;height:34px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.phases .ph{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;border-right:2px solid var(--surface)}
.phases .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
/* RECO */
.reco{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;box-shadow:var(--shadow)}
.reco .pr{grid-row:span 3;width:4px;border-radius:4px;background:var(--accent)}
.reco.hi .pr{background:var(--crit)} .reco.md .pr{background:var(--warn)} .reco.lo .pr{background:var(--good)}
.reco h3{margin:0;font-size:15px;font-family:var(--fb);font-weight:700}
.reco p{margin:0;color:var(--ink-2);max-width:95ch}
.reco .act{color:var(--ink)}
.aiout{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:520px;overflow:auto;font-size:13.5px;line-height:1.55}
/* REATHLE */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.steps div{font-size:11px;font-weight:600;padding:6px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);text-align:center}
.steps div.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.steps div.cur{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bar{height:8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
/* DRAWER */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:21;overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 18px) 40px;padding-inline:20px;box-shadow:-10px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}
details summary{cursor:pointer;font-weight:600}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .nav{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 16px;gap:10px;align-items:center}
  .brand{border:0;padding:0 10px 0 0;flex:none}
  .brand span{display:none}
  .nav ul{flex-direction:row;gap:4px}
  .nav li{flex:none}
  .nav .sub{display:flex;padding-left:0}
  .nav button.ni{white-space:nowrap;padding:7px 10px}
  .navfoot{display:none}
  .top{position:static;padding-inline:16px}
  .content{padding-inline:16px}
  .g2,.g3{grid-template-columns:1fr}
  .g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Navigation"></nav>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="tip" role="tooltip"></div>
<div id="drawerHost"></div>

<script>
"use strict";
/* ===================== UTILS ===================== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const fr=(v,d=0)=>v==null||!isFinite(v)?'–':(+v).toLocaleString('fr-FR',{maximumFractionDigits:d,minimumFractionDigits:d});
const r0=v=>fr(v,0), r1=v=>fr(v,1), r2=v=>fr(v,2);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};
const TODAY=iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);};
const dayDiff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const mondayOf=s=>{const d=new Date(s+'T12:00:00');return addDays(s,-((d.getDay()+6)%7));};
const wd=s=>(new Date(s+'T12:00:00').getDay()+6)%7;
const fmtD=(s,o={weekday:'short',day:'numeric',month:'short'})=>s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR',o):'–';
const fmtShort=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}):'–';
const range=(a,b)=>{const o=[];for(let d=a;d<=b;d=addDays(d,1))o.push(d);return o;};
const mean=a=>{a=a.filter(x=>x!=null&&isFinite(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null;};
const sd=a=>{a=a.filter(x=>x!=null&&isFinite(x));if(a.length<2)return null;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1));};
const sum=a=>a.reduce((s,x)=>s+(x||0),0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ===================== SETTINGS ===================== */
const MODE=(function(){try{return new URLSearchParams(location.search).get('mode')==='individuel'?'individuel':'football';}catch(e){return 'football';}})();
const DB_PREFIX=MODE==='individuel'?'ci':'aca';               // espace de données séparé pour le coaching individuel

let demoWarned=0;
async function put(col,id,obj,silent){
  obj=JSON.parse(JSON.stringify(obj));
  DATA[col][id]=obj;
  if(Store.demo){if(Date.now()-demoWarned>8000){demoWarned=Date.now();toast('Mode exemple : modification visible mais non enregistrée');}if(!silent)scheduleRender(true);return;}
  if(Store.mode==='db'){try{await Store.db.collection(col).doc(id).set(obj);}catch(e){toast(dbErr(e));}}
  else saveLocal();
  if(!silent)scheduleRender(true);
}
async function del(col,id){

}
function dbErr(e){const c=e&&e.code;if(c==='quota_exceeded')return 'Base pleine : supprime d’anciennes données';if(c==='invalid_argument')return "Tu n'as pas les droits d'écriture sur cette page";return 'Enregistrement impossible pour le moment, réessaie';}

let renderQueued=false, formDirty=false, pendingRender=false;
function isEditingField(){const a=document.activeElement;return !!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.id!=='refDate'&&a.closest('#content,#drawerHost'));}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender&&!isEditingField()&&!formDirty){pendingRender=false;scheduleRender();}},250);});

/* ===== Backend Vercel (base partagée Upstash + IA) — remplace window.claude ===== */
function makeApiDb(){
  const cache={},listeners={},timers={},queue={},pending={};
  async function fetchCol(col){
    try{const r=await fetch('/api/storage?action=get&key='+encodeURIComponent(DB_PREFIX+':'+col)+'&_='+Date.now(),{cache:'no-store'});
      if(!r.ok)return null;const j=await r.json();return j&&j.value?JSON.parse(j.value):{};}catch(e){return null;}
  }
  function emit(col){const map=cache[col]||{};const docs=Object.keys(map).map(id=>({id,data:()=>map[id]}));(listeners[col]||[]).forEach(cb=>{try{cb({docs});}catch(e){}});}
  function save(col){
    pending[col]=(pending[col]||0)+1;
    queue[col]=(queue[col]||Promise.resolve()).then(async()=>{
      try{await fetch('/api/storage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set',key:DB_PREFIX+':'+col,value:JSON.stringify(cache[col]||{})})});}catch(e){}
      pending[col]=Math.max(0,(pending[col]||1)-1);
    });
    return queue[col];
  }
  async function poll(col){if(pending[col])return;const m=await fetchCol(col);if(m&&!pending[col]){cache[col]=m;emit(col);}}
  return {collection(col){return {
    onSnapshot(cb,err){(listeners[col]=listeners[col]||[]).push(cb);
      fetchCol(col).then(m=>{cache[col]=m||{};emit(col);}).catch(e=>{if(err)err(e);});
      if(!timers[col])timers[col]=setInterval(()=>poll(col),8000);
      return ()=>{};},
    doc(id){return {
      set(obj){cache[col]=cache[col]||{};cache[col][id]=obj;emit(col);return save(col);},
      delete(){cache[col]=cache[col]||{};delete cache[col][id];emit(col);return save(col);}
    };}
  };}};
}
function makeSample(){
  return async function(prompt,opts){
    opts=opts||{};
    let r;
    try{r=await fetch('/api/reco',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt}),signal:opts.signal});}
    catch(e){if(e&&e.name==='AbortError'){const a=new Error('cancelled');a.code='cancelled';throw a;}const x=new Error('reco');x.code='error';throw x;}
    if(!r.ok){let code='error';try{const j=await r.json();code=j.code||code;}catch(e){}
      if(r.status===429)code='rate_limited';const err=new Error('reco '+r.status);err.code=code;throw err;}
    const j=await r.json();const text=j.text||'';
    if(opts.onText){try{opts.onText({text});}catch(e){}}
    return {text,truncated:!!j.truncated};
  };
}
function makeDownloads(){
  return {save:async({filename,data})=>{
    const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }};
}

async function boot(){
  const local=loadLocal();
  if(local&&Object.keys(local.config).length){DATA=local;Store.demo=false;}else{DATA=makeDemo();Store.demo=true;}
  Store.mode='pending';
  render();
  Store.downloads=makeDownloads();
  Store.sample=makeSample();
  if(UI.tab==='reco')scheduleRender();
  let db=null;
  try{db=makeApiDb();}catch(e){db=null;}
  if(!db){Store.mode='local';renderNavFoot();return;}
  Store.db=db;Store.mode='db';
  const fresh=empty();Store.fresh=fresh;const pending=new Set(COLS);
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});fresh[col]=o;
      if(pending.has(col)){pending.delete(col);if(!pending.size)firstLoad();}
      else if(Store.ready&&!Store.demo){DATA=fresh;scheduleRender();}
    },err=>{console.warn('db',col,err);});
  });
}
function firstLoad(){
  Store.ready=true;
  const f=Store.fresh;
  const has=COLS.some(c=>Object.keys(f[c]).length);
  if(has){Store.demo=false;DATA=f;}
  else{
    // aucune donnée partagée : si des données locales existent, on les propose ; sinon exemple
    const local=loadLocal();
    if(local&&Object.keys(local.players).length){DATA=local;Store.demo=true;Store.localImport=true;}
    else{DATA=makeDemo();Store.demo=true;}
  }
  render();
}
async function writeAll(src){
  if(Store.mode==='db'){
    const jobs=[];COLS.forEach(c=>Object.entries(src[c]).forEach(([id,o])=>jobs.push([c,id,o])));
    let i=0,done=0;const bar=$('#bulkProg');
    async function worker(){while(i<jobs.length){const [c,id,o]=jobs[i++];try{await Store.db.collection(c).doc(id).set(JSON.parse(JSON.stringify(o)));}catch(e){}done++;if(bar)bar.textContent=`Enregistrement… ${done}/${jobs.length}`;}}
    await Promise.all([worker(),worker(),worker(),worker()]);
    DATA=Store.fresh;
  }else{DATA=src;saveLocal();}
}
async function keepDemo(){
  const src=DATA;Store.demo=false;
  src.config.settings=Object.assign({},src.config.settings||{},{started:true});
  await writeAll(src);toast('Données enregistrées');render();
}
async function startEmpty(){
  Store.demo=false;
  const base=empty();base.config.settings={started:true};
  if(Store.mode==='db'){await Store.db.collection('config').doc('settings').set({started:true});DATA=Store.fresh;DATA.config.settings=DATA.config.settings||{started:true};}
  else{DATA=base;saveLocal();}
  UI.tab='entry';UI.entryTab='player';render();
}

    D.maxes[p.id]={id:p.id,values:{'Squat arrière':Math.round(m*J(1.1,1.6)/2.5)*2.5,'Soulevé de terre roumain':Math.round(m*J(1,1.4)/2.5)*2.5,'Développé couché':Math.round(m*J(.75,1.1)/2.5)*2.5,'Hip thrust':Math.round(m*J(1.4,2)/2.5)*2.5},

/* ===================== ANALYTICS ===================== */
let IDX=null;
function buildIndex(){
  const P={};Object.keys(DATA.players).forEach(id=>P[id]={days:{},vmaxObs:0});
  const add=(pid,date,e,dur,kind)=>{const p=P[pid];if(!p||!e)return;const d=p.days[date]||(p.days[date]={load:0,min:0,dist:0,hsr:0,sprint:0,acc:0,dec:0,vmax:0,match:false,n:0,gps:false});
    const min=num(e.min)??num(dur)??0;const rpe=num(e.rpe);if(rpe!=null)d.load+=rpe*min;d.min+=min;
    ['dist','hsr','sprint','acc','dec'].forEach(k=>{const v=num(e[k]);if(v!=null){d[k]+=v;d.gps=true;}});
    const vm=num(e.vmax)||0;d.vmax=Math.max(d.vmax,vm);if(kind==='match')d.match=true;d.n++;p.vmaxObs=Math.max(p.vmaxObs,vm);};
  Object.values(DATA.sessions).forEach(s=>Object.entries(s.players||{}).forEach(([pid,e])=>add(pid,s.date,e,s.duration,'session')));
  Object.values(DATA.matches).forEach(m=>Object.entries(m.players||{}).forEach(([pid,e])=>add(pid,m.date,e,m.duration,'match')));
  Object.values(DATA.injuries).forEach(i=>(i.log||[]).forEach(l=>add(i.pid,l.date,l,l.min,'reathle')));
  IDX=P;
}
const pday=(pid,d)=>(IDX[pid]&&IDX[pid].days[d])||null;
const vref=p=>Math.max(num(p.vmax)||0,(IDX[p.id]&&IDX[p.id].vmaxObs)||0)||null;
function loads(pid,end,n){const o=[];for(let i=n-1;i>=0;i--){const d=addDays(end,-i);const x=pday(pid,d);o.push(x?x.load:0);}return o;}
function ewma(pid,end){const la=2/8,lc=2/29;let a=0,c=0,seen=false,first=null;
  for(let i=69;i>=0;i--){const d=addDays(end,-i);const x=pday(pid,d);const v=x?x.load:0;if(v>0&&!seen){seen=true;first=i;a=v;c=v;continue;}if(!seen)continue;a=a+la*(v-a);c=c+lc*(v-c);}
  if(!seen)return{acute:null,chronic:null,acwr:null,days:0};return{acute:a,chronic:c,acwr:c>0?a/c:null,days:first};}
function weekStats(pid,end){const l=loads(pid,end,7);const s=sum(l);const m=s/7;const v=sd(l);const mono=v&&v>0?m/v:null;
  const prev=[1,2,3].map(k=>sum(loads(pid,addDays(end,-7*k),7)));const pm=mean(prev);
  return{sum:s,mono,strain:mono!=null?s*mono:null,prev:sum(loads(pid,addDays(end,-7),7)),prevAvg:pm,chg:pm?((s-pm)/pm*100):null};}
const WK=['sleep','fatigue','soreness','stress','mood'];
const WL={sleep:'Sommeil',fatigue:'Fatigue',soreness:'Courbatures',stress:'Stress',mood:'Humeur'};
function wScore(e){if(!e)return null;const v=WK.map(k=>num(e[k])).filter(x=>x!=null);if(!v.length)return null;return sum(v)/(v.length*5)*100;}
const wEntry=(pid,d)=>DATA.wellness[d]&&DATA.wellness[d].entries?DATA.wellness[d].entries[pid]:null;
const wOf=(pid,d)=>wScore(wEntry(pid,d));
function wStats(pid,end){const hist=[];for(let i=1;i<=28;i++){const v=wOf(pid,addDays(end,-i));if(v!=null)hist.push(v);}
  const today=wOf(pid,end);const m=mean(hist),s=sd(hist);
  return{today,mean:m,sd:s,z:(today!=null&&m!=null&&s)?(today-m)/Math.max(s,3):null};}
function activeInjury(pid,ref){return Object.values(DATA.injuries).filter(i=>i.pid===pid&&i.date<=ref&&i.status!=='apte').sort((a,b)=>b.date.localeCompare(a.date))[0]||null;}
function testBatteries(cat){return Object.values(DATA.tests).filter(t=>cat==='Tous'||t.cat===cat).sort((a,b)=>a.date.localeCompare(b.date));}
function testSeries(pid,tid){const o=[];Object.values(DATA.tests).sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{const v=b.results&&b.results[tid]?num(b.results[tid][pid]):null;if(v!=null)o.push({date:b.date,v});});return o;}
function lastVmaxExpo(p,ref){const v=vref(p);if(!v)return null;const th=S().th.vmaxPct/100*v;for(let i=0;i<60;i++){const d=addDays(ref,-i);const x=pday(p.id,d);if(x&&x.vmax>=th&&d<=ref)return i;}return null;}
const STATUS_LABEL={soins:'Soins',reathle:'Réathlétisation',reprise:'Reprise collective',apte:'Apte'};
function playerStatus(p,ref){
  const th=S().th;const R=[];let lv=0;const up=(l,t)=>{R.push({l,t});lv=Math.max(lv,l);};
  const inj=activeInjury(p.id,ref);
  if(inj){if(inj.status==='reprise')up(2,'Reprise collective ('+inj.zone+')');else up(3,(inj.status==='reathle'?'Réathlé phase '+((inj.phase||0)+1):'Blessé')+' — '+inj.zone);}
  const w=wStats(p.id,ref);
  if(w.today!=null){if(w.today<th.well)up(3,'Wellness '+r0(w.today)+' %');else if(w.z!=null&&w.z<th.wz*1.6)up(3,'Wellness très bas vs habitude (z '+r1(w.z)+')');else if(w.z!=null&&w.z<th.wz)up(2,'Wellness sous son habitude (z '+r1(w.z)+')');}
  const e=ewma(p.id,ref);
  if(e.acwr!=null&&e.days>=21){if(e.acwr>th.acwrHi+.2)up(3,'ACWR '+r2(e.acwr));else if(e.acwr>th.acwrHi)up(2,'ACWR '+r2(e.acwr));else if(e.acwr<th.acwrLo&&!inj)up(2,'Sous-charge (ACWR '+r2(e.acwr)+')');}
  const c=testSeries(p.id,'cmj');if(c.length>=2){const a=c[c.length-1].v,b=mean(c.slice(0,-1).map(x=>x.v));const drop=(b-a)/b*100;if(drop>th.cmjDrop)up(2,'CMJ −'+r1(drop)+' %');}
  const vx=lastVmaxExpo(p,ref);if(!inj&&(vx==null||vx>th.vmaxDays))up(1,vx==null?'Aucun sprint ≥ '+th.vmaxPct+' % Vmax enregistré':'Pas de sprint ≥ '+th.vmaxPct+' % Vmax depuis '+vx+' j');
  return{lv,reasons:R,w,e,inj,vx};
}
function lvPill(lv){return lv>=3?'<span class="pill crit"><span class="ic"></span>Rouge</span>':lv===2?'<span class="pill warn"><span class="ic"></span>Orange</span>':'<span class="pill good"><span class="ic"></span>Vert</span>';}
function wCls(v){const th=S().th.well;return v==null?'':v<th?'crit':v<th+12?'warn':'good';}
function acwrCls(v){const th=S().th;return v==null?'neutral':v>th.acwrHi+.2?'crit':v>th.acwrHi||v<th.acwrLo?'warn':'good';}
function nextMatch(cat,ref){
  const c=[];Object.values(DATA.plan).forEach(p=>{if(p.type==='Match'&&p.date>=ref&&(cat==='Tous'||p.cat===cat))c.push({date:p.date,cat:p.cat,label:p.title});});
  Object.values(DATA.matches).forEach(m=>{if(m.date>=ref&&(cat==='Tous'||m.cat===cat))c.push({date:m.date,cat:m.cat,label:'vs '+m.opponent});});
  return c.sort((a,b)=>a.date.localeCompare(b.date))[0]||null;}
function prevMatch(cat,ref){const c=Object.values(DATA.matches).filter(m=>m.date<ref&&(cat==='Tous'||m.cat===cat)).sort((a,b)=>b.date.localeCompare(a.date));return c[0]||null;}
function matchDays(cat){const s=new Set();Object.values(DATA.matches).forEach(m=>{if(cat==='Tous'||m.cat===cat)s.add(m.date);});Object.values(DATA.plan).forEach(p=>{if(p.type==='Match'&&(cat==='Tous'||p.cat===cat))s.add(p.date);});return [...s].sort();}
function jLabel(d,cat){const md=matchDays(cat);if(md.includes(d))return{t:'J',m:true};const nx=md.find(x=>x>d);const pv=[...md].reverse().find(x=>x<d);
  const a=nx?dayDiff(nx,d):99,b=pv?dayDiff(d,pv):99;if(a>6&&b>6)return null;if(b<=2&&b<a)return{t:'J+'+b};if(a<=6)return{t:'J-'+a};return{t:'J+'+b};}
function curPhase(cat,ref){return Object.values(DATA.phases).find(p=>(p.cat==='Tous'||cat==='Tous'||p.cat===cat)&&p.start<=ref&&p.end>=ref)||null;}
function age(b,ref){if(!b)return null;return dayDiff(ref,b)/365.25;}
</script>

<script>
/* ===================== CHARTS ===================== */
function niceTicks(a,b,n=4){if(a===b){a-=1;b+=1;}const span=b-a;const step0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const f=step0/mag;const step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const lo=Math.floor(a/step)*step,hi=Math.ceil(b/step)*step;const t=[];for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(6));return t;}
function lineChart(o){
  const W=640,H=o.h||190,L=40,Rp=12,T=10,B=24;const n=o.labels.length;if(!n)return '<div class="empty">Pas de données</div>';
  const vals=[];o.series.forEach(s=>s.values.forEach(v=>{if(v!=null&&isFinite(v))vals.push(v);}));(o.refs||[]).forEach(r=>vals.push(r.v));if(o.band){vals.push(o.band[0],o.band[1]);}
  if(!vals.length)return '<div class="empty">Pas encore de données sur la période</div>';
  let y0=o.yMin??Math.min(...vals),y1=o.yMax??Math.max(...vals);if(o.yMin==null){const p=(y1-y0)*.12||1;y0-=p;}if(o.yMax==null){const p=(y1-y0)*.1||1;y1+=p;}
  const tk=niceTicks(y0,y1,4);y0=Math.min(y0,tk[0]);y1=Math.max(y1,tk[tk.length-1]);
  const x=i=>L+(n<=1?(W-L-Rp)/2:i*(W-L-Rp)/(n-1)),y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const fmt=o.fmt||(v=>r0(v));
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'Graphique')}"><g class="grid">`;
  tk.forEach(t=>{g+=`<line x1="${L}" x2="${W-Rp}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`;});g+='</g>';
  if(o.band)g+=`<rect x="${L}" width="${W-L-Rp}" y="${y(o.band[1])}" height="${Math.max(0,y(o.band[0])-y(o.band[1]))}" fill="var(--good)" opacity=".09"/>`;
  (o.refs||[]).forEach(r=>{g+=`<line x1="${L}" x2="${W-Rp}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${r.color||'var(--crit)'}" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-Rp}" y="${y(r.v)-4}" text-anchor="end" style="fill:${r.color||'var(--crit)'}">${esc(r.label||'')}</text>`;});
  const step=Math.max(1,Math.ceil(n/8));o.labels.forEach((l,i)=>{if(i%step===0||i===n-1&&n<=10)g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(o.xfmt?o.xfmt(l):fmtShort(l))}</text>`;});
  o.series.forEach(s=>{let d='',area='',first=true;
    // ligne continue : on relie tous les points connus, sans couper aux jours sans donnée
    s.values.forEach((v,i)=>{if(v==null||!isFinite(v))return;d+=(first?'M':'L')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';first=false;});
    if(s.area){const pts=s.values.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(pts.length>1)area=`<path d="M${pts[0][0]} ${y(y0)} `+pts.map(p=>`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')+` L${pts[pts.length-1][0]} ${y(y0)} Z" fill="${s.color}" opacity=".10"/>`;}
    g+=area+`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    const li=s.values.map((v,i)=>v!=null&&isFinite(v)?i:-1).filter(i=>i>=0);
    if(s.dots)li.forEach(i=>{g+=`<circle cx="${x(i)}" cy="${y(s.values[i])}" r="3" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"/>`;});
    if(li.length){const i=li[li.length-1];g+=`<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;}
  });
  const cw=(W-L-Rp)/Math.max(1,n-1);
  o.labels.forEach((l,i)=>{const tip=(o.xfmt?o.xfmt(l):fmtD(l))+'\n'+o.series.map(s=>s.name+' : '+(s.values[i]==null?'–':(s.tipFmt||fmt)(s.values[i]))).join('\n');g+=`<rect x="${x(i)-cw/2}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent" data-tip="${esc(tip)}"/>`;});
  g+='</svg>';
  const leg=o.series.length>1?`<div class="legend">${o.series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return leg+g;
}
function barChart(o){
  const W=640,H=o.h||190,L=44,Rp=10,T=10,B=24;const n=o.labels.length;if(!n)return '<div class="empty">Pas de données</div>';
  const vals=o.values.filter(v=>v!=null);(o.refs||[]).forEach(r=>vals.push(r.v));const mx=Math.max(1,...vals);const tk=niceTicks(0,mx,4);const y1=tk[tk.length-1];
  const bw=(W-L-Rp)/n;const y=v=>T+(H-T-B)*(1-v/y1);const fmt=o.fmt||(v=>r0(v));
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'Graphique')}"><g class="grid">`;
  tk.forEach(t=>{g+=`<line x1="${L}" x2="${W-Rp}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`;});g+='</g>';
  o.values.forEach((v,i)=>{if(!v)return;const h=Math.max(1,y(0)-y(v));const bx=L+i*bw+Math.min(2,bw*.12);const w=Math.max(2,bw-Math.min(4,bw*.24));const c=(o.colors&&o.colors[i])||o.color||'var(--accent)';const r=Math.min(3,w/2);
    g+=`<path d="M${bx} ${y(0)} V${y(0)-h+r} Q${bx} ${y(0)-h} ${bx+r} ${y(0)-h} H${bx+w-r} Q${bx+w} ${y(0)-h} ${bx+w} ${y(0)-h+r} V${y(0)} Z" fill="${c}"/>`;});
  (o.refs||[]).forEach(r=>{g+=`<line x1="${L}" x2="${W-Rp}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${r.color||'var(--ink-2)'}" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-Rp}" y="${y(r.v)-4}" text-anchor="end">${esc(r.label||'')}</text>`;});
  const step=Math.max(1,Math.ceil(n/(o.maxLabels||10)));o.labels.forEach((l,i)=>{if(i%step===0)g+=`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${esc(o.xfmt?o.xfmt(l):fmtShort(l))}</text>`;});
  o.values.forEach((v,i)=>{g+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-tip="${esc((o.tips&&o.tips[i])||((o.xfmt?o.xfmt(o.labels[i]):fmtD(o.labels[i]))+'\n'+fmt(v||0)+(o.unit?' '+o.unit:'')))}"/>`;});
  return g+'</svg>'+(o.legend?`<div class="legend" style="margin-top:6px">${o.legend.map(l=>`<span><i style="background:${l[1]}"></i>${esc(l[0])}</span>`).join('')}</div>`:'');
}
function hbars(items,o={}){ // items: {label,value,color,tip,sub}
  if(!items.length)return '<div class="empty">Pas de données</div>';
  const mx=o.max||Math.max(1e-9,...items.map(i=>Math.abs(i.value||0)));const fmt=o.fmt||r0;
  return `<div class="stack" style="gap:6px">${items.map(i=>`<div style="display:grid;grid-template-columns:minmax(90px,150px) 1fr 64px;gap:10px;align-items:center" data-tip="${esc(i.tip||i.label+' : '+fmt(i.value))}">
    <div class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.html||esc(i.label)}</div>
    <div class="bar" style="height:12px"><i style="width:${clamp((i.value||0)/mx*100,0,100)}%;background:${i.color||'var(--accent)'};border-radius:4px"></i></div>
    <div class="small n" style="text-align:right;font-weight:600">${fmt(i.value)}${o.unit?' '+o.unit:''}</div></div>`).join('')}</div>`;
}
function zbars(items){ // diverging, value = z (−3..3)
  return `<div class="stack" style="gap:6px">${items.map(i=>{const z=clamp(i.value??0,-3,3);const w=Math.abs(z)/3*50;const c=z>=0?'var(--good)':'var(--crit)';
    return `<div style="display:grid;grid-template-columns:minmax(110px,170px) 1fr 54px;gap:10px;align-items:center" data-tip="${esc(i.tip||'')}"><div class="small">${esc(i.label)}</div>
    <div style="position:relative;height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px"><div style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-2)"></div>
    ${i.value==null?'':`<div style="position:absolute;top:1px;bottom:1px;${z>=0?'left:50%':'right:50%'};width:${w}%;background:${c};border-radius:3px"></div>`}</div>
    <div class="small" style="text-align:right;font-weight:600">${i.value==null?'–':(z>0?'+':'')+r1(i.value)}</div></div>`;}).join('')}</div>`;
}
/* tooltip */
(function(){const tip=$('#tip');
  document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.classList.remove('on');return;}tip.textContent=t.getAttribute('data-tip');tip.classList.add('on');});

/* ===================== SHELL ===================== */
function counts(){const ps=playersOf(UI.cat);let red=0,orange=0;ps.forEach(p=>{const s=playerStatus(p,UI.ref);if(s.lv>=3)red++;else if(s.lv===2)orange++;});
  const inj=Object.values(DATA.injuries).filter(i=>i.status!=='apte'&&DATA.players[i.pid]&&inCat(DATA.players[i.pid])).length;
  const rea=Object.values(DATA.injuries).filter(i=>(i.status==='reathle'||i.status==='reprise')&&DATA.players[i.pid]&&inCat(DATA.players[i.pid])).length;return{red,orange,inj,rea};}
function renderNav(){
  const c=counts();const badge={overview:c.red?`<span class="badge crit">${c.red}</span>`:c.orange?`<span class="badge warn">${c.orange}</span>`:'',medical:c.inj?`<span class="badge">${c.inj}</span>`:'',reathle:c.rea?`<span class="badge">${c.rea}</span>`:''};
  const inPerf=['testing','reathle','muscu'].includes(UI.tab);
  let h=`<div class="brand"><b>Blueperf</b><span>${MODE==='individuel'?'Coaching individuel':esc(S().appName)}</span></div><ul>`;
  TABS.forEach(t=>{
    if(t.children){const kids=t.children.filter(k=>tabOn(k.id));if(!tabOn('perf')||!kids.length)return;const open=!!UI.perfOpen||inPerf;
      h+=`<li class="${open?'open':''}"><button class="ni ${inPerf&&!open?'on':''}" data-act="perfToggle" aria-expanded="${open}"><span>${t.label}</span><span class="chev">▶</span></button>${open?`<ul class="sub">${kids.map(k=>`<li><button class="ni ${UI.tab===k.id?'on':''}" data-act="tab" data-id="${k.id}"><span>${k.label}</span>${badge[k.id]||''}</button></li>`).join('')}</ul>`:''}</li>`;return;}
    if(!tabOn(t.id)&&t.id!=='settings')return;
    h+=`<li><button class="ni ${UI.tab===t.id?'on':''}" data-act="tab" data-id="${t.id}"><span>${t.label}</span>${badge[t.id]||''}</button></li>`;});
  h+=`</ul><div class="navfoot" id="navfoot"></div>`;
  $('#nav').innerHTML=h;renderNavFoot();
}
function renderNavFoot(){const f=$('#navfoot');if(!f)return;
  f.innerHTML=Store.mode==='db'?'<span class="dot ok"></span>Données partagées, enregistrées en ligne':Store.mode==='local'?'<span class="dot loc"></span>Enregistrement dans ce navigateur uniquement':'<span class="dot"></span>Connexion à la base…';}
function tabLabel(id){for(const t of TABS){if(t.id===id)return t.label;if(t.children)for(const k of t.children)if(k.id===id)return (t.label+' · '+k.label);}return '';}
function renderTop(){
  const cs=['Tous',...cats()];const ph=curPhase(UI.cat,UI.ref);const nm=nextMatch(UI.cat,UI.ref);
  let ctx=[fmtD(UI.ref,{weekday:'long',day:'numeric',month:'long'})];if(ph)ctx.push(ph.name);if(nm){const d=dayDiff(nm.date,UI.ref);ctx.push((d===0?'Jour de match':'J-'+d)+' · '+(UI.cat==='Tous'?nm.cat+' ':'')+nm.label);}
  $('#top').innerHTML=`<div><h1>${esc(tabLabel(UI.tab))}</h1><div class="ctx">${esc(ctx.join(' · '))}</div></div>
  <div class="tools"><div class="seg" role="group" aria-label="Catégorie">${cs.map(c=>`<button class="${UI.cat===c?'on':''}" data-act="cat" data-id="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <input type="date" id="refDate" value="${UI.ref}" aria-label="Date de référence" style="width:auto">
  ${UI.ref!==TODAY?`<button class="btn sm" data-act="today">Aujourd'hui</button>`:''}</div>`;
}
function banner(){
  if(!Store.demo)return '';
  if(Store.localImport)return `<div class="banner"><p><b>Des données existent dans ce navigateur.</b> La base partagée est vide : tu peux y transférer tes données pour les retrouver sur tous tes appareils.</p><div class="row"><span id="bulkProg" class="small muted"></span><button class="btn pri" data-act="keepDemo">Transférer vers la base</button></div></div>`;
  return `<div class="banner"><p><b>Données d'exemple</b> (joueurs et séances fictifs) pour découvrir l'outil. Tes saisies ne sont pas enregistrées tant que tu restes en mode exemple.</p>
  <div class="row"><span id="bulkProg" class="small muted"></span><button class="btn" data-act="keepDemo">Garder l'exemple comme base</button><button class="btn pri" data-act="startEmpty">Commencer avec mes joueurs</button></div></div>`;
}
function render(){
  buildIndex();
  if(!tabOn(UI.tab)&&UI.tab!=='settings'){UI.tab=allTabIds().find(t=>tabOn(t))||'settings';}
  if(['testing','reathle','muscu'].includes(UI.tab)&&!tabOn('perf'))UI.tab='overview';
  renderNav();renderTop();
  const v=VIEWS[UI.tab]||VIEWS.overview;let html='';
  try{html=v();}catch(e){console.error(e);html=`<div class="empty">Cet onglet n'a pas pu s'afficher (${esc(e.message)}).</div>`;}
  $('#content').innerHTML=banner()+html;
  renderDrawer();
  if(POST[UI.tab])POST[UI.tab]();
}
function go(tab){UI.tab=tab;UI.edit=UI.edit&&tab==='entry'?UI.edit:null;formDirty=false;saveUI();render();window.scrollTo(0,0);}
</script>

<script>
const VIEWS={},POST={};
const COL_TR='var(--accent)',COL_MATCH='var(--s2)',COL_REA='var(--s3)';
function emptyPlayers(){return `<div class="card"><h2>Aucun joueur${UI.cat!=='Tous'?' en '+esc(UI.cat):''}</h2><p class="muted">Ajoute ton effectif pour que les tableaux se remplissent.</p><button class="btn pri" data-act="goEntry" data-id="player">Ajouter des joueurs</button></div>`;}
function kpi(label,v,unit,d,cls){return `<div class="card kpi"><div class="eyebrow">${label}</div><div class="v" ${cls?`style="color:var(--${cls})"`:''}>${v}${unit?`<small>${unit}</small>`:''}</div>${d?`<div class="d">${d}</div>`:''}</div>`;}
function teamDaily(ps,end,n,key='load'){const labels=[],vals=[],isM=[];for(let i=n-1;i>=0;i--){const d=addDays(end,-i);labels.push(d);const v=ps.map(p=>pday(p.id,d)).filter(x=>x&&x[key]>0);vals.push(v.length?mean(v.map(x=>x[key])):0);isM.push(v.some(x=>x.match));}return{labels,vals,isM};}
function teamWell(ps,end,n,key){const labels=[],vals=[];for(let i=n-1;i>=0;i--){const d=addDays(end,-i);labels.push(d);const v=ps.map(p=>{const e=wEntry(p.id,d);return key?num(e&&e[key]):wScore(e);}).filter(x=>x!=null);vals.push(v.length?mean(v):null);}return{labels,vals};}
function chgTxt(c){if(c==null)return 'Pas encore d’historique';const s=(c>0?'+':'')+r0(c)+' % vs moyenne des 3 semaines précédentes';return s;}

/* ---------- VUE D'ENSEMBLE ---------- */
VIEWS.overview=()=>{
  const ps=playersOf(UI.cat);if(!ps.length)return emptyPlayers();const ref=UI.ref;const th=S().th;
  const st=ps.map(p=>({p,s:playerStatus(p,ref)})).sort((a,b)=>b.s.lv-a.s.lv||a.p.name.localeCompare(b.p.name));
  const red=st.filter(x=>x.s.lv>=3).length,orange=st.filter(x=>x.s.lv===2).length;
  const unavail=st.filter(x=>x.s.inj&&x.s.inj.status!=='reprise').length;
  const wt=st.map(x=>x.s.w.today).filter(v=>v!=null);
  const ws=ps.map(p=>weekStats(p.id,ref));const l7=mean(ws.map(w=>w.sum).filter(v=>v>0));const pa=mean(ws.map(w=>w.prevAvg).filter(v=>v>0));
  const ac=mean(st.map(x=>x.s.e.acwr).filter(v=>v!=null));
  const nm=nextMatch(UI.cat,ref);
  const td=teamDaily(ps,ref,28);const tw=teamWell(ps,ref,28);
  const today=Object.values(DATA.plan).filter(p=>p.date===ref&&inCat(p));
  const recos=buildRecos().slice(0,4);
  const toFill=ps.map(p=>{
    const noWell=!wEntry(p.id,ref);
    const sess=Object.values(DATA.sessions).filter(s=>s.date===ref&&s.cat===p.cat&&s.players&&s.players[p.id]);
    const noRpe=sess.some(s=>s.players[p.id].rpe==null);
    return {p,noWell,noRpe};
  }).filter(x=>x.noWell||x.noRpe);
  const toFillCard=`<div class="card"><div class="hrow"><h2>À saisir aujourd'hui</h2><span class="small muted">${toFill.length?toFill.length+' joueur·se(s) sans RPE ou wellness':'Tout est saisi'}</span></div>
    ${toFill.length?`<div class="tw"><table><thead><tr><th>Joueur</th><th>Manque</th><th></th></tr></thead><tbody>
      ${toFill.map(x=>`<tr><td>${plink(x.p.id)}</td>
        <td>${[x.noWell?'<span class="pill warn">Wellness</span>':'',x.noRpe?'<span class="pill warn">RPE séance</span>':''].filter(Boolean).join(' ')}</td>
        <td><button class="btn sm pri" data-act="fillPlayer" data-id="${esc(x.p.id)}">Saisir</button></td></tr>`).join('')}
      </tbody></table></div>`:'<p class="muted" style="margin:0">Tous les RPE et wellness du jour sont saisis. 👍</p>'}</div>`;
  return `<div class="grid g6">
    ${kpi('Disponibles',ps.length-unavail,'/'+ps.length,unavail?unavail+' blessé'+(unavail>1?'s':'')+' ou en réathlé':'Tout le groupe est disponible')}
    ${kpi('Alertes',red,'',`<span class="pill crit">${red} rouge${red>1?'s':''}</span> <span class="pill warn">${orange} orange</span>`,red?'crit':null)}
    ${kpi('Wellness du jour',wt.length?r0(mean(wt)):'–',wt.length?'%':'',`${wt.length}/${ps.length} questionnaires remplis`)}
    ${kpi('Charge 7 jours',r0(l7),'UA',l7&&pa?chgTxt((l7-pa)/pa*100):'Moyenne par joueur (sRPE)')}
    ${kpi('ACWR moyen',ac!=null?r2(ac):'–','',`Zone cible ${r1(th.acwrLo)}–${r1(th.acwrHi)} (EWMA 7/28 j)`,ac!=null?(acwrCls(ac)==='good'?null:acwrCls(ac)):null)}
    ${kpi('Prochain match',nm?(dayDiff(nm.date,ref)===0?'J':'J-'+dayDiff(nm.date,ref)):'–','',nm?esc(fmtD(nm.date)+' · '+nm.label):'Aucun match planifié')}
  </div>
  ${toFillCard}
  <div class="grid g2">
    <div class="card"><div class="hrow"><h2>Charge d'équipe, 28 jours</h2><span class="small muted">sRPE moyen par joueur présent</span></div>
      ${barChart({labels:td.labels,values:td.vals,colors:td.isM.map(m=>m?COL_MATCH:COL_TR),unit:'UA',legend:[['Entraînement',COL_TR],['Match',COL_MATCH]]})}</div>
    <div class="card"><div class="hrow"><h2>Wellness d'équipe, 28 jours</h2><span class="small muted">Score moyen sur 100</span></div>
      ${lineChart({labels:tw.labels,series:[{name:'Wellness',values:tw.vals,color:COL_TR,area:true}],yMin:40,yMax:100,refs:[{v:th.well,label:'Seuil '+th.well+' %'}],fmt:v=>r0(v)})}</div>
  </div>
  <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">
    <div class="card"><div class="hrow"><h2>État de forme du groupe</h2><span class="small muted">Trié par priorité · clique un joueur pour sa fiche</span></div>
      <div class="tw"><table><thead><tr><th>Joueur</th>${UI.cat==='Tous'?'<th>Cat.</th>':''}<th>Poste</th><th>Statut</th><th class="n">Wellness</th><th class="n">ACWR</th><th class="n">Charge 7 j</th><th class="n">≥${th.vmaxPct} % Vmax</th><th>Motifs</th></tr></thead><tbody>
      ${st.map(({p,s})=>`<tr><td>${plink(p.id)}</td>${UI.cat==='Tous'?`<td>${esc(p.cat)}</td>`:''}<td>${esc(p.pos||'')}</td><td>${lvPill(s.lv)}</td>
        <td class="n">${s.w.today!=null?`<span class="pill ${wCls(s.w.today)}">${r0(s.w.today)} %</span>`:'<span class="muted">–</span>'}</td>
        <td class="n">${s.e.acwr!=null?`<span class="pill ${acwrCls(s.e.acwr)}">${r2(s.e.acwr)}</span>`:'–'}</td>
        <td class="n">${r0(weekStats(p.id,ref).sum)}</td><td class="n">${s.vx==null?'–':s.vx===0?"aujourd'hui":'il y a '+s.vx+' j'}</td>
        <td class="wrap small">${s.reasons.filter(r=>r.l>=1).map(r=>esc(r.t)).join(' · ')||'<span class="muted">RAS</span>'}</td></tr>`).join('')}
      </tbody></table></div></div>
    <div class="stack">
      <div class="card"><div class="hrow"><h2>Au programme</h2><button class="btn sm" data-act="tab" data-id="training">Planning</button></div>
        ${today.length?today.map(e=>`<div class="ent ${e.type==='Match'?'match':''}"><b>${esc(e.title||e.objective)}</b><span class="muted">${esc(e.cat)} · ${esc(e.type)} · ${r0(e.duration)} min · ${esc(e.intensity||'')}</span></div>`).join(''):'<p class="muted" style="margin:0">Rien de planifié ce jour.</p>'}</div>
      <div class="card"><div class="hrow"><h2>À retenir</h2><button class="btn sm" data-act="tab" data-id="reco">Toutes les recos</button></div>
        <div class="stack">${recos.length?recos.map(r=>`<div class="stack" style="gap:2px"><span class="pill ${r.p==='hi'?'crit':r.p==='md'?'warn':'good'}" style="align-self:flex-start">${r.p==='hi'?'Priorité haute':r.p==='md'?'À surveiller':'Info'}</span><b>${esc(r.title)}</b><span class="small muted">${esc(r.action)}</span></div>`).join(''):'<p class="muted">Rien de particulier.</p>'}</div></div>
    </div>
  </div>`;
};

/* ---------- SANTÉ & FORME ---------- */
VIEWS.health=()=>{
  const ps=playersOf(UI.cat);if(!ps.length)return emptyPlayers();const ref=UI.ref;const th=S().th;
  const st=ps.map(p=>({p,w:wStats(p.id,ref),e:wEntry(p.id,ref)}));
  const filled=st.filter(x=>x.w.today!=null);const low=filled.filter(x=>x.w.today<th.well||(x.w.z!=null&&x.w.z<th.wz));
  const tw=teamWell(ps,ref,28);const last3=mean(tw.vals.slice(-3)),base=mean(tw.vals.slice(0,-3));
  const days=range(addDays(ref,-13),ref);
  const missing=st.filter(x=>x.w.today==null&&!(activeInjury(x.p.id,ref)));
  return `<div class="grid g4">
    ${kpi('Questionnaires du jour',filled.length,'/'+ps.length,missing.length?missing.length+' non rempli'+(missing.length>1?'s':''):'Tout le monde a répondu')}
    ${kpi('Score moyen du jour',filled.length?r0(mean(filled.map(x=>x.w.today))):'–','%','Sommeil, fatigue, courbatures, stress, humeur (1 à 5)')}
    ${kpi('Joueurs à surveiller',low.length,'',low.length?low.map(x=>esc(x.p.name)).slice(0,4).join(', '):'Aucun sous le seuil ou sous son habitude',low.length?'warn':null)}
    ${kpi('Tendance 3 jours',last3!=null&&base?((last3-base>=0?'+':'')+r1(last3-base)):'–','pts','Moyenne des 3 derniers jours vs les 25 précédents',last3!=null&&base&&last3-base<-5?'crit':null)}
  </div>
  <div class="card"><div class="hrow"><h2>Wellness d'équipe</h2><button class="btn sm pri" data-act="goEntry" data-id="wellness">Saisir le wellness</button></div>
    ${lineChart({labels:tw.labels,series:[{name:'Score',values:tw.vals,color:COL_TR,area:true,dots:true}],yMin:40,yMax:100,refs:[{v:th.well,label:'Seuil '+th.well+' %'}],h:200})}</div>
  <div class="grid g6" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
    ${WK.map(k=>{const s=teamWell(ps,ref,28,k);const lv=s.vals.filter(v=>v!=null);return `<div class="card"><div class="hrow"><h3>${WL[k]}</h3><b>${lv.length?r1(lv[lv.length-1]):'–'}<span class="muted small">/5</span></b></div>${lineChart({labels:s.labels,series:[{name:WL[k],values:s.vals,color:COL_TR}],yMin:1,yMax:5,h:120,fmt:v=>r1(v)})}</div>`;}).join('')}
  </div>
  <div class="card"><div class="hrow"><h2>Carte de chaleur, 14 jours</h2><span class="small muted">Score wellness (%) · rouge sous ${th.well} %, orange jusqu'à ${th.well+12} %</span></div>
    <div class="tw"><table class="hm"><thead><tr><th>Joueur</th>${days.map(d=>`<th class="n" style="text-align:center">${DAYS[wd(d)]}<br>${fmtShort(d)}</th>`).join('')}<th class="n">Moy.</th></tr></thead><tbody>
    ${ps.map(p=>{const v=days.map(d=>wOf(p.id,d));return `<tr><td>${plink(p.id)}</td>${v.map((x,i)=>`<td class="c" style="background:${x==null?'transparent':`var(--${wCls(x)}-soft)`};color:${x==null?'var(--muted)':`var(--${wCls(x)})`}" data-tip="${esc(p.name+' · '+fmtD(days[i])+'\n'+(x==null?'Non rempli':wTip(wEntry(p.id,days[i]))))}">${x==null?'·':r0(x)}</td>`).join('')}<td class="n"><b>${r0(mean(v))}</b></td></tr>`;}).join('')}
    </tbody></table></div></div>
  <div class="card"><div class="hrow"><h2>Détail du ${fmtD(ref,{day:'numeric',month:'long'})}</h2><span class="small muted">z = écart à la moyenne individuelle des 28 derniers jours</span></div>
    <div class="tw"><table><thead><tr><th>Joueur</th>${WK.map(k=>`<th class="n">${WL[k]}</th>`).join('')}<th class="n">Score</th><th class="n">z</th><th>Commentaire</th></tr></thead><tbody>
    ${st.map(({p,w,e})=>`<tr><td>${plink(p.id)}</td>${WK.map(k=>{const v=num(e&&e[k]);return `<td class="n" style="${v!=null&&v<=2?'color:var(--crit);font-weight:700':''}">${v??'–'}</td>`;}).join('')}
      <td class="n">${w.today!=null?`<span class="pill ${wCls(w.today)}">${r0(w.today)} %</span>`:'–'}</td><td class="n" style="${w.z!=null&&w.z<th.wz?'color:var(--crit);font-weight:700':''}">${w.z!=null?r1(w.z):'–'}</td><td class="small">${esc(e&&e.note||'')}</td></tr>`).join('')}
    </tbody></table></div>
    ${missing.length?`<p class="note">Non remplis : ${missing.map(x=>esc(x.p.name)).join(', ')}</p>`:''}</div>`;
};
function wTip(e){if(!e)return '';return WK.map(k=>WL[k]+' : '+(e[k]??'–')).join('\n')+(e.note?'\n« '+e.note+' »':'');}

/* ---------- CHARGES ---------- */
VIEWS.load=()=>{
  const ps=playersOf(UI.cat);if(!ps.length)return emptyPlayers();const ref=UI.ref;const th=S().th;
  const rows=ps.map(p=>({p,w:weekStats(p.id,ref),e:ewma(p.id,ref)}));
  const td=teamDaily(ps,ref,28);
  const weeks=[];for(let k=9;k>=0;k--){const end=addDays(ref,-7*k);weeks.push({end,v:mean(ps.map(p=>sum(loads(p.id,end,7))).filter(v=>v>0))});}
  const l7=mean(rows.map(r=>r.w.sum).filter(v=>v>0)),pa=mean(rows.map(r=>r.w.prevAvg).filter(v=>v>0));
  const mono=mean(rows.map(r=>r.w.mono).filter(v=>v!=null));const ac=mean(rows.map(r=>r.e.acwr).filter(v=>v!=null));
  const ev=[...Object.values(DATA.sessions).map(s=>({...s,kind:'session'})),...Object.values(DATA.matches).map(m=>({...m,kind:'match',title:'Match vs '+m.opponent,type:'Match'}))].filter(inCat).filter(e=>e.date<=ref).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,UI.loadMore?80:15);
  return `<div class="grid g4">
    ${kpi('Charge 7 jours',r0(l7),'UA',chgTxt(l7&&pa?(l7-pa)/pa*100:null),l7&&pa&&Math.abs((l7-pa)/pa*100)>th.weekChg?'warn':null)}
    ${kpi('Monotonie',mono!=null?r2(mono):'–','',`Moyenne/écart-type des 7 derniers jours · au-delà de ${th.monotony} : charges trop uniformes`,mono!=null&&mono>th.monotony?'warn':null)}
    ${kpi('Contrainte (strain)',r0(mean(rows.map(r=>r.w.strain).filter(v=>v!=null))),'','Charge × monotonie (Foster)')}
    ${kpi('ACWR moyen',ac!=null?r2(ac):'–','','Aiguë 7 j / chronique 28 j (EWMA)')}
  </div>
  <div class="grid g2">
    <div class="card"><div class="hrow"><h2>Charge quotidienne</h2><span class="small muted">sRPE = RPE × minutes, moyenne par joueur présent</span></div>
      ${barChart({labels:td.labels,values:td.vals,colors:td.isM.map(m=>m?COL_MATCH:COL_TR),unit:'UA',legend:[['Entraînement',COL_TR],['Match',COL_MATCH]]})}</div>
    <div class="card"><div class="hrow"><h2>Charge hebdomadaire, 10 semaines</h2><span class="small muted">Semaines glissantes se terminant le jour indiqué</span></div>
      ${barChart({labels:weeks.map(w=>w.end),values:weeks.map(w=>w.v||0),colors:weeks.map((w,i)=>i===weeks.length-1?COL_TR:'color-mix(in srgb,var(--accent) 45%,var(--surface))'),unit:'UA',refs:[{v:mean(weeks.slice(-5,-1).map(w=>w.v).filter(Boolean))||0,label:'Moy. 4 sem.'}]})}</div>
  </div>
  <div class="card"><div class="hrow"><h2>Charge individuelle</h2><span class="small muted">Variation : 7 derniers jours vs moyenne des 3 semaines précédentes · alerte au-delà de ±${th.weekChg} %</span></div>
    <div class="tw"><table><thead><tr><th>Joueur</th><th class="n">7 j (UA)</th><th class="n">Sem. préc.</th><th class="n">Variation</th><th class="n">Monotonie</th><th class="n">Strain</th><th class="n">Aiguë</th><th class="n">Chronique</th><th class="n">ACWR</th><th>Tendance 28 j</th></tr></thead><tbody>
    ${rows.map(({p,w,e})=>{const l=loads(p.id,ref,28);return `<tr><td>${plink(p.id)}</td><td class="n"><b>${r0(w.sum)}</b></td><td class="n">${r0(w.prev)}</td>
      <td class="n">${w.chg==null?'–':`<span class="pill ${Math.abs(w.chg)>th.weekChg?(w.chg>0?'crit':'warn'):'good'}">${w.chg>0?'+':''}${r0(w.chg)} %</span>`}</td>
      <td class="n" style="${w.mono>th.monotony?'color:var(--warn);font-weight:700':''}">${w.mono!=null?r2(w.mono):'–'}</td><td class="n">${r0(w.strain)}</td>
      <td class="n">${r0(e.acute)}</td><td class="n">${r0(e.chronic)}</td><td class="n">${e.acwr!=null?`<span class="pill ${acwrCls(e.acwr)}">${r2(e.acwr)}</span>`:'–'}</td>
      <td style="width:150px">${spark(l)}</td></tr>`;}).join('')}
    </tbody></table></div>
    <p class="note">L'ACWR est un indicateur débattu (couplage mathématique, faible pouvoir prédictif). Il sert ici de repère, avec la variation hebdomadaire et le ressenti du joueur.</p></div>
  <div class="card"><div class="hrow"><h2>Séances et matchs enregistrés</h2><div class="row"><button class="btn sm pri" data-act="goEntry" data-id="session">Nouvelle séance</button></div></div>
    <div class="tw"><table><thead><tr><th>Date</th><th>Cat.</th><th>Type</th><th>Intitulé</th><th class="n">Durée</th><th class="n">Joueurs</th><th class="n">RPE moy.</th><th class="n">sRPE moy.</th><th></th></tr></thead><tbody>
    ${ev.map(e=>{const pl=Object.values(e.players||{});const rp=mean(pl.map(x=>num(x.rpe)));const sr=mean(pl.map(x=>(num(x.rpe)??0)*(num(x.min)??num(e.duration)??0)).filter(v=>v>0));
      return `<tr><td>${fmtD(e.date)}</td><td>${esc(e.cat)}</td><td><span class="pill ${e.kind==='match'?'info':'neutral'}">${esc(e.type)}</span></td><td>${esc(e.title||'')}</td><td class="n">${r0(e.duration)} min</td><td class="n">${pl.length}</td><td class="n">${r1(rp)}</td><td class="n">${r0(sr)}</td>
      <td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="edit" data-col="${e.kind==='match'?'matches':'sessions'}" data-id="${esc(e.id)}">Modifier</button><button class="btn sm danger" data-act="del" data-col="${e.kind==='match'?'matches':'sessions'}" data-id="${esc(e.id)}">Supprimer</button></div></td></tr>`;}).join('')||'<tr><td colspan="9" class="muted">Aucune séance</td></tr>'}
    </tbody></table></div>${!UI.loadMore?'<div class="row" style="margin-top:8px"><button class="btn sm" data-act="loadMore">Afficher plus</button></div>':''}</div>`;
};
function spark(vals,color='var(--accent)'){const W=140,H=26;const mx=Math.max(1,...vals);const bw=W/vals.length;return `<svg viewBox="0 0 ${W} ${H}" width="140" height="26" aria-hidden="true">${vals.map((v,i)=>v?`<rect x="${i*bw+.5}" y="${H-v/mx*H}" width="${Math.max(1,bw-1)}" height="${v/mx*H}" fill="${color}" opacity="${i>=vals.length-7?1:.45}" rx="1"/>`:'').join('')}</svg>`;}

/* ---------- GPS ---------- */
function gpsEvents(){return [...Object.values(DATA.sessions).map(s=>({...s,kind:'session',col:'sessions'})),...Object.values(DATA.matches).map(m=>({...m,kind:'match',col:'matches',title:'Match vs '+m.opponent}))]
  .filter(inCat).filter(e=>e.date<=UI.ref&&Object.values(e.players||{}).some(x=>num(x.dist)!=null)).sort((a,b)=>b.date.localeCompare(a.date));}
VIEWS.gps=()=>{
  const ps=playersOf(UI.cat);if(!ps.length)return emptyPlayers();const ref=UI.ref;const th=S().th;
  const evs=gpsEvents();let ev=evs.find(e=>e.id===UI.gpsEvent)||evs[0];
  const td=teamDaily(ps,ref,28,'dist');
  const wk=ps.map(p=>{const t={dist:0,hsr:0,sprint:0,acc:0,dec:0,vmax:0};for(let i=0;i<7;i++){const x=pday(p.id,addDays(ref,-i));if(x){['dist','hsr','sprint','acc','dec'].forEach(k=>t[k]+=x[k]);t.vmax=Math.max(t.vmax,x.vmax);}}return{p,t,vx:lastVmaxExpo(p,ref),vr:vref(p)};});
  let evTable='<div class="empty">Aucune donnée GPS. Saisis-les avec la séance ou colle un export CSV dans Saisie › Import GPS.</div>';
  if(ev){const rows=Object.entries(ev.players||{}).filter(([pid])=>DATA.players[pid]).map(([pid,x])=>({p:DATA.players[pid],x,min:num(x.min)??num(ev.duration)}));
    const avg=k=>mean(rows.map(r=>num(r.x[k])));
    evTable=`<div class="tw"><table><thead><tr><th>Joueur</th><th class="n">Min</th><th class="n">Distance (m)</th><th class="n">m/min</th><th class="n">HSR &gt;${r1(th.hsr)} (m)</th><th class="n">Sprint &gt;${r0(th.sprint)} (m)</th><th class="n">Acc.</th><th class="n">Déc.</th><th class="n">Vmax (km/h)</th><th class="n">% Vmax réf.</th></tr></thead><tbody>
    ${rows.sort((a,b)=>(num(b.x.dist)||0)-(num(a.x.dist)||0)).map(({p,x,min})=>{const pv=vref(p);const pct=pv&&num(x.vmax)?num(x.vmax)/pv*100:null;return `<tr><td>${plink(p.id)}</td><td class="n">${r0(min)}</td><td class="n"><b>${r0(num(x.dist))}</b></td><td class="n">${min?r0(num(x.dist)/min):'–'}</td><td class="n">${r0(num(x.hsr))}</td><td class="n">${r0(num(x.sprint))}</td><td class="n">${r0(num(x.acc))}</td><td class="n">${r0(num(x.dec))}</td><td class="n">${r1(num(x.vmax))}</td><td class="n">${pct==null?'–':`<span class="pill ${pct>=th.vmaxPct?'good':'neutral'}">${r0(pct)} %</span>`}</td></tr>`;}).join('')}
    <tr><td><b>Moyenne</b></td><td class="n">${r0(mean(rows.map(r=>r.min)))}</td><td class="n"><b>${r0(avg('dist'))}</b></td><td class="n">–</td><td class="n">${r0(avg('hsr'))}</td><td class="n">${r0(avg('sprint'))}</td><td class="n">${r0(avg('acc'))}</td><td class="n">${r0(avg('dec'))}</td><td class="n">${r1(avg('vmax'))}</td><td></td></tr></tbody></table></div>`;}
  const noExpo=wk.filter(x=>!activeInjury(x.p.id,ref)&&(x.vx==null||x.vx>th.vmaxDays));
  return `<div class="card"><div class="hrow"><h2>Séance ou match</h2><div class="row"><select id="gpsSel" style="width:auto;max-width:100%">${evs.map(e=>`<option value="${esc(e.id)}" ${ev&&e.id===ev.id?'selected':''}>${fmtD(e.date)} · ${esc(e.cat)} · ${esc(e.title||e.type)}</option>`).join('')}</select><button class="btn sm" data-act="goEntry" data-id="gps">Importer un CSV</button></div></div>${evTable}</div>
  <div class="grid g2">
    <div class="card"><div class="hrow"><h2>Distance moyenne par jour</h2><span class="small muted">28 jours · par joueur présent</span></div>${barChart({labels:td.labels,values:td.vals,colors:td.isM.map(m=>m?COL_MATCH:COL_TR),unit:'m',legend:[['Entraînement',COL_TR],['Match',COL_MATCH]]})}</div>
    <div class="card"><div class="hrow"><h2>Haute intensité sur 7 jours</h2><span class="small muted">HSR cumulée par joueur (m)</span></div>${hbars(wk.slice().sort((a,b)=>b.t.hsr-a.t.hsr).map(x=>({label:x.p.name,value:x.t.hsr,tip:x.p.name+' : '+r0(x.t.hsr)+' m de HSR, '+r0(x.t.sprint)+' m de sprint'})),{unit:'m'})}</div>
  </div>
  <div class="card"><div class="hrow"><h2>Cumul 7 jours et exposition à la vitesse maximale</h2><span class="small muted">Objectif : au moins 1 exposition ≥ ${th.vmaxPct} % de la Vmax de référence tous les ${th.vmaxDays} jours</span></div>
    ${noExpo.length?`<p class="small" style="margin-top:0"><span class="pill warn">${noExpo.length} joueur${noExpo.length>1?'s':''} sans exposition récente</span> ${noExpo.map(x=>esc(x.p.name)).join(', ')}</p>`:''}
    <div class="tw"><table><thead><tr><th>Joueur</th><th class="n">Distance</th><th class="n">HSR</th><th class="n">Sprint</th><th class="n">Acc.</th><th class="n">Déc.</th><th class="n">Vmax 7 j</th><th class="n">Vmax réf.</th><th class="n">Dernière expo ≥${th.vmaxPct} %</th></tr></thead><tbody>
    ${wk.map(({p,t,vx,vr})=>`<tr><td>${plink(p.id)}</td><td class="n">${r0(t.dist)}</td><td class="n">${r0(t.hsr)}</td><td class="n">${r0(t.sprint)}</td><td class="n">${r0(t.acc)}</td><td class="n">${r0(t.dec)}</td><td class="n">${t.vmax?r1(t.vmax):'–'}</td><td class="n">${r1(vr)}</td>
      <td class="n">${vx==null?'<span class="pill warn">Jamais</span>':`<span class="pill ${vx>th.vmaxDays?'warn':'good'}">${vx===0?"Aujourd'hui":'J-'+vx}</span>`}</td></tr>`).join('')}
    </tbody></table></div></div>`;
};
POST.gps=()=>{const s=$('#gpsSel');if(s)s.onchange=()=>{UI.gpsEvent=s.value;render();};};

/* ---------- COMPÉTITION ---------- */
VIEWS.comp=()=>{
  const ref=UI.ref;const ms=Object.values(DATA.matches).filter(inCat).filter(m=>m.date<=ref).sort((a,b)=>b.date.localeCompare(a.date));
  const ps=playersOf(UI.cat);
  const res=m=>num(m.gf)>num(m.ga)?'V':num(m.gf)<num(m.ga)?'D':'N';
  const W=ms.filter(m=>res(m)==='V').length,N=ms.filter(m=>res(m)==='N').length,L=ms.filter(m=>res(m)==='D').length;
  const m=ms.find(x=>x.id===UI.compMatch)||ms[0];
  const season=ps.map(p=>{let n=0,st=0,min=0,g=0,a=0,y=0,rt=[],poss=0,dist=0,dmin=0;ms.forEach(x=>{if(x.cat!==p.cat)return;poss+=num(x.duration)||90;const e=x.players&&x.players[p.id];if(!e||!num(e.min))return;n++;if(e.starter)st++;min+=num(e.min);g+=num(e.goals)||0;a+=num(e.assists)||0;y+=num(e.yellow)||0;if(num(e.rating)!=null)rt.push(num(e.rating));if(num(e.dist)!=null){dist+=num(e.dist);dmin+=num(e.min);}});
    return{p,n,st,min,g,a,y,rt:mean(rt),pct:poss?min/poss*100:null,d90:dmin?dist/dmin*90:null};});
  const sp=DATA.players[UI.compPlayer]&&inCat(DATA.players[UI.compPlayer])?DATA.players[UI.compPlayer]:ps[0];
  let indiv='';
  if(sp){const log=ms.filter(x=>x.cat===sp.cat).slice().reverse().map(x=>({x,e:(x.players||{})[sp.id]}));const s=season.find(r=>r.p.id===sp.id)||{};
    indiv=`<div class="card"><div class="hrow"><h2>Vue individuelle</h2><select id="compPl" style="width:auto">${ps.map(p=>`<option value="${esc(p.id)}" ${p.id===sp.id?'selected':''}>${esc(p.name)}${UI.cat==='Tous'?' ('+esc(p.cat)+')':''}</option>`).join('')}</select></div>
    <div class="grid g6" style="margin-bottom:14px">${kpi('Matchs',s.n??0,'',(s.st??0)+' titularisations')}${kpi('Minutes',r0(s.min),'',s.pct!=null?r0(s.pct)+' % du temps possible':'')}${kpi('Buts',s.g??0,'')}${kpi('Passes déc.',s.a??0,'')}${kpi('Note moyenne',s.rt!=null?r1(s.rt):'–','/10')}${kpi('Distance / 90 min',s.d90?r0(s.d90):'–','m')}</div>
    <div class="grid g2"><div>${barChart({labels:log.map(l=>l.x.date),values:log.map(l=>num(l.e&&l.e.min)||0),unit:'min',h:170,tips:log.map(l=>fmtD(l.x.date)+' vs '+l.x.opponent+'\n'+(num(l.e&&l.e.min)||0)+' min')})}<div class="small muted" style="text-align:center">Minutes jouées par match</div></div>
    <div>${lineChart({labels:log.map(l=>l.x.date),series:[{name:'Note',values:log.map(l=>num(l.e&&l.e.rating)),color:COL_TR,dots:true}],yMin:0,yMax:10,h:170,fmt:v=>r1(v)})}<div class="small muted" style="text-align:center">Note du staff</div></div></div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Adversaire</th><th>Score</th><th class="n">Min</th><th>Tit.</th><th class="n">B</th><th class="n">PD</th><th class="n">Note</th><th class="n">Dist.</th><th class="n">HSR</th><th class="n">Vmax</th></tr></thead><tbody>
    ${log.slice().reverse().map(({x,e})=>`<tr><td>${fmtD(x.date)}</td><td>${esc(x.opponent)}</td><td>${esc(x.gf)}–${esc(x.ga)}</td><td class="n">${e?r0(num(e.min)):'–'}</td><td>${e&&e.starter?'Oui':e?'Non':'<span class="muted">Absent</span>'}</td><td class="n">${e?num(e.goals)||0:'–'}</td><td class="n">${e?num(e.assists)||0:'–'}</td><td class="n">${e?r1(num(e.rating)):'–'}</td><td class="n">${e?r0(num(e.dist)):'–'}</td><td class="n">${e?r0(num(e.hsr)):'–'}</td><td class="n">${e?r1(num(e.vmax)):'–'}</td></tr>`).join('')}
    </tbody></table></div></div>`;}
  let detail='<div class="empty">Aucun match enregistré.</div>';
  if(m){const rows=Object.entries(m.players||{}).filter(([pid])=>DATA.players[pid]).map(([pid,e])=>({p:DATA.players[pid],e})).sort((a,b)=>(b.e.starter?1:0)-(a.e.starter?1:0)||(num(b.e.min)||0)-(num(a.e.min)||0));
    detail=`<div class="row sb" style="margin-bottom:10px"><div><div class="eyebrow">${esc(m.competition||'')} · ${fmtD(m.date,{weekday:'long',day:'numeric',month:'long'})} · ${esc(m.venue||'')}</div>
      <div style="font-family:var(--fd);font-size:30px;font-weight:700">${esc(m.cat)} ${esc(m.gf)} – ${esc(m.ga)} ${esc(m.opponent)} <span class="pill ${res(m)==='V'?'good':res(m)==='D'?'crit':'neutral'}" style="vertical-align:middle">${res(m)==='V'?'Victoire':res(m)==='D'?'Défaite':'Nul'}</span></div></div>
      <div class="row"><button class="btn sm" data-act="edit" data-col="matches" data-id="${esc(m.id)}">Modifier</button></div></div>
    <div class="tw"><table><thead><tr><th>Joueur</th><th>Tit.</th><th class="n">Min</th><th class="n">Buts</th><th class="n">PD</th><th class="n">Cartons</th><th class="n">Note</th><th class="n">RPE</th><th class="n">Distance</th><th class="n">HSR</th><th class="n">Sprint</th><th class="n">Vmax</th></tr></thead><tbody>
    ${rows.map(({p,e})=>`<tr><td>${plink(p.id)}</td><td>${e.starter?'Oui':'Non'}</td><td class="n">${r0(num(e.min))}</td><td class="n">${num(e.goals)||''}</td><td class="n">${num(e.assists)||''}</td><td class="n">${num(e.yellow)?'<span class="pill warn">J</span>':''}${num(e.red)?'<span class="pill crit">R</span>':''}</td><td class="n">${r1(num(e.rating))}</td><td class="n">${r0(num(e.rpe))}</td><td class="n">${r0(num(e.dist))}</td><td class="n">${r0(num(e.hsr))}</td><td class="n">${r0(num(e.sprint))}</td><td class="n">${r1(num(e.vmax))}</td></tr>`).join('')}
    </tbody></table></div>`;}
  return `<div class="grid g6">${kpi('Matchs',ms.length,'')}${kpi('Victoires',W,'','',W?'good':null)}${kpi('Nuls',N,'')}${kpi('Défaites',L,'')}${kpi('Buts marqués',sum(ms.map(x=>num(x.gf))),'',ms.length?r1(sum(ms.map(x=>num(x.gf)))/ms.length)+' par match':'')}${kpi('Buts encaissés',sum(ms.map(x=>num(x.ga))),'',ms.length?r1(sum(ms.map(x=>num(x.ga)))/ms.length)+' par match':'')}</div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,2.2fr)">
    <div class="card"><div class="hrow"><h2>Matchs</h2><button class="btn sm pri" data-act="goEntry" data-id="match">Saisir un match</button></div>
      <div class="stack" style="gap:6px;max-height:520px;overflow:auto">${ms.map(x=>`<button class="btn" style="justify-content:space-between;${m&&x.id===m.id?'border-color:var(--accent);color:var(--accent)':''}" data-act="compMatch" data-id="${esc(x.id)}"><span>${fmtShort(x.date)} · ${esc(x.cat)} · ${esc(x.opponent)}</span><span class="pill ${res(x)==='V'?'good':res(x)==='D'?'crit':'neutral'}">${esc(x.gf)}–${esc(x.ga)}</span></button>`).join('')||'<p class="muted">Aucun match.</p>'}</div></div>
    <div class="card">${detail}</div>
  </div>
  <div class="card"><div class="hrow"><h2>Statistiques de la saison</h2><span class="small muted">% temps de jeu = minutes jouées / minutes possibles</span></div>
    <div class="tw"><table><thead><tr><th>Joueur</th><th>Poste</th><th class="n">Matchs</th><th class="n">Tit.</th><th class="n">Minutes</th><th>Temps de jeu</th><th class="n">Buts</th><th class="n">PD</th><th class="n">Cartons J</th><th class="n">Note moy.</th><th class="n">Dist./90</th></tr></thead><tbody>
    ${season.sort((a,b)=>b.min-a.min).map(r=>`<tr><td>${plink(r.p.id)}</td><td>${esc(r.p.pos||'')}</td><td class="n">${r.n}</td><td class="n">${r.st}</td><td class="n"><b>${r0(r.min)}</b></td><td style="min-width:120px"><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${clamp(r.pct||0,0,100)}%"></i></div><span class="small">${r.pct!=null?r0(r.pct)+' %':'–'}</span></div></td><td class="n">${r.g}</td><td class="n">${r.a}</td><td class="n">${r.y}</td><td class="n">${r.rt!=null?r1(r.rt):'–'}</td><td class="n">${r.d90?r0(r.d90):'–'}</td></tr>`).join('')}
    </tbody></table></div></div>${indiv}`;
};
POST.comp=()=>{const s=$('#compPl');if(s)s.onchange=()=>{UI.compPlayer=s.value;render();};};
</script>

<script>
/* ---------- ENTRAÎNEMENT ---------- */
function planStatus(e){if(e.type==='Match'){const m=Object.values(DATA.matches).some(x=>x.date===e.date&&x.cat===e.cat);return m?'done':e.date<TODAY?'miss':'todo';}
  if(e.done)return 'done';const s=Object.values(DATA.sessions).some(x=>x.date===e.date&&x.cat===e.cat&&(x.type===e.type||e.type==='Mixte'||x.type==='Mixte'));return s?'done':e.date<TODAY?'miss':'todo';}
const PS={done:'<span class="pill good">Réalisé</span>',miss:'<span class="pill crit">Non réalisé</span>',todo:'<span class="pill neutral">À venir</span>'};
function entCls(e){return e.type==='Match'?'match':e.type==='Récupération'?'rec':e.type==='Salle'?'salle':'';}
VIEWS.training=()=>{
  const v=UI.planView;
  const sw=`<div class="subtabs">${[['week','Semaine (microcycle)'],['month','Mois'],['season','Saison']].map(([k,l])=>`<button class="${v===k?'on':''}" data-act="planView" data-id="${k}">${l}</button>`).join('')}</div>`;
  const cat=UI.cat;const catLbl=cat==='Tous'?'toutes catégories':cat;
  if(v==='week'){
    const mon=UI.planWeek;const days=range(mon,addDays(mon,6));
    const ents=Object.values(DATA.plan).filter(inCat).filter(e=>e.date>=mon&&e.date<=days[6]);
    const real=Object.values(DATA.sessions).filter(inCat).filter(s=>s.date>=mon&&s.date<=days[6]);
    const stt=ents.map(planStatus);const done=stt.filter(s=>s==='done').length,miss=stt.filter(s=>s==='miss').length;
    const pMin=sum(ents.filter(e=>e.type!=='Match').map(e=>num(e.duration))),rMin=sum(real.map(s=>num(s.duration)));
    const objs={};ents.forEach(e=>{objs[e.objective||'Autre']=(objs[e.objective||'Autre']||0)+(num(e.duration)||0);});
    const unplanned=real.filter(s=>!ents.some(e=>e.date===s.date&&e.cat===s.cat));
    return sw+`<div class="row sb"><div class="row"><button class="btn sm" data-act="week" data-id="-7" aria-label="Semaine précédente">◀</button><b style="font-family:var(--fd);font-size:20px">Semaine du ${fmtD(mon,{day:'numeric',month:'long'})}</b><button class="btn sm" data-act="week" data-id="7" aria-label="Semaine suivante">▶</button>${mon!==mondayOf(TODAY)?'<button class="btn sm" data-act="week" data-id="0">Cette semaine</button>':''}</div>
      <div class="row"><button class="btn sm" data-act="dupWeek">Dupliquer vers la semaine suivante</button><button class="btn sm pri" data-act="addPlan" data-id="${mon}">Planifier une séance</button></div></div>
    <div class="week">${days.map(d=>{const es=ents.filter(e=>e.date===d);const jl=jLabel(d,cat==='Tous'?(cats()[cats().length-1]||'Tous'):cat);const rs=real.filter(s=>s.date===d&&!es.some(e=>e.cat===s.cat&&(e.type===s.type)));
