const DAYTPL={'J+1':['Récupération / compensation','Titulaires : récupération active 30–40 min (vélo, mobilité, soins). Non-joueurs et joueurs < 45 min : compensation avec jeu réduit + course à haute intensité pour compenser la charge du match.'],
 'J+2':['Récupération ou repos','Repos ou séance légère. Idéal pour le suivi individuel (entretiens, soins).'],
 'J-5':['Reprise / technique','Charge modérée : technique, prévention (Nordic, Copenhagen), gainage.'],
 'J-4':['Force & tension','Jeux réduits (4c4 à 6c6, petits espaces), accélérations/décélérations, musculation force (charges lourdes, faible volume).'],
 'J-3':['Volume & endurance','Grands espaces (8c8 à 11c11), endurance intermittente type 15-15 à 100-110 % VIFT, courses haute intensité : c’est la séance la plus volumineuse.'],
 'J-2':['Vitesse & réactivité','Exposition à la vitesse maximale (sprints 30–40 m lancés, récupération complète), réactivité, finitions. Volume réduit.'],
 'J-1':['Activation','Séance courte (45–60 min) : vitesse de réaction, coups de pied arrêtés, faible volume, intensité par pics brefs.'],
 'J':['Match','Échauffement standardisé, relevé RPE et GPS après le match.']};
function buildRecos(){
  const ref=UI.ref;const th=S().th;const out=[];const cs=UI.cat==='Tous'?cats():[UI.cat];
  cs.forEach(cat=>{
    const ps=playersOf(cat);if(!ps.length)return;const pre=UI.cat==='Tous'?cat+' · ':'';const healthy=ps.filter(p=>!activeInjury(p.id,ref));
    const nm=nextMatch(cat,ref);const dm=nm?dayDiff(nm.date,ref):null;
    // vitesse max
    const noV=healthy.filter(p=>{const v=lastVmaxExpo(p,ref);return v==null||v>th.vmaxDays;});
    if(noV.length>=Math.max(2,healthy.length*.25)){out.push({p:'hi',cat,title:pre+`Exposition à la vitesse maximale insuffisante (${noV.length} joueurs)`,why:`Aucune course ≥ ${th.vmaxPct} % de leur Vmax depuis plus de ${th.vmaxDays} jours. L'exposition régulière au sprint est un facteur clé de prévention des lésions des ischio-jambiers.`,
      action:dm!=null&&dm>=2&&dm<=4?`À placer ${dm===2?'aujourd’hui (J-2)':'à J-2'} : 3 à 5 sprints de 30–40 m lancés, récupération complète (2–3 min).`:'Prochaine séance de vitesse : 3 à 5 sprints de 30–40 m lancés, récupération complète, en début de séance après l’échauffement.',players:noV.map(p=>p.id)});}
    else if(noV.length){out.push({p:'md',cat,title:pre+`${noV.length} joueur${noV.length>1?'s':''} à exposer à la vitesse max`,why:`Pas de sprint ≥ ${th.vmaxPct} % Vmax depuis plus de ${th.vmaxDays} jours.`,action:'Ajouter 2–3 sprints lancés en fin d’échauffement pour ces joueurs.',players:noV.map(p=>p.id)});}
    // variation de charge
    const ws=healthy.map(p=>weekStats(p.id,ref));const l7=mean(ws.map(w=>w.sum).filter(v=>v>0)),pa=mean(ws.map(w=>w.prevAvg).filter(v=>v>0));
    if(l7&&pa){const c=(l7-pa)/pa*100;
      if(c>th.weekChg)out.push({p:c>th.weekChg*2?'hi':'md',cat,title:pre+`Charge en hausse de ${r0(c)} % sur 7 jours`,why:`Charge moyenne ${r0(l7)} UA contre ${r0(pa)} UA sur les 3 semaines précédentes. Au-delà de +${th.weekChg} %, le risque de blessure augmente.`,action:'Réduire le volume des prochaines séances (−20 à −30 % de durée ou d’espace), conserver l’intensité par pics.'});
      else if(c<-30&&!(dm!=null&&dm<=2))out.push({p:'md',cat,title:pre+`Charge en baisse de ${r0(-c)} %`,why:'Une baisse durable réduit la charge chronique et expose à un pic lors du retour à la normale.',action:'Remonter progressivement le volume (+10 à 15 % par semaine) si le calendrier le permet.'});}
    // ACWR individuels
    const hi=healthy.filter(p=>{const e=ewma(p.id,ref);return e.acwr!=null&&e.days>=21&&e.acwr>th.acwrHi;});
    if(hi.length)out.push({p:'md',cat,title:pre+`ACWR élevé pour ${hi.length} joueur${hi.length>1?'s':''}`,why:`Charge aiguë supérieure à ${th.acwrHi} fois la charge chronique.`,action:'Individualiser : limiter le temps de jeu en jeux réduits, pas de complément haute intensité.',players:hi.map(p=>p.id)});
    const lo=healthy.filter(p=>{const e=ewma(p.id,ref);return e.acwr!=null&&e.days>=21&&e.acwr<th.acwrLo;});
    if(lo.length)out.push({p:'lo',cat,title:pre+`Sous-charge pour ${lo.length} joueur${lo.length>1?'s':''}`,why:`ACWR inférieur à ${th.acwrLo} : la charge récente est faible par rapport à l'habitude.`,action:'Compléments de charge : jeux réduits additionnels ou intermittent court (15-15) pour maintenir la condition.',players:lo.map(p=>p.id)});
    // non-joueurs
    const pm=prevMatch(cat,ref);if(pm&&dayDiff(ref,pm.date)<=3){const nj=healthy.filter(p=>{const e=(pm.players||{})[p.id];return !e||(num(e.min)||0)<45;});
      if(nj.length)out.push({p:'md',cat,title:pre+`Compensation pour ${nj.length} joueur${nj.length>1?'s':''} (< 45 min au dernier match)`,why:`Match du ${fmtD(pm.date)} contre ${pm.opponent}. Sans compensation, leur charge haute intensité chute.`,action:'Séance de compensation à J+1 ou J+2 : jeu réduit 4c4 + 6 à 8 courses de 60–80 m à haute intensité + 3 sprints.',players:nj.map(p=>p.id)});}
    // force
    const strength=Object.values(DATA.sessions).filter(s=>s.cat===cat&&s.date<=ref&&dayDiff(ref,s.date)<7&&(s.type==='Salle'||s.objective==='Force'||s.objective==='Puissance / explosivité')).length;
    if(strength<2)out.push({p:strength===0?'hi':'md',cat,title:pre+`${strength} séance${strength>1?'s':''} de force sur 7 jours`,why:'Deux stimulations de force par semaine sont recommandées pour progresser (une seule suffit pour maintenir en période chargée).',action:dm!=null&&dm>=4?'Programmer une séance de force à J-4 (charges lourdes, faible volume) et une à J+2.':'Placer la séance de force à J+2 ou J-4 la semaine prochaine, jamais à J-1.'});
    // monotonie
    const mono=mean(ws.map(w=>w.mono).filter(v=>v!=null));if(mono!=null&&mono>th.monotony)out.push({p:'md',cat,title:pre+`Monotonie élevée (${r2(mono)})`,why:'Les charges quotidiennes sont trop uniformes : la variation entre jours durs et jours légers favorise l’adaptation.',action:'Alterner davantage : une séance nettement plus légère (RPE ≤ 3) et une séance clé plus intense.'});
    // wellness
    const tw=teamWell(ps,ref,28);const l3=mean(tw.vals.slice(-3)),b=mean(tw.vals.slice(0,-3));if(l3!=null&&b&&l3-b<-5)out.push({p:'hi',cat,title:pre+`Wellness en baisse (${r1(l3-b)} points sur 3 jours)`,why:`Score moyen ${r0(l3)} % contre ${r0(b)} % habituellement.`,action:'Alléger la prochaine séance, vérifier sommeil et charge scolaire (contrôles, examens), rappel hydratation et nutrition.'});
    const lowW=ps.filter(p=>{const w=wStats(p.id,ref);return w.today!=null&&(w.today<th.well||(w.z!=null&&w.z<th.wz*1.6));});
    if(lowW.length)out.push({p:'hi',cat,title:pre+`Wellness bas aujourd’hui : ${lowW.map(p=>p.name).join(', ')}`,why:'Score sous le seuil ou très en dessous de l’habitude du joueur.',action:'Échange individuel avant la séance ; séance adaptée (volume réduit) si le ressenti se confirme à l’échauffement.',players:lowW.map(p=>p.id)});
    // tests
    const bt=testBatteries(cat);const lastT=bt.length?bt[bt.length-1].date:null;if(!lastT||dayDiff(ref,lastT)>56)out.push({p:'lo',cat,title:pre+'Batterie de tests à programmer',why:lastT?`Dernière batterie le ${fmtD(lastT)}, il y a ${dayDiff(ref,lastT)} jours.`:'Aucune batterie de tests enregistrée.',action:'Programmer CMJ, sprint 10/30 m, 505 et 30-15 IFT sur une semaine sans match en milieu de semaine (J-4 ou J-3). Un CMJ hebdomadaire aide aussi à suivre la fatigue.'});
    // croissance
    // réathlé
    Object.values(DATA.injuries).filter(i=>i.status==='reathle'&&DATA.players[i.pid]&&DATA.players[i.pid].cat===cat).forEach(i=>{const ph=S().rtp[i.phase||0];if(!ph)return;const cr=(i.criteria&&i.criteria[i.phase||0])||[];const left=ph.criteria.filter((c,k)=>!cr[k]);
      out.push({p:'lo',cat,title:pre+`${pname(i.pid)} : réathlé, phase ${(i.phase||0)+1} (${ph.name})`,why:`${i.zone}, ${dayDiff(ref,i.date)} jours depuis la blessure.`,action:left.length?'Critères restants : '+left.join(' ; ')+'.':'Tous les critères de la phase sont validés : passage à la phase suivante possible.',players:[i.pid]});});
    // planning
    const mon=mondayOf(ref);const pl=Object.values(DATA.plan).filter(e=>e.cat===cat&&e.date>=mon&&e.date<=addDays(mon,6));
    if(!Object.values(DATA.plan).some(e=>e.cat===cat&&e.date>=addDays(mon,7)&&e.date<=addDays(mon,13)))out.push({p:'lo',cat,title:pre+'Semaine prochaine non planifiée',why:'Aucune séance planifiée pour la semaine suivante.',action:'Utiliser « Dupliquer vers la semaine suivante » dans Entraînement puis ajuster.'});
    const missed=pl.filter(e=>planStatus(e)==='miss');if(missed.length)out.push({p:'lo',cat,title:pre+`${missed.length} séance${missed.length>1?'s':''} planifiée${missed.length>1?'s':''} non réalisée${missed.length>1?'s':''} cette semaine`,why:missed.map(e=>fmtD(e.date)+' : '+(e.title||e.objective)).join(' · '),action:'Marquer « Fait » si elles ont eu lieu, ou reporter l’objectif manqué sur un autre jour.'});
  });
  const o={hi:0,md:1,lo:2};return out.sort((a,b)=>o[a.p]-o[b.p]);
}

async function runAI(){
  const sample=Store.sample;if(!sample)return;const ctl=new AbortController();UI.ai={busy:true,text:'',ctl};render();
  const prompt=`Tu es préparateur physique dans un centre de formation de football (catégories U15 à U18). Voici les données de suivi au ${UI.ref}. Réponds en français, sans tableau Markdown, en texte clair structuré avec des titres courts :
1) Les 3 à 5 constats principaux (chiffres à l'appui).
2) Une proposition de contenu pour chacun des 7 prochains jours (objectif, contenu, volume, intensité), cohérente avec la position par rapport au match.
3) Les joueurs à individualiser et comment.
4) Les points de vigilance (prévention, croissance, charge scolaire).
Base-toi sur les données et les recommandations scientifiques actuelles (exposition à la vitesse maximale, gestion de la charge, prévention ischios/adducteurs, maturation). Sois concret et concis.

DONNÉES :${aiSummary()}`;
  try{const r=await sample(prompt,{signal:ctl.signal,cache:false,onText:({text})=>{UI.ai.text=text;const o=$('#aiOut');if(o)o.textContent=text;}});UI.ai={busy:false,text:r.text,err:r.truncated?'Réponse coupée : relance pour la suite.':null};}
  catch(e){const m={not_granted:'Accès à Claude refusé pour cette page.',rate_limited:'Trop de demandes : réessaie dans quelques minutes.',session_expired:'Reconnecte-toi à Claude.',cancelled:null,sampling_disabled:'Claude n’est pas disponible pour ce compte.'};
    UI.ai={busy:false,text:e.text||'',err:e.code in m?m[e.code]:'L’analyse a échoué, réessaie.'};if(e.code==='not_granted'||e.code==='sampling_disabled')Store.sample=null;}
  if(UI.tab==='reco')render();
}

/* ---------- PERFORMANCE : TESTING ---------- */
VIEWS.testing=()=>{
  const ps=playersOf(UI.cat);if(!ps.length)return emptyPlayers();const tests=S().tests;if(!tests.length)return '<div class="empty">Aucun test défini : ajoute-en dans Paramètres.</div>';
  const t=tests.find(x=>x.id===UI.testId)||tests[0];const hi=t.better!=='low';
  const bats=testBatteries(UI.cat).filter(b=>b.results&&b.results[t.id]&&Object.keys(b.results[t.id]).length);
  const rows=ps.map(p=>{const s=testSeries(p.id,t.id);const last=s[s.length-1],prev=s[s.length-2];return{p,last,prev,chg:last&&prev?(last.v-prev.v)/prev.v*100:null};});
  const lastVals=rows.map(r=>r.last&&r.last.v).filter(v=>v!=null);const m=mean(lastVals),sdv=sd(lastVals);
  rows.forEach(r=>{r.z=r.last&&m!=null&&sdv?((r.last.v-m)/sdv)*(hi?1:-1):null;});
  const ranked=rows.filter(r=>r.last).sort((a,b)=>hi?b.last.v-a.last.v:a.last.v-b.last.v);
  const sp=DATA.players[UI.testPlayer]&&inCat(DATA.players[UI.testPlayer])?DATA.players[UI.testPlayer]:ps[0];
  const prof=tests.map(tt=>{const vals=ps.map(p=>{const s=testSeries(p.id,tt.id);return s.length?s[s.length-1].v:null;}).filter(v=>v!=null);const mm=mean(vals),ss=sd(vals);const s=testSeries(sp.id,tt.id);const v=s.length?s[s.length-1].v:null;
    return{label:tt.name,value:v!=null&&mm!=null&&ss?((v-mm)/ss)*(tt.better==='low'?-1:1):null,tip:tt.name+' : '+(v!=null?fr(v,2)+' '+tt.unit:'–')+' (moy. groupe '+fr(mm,2)+')'};});
  const evo=testSeries(sp.id,t.id);const tDates=[...new Set(bats.map(b=>b.date))];
  return `<div class="card"><div class="hrow"><div class="row"><h2>Test</h2><select id="testSel" style="width:auto">${tests.map(x=>`<option value="${esc(x.id)}" ${x.id===t.id?'selected':''}>${esc(x.name)} (${esc(x.unit)})</option>`).join('')}</select></div>
    <div class="row"><button class="btn sm pri" data-act="goEntry" data-id="tests">Nouvelle session de tests</button></div></div>
    <div class="grid g4">${kpi('Moyenne du groupe',fr(m,2),t.unit,lastVals.length+' joueurs testés')}${kpi('Écart-type',fr(sdv,2),t.unit,'Dispersion du groupe')}${kpi('Meilleur',ranked[0]?fr(ranked[0].last.v,2):'–',t.unit,ranked[0]?esc(ranked[0].p.name):'')}${kpi('Sessions',bats.length,'',bats.length?'Dernière : '+fmtD(bats[bats.length-1].date):'')}</div></div>
  <div class="grid g2">
    <div class="card"><div class="hrow"><h2>Classement</h2><span class="small muted">${hi?'Plus haut = meilleur':'Plus bas = meilleur'}</span></div>
      ${hbars(ranked.map(r=>({label:r.p.name,value:r.last.v,color:r.z!=null&&r.z<-1?'var(--warn)':'var(--accent)',tip:r.p.name+' : '+fr(r.last.v,2)+' '+t.unit+' ('+fmtD(r.last.date)+')'})),{fmt:v=>fr(v,2),max:Math.max(...lastVals,0)*1.02})}</div>
    <div class="card"><div class="hrow"><h2>Profil de ${esc(sp.name)}</h2><select id="testPl" style="width:auto">${ps.map(p=>`<option value="${esc(p.id)}" ${p.id===sp.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
      <p class="note" style="margin-top:0">z-score par rapport au groupe, orienté pour que la droite soit toujours meilleure.</p>${zbars(prof)}
      <div style="margin-top:14px">${evo.length?lineChart({labels:evo.map(e=>e.date),series:[{name:t.name,values:evo.map(e=>e.v),color:COL_TR,dots:true}],h:150,fmt:v=>fr(v,t.unit==='s'?2:1)}):'<p class="muted small">Pas encore de valeur pour ce test.</p>'}<div class="small muted" style="text-align:center">Évolution : ${esc(t.name)}</div></div></div>
  </div>
  <div class="card"><div class="hrow"><h2>Suivi par joueur : ${esc(t.name)}</h2><span class="small muted">Variation vs session précédente</span></div>
    <div class="tw"><table><thead><tr><th>Joueur</th>${tDates.map(d=>`<th class="n">${fmtShort(d)}</th>`).join('')}<th class="n">Variation</th><th class="n">z groupe</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${plink(r.p.id)}</td>${tDates.map(d=>{const b=bats.find(x=>x.date===d&&x.cat===r.p.cat);const v=b?num(b.results[t.id][r.p.id]):null;return `<td class="n">${v!=null?fr(v,2):'–'}</td>`;}).join('')}
      <td class="n">${r.chg==null?'–':`<span class="pill ${(hi?r.chg:-r.chg)>1?'good':(hi?r.chg:-r.chg)<-3?'crit':'neutral'}">${r.chg>0?'+':''}${r1(r.chg)} %</span>`}</td><td class="n">${r.z!=null?r1(r.z):'–'}</td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="card"><div class="hrow"><h2>Sessions de tests</h2></div><div class="tw"><table><thead><tr><th>Date</th><th>Cat.</th><th>Intitulé</th><th>Tests</th><th class="n">Joueurs</th><th></th></tr></thead><tbody>
    ${testBatteries(UI.cat).slice().reverse().map(b=>{const ids=Object.keys(b.results||{}).filter(k=>Object.keys(b.results[k]).length);const np=new Set();ids.forEach(k=>Object.keys(b.results[k]).forEach(p=>np.add(p)));
      return `<tr><td>${fmtD(b.date)}</td><td>${esc(b.cat)}</td><td>${esc(b.label||'')}</td><td class="wrap small">${ids.map(k=>esc((tests.find(x=>x.id===k)||{name:k}).name)).join(', ')}</td><td class="n">${np.size}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="edit" data-col="tests" data-id="${esc(b.id)}">Modifier</button><button class="btn sm danger" data-act="del" data-col="tests" data-id="${esc(b.id)}">×</button></div></td></tr>`;}).join('')||'<tr><td colspan="6" class="muted">Aucune session</td></tr>'}
    </tbody></table></div></div>`;
};
POST.testing=()=>{const a=$('#testSel');if(a)a.onchange=()=>{UI.testId=a.value;render();};const b=$('#testPl');if(b)b.onchange=()=>{UI.testPlayer=b.value;render();};};

/* ---------- PERFORMANCE : RÉATHLÉTISATION ---------- */
function refWeeklyDist(pid,before){const w=[1,2,3,4].map(k=>{let s=0;for(let i=0;i<7;i++){const x=pday(pid,addDays(before,-(k-1)*7-i-1));if(x&&!x.reathle)s+=x.dist;}return s;}).filter(v=>v>0);return mean(w);}
VIEWS.reathle=()=>{
  const ref=UI.ref;const rtp=S().rtp;
  const list=Object.values(DATA.injuries).filter(i=>i.status!=='apte'&&DATA.players[i.pid]&&inCat(DATA.players[i.pid])).sort((a,b)=>a.date.localeCompare(b.date));
  const inR=list.filter(i=>i.status==='reathle'||i.status==='reprise');const soins=list.filter(i=>i.status==='soins');
  const sel=inR.find(i=>i.id===UI.reaSel)||inR[0];
  let detail='<div class="empty">Aucun joueur en réathlétisation. Depuis l’onglet Médical, passe un joueur blessé en réathlé.</div>';
  if(sel){const ph=sel.phase||0;const cr=(sel.criteria&&sel.criteria[ph])||[];const cur=rtp[ph]||{name:'',criteria:[]};const allOk=cur.criteria.every((c,k)=>cr[k]);
    const log=(sel.log||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));const refW=refWeeklyDist(sel.pid,sel.date);
    let w7=0;log.forEach(l=>{if(dayDiff(ref,l.date)<7&&l.date<=ref)w7+=num(l.dist)||0;});const pct=refW?w7/refW*100:null;const p=DATA.players[sel.pid];const pv=vref(p);const vm=Math.max(0,...log.map(l=>num(l.vmax)||0));
    detail=`<div class="row sb"><div><div class="eyebrow">${esc(sel.zone)} · ${esc(sel.type||'')} · ${esc(sel.side||'')}</div><h2 style="margin:2px 0 0;font-size:26px">${plink(sel.pid)}</h2><div class="small muted">Blessé le ${fmtD(sel.date)} · J+${dayDiff(ref,sel.date)} · retour prévu ${fmtD(sel.expectedReturn)}</div></div>
      <div class="row"><button class="btn sm" data-act="medOpen" data-id="${esc(sel.id)}">Fiche médicale</button>${sel.status==='reprise'?`<button class="btn sm pri" data-act="injStatus" data-id="${esc(sel.id)}" data-v="apte">Déclarer apte</button>`:''}</div></div>
    <div class="steps" style="margin:14px 0">${rtp.map((r,k)=>`<div class="${k<ph?'done':k===ph?'cur':''}">${k+1}. ${esc(r.name)}</div>`).join('')}</div>
    <div class="grid g2"><div class="card flat"><h3>Critères de la phase ${ph+1} : ${esc(cur.name)}</h3><div class="stack">
      ${cur.criteria.map((c,k)=>`<label class="chk"><input type="checkbox" data-chg="crit" data-id="${esc(sel.id)}" data-k="${k}" ${cr[k]?'checked':''}> ${esc(c)}</label>`).join('')}</div>
      <div class="row" style="margin-top:12px">${ph>0?`<button class="btn sm" data-act="phase" data-id="${esc(sel.id)}" data-v="-1">Phase précédente</button>`:''}
      ${ph<rtp.length-1?`<button class="btn sm ${allOk?'pri':''}" data-act="phase" data-id="${esc(sel.id)}" data-v="1">${allOk?'Valider et passer en phase '+(ph+2):'Passer en phase '+(ph+2)+' (critères incomplets)'}</button>`:`<button class="btn sm pri" data-act="injStatus" data-id="${esc(sel.id)}" data-v="reprise">Passer en reprise collective</button>`}</div></div>
      <div class="card flat"><h3>Progression de charge terrain</h3><div class="stack small">
        <div><div class="row sb"><span>Distance 7 j / référence habituelle</span><b>${pct!=null?r0(pct)+' %':'–'}</b></div><div class="bar"><i style="width:${clamp(pct||0,0,100)}%;background:${pct>=80?'var(--good)':'var(--accent)'}"></i></div><span class="muted">${r0(w7)} m sur 7 j · référence ${refW?r0(refW)+' m/sem':'non disponible'}</span></div>
        <div><div class="row sb"><span>Vmax atteinte / Vmax de référence</span><b>${pv&&vm?r0(vm/pv*100)+' %':'–'}</b></div><div class="bar"><i style="width:${pv&&vm?clamp(vm/pv*100,0,100):0}%;background:${pv&&vm/pv>=.9?'var(--good)':'var(--accent)'}"></i></div><span class="muted">${vm?r1(vm)+' km/h':'–'} sur ${r1(pv)} km/h</span></div></div></div></div>
    <div class="card flat" style="margin-top:14px"><div class="hrow"><h3>Séances de réathlétisation</h3></div>
      ${log.length>1?barChart({labels:log.map(l=>l.date),values:log.map(l=>num(l.dist)||0),unit:'m',h:140}):''}
      <div class="tw" style="margin-top:8px"><table><thead><tr><th>Date</th><th>Contenu</th><th class="n">Min</th><th class="n">RPE</th><th class="n">Distance</th><th class="n">HSR</th><th class="n">Vmax</th><th></th></tr></thead><tbody>
      ${log.slice().reverse().map((l,k)=>`<tr><td>${fmtD(l.date)}</td><td class="wrap">${esc(l.content)}</td><td class="n">${r0(num(l.min))}</td><td class="n">${r0(num(l.rpe))}</td><td class="n">${r0(num(l.dist))}</td><td class="n">${r0(num(l.hsr))}</td><td class="n">${r1(num(l.vmax))}</td><td><button class="btn sm danger" data-act="delLog" data-id="${esc(sel.id)}" data-k="${log.length-1-k}">×</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">Aucune séance</td></tr>'}</tbody></table></div>
      <form data-form="rlog" data-id="${esc(sel.id)}" class="fgrid" style="margin-top:12px;align-items:end">
        <div class="f"><label for="rl-date">Date</label><input type="date" id="rl-date" name="date" value="${ref}" required></div>
        <div class="f" style="grid-column:span 2"><label for="rl-content">Contenu</label><input type="text" id="rl-content" name="content" placeholder="ex. 6 × 40 m à 85 %, COD 45°" required></div>
        <div class="f"><label for="rl-min">Durée (min)</label><input type="number" id="rl-min" name="min" min="0"></div><div class="f"><label for="rl-rpe">RPE</label><input type="number" id="rl-rpe" name="rpe" min="0" max="10"></div>
        <div class="f"><label for="rl-dist">Distance (m)</label><input type="number" id="rl-dist" name="dist" min="0"></div><div class="f"><label for="rl-hsr">HSR (m)</label><input type="number" id="rl-hsr" name="hsr" min="0"></div>
        <div class="f"><label for="rl-vmax">Vmax (km/h)</label><input type="number" id="rl-vmax" name="vmax" step="0.1" min="0"></div><div><button class="btn pri">Ajouter la séance</button></div></form></div>`;}
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,3fr)">
    <div class="stack"><div class="card"><h3>En réathlétisation</h3><div class="stack" style="gap:6px">${inR.map(i=>`<button class="btn" style="justify-content:space-between;${sel&&i.id===sel.id?'border-color:var(--accent);color:var(--accent)':''}" data-act="reaSel" data-id="${esc(i.id)}"><span>${esc(pname(i.pid))}</span><span class="pill ${i.status==='reprise'?'warn':'info'}">${i.status==='reprise'?'Reprise':'Ph. '+((i.phase||0)+1)}</span></button>`).join('')||'<p class="muted small">Personne</p>'}</div></div>
    <div class="card"><h3>En soins</h3><div class="stack" style="gap:8px">${soins.map(i=>`<div class="stack" style="gap:4px"><span>${plink(i.pid)} <span class="muted small">${esc(i.zone)} · J+${dayDiff(ref,i.date)}</span></span><button class="btn sm" data-act="injStatus" data-id="${esc(i.id)}" data-v="reathle">Démarrer la réathlé</button></div>`).join('')||'<p class="muted small">Personne</p>'}</div></div></div>
    <div class="card">${detail}</div></div>`;
};

const SKL=['Non acquis','En cours','Acquis','Maîtrisé'];
VIEWS.muscu=()=>{
  const ps=playersOf(UI.cat);const progs=Object.values(DATA.programs).filter(p=>inCat(p)).sort((a,b)=>a.name.localeCompare(b.name));const exos=S().muscuExos;const skills=S().skills;

      <div class="f"><label for="pg-freq">Séances / semaine</label><input type="number" id="pg-freq" name="freq" value="${esc(p.freq||2)}" min="1" max="7"></div></div>

  else if(sel){const cp=playersOf(sel.cat==='Tous'?UI.cat:sel.cat);const withPct=sel.exercises.filter(e=>num(e.pct));
    progHtml=`<div class="row sb"><div><div class="eyebrow">${esc(sel.cat)} · ${esc(sel.phase||'')} · ${esc(sel.freq||'')} séance(s)/sem.</div><h2 style="margin:2px 0 0">${esc(sel.name)}</h2></div><div class="row"><button class="btn sm" data-act="progEdit" data-id="${esc(sel.id)}">Modifier</button><button class="btn sm danger" data-act="del" data-col="programs" data-id="${esc(sel.id)}">Supprimer</button></div></div>
    <div class="tw" style="margin-top:10px"><table><thead><tr><th>Exercice</th><th class="n">Séries</th><th>Rép.</th><th class="n">% 1RM</th><th>Récup.</th><th>Consignes</th></tr></thead><tbody>${sel.exercises.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td class="n">${esc(e.sets)}</td><td>${esc(e.reps)}</td><td class="n">${num(e.pct)?esc(e.pct)+' %':'–'}</td><td>${esc(e.rest||'')}</td><td class="wrap small">${esc(e.notes||'')}</td></tr>`).join('')}</tbody></table></div>
    ${withPct.length?`<h3 style="margin-top:16px">Charges individuelles (kg)</h3><p class="note" style="margin-top:0">% 1RM × 1RM du joueur, arrondi à 2,5 kg. Charges indiquées seulement si la technique est au moins « Acquis ».</p>

    ${cp.map(p=>{const mx=(DATA.maxes[p.id]||{}).values||{};const sk=(DATA.maxes[p.id]||{}).skills||{};const minSk=Math.min(...skills.map(s=>num(sk[s])??0));

  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,3fr)">

  <div class="card"><div class="hrow"><h2>1RM et maîtrise technique</h2><span class="small muted">Les valeurs s’enregistrent dès que tu quittes la case</span></div>

    ${ps.map(p=>{const m=DATA.maxes[p.id]||{};const v=m.values||{},sk=m.skills||{};return `<tr><td>${plink(p.id)}</td>${exos.map(e=>`<td><input type="number" step="2.5" min="0" value="${esc(v[e]??'')}" data-chg="max" data-id="${esc(p.id)}" data-k="${esc(e)}" aria-label="${esc(p.name+' '+e)}"></td>`).join('')}
      ${skills.map(s=>`<td><select data-chg="skill" data-id="${esc(p.id)}" data-k="${esc(s)}" aria-label="${esc(p.name+' '+s)}" style="width:110px">${SKL.map((l,k)=>`<option value="${k}" ${(num(sk[s])??0)===k?'selected':''}>${l}</option>`).join('')}</select></td>`).join('')}</tr>`;}).join('')}</tbody></table></div>`:emptyPlayers()}</div>
  <div class="card"><h3>Calculateur de 1RM (Epley)</h3><div class="row"><div class="f"><label for="ep-kg">Charge (kg)</label><input type="number" id="ep-kg" style="width:120px"></div><div class="f"><label for="ep-reps">Répétitions</label><input type="number" id="ep-reps" style="width:120px"></div><div class="f"><label>1RM estimé</label><div id="ep-out" style="font-family:var(--fd);font-size:26px;font-weight:700">–</div></div></div>
    <p class="note">1RM = charge × (1 + répétitions / 30). Fiable jusqu’à environ 10 répétitions. Chez les jeunes, préfère un test sur 3 à 5 RM à un vrai 1RM.</p></div>`;
};
function exoRow(e,k){return `<tr><td><input class="w" type="text" name="ex-name-${k}" value="${esc(e.name)}" list="exoList" aria-label="Exercice"></td><td><input type="number" name="ex-sets-${k}" value="${esc(e.sets??'')}" min="0" aria-label="Séries"></td><td><input type="text" name="ex-reps-${k}" value="${esc(e.reps??'')}" aria-label="Répétitions"></td><td><input type="number" name="ex-pct-${k}" value="${esc(e.pct??'')}" min="0" max="100" aria-label="% 1RM"></td><td><input type="text" name="ex-rest-${k}" value="${esc(e.rest??'')}" aria-label="Récupération"></td><td><input class="w" type="text" name="ex-notes-${k}" value="${esc(e.notes??'')}" aria-label="Consignes"></td><td><button type="button" class="btn sm danger" data-act="rmRow">×</button></td></tr>`;}
POST.muscu=()=>{const a=$('#ep-kg'),b=$('#ep-reps'),o=$('#ep-out');if(!a)return;const f=()=>{const k=num(a.value),r=num(b.value);o.textContent=k&&r?fr(k*(1+r/30),1)+' kg':'–';};a.oninput=f;b.oninput=f;};

/* ---------- MÉDICAL ---------- */
const ZONES=['Ischio-jambiers','Adducteurs','Quadriceps','Mollet','Cheville','Genou','Hanche / pubis','Dos','Pied','Épaule','Tête (commotion)','Autre'];
VIEWS.medical=()=>{
  const ref=UI.ref;const all=Object.values(DATA.injuries).filter(i=>DATA.players[i.pid]&&inCat(DATA.players[i.pid])).sort((a,b)=>b.date.localeCompare(a.date));
  const cur=all.filter(i=>i.status!=='apte');const hist=all.filter(i=>i.status==='apte');
  const daysOut=i=>dayDiff(i.returnDate&&i.status==='apte'?i.returnDate:ref,i.date);
  let hours=0;Object.keys(IDX).forEach(pid=>{if(!DATA.players[pid]||!inCat(DATA.players[pid]))return;Object.values(IDX[pid].days).forEach(d=>hours+=d.min/60);});
  const zones={};all.forEach(i=>zones[i.zone]=(zones[i.zone]||0)+1);const mech={};all.forEach(i=>mech[i.mechanism||'Non précisé']=(mech[i.mechanism||'Non précisé']||0)+1);
  const sel=DATA.injuries[UI.medSel];
  const sev=d=>d<=3?'Minime':d<=7?'Légère':d<=28?'Modérée':'Sévère';
  let fiche='';
  if(sel){const p=DATA.players[sel.pid];fiche=`<div class="card" id="fiche"><div class="row sb"><div><div class="eyebrow">Fiche blessure</div><h2 style="margin:2px 0 0;font-size:24px">${plink(sel.pid)} · ${esc(sel.zone)}</h2>
    <div class="small muted">${esc(sel.type||'')} · ${esc(sel.side||'')} · ${esc(sel.mechanism||'')} · ${esc(sel.context||'')} · le ${fmtD(sel.date)}</div></div>
    <div class="row"><button class="btn sm" data-act="edit" data-col="injuries" data-id="${esc(sel.id)}">Modifier</button><button class="btn sm" data-act="medClose">Fermer</button></div></div>
    <div class="row" style="margin:12px 0"><span class="flabel">Statut</span>${['soins','reathle','reprise','apte'].map(s=>`<button class="btn sm ${sel.status===s?'pri':''}" data-act="injStatus" data-id="${esc(sel.id)}" data-v="${s}">${STATUS_LABEL[s]}</button>`).join('')}
      ${sel.status==='reathle'?`<button class="btn sm" data-act="goReathle" data-id="${esc(sel.id)}">Ouvrir la réathlé →</button>`:''}</div>
    <div class="grid g4" style="margin-bottom:12px">${kpi('Jours d’absence',daysOut(sel),'',sev(daysOut(sel)))}${kpi('Retour prévu',sel.expectedReturn?fmtShort(sel.expectedReturn):'–','',sel.expectedReturn&&sel.status!=='apte'?(dayDiff(sel.expectedReturn,ref)>=0?'dans '+dayDiff(sel.expectedReturn,ref)+' j':'dépassé de '+(-dayDiff(sel.expectedReturn,ref))+' j'):'')}${kpi('Phase réathlé',sel.status==='soins'?'–':(sel.phase||0)+1,'/'+S().rtp.length,'')}${kpi('Douleur (EVA)',(sel.followups||[]).length?sel.followups[sel.followups.length-1].pain??'–':'–','/10','Dernier suivi')}</div>
    ${sel.notes?`<p class="small">${esc(sel.notes)}</p>`:''}
    <h3>Suivi</h3><div class="stack">${(sel.followups||[]).slice().reverse().map((f,k)=>`<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="pill neutral">${fmtShort(f.date)}</span><span style="flex:1">${esc(f.text)}</span>${f.pain!=null&&f.pain!==''?`<span class="pill ${f.pain>=5?'crit':f.pain>=3?'warn':'good'}">EVA ${esc(f.pain)}</span>`:''}</div>`).join('')||'<p class="muted small">Aucun suivi.</p>'}</div>
    <form data-form="followup" data-id="${esc(sel.id)}" class="fgrid" style="margin-top:12px;align-items:end"><div class="f"><label for="fu-date">Date</label><input type="date" id="fu-date" name="date" value="${ref}"></div><div class="f" style="grid-column:span 2"><label for="fu-text">Note de suivi</label><input type="text" id="fu-text" name="text" required placeholder="Examen, évolution, décision…"></div><div class="f"><label for="fu-pain">Douleur EVA (0–10)</label><input type="number" id="fu-pain" name="pain" min="0" max="10"></div><div><button class="btn pri">Ajouter</button></div></form></div>`;}
  return `<div class="grid g6">${kpi('Blessés actuels',cur.length,'',cur.filter(i=>i.status==='soins').length+' en soins, '+cur.filter(i=>i.status==='reathle').length+' en réathlé')}${kpi('Blessures (saison)',all.length,'')}
    ${kpi('Jours d’absence cumulés',sum(all.map(daysOut)),'j','')}${kpi('Incidence',hours?r1(all.length/hours*1000):'–','/1000 h','Blessures pour 1000 h d’exposition')}
    ${kpi('Fardeau',hours?r0(sum(all.map(daysOut))/hours*1000):'–','j/1000 h','Jours perdus pour 1000 h')}${kpi('Exposition',r0(hours),'h','Entraînements + matchs enregistrés')}</div>
  ${fiche}
  <div class="card"><div class="hrow"><h2>Blessures en cours</h2><button class="btn sm pri" data-act="goEntry" data-id="injury">Déclarer une blessure</button></div>
    <div class="tw"><table><thead><tr><th>Joueur</th><th>Zone</th><th>Type</th><th>Date</th><th class="n">Jours</th><th>Statut</th><th>Retour prévu</th><th></th></tr></thead><tbody>
    ${cur.map(i=>`<tr><td>${plink(i.pid)}</td><td>${esc(i.zone)}</td><td>${esc(i.type||'')}</td><td>${fmtD(i.date)}</td><td class="n">${daysOut(i)}</td><td><span class="pill ${i.status==='soins'?'crit':i.status==='reathle'?'info':'warn'}">${STATUS_LABEL[i.status]}${i.status==='reathle'?' · ph. '+((i.phase||0)+1):''}</span></td><td>${fmtD(i.expectedReturn)}</td>
      <td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="medOpen" data-id="${esc(i.id)}">Fiche</button>${i.status==='soins'?`<button class="btn sm" data-act="injStatus" data-id="${esc(i.id)}" data-v="reathle">→ Réathlé</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="8" class="muted">Aucun blessé</td></tr>'}
    </tbody></table></div></div>
  <div class="grid g2"><div class="card"><h3>Répartition par zone</h3>${hbars(Object.entries(zones).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v})))}</div><div class="card"><h3>Mécanisme</h3>${hbars(Object.entries(mech).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v,color:'var(--s2)'})))}</div></div>
  <div class="card"><h3>Historique</h3><div class="tw"><table><thead><tr><th>Joueur</th><th>Zone</th><th>Type</th><th>Date</th><th>Retour</th><th class="n">Jours</th><th>Gravité</th><th>Contexte</th><th></th></tr></thead><tbody>
    ${hist.map(i=>`<tr><td>${plink(i.pid)}</td><td>${esc(i.zone)}</td><td>${esc(i.type||'')}</td><td>${fmtD(i.date)}</td><td>${fmtD(i.returnDate)}</td><td class="n">${daysOut(i)}</td><td>${sev(daysOut(i))}</td><td>${esc(i.context||'')}</td><td><button class="btn sm" data-act="medOpen" data-id="${esc(i.id)}">Fiche</button></td></tr>`).join('')||'<tr><td colspan="9" class="muted">Aucune blessure clôturée</td></tr>'}
  </tbody></table></div></div>`;
};
</script>

<script>
/* ---------- SAISIE ---------- */
const ENTRY_TABS=[['session','Séance'],['wellness','Wellness'],['match','Match'],['injury','Blessure'],['plan','Planification'],['season','Phase de saison'],['tests','Tests'],['player','Joueurs'],['gps','Import GPS']];
const COL2TAB={sessions:'session',matches:'match',injuries:'injury',plan:'plan',phases:'season',players:'player',tests:'tests'};
const GF={session:[['min','Min'],['rpe','RPE'],['dist','Dist. (m)'],['hsr','HSR (m)'],['sprint','Sprint (m)'],['acc','Acc.'],['dec','Déc.'],['vmax','Vmax']],
 match:[['min','Min'],['starter','Tit.','chk'],['goals','Buts'],['assists','PD'],['yellow','J'],['red','R'],['rating','Note'],['rpe','RPE'],['dist','Dist. (m)'],['hsr','HSR (m)'],['sprint','Sprint (m)'],['acc','Acc.'],['dec','Déc.'],['vmax','Vmax']]};
const defCat=()=>UI.cat==='Tous'?cats()[0]:UI.cat;
const opt=(list,cur)=>list.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${String(v)===String(cur??'')?'selected':''}>${esc(l)}</option>`;}).join('');
const fld=(id,label,inner,span)=>`<div class="f" ${span?`style="grid-column:span ${span}"`:''}><label for="${id}">${label}</label>${inner}</div>`;
function editing(col){return UI.edit&&UI.edit.col===col?DATA[col][UI.edit.id]:null;}
function gridHTML(kind,cat,existing,dur){
  const F=GF[kind];const ps=playersOf(cat);if(!ps.length)return `<tr><td colspan="${F.length+1}" class="muted">Aucun joueur dans cette catégorie</td></tr>`;
  const fill=`<tr style="background:var(--surface-2)"><td class="small muted">Remplir la colonne</td>${F.map(([k,l,t])=>t==='chk'?'<td></td>':`<td><input type="number" step="any" data-fill="${k}" aria-label="Remplir ${l} pour tous"></td>`).join('')}</tr>`;
  return fill+ps.map(p=>{const x=existing?existing[p.id]:null;const inj=activeInjury(p.id,UI.ref);const on=existing?!!x:!inj||inj.status==='reprise';
    return `<tr><td><label class="chk"><input type="checkbox" name="on-${p.id}" ${on?'checked':''}> ${esc(p.name)}</label>${inj?` <span class="pill ${inj.status==='soins'?'crit':'info'}">${STATUS_LABEL[inj.status]}</span>`:''}</td>
    ${F.map(([k,l,t])=>t==='chk'?`<td><input type="checkbox" name="${k}-${p.id}" ${x&&x[k]?'checked':''} aria-label="${l} ${esc(p.name)}"></td>`:`<td><input type="number" step="any" name="${k}-${p.id}" value="${esc(x&&x[k]!=null?x[k]:'')}" ${k==='min'&&dur?`placeholder="${esc(dur)}"`:''} aria-label="${l} ${esc(p.name)}"></td>`).join('')}</tr>`;}).join('');
}
function readGrid(form,kind,cat){const F=GF[kind];const out={};playersOf(cat).forEach(p=>{const on=form.elements['on-'+p.id];if(!on||!on.checked)return;const o={};
  F.forEach(([k,l,t])=>{const el=form.elements[k+'-'+p.id];if(!el)return;if(t==='chk')o[k]=el.checked;else{const v=num(el.value);if(v!=null)o[k]=v;}});out[p.id]=o;});return out;}
const ENTRY={};
ENTRY.session=()=>{const e=editing('sessions');const cat=e?e.cat:defCat();const s=S();
  return `<form data-form="session" class="stack"><div class="fgrid">
    ${fld('se-date','Date',`<input type="date" id="se-date" name="date" value="${e?e.date:(UI.prefDate||UI.ref)}" required>`)}
    ${fld('se-cat','Catégorie',`<select id="se-cat" name="cat" data-regrid="session">${opt(cats(),cat)}</select>`)}
    ${fld('se-type','Type',`<select id="se-type" name="type">${opt(s.sessionTypes,e&&e.type)}</select>`)}
    ${fld('se-obj','Objectif',`<select id="se-obj" name="objective">${opt(s.objectives,e&&e.objective)}</select>`)}
    ${fld('se-title','Intitulé',`<input type="text" id="se-title" name="title" value="${esc(e&&e.title||'')}" placeholder="ex. Force + jeu réduit">`,2)}
    ${fld('se-dur','Durée (min)',`<input type="number" id="se-dur" name="duration" value="${esc(e?e.duration:90)}" min="0" required>`)}
    ${fld('se-content','Contenu',`<input type="text" id="se-content" name="content" value="${esc(e&&e.content||'')}" placeholder="Exercices, consignes…">`,3)}
  </div>
  <div style="margin-top:4px"><b>Procédés (jusqu'à 8)</b> <span class="small muted">— chaque joueur·se note son RPE ressenti pour chaque procédé dans son espace perso</span></div>
  <div class="tw"><table class="gridin"><thead><tr><th>#</th><th>Temps (min)</th><th>Type</th><th>Zone</th><th>RPE cible</th></tr></thead><tbody>
    ${[0,1,2,3,4,5,6,7].map(i=>{const pr=(e&&e.procedes&&e.procedes[i])||{};return `<tr>
      <td class="small muted">P${i+1}</td>
      <td><input type="number" step="any" name="pc-temps-${i}" value="${esc(pr.temps??'')}" placeholder="0" aria-label="Temps procédé ${i+1}"></td>
      <td><input type="text" name="pc-type-${i}" value="${esc(pr.type||'')}" placeholder="Échauffement, jeu réduit, W/E/A…" aria-label="Type procédé ${i+1}"></td>
      <td><input type="number" step="any" name="pc-zone-${i}" value="${esc(pr.zone??'')}" placeholder="1-5" aria-label="Zone procédé ${i+1}"></td>
      <td><input type="number" step="any" name="pc-rpe-${i}" value="${esc(pr.rpe??'')}" placeholder="0-10" aria-label="RPE cible procédé ${i+1}"></td>
    </tr>`;}).join('')}
  </tbody></table></div>
  <p class="note" style="margin:0"><b>Présence :</b> coche/décoche chaque joueur·se pour indiquer qui était là. Minutes vides = durée de la séance. RPE (CR-10) recueilli 20 à 30 min après la séance. Colonnes GPS facultatives.</p>
  <div class="tw"><table class="gridin"><thead><tr><th>Joueur</th>${GF.session.map(f=>`<th>${f[1]}</th>`).join('')}</tr></thead><tbody id="grid">${gridHTML('session',cat,e&&e.players,e?e.duration:90)}</tbody></table></div>
  <div class="row">${e?'<button type="button" class="btn" data-act="cancelEdit">Annuler</button>':''}<button class="btn pri">${e?'Enregistrer les modifications':'Enregistrer la séance'}</button></div></form>`;};
ENTRY.match=()=>{const e=editing('matches');const cat=e?e.cat:defCat();
  return `<form data-form="match" class="stack"><div class="fgrid">
    ${fld('ma-date','Date',`<input type="date" id="ma-date" name="date" value="${e?e.date:UI.ref}" required>`)}
    ${fld('ma-cat','Catégorie',`<select id="ma-cat" name="cat" data-regrid="match">${opt(cats(),cat)}</select>`)}
    ${fld('ma-opp','Adversaire',`<input type="text" id="ma-opp" name="opponent" value="${esc(e&&e.opponent||'')}" required>`)}
    ${fld('ma-comp','Compétition',`<input type="text" id="ma-comp" name="competition" value="${esc(e&&e.competition||'')}">`)}
    ${fld('ma-venue','Lieu',`<select id="ma-venue" name="venue">${opt(['Domicile','Extérieur','Neutre'],e&&e.venue)}</select>`)}
    ${fld('ma-gf','Buts marqués',`<input type="number" id="ma-gf" name="gf" min="0" value="${esc(e?e.gf:'')}" required>`)}
    ${fld('ma-ga','Buts encaissés',`<input type="number" id="ma-ga" name="ga" min="0" value="${esc(e?e.ga:'')}" required>`)}
    ${fld('ma-dur','Durée (min)',`<input type="number" id="ma-dur" name="duration" min="0" value="${esc(e?e.duration:(cat==='U15'?80:90))}">`)}
  </div>
  <div class="tw"><table class="gridin"><thead><tr><th>Joueur</th>${GF.match.map(f=>`<th>${f[1]}</th>`).join('')}</tr></thead><tbody id="grid">${gridHTML('match',cat,e&&e.players)}</tbody></table></div>
  <p class="note" style="margin:0">Coche les joueurs ayant participé (y compris entrés en jeu). Note sur 10.</p>
  <div class="row">${e?'<button type="button" class="btn" data-act="cancelEdit">Annuler</button>':''}<button class="btn pri">${e?'Enregistrer les modifications':'Enregistrer le match'}</button></div></form>`;};
ENTRY.wellness=()=>{const cat=UI.wCat||defCat();const date=UI.wDate||UI.ref;const doc=DATA.wellness[date];const ps=playersOf(cat);
  return `<form data-form="wellness" class="stack"><div class="fgrid">
    ${fld('we-date','Date',`<input type="date" id="we-date" name="date" value="${date}" data-rew="1">`)}
    ${fld('we-cat','Catégorie',`<select id="we-cat" name="cat" data-rew="1">${opt(cats(),cat)}</select>`)}</div>
  <p class="note" style="margin:0">Échelle de 1 (très mauvais) à 5 (très bon) pour chaque item : pour fatigue, courbatures et stress, 5 = aucune fatigue, aucune courbature, aucun stress.</p>
  <div class="tw"><table class="gridin"><thead><tr><th>Joueur</th>${WK.map(k=>`<th>${WL[k]}</th>`).join('')}<th>Commentaire</th></tr></thead><tbody>
  ${ps.map(p=>{const x=doc&&doc.entries&&doc.entries[p.id]||{};return `<tr><td>${esc(p.name)}</td>${WK.map(k=>`<td><select name="${k}-${p.id}" aria-label="${WL[k]} ${esc(p.name)}" style="width:60px"><option value="">–</option>${[1,2,3,4,5].map(v=>`<option ${num(x[k])===v?'selected':''}>${v}</option>`).join('')}</select></td>`).join('')}<td><input class="w" type="text" name="note-${p.id}" value="${esc(x.note||'')}" aria-label="Commentaire ${esc(p.name)}"></td></tr>`;}).join('')||'<tr><td class="muted">Aucun joueur</td></tr>'}
  </tbody></table></div><div class="row"><button class="btn pri">Enregistrer le wellness</button></div></form>`;};
ENTRY.injury=()=>{const e=editing('injuries');const ps=playersOf('Tous');
  return `<form data-form="injury" class="stack"><div class="fgrid">
    ${fld('in-pid','Joueur',`<select id="in-pid" name="pid" required>${opt(ps.map(p=>[p.id,p.name+' ('+p.cat+')']),e?e.pid:UI.prefPid)}</select>`)}
    ${fld('in-date','Date',`<input type="date" id="in-date" name="date" value="${e?e.date:UI.ref}" required>`)}
    ${fld('in-zone','Zone',`<select id="in-zone" name="zone">${opt(ZONES,e&&e.zone)}</select>`)}
    ${fld('in-type','Type / diagnostic',`<input type="text" id="in-type" name="type" value="${esc(e&&e.type||'')}" placeholder="ex. Lésion grade 1">`)}
    ${fld('in-side','Côté',`<select id="in-side" name="side">${opt(['Droit','Gauche','Bilatéral','Non applicable'],e&&e.side)}</select>`)}
    ${fld('in-mech','Mécanisme',`<select id="in-mech" name="mechanism">${opt(['Sans contact','Contact','Surcharge / progressive','Non précisé'],e&&e.mechanism)}</select>`)}
    ${fld('in-ctx','Contexte',`<select id="in-ctx" name="context">${opt(['Match','Entraînement','Musculation','Hors club'],e&&e.context)}</select>`)}
    ${fld('in-status','Statut',`<select id="in-status" name="status">${opt(Object.entries(STATUS_LABEL),e?e.status:'soins')}</select>`)}
    ${fld('in-ret','Retour prévu',`<input type="date" id="in-ret" name="expectedReturn" value="${esc(e&&e.expectedReturn||'')}">`)}
    ${fld('in-notes','Notes',`<textarea id="in-notes" name="notes">${esc(e&&e.notes||'')}</textarea>`,3)}
  </div><div class="row">${e?'<button type="button" class="btn" data-act="cancelEdit">Annuler</button>':''}<button class="btn pri">${e?'Enregistrer':'Déclarer la blessure'}</button></div></form>`;};
ENTRY.plan=()=>{const e=editing('plan');const s=S();
  return `<form data-form="plan" class="stack"><div class="fgrid">
    ${fld('pl-date','Date',`<input type="date" id="pl-date" name="date" value="${e?e.date:(UI.prefDate||UI.ref)}" required>`)}

    ${fld('pl-type','Type',`<select id="pl-type" name="type">${opt([...s.sessionTypes,'Match'],e&&e.type)}</select>`)}
    ${fld('pl-obj','Objectif',`<select id="pl-obj" name="objective">${opt(s.objectives,e&&e.objective)}</select>`)}
    ${fld('pl-title','Intitulé (ou « Match vs … »)',`<input type="text" id="pl-title" name="title" value="${esc(e&&e.title||'')}">`,2)}

    <div class="card flat"><h3>Tout effacer</h3><p class="note" style="margin-top:0">Supprime définitivement joueurs, séances, matchs, tests, blessures et paramètres. Exporte d’abord une sauvegarde.</p><button class="btn danger" data-act="resetAll">Tout effacer</button> <span id="resetProg" class="small muted"></span></div></div>`;}
  const subtabs=`<div class="subtabs">${tabs.map(([k,l])=>`<button class="${t===k?'on':''}" data-act="settingsTab" data-id="${k}">${l}</button>`).join('')}</div>`;
  if(t==='players')return subtabs+`<p class="note">Ajoute tes joueur·ses et donne à chacun·e un <b>identifiant</b> + <b>mot de passe</b> pour son espace perso (RPE + wellness) : <b>/academie/espace.html</b>.</p>`+ENTRY.player();
  return subtabs+`<div class="card">${body}</div>`;};
function testRow(x){return `<tr data-id="${esc(x.id||'')}"><td><input class="w" type="text" name="tn" value="${esc(x.name||'')}" aria-label="Nom"></td><td><input type="text" name="tu" value="${esc(x.unit||'')}" aria-label="Unité"></td><td><select name="tb" style="width:auto" aria-label="Meilleur si">${opt([['high','valeur haute'],['low','valeur basse']],x.better||'high')}</select></td><td><button type="button" class="btn sm danger" data-act="rmRow">×</button></td></tr>`;}

/* ---------- FICHE JOUEUR (panneau) ---------- */
function renderDrawer(){
  const host=$('#drawerHost');const p=DATA.players[UI.drawer];if(!p){host.innerHTML='';document.body.style.overflow='';return;}
  const ref=UI.ref;const s=playerStatus(p,ref);const days=range(addDays(ref,-27),ref);
  const wv=days.map(d=>wOf(p.id,d));const lv=days.map(d=>{const x=pday(p.id,d);return x?x.load:0;});const isM=days.map(d=>{const x=pday(p.id,d);return x&&x.match;});
  const ac=days.map(d=>ewma(p.id,d).acwr);const w=weekStats(p.id,ref);
  const tests=S().tests.map(t=>{const sr=testSeries(p.id,t.id);return{t,last:sr[sr.length-1],prev:sr[sr.length-2]};}).filter(x=>x.last);
  const inj=Object.values(DATA.injuries).filter(i=>i.pid===p.id).sort((a,b)=>b.date.localeCompare(a.date));
  const ms=Object.values(DATA.matches).filter(m=>m.cat===p.cat&&m.date<=ref);let mn=0,mm=0,g=0,a=0;ms.forEach(m=>{const e=(m.players||{})[p.id];if(e&&num(e.min)){mn++;mm+=num(e.min);g+=num(e.goals)||0;a+=num(e.assists)||0;}});
  const mx=DATA.maxes[p.id]||{};
  host.innerHTML=`<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Fiche de ${esc(p.name)}">
    <div class="row sb"><div><div class="eyebrow">${esc(p.cat)} · ${esc(p.pos||'')}${p.number?' · n° '+esc(p.number):''}</div><h2 style="margin:2px 0 0;font-family:var(--fd);font-size:32px">${esc(p.name)}</h2>
      <div class="small muted">${p.birth?r1(age(p.birth,ref))+' ans · ':''}${p.height?r0(p.height)+' cm · ':''}${p.mass?r1(p.mass)+' kg · ':''}Vmax réf. ${r1(vref(p))} km/h</div></div>
      <div class="row"><button class="btn sm" data-act="edit" data-col="players" data-id="${esc(p.id)}">Modifier</button><button class="btn sm" data-act="injFor" data-id="${esc(p.id)}">Déclarer une blessure</button><button class="btn sm" data-act="closeDrawer" aria-label="Fermer">✕</button></div></div>
    <div class="card"><div class="row">${lvPill(s.lv)}${s.reasons.map(r=>`<span class="pill ${r.l>=3?'crit':r.l===2?'warn':'neutral'}">${esc(r.t)}</span>`).join('')||'<span class="small muted">Aucun signal particulier</span>'}</div></div>
    <div class="grid g4">${kpi('Wellness',s.w.today!=null?r0(s.w.today):'–','%',s.w.mean!=null?'Habitude '+r0(s.w.mean)+' %':'')}${kpi('Charge 7 j',r0(w.sum),'UA',w.chg!=null?(w.chg>0?'+':'')+r0(w.chg)+' % vs 3 sem.':'')}${kpi('ACWR',s.e.acwr!=null?r2(s.e.acwr):'–','','EWMA 7/28 j')}${kpi('Matchs',mn,'',r0(mm)+' min · '+g+' B · '+a+' PD')}</div>
    <div class="card"><h3>Wellness, 28 jours</h3>${lineChart({labels:days,series:[{name:'Wellness',values:wv,color:COL_TR,dots:true}],yMin:30,yMax:100,refs:[{v:S().th.well,label:'Seuil'}],h:150})}</div>
    <div class="card"><h3>Charge quotidienne (sRPE)</h3>${barChart({labels:days,values:lv,colors:isM.map(m=>m?COL_MATCH:COL_TR),unit:'UA',h:150,legend:[['Entraînement',COL_TR],['Match',COL_MATCH]]})}</div>
    <div class="card"><h3>ACWR</h3>${lineChart({labels:days,series:[{name:'ACWR',values:ac,color:COL_TR}],band:[S().th.acwrLo,S().th.acwrHi],h:140,fmt:v=>r2(v),yMin:0})}<p class="note">Zone verte : ${r1(S().th.acwrLo)} à ${r1(S().th.acwrHi)}.</p></div>
    <div class="grid g2"><div class="card"><h3>Derniers tests</h3>${tests.length?`<div class="tw"><table><thead><tr><th>Test</th><th class="n">Valeur</th><th class="n">Préc.</th><th>Date</th></tr></thead><tbody>${tests.map(x=>`<tr><td>${esc(x.t.name)}</td><td class="n"><b>${fr(x.last.v,2)}</b> ${esc(x.t.unit)}</td><td class="n">${x.prev?fr(x.prev.v,2):'–'}</td><td>${fmtShort(x.last.date)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">Aucun test</p>'}</div>
      <div class="card"><h3>Musculation</h3>${Object.keys(mx.values||{}).length?`<div class="stack small">${Object.entries(mx.values).filter(([k,v])=>num(v)).map(([k,v])=>`<div class="row sb"><span>${esc(k)}</span><b>${fr(num(v),1)} kg${p.mass?' · '+r2(num(v)/p.mass)+' × PDC':''}</b></div>`).join('')}</div>`:'<p class="muted small">Pas de 1RM saisi</p>'}</div></div>
    <div class="card"><h3>Blessures</h3>${inj.length?`<div class="stack">${inj.map(i=>`<div class="row sb"><span><b>${esc(i.zone)}</b> · ${esc(i.type||'')} · ${fmtD(i.date)}</span><span class="row"><span class="pill ${i.status==='apte'?'good':i.status==='soins'?'crit':'info'}">${STATUS_LABEL[i.status]}</span><button class="btn sm" data-act="medOpen" data-id="${esc(i.id)}">Fiche</button></span></div>`).join('')}</div>`:'<p class="muted small">Aucune blessure enregistrée</p>'}</div>
  </aside>`;
  document.body.style.overflow='hidden';
}

/* ---------- ACTIONS ---------- */
const ACT={
  tab:b=>{UI.drawer=null;go(b.dataset.id);},
  cat:b=>{UI.cat=b.dataset.id;saveUI();render();},
  today:()=>{UI.ref=TODAY;render();},
  player:b=>{UI.drawer=b.dataset.id;renderDrawer();},
  closeDrawer:()=>{UI.drawer=null;renderDrawer();},
  perfToggle:()=>{UI.perfOpen=!UI.perfOpen;renderNav();},
  goEntry:b=>{UI.edit=null;UI.entryTab=b.dataset.id;UI.drawer=null;go('entry');},
  entryTab:b=>{UI.edit=null;UI.entryTab=b.dataset.id;formDirty=false;render();},
  cancelEdit:()=>{UI.edit=null;formDirty=false;render();},
  edit:b=>{UI.edit={col:b.dataset.col,id:b.dataset.id};UI.entryTab=COL2TAB[b.dataset.col];UI.drawer=null;if(b.dataset.col==='tests')UI.tSel=null;go('entry');},
  fillPlayer:b=>{const p=DATA.players[b.dataset.id];if(!p)return;const ref=UI.ref;UI.drawer=null;
    if(!wEntry(p.id,ref)){UI.edit=null;UI.entryTab='wellness';UI.wCat=p.cat;UI.wDate=ref;go('entry');return;}
    const sess=Object.values(DATA.sessions).filter(s=>s.date===ref&&s.cat===p.cat&&s.players&&s.players[p.id]&&s.players[p.id].rpe==null);
    if(sess.length){UI.edit={col:'sessions',id:sess[0].id};UI.entryTab='session';go('entry');}
    else{UI.edit=null;UI.entryTab='wellness';UI.wCat=p.cat;UI.wDate=ref;go('entry');}},
  del:b=>{if(!b.classList.contains('arm')){b.classList.add('arm');const t=b.textContent;b.textContent='Confirmer';setTimeout(()=>{if(b.isConnected){b.classList.remove('arm');b.textContent=t;}},3000);return;}
    const col=b.dataset.col,id=b.dataset.id;if(col==='players'&&UI.drawer===id)UI.drawer=null;if(col==='injuries'&&UI.medSel===id)UI.medSel=null;del(col,id);toast('Supprimé');},
  keepDemo:async b=>{b.disabled=true;await keepDemo();},
  startEmpty:async b=>{b.disabled=true;await startEmpty();},
  loadMore:()=>{UI.loadMore=true;render();},
  compMatch:b=>{UI.compMatch=b.dataset.id;render();},
  planView:b=>{UI.planView=b.dataset.id;render();},
  week:b=>{const d=+b.dataset.id;UI.planWeek=d===0?mondayOf(TODAY):addDays(UI.planWeek,d);render();},
  month:b=>{let [y,m]=UI.planMonth.split('-').map(Number);m+=+b.dataset.id;if(m<1){m=12;y--;}if(m>12){m=1;y++;}UI.planMonth=`${y}-${String(m).padStart(2,'0')}`;render();},
  addPlan:b=>{UI.edit=null;UI.prefDate=b.dataset.id;UI.entryTab='plan';go('entry');},
  toggleDone:b=>{const e=DATA.plan[b.dataset.id];if(e)put('plan',e.id,Object.assign({},e,{done:!e.done}));},
  dupWeek:async b=>{const mon=UI.planWeek;const ents=Object.values(DATA.plan).filter(inCat).filter(e=>e.date>=mon&&e.date<=addDays(mon,6));if(!ents.length){toast('Rien à dupliquer');return;}
    b.disabled=true;for(const e of ents){const id=uid();await put('plan',id,Object.assign({},e,{id,date:addDays(e.date,7),done:false}));}UI.planWeek=addDays(mon,7);toast(ents.length+' séances copiées');render();},
  ai:()=>runAI(),aiStop:()=>{UI.ai&&UI.ai.ctl&&UI.ai.ctl.abort();},
  reaSel:b=>{UI.reaSel=b.dataset.id;render();},
  injStatus:async b=>{const i=JSON.parse(JSON.stringify(DATA.injuries[b.dataset.id]));const v=b.dataset.v;i.status=v;if(v==='apte')i.returnDate=i.returnDate||UI.ref;else delete i.returnDate;if(v==='reprise')i.phase=S().rtp.length-1;if(v==='reathle'&&i.phase==null)i.phase=0;
    i.followups=i.followups||[];i.followups.push({date:UI.ref,text:'Statut : '+STATUS_LABEL[v],pain:null});await put('injuries',i.id,i);if(v==='reathle'){UI.reaSel=i.id;}toast('Statut : '+STATUS_LABEL[v]);},
  phase:async b=>{const i=JSON.parse(JSON.stringify(DATA.injuries[b.dataset.id]));i.phase=clamp((i.phase||0)+(+b.dataset.v),0,S().rtp.length-1);i.followups=i.followups||[];i.followups.push({date:UI.ref,text:'Réathlé : phase '+(i.phase+1)+' ('+S().rtp[i.phase].name+')',pain:null});await put('injuries',i.id,i);},
  delLog:async b=>{const i=JSON.parse(JSON.stringify(DATA.injuries[b.dataset.id]));const log=(i.log||[]).slice().sort((a,c)=>a.date.localeCompare(c.date));log.splice(+b.dataset.k,1);i.log=log;await put('injuries',i.id,i);},
  medOpen:b=>{UI.medSel=b.dataset.id;UI.drawer=null;if(UI.tab!=='medical')go('medical');else render();setTimeout(()=>{const f=$('#fiche');if(f)f.scrollIntoView({behavior:'smooth',block:'start'});},50);},
  medClose:()=>{UI.medSel=null;render();},
  goReathle:b=>{UI.reaSel=b.dataset.id;go('reathle');},
  injFor:b=>{UI.prefPid=b.dataset.id;UI.edit=null;UI.entryTab='injury';UI.drawer=null;go('entry');},
  progSel:b=>{UI.progSel=b.dataset.id;UI.progEdit=null;render();},
  progEdit:b=>{UI.progEdit=b.dataset.id;render();},
  progCancel:()=>{UI.progEdit=null;formDirty=false;render();},
  addExo:()=>{const tb=$('#exoRows');const k=tb.children.length+Date.now()%1000;tb.insertAdjacentHTML('beforeend',exoRow({name:'',sets:3,reps:'',pct:'',rest:''},'n'+k));},
  rmRow:b=>{b.closest('tr').remove();},
  settingsTab:b=>{UI.settingsTab=b.dataset.id;render();},
  addTest:()=>{$('#testRows').insertAdjacentHTML('beforeend',testRow({}));},
  gpsParse:()=>gpsParse(),gpsApply:()=>gpsApply(),
  export:async()=>{const txt=JSON.stringify(Object.assign({app:'blueperf-academie',exported:new Date().toISOString()},DATA),null,1);const name='blueperf-academie-'+TODAY+'.json';
    if(Store.downloads){try{await Store.downloads.save({filename:name,data:txt});toast('Sauvegarde exportée');return;}catch(e){if(e&&e.code==='declined')return;}}
    $('#expOut').innerHTML=`<p class="note">Copie ce contenu dans un fichier .json :</p><textarea readonly style="min-height:160px;font-family:ui-monospace,monospace;font-size:11px">${esc(txt)}</textarea>`;},
  resetAll:async b=>{if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Confirmer : tout effacer';setTimeout(()=>{if(b.isConnected){b.classList.remove('arm');b.textContent='Tout effacer';}},4000);return;}
    b.disabled=true;const pr=$('#resetProg');
    if(Store.mode==='db'&&!Store.demo){const jobs=[];COLS.forEach(c=>Object.keys(DATA[c]).forEach(id=>jobs.push([c,id])));let n=0;for(const [c,id] of jobs){try{await Store.db.collection(c).doc(id).delete();}catch(e){}n++;if(pr)pr.textContent=n+'/'+jobs.length;}
      await Store.db.collection('config').doc('settings').set({started:true});}
    else{DATA=empty();DATA.config.settings={started:true};Store.demo=false;saveLocal();}
    toast('Données effacées');render();},
  importGo:async b=>{if(!PENDING_IMPORT)return;b.disabled=true;const src=empty();COLS.forEach(c=>Object.assign(src[c],DATA[c],PENDING_IMPORT[c]||{}));Store.demo=false;await writeAll(src);PENDING_IMPORT=null;toast('Import terminé');render();}
};
let PENDING_IMPORT=null;
const CHG={
  crit:async t=>{const i=JSON.parse(JSON.stringify(DATA.injuries[t.dataset.id]));const ph=i.phase||0;i.criteria=i.criteria||{};const arr=(i.criteria[ph]||[]).slice();arr[+t.dataset.k]=t.checked;i.criteria[ph]=arr;await put('injuries',i.id,i);},
  max:async t=>{const m=JSON.parse(JSON.stringify(DATA.maxes[t.dataset.id]||{id:t.dataset.id,values:{},skills:{}}));m.values=m.values||{};const v=num(t.value);if(v==null)delete m.values[t.dataset.k];else m.values[t.dataset.k]=v;await put('maxes',t.dataset.id,m,true);},
  skill:async t=>{const m=JSON.parse(JSON.stringify(DATA.maxes[t.dataset.id]||{id:t.dataset.id,values:{},skills:{}}));m.skills=m.skills||{};m.skills[t.dataset.k]=+t.value;await put('maxes',t.dataset.id,m,true);},
  tabOn:async t=>{const tabs=Object.assign({},S().tabs,{[t.dataset.id]:t.checked});await saveSettings({tabs});},
  import:t=>{const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.players)throw 0;PENDING_IMPORT=o;const n=COLS.reduce((a,c)=>a+Object.keys(o[c]||{}).length,0);
    $('#expOut').innerHTML=`<div class="banner"><p>${n} éléments trouvés dans « ${esc(f.name)} ». Ils seront ajoutés aux données actuelles (les éléments de même identifiant sont remplacés).</p><span id="bulkProg" class="small muted"></span><button class="btn pri" data-act="importGo">Importer</button></div>`;}catch(e){toast('Fichier non reconnu');}};r.readAsText(f);}
};
/* GPS CSV */
let GPS_PARSED=null;
function gpsParse(){const txt=$('#gp-csv').value.trim();const out=$('#gp-prev');if(!txt){out.innerHTML='<p class="small" style="color:var(--crit)">Colle d’abord les données.</p>';return;}
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());const sep=[';','\t',','].map(s=>[s,lines[0].split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const head=lines[0].split(sep).map(h=>norm(h));
  const find=(...keys)=>head.findIndex(h=>keys.some(k=>h.includes(k)));
  const col={name:find('joueur','player','nom','name','athlete'),dist:find('distancetotale','totaldistance','distance','dist'),hsr:find('hsr','highspeed','hauteintensite','haute','hid'),sprint:find('sprint'),acc:find('acc'),dec:find('dec'),vmax:find('vmax','maxspeed','vitessemax','topspeed','maxvel'),min:find('minute','duree','duration','min')};
  if(col.name<0){out.innerHTML='<p class="small" style="color:var(--crit)">Colonne du nom du joueur introuvable.</p>';return;}
  const [c,id]=$('#gp-ev').value.split('|');const ev=DATA[c][id];if(!ev){out.innerHTML='<p class="small">Choisis une séance.</p>';return;}
  const ps=playersOf(ev.cat,true);const rows=[];
  lines.slice(1).forEach(l=>{const a=l.split(sep);const nm=norm(a[col.name]);if(!nm)return;const p=ps.find(p=>norm(p.name)===nm)||ps.find(p=>norm(p.name).startsWith(nm)||nm.startsWith(norm(p.name)));
    const g=k=>col[k]>=0?num(String(a[col[k]]||'').replace(',','.').replace(/\s/g,'')):null;rows.push({raw:a[col.name],p,v:{dist:g('dist'),hsr:g('hsr'),sprint:g('sprint'),acc:g('acc'),dec:g('dec'),vmax:g('vmax'),min:g('min')}});});
  GPS_PARSED={c,id,rows};const ok=rows.filter(r=>r.p).length;
  out.innerHTML=`<p class="small">${ok} ligne${ok>1?'s':''} associée${ok>1?'s':''} à un joueur sur ${rows.length}. Colonnes détectées : ${Object.entries(col).filter(([k,v])=>v>=0).map(([k])=>k).join(', ')}.</p>
  <div class="tw"><table><thead><tr><th>Ligne</th><th>Joueur</th><th class="n">Dist.</th><th class="n">HSR</th><th class="n">Sprint</th><th class="n">Acc.</th><th class="n">Déc.</th><th class="n">Vmax</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.raw)}</td><td>${r.p?esc(r.p.name):'<span class="pill warn">Non trouvé</span>'}</td>${['dist','hsr','sprint','acc','dec','vmax'].map(k=>`<td class="n">${r.v[k]??'–'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:8px"><button class="btn pri" data-act="gpsApply" ${ok?'':'disabled'}>Ajouter à la séance</button></div>`;}
async function gpsApply(){if(!GPS_PARSED)return;const {c,id,rows}=GPS_PARSED;const ev=JSON.parse(JSON.stringify(DATA[c][id]));ev.players=ev.players||{};
  rows.forEach(r=>{if(!r.p)return;const e=ev.players[r.p.id]||{};Object.entries(r.v).forEach(([k,v])=>{if(v!=null)e[k]=v;});ev.players[r.p.id]=e;});await put(c,id,ev);GPS_PARSED=null;toast('Données GPS ajoutées');UI.gpsEvent=id;go('gps');}

/* ---------- ÉVÉNEMENTS ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(!f)return;if(b.tagName==='BUTTON'&&b.type!=='submit')e.preventDefault();f(b,e);});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='refDate'){UI.ref=t.value||TODAY;render();return;}if(t.dataset&&t.dataset.chg&&CHG[t.dataset.chg])CHG[t.dataset.chg](t);});
document.addEventListener('input',e=>{const t=e.target;if(t.closest('form'))formDirty=true;if(t.dataset&&t.dataset.fill){const k=t.dataset.fill;const form=t.closest('form');$$('#grid tr',form).forEach(tr=>{const on=tr.querySelector('input[name^="on-"]');const inp=tr.querySelector(`input[name^="${k}-"]`);if(on&&on.checked&&inp)inp.value=t.value;});}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();formDirty=false;const h=FORMS[f.dataset.form];if(h)h(f);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.drawer){UI.drawer=null;renderDrawer();}});
boot();
