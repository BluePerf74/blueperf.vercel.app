        <div><div class="row sb"><span>Vmax atteinte / Vmax de référence</span><b>${curVmaxPct!=null?r0(curVmaxPct)+' %':'–'}</b></div><div class="bar"><i style="width:${curVmaxPct!=null?clamp(curVmaxPct,0,100):0}%;background:${vmaxOk?'var(--good)':'var(--accent)'}"></i></div><span class="muted">${vm?r1(vm)+' km/h':'–'} sur ${r1(pv)} km/h · objectif ≥ ${tgtVmax} %${tgtVmax<=0?'':(vmaxOk?' ✓':' ✗')}</span></div></div></div></div>
    <div class="card flat" style="margin-top:14px"><div class="hrow"><h3>${INDIV?'Séances de reprise':'Séances de réathlétisation'}</h3></div>
      ${log.length>1?barChart({labels:log.map(l=>l.date),values:log.map(l=>num(l.dist)||0),unit:'m',h:140}):''}
      <div class="tw" style="margin-top:8px"><table><thead><tr><th>Date</th><th>Contenu</th><th class="n">Min</th><th class="n">RPE</th><th class="n">Distance</th><th class="n">HSR</th><th class="n">Vmax</th><th></th></tr></thead><tbody>
      ${log.slice().reverse().map((l,k)=>`<tr><td>${fmtD(l.date)}</td><td class="wrap">${esc(l.content)}</td><td class="n">${r0(num(l.min))}</td><td class="n">${r0(num(l.rpe))}</td><td class="n">${r0(num(l.dist))}</td><td class="n">${r0(num(l.hsr))}</td><td class="n">${r1(num(l.vmax))}</td><td><button class="btn sm danger" data-act="delLog" data-id="${esc(sel.id)}" data-k="${log.length-1-k}">×</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">Aucune séance</td></tr>'}</tbody></table></div>
      <form data-form="rlog" data-id="${esc(sel.id)}" class="fgrid" style="margin-top:12px;align-items:end">
        <div class="f"><label for="rl-date">Date</label><input type="date" id="rl-date" name="date" value="${ref}" required></div>
        <div class="f" style="grid-column:span 2"><label for="rl-content">Contenu</label><input type="text" id="rl-content" name="content" placeholder="ex. 6 × 40 m à 85 %, COD 45°" required></div>
        <div class="f"><label for="rl-min">Durée (min)</label><input type="number" id="rl-min" name="min" min="0"></div><div class="f"><label for="rl-rpe">RPE</label><input type="number" id="rl-rpe" name="rpe" min="0" max="10"></div>
        <div class="f"><label for="rl-dist">Distance (m)</label><input type="number" id="rl-dist" name="dist" min="0"></div><div class="f"><label for="rl-hsr">HSR (m)</label><input type="number" id="rl-hsr" name="hsr" min="0"></div>
        <div class="f"><label for="rl-vmax">Vmax (km/h)</label><input type="number" id="rl-vmax" name="vmax" step="0.1" min="0"></div><div><button class="btn pri">Ajouter la séance</button></div></form></div>`;}
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,3fr)">
    <div class="stack"><div class="card"><h3>${INDIV?'En reprise':'En réathlétisation'}</h3><div class="stack" style="gap:6px">${inR.map(i=>`<button class="btn" style="justify-content:space-between;${sel&&i.id===sel.id?'border-color:var(--accent);color:var(--accent)':''}" data-act="reaSel" data-id="${esc(i.id)}"><span>${esc(pname(i.pid))}</span><span class="pill ${i.status==='reprise'?'warn':'info'}">${i.status==='reprise'?'Reprise':'Ph. '+((i.phase||0)+1)}</span></button>`).join('')||'<p class="muted small">Personne</p>'}</div></div>
    <div class="card"><h3>En soins</h3><div class="stack" style="gap:8px">${soins.map(i=>`<div class="stack" style="gap:4px"><span>${plink(i.pid)} <span class="muted small">${esc(i.zone)} · J+${dayDiff(ref,i.date)}</span></span><button class="btn sm" data-act="injStatus" data-id="${esc(i.id)}" data-v="reathle">${INDIV?'Démarrer la reprise':'Démarrer la réathlé'}</button></div>`).join('')||'<p class="muted small">Personne</p>'}</div></div></div>
    <div class="card">${detail}</div></div>`;
};

/* ---------- PERFORMANCE : MUSCULATION ---------- */
const SKL=['Non acquis','En cours','Acquis','Maîtrisé'];
VIEWS.muscu=()=>{
  const ps=playersOf(UI.cat);const progs=Object.values(DATA.programs).filter(p=>inCat(p)).sort((a,b)=>a.name.localeCompare(b.name));const exos=S().muscuExos;const skills=S().skills;
  const sel=progs.find(p=>p.id===UI.progSel)||progs[0];const editing=UI.progEdit;
  let progHtml='<div class="empty">Aucun programme. Crée le premier.</div>';
  if(editing){const p=editing==='new'?{name:'',cat:UI.cat==='Tous'?cats()[0]:UI.cat,phase:'',freq:2,exercises:[{name:'',sets:3,reps:'6',pct:'',rest:''}]}:DATA.programs[editing];
    progHtml=`<form data-form="program" data-id="${esc(editing)}" class="stack"><div class="fgrid">
      <div class="f"><label for="pg-name">Nom</label><input type="text" id="pg-name" name="name" value="${esc(p.name)}" required></div>
      <div class="f"><label for="pg-cat">Catégorie</label><select id="pg-cat" name="cat">${['Tous',...cats()].map(c=>`<option ${c===p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="f"><label for="pg-phase">Orientation</label><input type="text" id="pg-phase" name="phase" value="${esc(p.phase||'')}" list="phaseList"><datalist id="phaseList"><option>Force maximale</option><option>Puissance</option><option>Hypertrophie</option><option>Prévention</option><option>Réathlétisation</option><option>Apprentissage technique</option></datalist></div>
      <div class="f"><label for="pg-freq">Séances / semaine</label><input type="number" id="pg-freq" name="freq" value="${esc(p.freq||2)}" min="1" max="7"></div></div>
      <datalist id="exoList">${exos.map(e=>`<option>${esc(e)}</option>`).join('')}</datalist>
      <div class="tw"><table class="gridin"><thead><tr><th>Exercice</th><th>Séries</th><th>Répétitions</th><th>% 1RM</th><th>Récup.</th><th>Consignes</th><th></th></tr></thead><tbody id="exoRows">
      ${p.exercises.map((e,k)=>exoRow(e,k)).join('')}</tbody></table></div>
      <div class="row"><button type="button" class="btn sm" data-act="addExo">+ Exercice</button><span style="flex:1"></span><button type="button" class="btn sm" data-act="progCancel">Annuler</button><button class="btn pri">Enregistrer le programme</button></div></form>`;}
  else if(sel){const cp=playersOf(sel.cat==='Tous'?UI.cat:sel.cat);const withPct=sel.exercises.filter(e=>num(e.pct));
    progHtml=`<div class="row sb"><div><div class="eyebrow">${esc(sel.cat)} · ${esc(sel.phase||'')} · ${esc(sel.freq||'')} séance(s)/sem.</div><h2 style="margin:2px 0 0">${esc(sel.name)}</h2></div><div class="row"><button class="btn sm" data-act="progEdit" data-id="${esc(sel.id)}">Modifier</button><button class="btn sm danger" data-act="del" data-col="programs" data-id="${esc(sel.id)}">Supprimer</button></div></div>
    <div class="tw" style="margin-top:10px"><table><thead><tr><th>Exercice</th><th class="n">Séries</th><th>Rép.</th><th class="n">% 1RM</th><th>Récup.</th><th>Consignes</th></tr></thead><tbody>${sel.exercises.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td class="n">${esc(e.sets)}</td><td>${esc(e.reps)}</td><td class="n">${num(e.pct)?esc(e.pct)+' %':'–'}</td><td>${esc(e.rest||'')}</td><td class="wrap small">${esc(e.notes||'')}</td></tr>`).join('')}</tbody></table></div>
    ${withPct.length?`<h3 style="margin-top:16px">Charges individuelles (kg)</h3><p class="note" style="margin-top:0">% 1RM × 1RM du/de la ${PL.one}, arrondi à 2,5 kg. Charges indiquées seulement si la technique est au moins « Acquis ».</p>
    <div class="tw"><table><thead><tr><th>${PL.One}</th>${withPct.map(e=>`<th class="n">${esc(e.name)}<br><span style="text-transform:none">${esc(e.sets)}×${esc(e.reps)} @ ${esc(e.pct)} %</span></th>`).join('')}</tr></thead><tbody>
    ${cp.map(p=>{const mx=(DATA.maxes[p.id]||{}).values||{};const sk=(DATA.maxes[p.id]||{}).skills||{};const minSk=Math.min(...skills.map(s=>num(sk[s])??0));
      return `<tr><td>${plinkA(p.id)}</td>${withPct.map(e=>{const rm=num(mx[e.name]);return `<td class="n">${rm?(minSk>=2?`<b>${fr(Math.round(rm*num(e.pct)/100/2.5)*2.5,1)}</b>`:`<span class="pill warn" data-tip="Technique à valider avant de charger">Technique</span>`):'<span class="muted">1RM ?</span>'}</td>`;}).join('')}</tr>`;}).join('')}</tbody></table></div>`:''}`;}
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,3fr)">
    <div class="card"><div class="hrow"><h3>Programmes</h3><button class="btn sm pri" data-act="progEdit" data-id="new">Nouveau</button></div><div class="stack" style="gap:6px">${progs.map(p=>`<button class="btn" style="justify-content:space-between;${sel&&p.id===sel.id&&!editing?'border-color:var(--accent);color:var(--accent)':''}" data-act="progSel" data-id="${esc(p.id)}"><span>${esc(p.name)}</span><span class="small muted">${esc(p.cat)}</span></button>`).join('')||'<p class="muted small">Aucun</p>'}</div></div>
    <div class="card">${progHtml}</div></div>
  <div class="card"><div class="hrow"><h2>1RM et maîtrise technique</h2><span class="small muted">Les valeurs s’enregistrent dès que tu quittes la case</span></div>
    ${ps.length?`<div class="tw"><table class="gridin"><thead><tr><th>${PL.One}</th>${exos.map(e=>`<th>${esc(e)} (kg)</th>`).join('')}${skills.map(s=>`<th>${esc(s)}</th>`).join('')}</tr></thead><tbody>
    ${ps.map(p=>{const m=DATA.maxes[p.id]||{};const v=m.values||{},sk=m.skills||{};return `<tr><td>${plinkA(p.id)}</td>${exos.map(e=>`<td><input type="number" step="2.5" min="0" value="${esc(v[e]??'')}" data-chg="max" data-id="${esc(p.id)}" data-k="${esc(e)}" aria-label="${esc(p.name+' '+e)}"></td>`).join('')}
      ${skills.map(s=>`<td><select data-chg="skill" data-id="${esc(p.id)}" data-k="${esc(s)}" aria-label="${esc(p.name+' '+s)}" style="width:110px">${SKL.map((l,k)=>`<option value="${k}" ${(num(sk[s])??0)===k?'selected':''}>${l}</option>`).join('')}</select></td>`).join('')}</tr>`;}).join('')}</tbody></table></div>`:emptyPlayers()}</div>
  <div class="card"><h3>Calculateur de 1RM (Epley)</h3><div class="row"><div class="f"><label for="ep-kg">Charge (kg)</label><input type="number" id="ep-kg" style="width:120px"></div><div class="f"><label for="ep-reps">Répétitions</label><input type="number" id="ep-reps" style="width:120px"></div><div class="f"><label>1RM estimé</label><div id="ep-out" style="font-family:var(--fd);font-size:26px;font-weight:700">–</div></div></div>
    <p class="note">1RM = charge × (1 + répétitions / 30). Fiable jusqu’à environ 10 répétitions. Chez les jeunes, préfère un test sur 3 à 5 RM à un vrai 1RM.</p></div>`;
};
function exoRow(e,k){return `<tr><td><input class="w" type="text" name="ex-name-${k}" value="${esc(e.name)}" list="exoList" aria-label="Exercice"></td><td><input type="number" name="ex-sets-${k}" value="${esc(e.sets??'')}" min="0" aria-label="Séries"></td><td><input type="text" name="ex-reps-${k}" value="${esc(e.reps??'')}" aria-label="Répétitions"></td><td><input type="number" name="ex-pct-${k}" value="${esc(e.pct??'')}" min="0" max="100" aria-label="% 1RM"></td><td><input type="text" name="ex-rest-${k}" value="${esc(e.rest??'')}" aria-label="Récupération"></td><td><input class="w" type="text" name="ex-notes-${k}" value="${esc(e.notes??'')}" aria-label="Consignes"></td><td><button type="button" class="btn sm danger" data-act="rmRow">×</button></td></tr>`;}
POST.muscu=()=>{const a=$('#ep-kg'),b=$('#ep-reps'),o=$('#ep-out');if(!a)return;const f=()=>{const k=num(a.value),r=num(b.value);o.textContent=k&&r?fr(k*(1+r/30),1)+' kg':'–';};a.oninput=f;b.oninput=f;};

/* ---------- MÉDICAL ---------- */
const ZONES=['Ischio-jambiers','Adducteurs','Quadriceps','Mollet','Cheville','Genou','Hanche / pubis','Dos','Pied','Épaule','Tête (commotion)','Autre'];
VIEWS.medical=()=>{
  const ref=UI.ref;const all=Object.values(DATA.injuries).filter(i=>DATA.players[i.pid]&&inCat(DATA.players[i.pid])).sort((a,b)=>b.date.localeCompare(a.date));
  const cur=all.filter(i=>i.status!=='apte');const hist=all.filter(i=>i.status==='apte');
  const daysOut=i=>dayDiff(i.returnDate&&i.status==='apte'?i.returnDate:ref,i.date);
  let hours=0;Object.keys(IDX).forEach(pid=>{if(!DATA.players[pid]||!inCat(DATA.players[pid]))return;Object.values(IDX[pid].days).forEach(d=>hours+=d.min/60);});
  const zones={};all.forEach(i=>zones[i.zone]=(zones[i.zone]||0)+1);const mech={};all.forEach(i=>mech[i.mechanism||'Non précisé']=(mech[i.mechanism||'Non précisé']||0)+1);
  const sel=DATA.injuries[UI.medSel];
  const sev=d=>d<=3?'Minime':d<=7?'Légère':d<=28?'Modérée':'Sévère';
  let fiche='';
  if(sel){const p=DATA.players[sel.pid];fiche=`<div class="card" id="fiche"><div class="row sb"><div><div class="eyebrow">Fiche blessure</div><h2 style="margin:2px 0 0;font-size:24px">${plink(sel.pid)} · ${esc(sel.zone)}</h2>
    <div class="small muted">${esc(sel.type||'')} · ${esc(sel.side||'')} · ${esc(sel.mechanism||'')} · ${esc(sel.context||'')} · le ${fmtD(sel.date)}</div></div>
    <div class="row"><button class="btn sm" data-act="edit" data-col="injuries" data-id="${esc(sel.id)}">Modifier</button><button class="btn sm" data-act="medClose">Fermer</button></div></div>
    <div class="row" style="margin:12px 0"><span class="flabel">Statut</span>${['soins','reathle','reprise','apte'].map(s=>`<button class="btn sm ${sel.status===s?'pri':''}" data-act="injStatus" data-id="${esc(sel.id)}" data-v="${s}">${STATUS_LABEL[s]}</button>`).join('')}
      ${sel.status==='reathle'?`<button class="btn sm" data-act="goReathle" data-id="${esc(sel.id)}">Ouvrir la réathlé →</button>`:''}</div>
    <div class="grid g4" style="margin-bottom:12px">${kpi('Jours d’absence',daysOut(sel),'',sev(daysOut(sel)))}${kpi('Retour prévu',sel.expectedReturn?fmtShort(sel.expectedReturn):'–','',sel.expectedReturn&&sel.status!=='apte'?(dayDiff(sel.expectedReturn,ref)>=0?'dans '+dayDiff(sel.expectedReturn,ref)+' j':'dépassé de '+(-dayDiff(sel.expectedReturn,ref))+' j'):'')}${kpi('Phase réathlé',sel.status==='soins'?'–':(sel.phase||0)+1,'/'+S().rtp.length,'')}${kpi('Douleur (EVA)',(sel.followups||[]).length?sel.followups[sel.followups.length-1].pain??'–':'–','/10','Dernier suivi')}</div>
    ${sel.notes?`<p class="small">${esc(sel.notes)}</p>`:''}
    <h3>Suivi</h3><div class="stack">${(sel.followups||[]).slice().reverse().map((f,k)=>`<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="pill neutral">${fmtShort(f.date)}</span><span style="flex:1">${esc(f.text)}</span>${f.pain!=null&&f.pain!==''?`<span class="pill ${f.pain>=5?'crit':f.pain>=3?'warn':'good'}">EVA ${esc(f.pain)}</span>`:''}</div>`).join('')||'<p class="muted small">Aucun suivi.</p>'}</div>
    <form data-form="followup" data-id="${esc(sel.id)}" class="fgrid" style="margin-top:12px;align-items:end"><div class="f"><label for="fu-date">Date</label><input type="date" id="fu-date" name="date" value="${ref}"></div><div class="f" style="grid-column:span 2"><label for="fu-text">Note de suivi</label><input type="text" id="fu-text" name="text" required placeholder="Examen, évolution, décision…"></div><div class="f"><label for="fu-pain">Douleur EVA (0–10)</label><input type="number" id="fu-pain" name="pain" min="0" max="10"></div><div><button class="btn pri">Ajouter</button></div></form></div>`;}
  return `<div class="grid g6">${kpi('Blessés actuels',cur.length,'',cur.filter(i=>i.status==='soins').length+' en soins, '+cur.filter(i=>i.status==='reathle').length+' en réathlé')}${kpi('Blessures (saison)',all.length,'')}
    ${kpi('Jours d’absence cumulés',sum(all.map(daysOut)),'j','')}${kpi('Incidence',hours?r1(all.length/hours*1000):'–','/1000 h','Blessures pour 1000 h d’exposition')}
    ${kpi('Fardeau',hours?r0(sum(all.map(daysOut))/hours*1000):'–','j/1000 h','Jours perdus pour 1000 h')}${kpi('Exposition',r0(hours),'h','Entraînements + matchs enregistrés')}</div>
  ${fiche}
  <div class="card"><div class="hrow"><h2>Blessures en cours</h2><button class="btn sm pri" data-act="goEntry" data-id="injury">Déclarer une blessure</button></div>
    <div class="tw"><table><thead><tr><th>${PL.One}</th><th>Zone</th><th>Type</th><th>Date</th><th class="n">Jours</th><th>Statut</th><th>Retour prévu</th><th></th></tr></thead><tbody>
    ${cur.map(i=>`<tr><td>${plinkA(i.pid)}</td><td>${esc(i.zone)}</td><td>${esc(i.type||'')}</td><td>${fmtD(i.date)}</td><td class="n">${daysOut(i)}</td><td><span class="pill ${i.status==='soins'?'crit':i.status==='reathle'?'info':'warn'}">${STATUS_LABEL[i.status]}${i.status==='reathle'?' · ph. '+((i.phase||0)+1):''}</span></td><td>${fmtD(i.expectedReturn)}</td>
      <td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="medOpen" data-id="${esc(i.id)}">Fiche</button>${i.status==='soins'?`<button class="btn sm" data-act="injStatus" data-id="${esc(i.id)}" data-v="reathle">→ Réathlé</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="8" class="muted">Aucun blessé</td></tr>'}
    </tbody></table></div></div>
  <div class="grid g2"><div class="card"><h3>Répartition par zone</h3>${hbars(Object.entries(zones).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v})))}</div><div class="card"><h3>Mécanisme</h3>${hbars(Object.entries(mech).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v,color:'var(--s2)'})))}</div></div>
  <div class="card"><h3>Historique</h3><div class="tw"><table><thead><tr><th>${PL.One}</th><th>Zone</th><th>Type</th><th>Date</th><th>Retour</th><th class="n">Jours</th><th>Gravité</th><th>Contexte</th><th></th></tr></thead><tbody>
    ${hist.map(i=>`<tr><td>${plinkA(i.pid)}</td><td>${esc(i.zone)}</td><td>${esc(i.type||'')}</td><td>${fmtD(i.date)}</td><td>${fmtD(i.returnDate)}</td><td class="n">${daysOut(i)}</td><td>${sev(daysOut(i))}</td><td>${esc(i.context||'')}</td><td><button class="btn sm" data-act="medOpen" data-id="${esc(i.id)}">Fiche</button></td></tr>`).join('')||'<tr><td colspan="9" class="muted">Aucune blessure clôturée</td></tr>'}
  </tbody></table></div></div>`;
};
</script>

<script>
/* ---------- SAISIE ---------- */
const ENTRY_TABS=[['session','Séance'],['wellness','Wellness'],['match','Match'],['injury','Blessure'],['plan','Planification'],['season','Phase de saison'],['tests','Tests'],['player','Joueurs'],['gps','Import GPS']];
const ENTRY_MENU=[['assign','⚑ Affectation des '+PL.many],['simple','⚡ Séance simple (RPE)'],['session','Saisir une séance'],['rpe','Saisir les RPE'],['gps','Importer les GPS'],['match','Match'],['wellness','Wellness'],['injury','Blessure'],['plan','Entraînement (planifier une séance)'],['season','Phase de saison'],['tests','Tests'],['player',PL.Many]].filter(x=>!(MODE==='individuel'&&(x[0]==='gps'||x[0]==='match')));
const COL2TAB={sessions:'session',matches:'match',injuries:'injury',plan:'plan',phases:'season',players:'player',tests:'tests'};
const GF={session:[['min','Min'],['rpe','RPE'],['dist','Dist. (m)'],['hsr','HSR (m)'],['sprint','Sprint (m)'],['acc','Acc.'],['dec','Déc.'],['vmax','Vmax']],
 match:[['min','Min'],['starter','Tit.','chk'],['goals','Buts'],['assists','PD'],['yellow','J'],['red','R'],['rating','Note'],['rpe','RPE'],['dist','Dist. (m)'],['hsr','HSR (m)'],['sprint','Sprint (m)'],['acc','Acc.'],['dec','Déc.'],['vmax','Vmax']]};
const defCat=()=>UI.cat==='Tous'?cats()[0]:UI.cat;
const opt=(list,cur)=>list.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${String(v)===String(cur??'')?'selected':''}>${esc(l)}</option>`;}).join('');
const fld=(id,label,inner,span)=>`<div class="f" ${span?`style="grid-column:span ${span}"`:''}><label for="${id}">${label}</label>${inner}</div>`;
/* Champ catégorie : masqué en coaching individuel (une seule catégorie implicite), rendu en input caché pour que les formulaires continuent d'envoyer cat. */
const catFld=(id,cur,attrs)=>INDIV?`<input type="hidden" id="${id}" name="cat" value="${INDIV_CAT}">`:fld(id,'Catégorie',`<select id="${id}" name="cat" ${attrs||''}>${opt(cats(),cur)}</select>`);
// Coaching individuel : à qui rattacher un plan / un mésocycle (une personne précise ou tout le monde).
function indivPidField(id,e){if(!INDIV)return '';
  const cur=(e&&e.pid)||(UI.indivClient&&UI.indivClient!=='Tous'?UI.indivClient:'all');
  const cls=Object.values(DATA.players).filter(p=>p.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  return fld(id,'Pour quel·le client·e ?',`<select id="${id}" name="pid"><option value="all" ${cur==='all'?'selected':''}>Tous les client·es</option>${cls.map(c=>`<option value="${esc(c.id)}" ${cur===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`,2);}
function editing(col){return UI.edit&&UI.edit.col===col?DATA[col][UI.edit.id]:null;}
function gridHTML(kind,cat,existing,dur){
  const F=GF[kind];const ps=playersOf(cat);if(!ps.length)return `<tr><td colspan="${F.length+1}" class="muted">Aucun joueur dans cette catégorie</td></tr>`;
  const fill=`<tr style="background:var(--surface-2)"><td class="small muted">Remplir la colonne</td>${F.map(([k,l,t])=>t==='chk'?'<td></td>':`<td><input type="number" step="any" data-fill="${k}" aria-label="Remplir ${l} pour tous"></td>`).join('')}</tr>`;
  return fill+ps.map(p=>{const x=existing?existing[p.id]:null;const inj=activeInjury(p.id,UI.ref);const on=existing?!!x:!inj||inj.status==='reprise';
    return `<tr><td><label class="chk"><input type="checkbox" name="on-${p.id}" ${on?'checked':''}> ${esc(p.name)}</label>${inj?` <span class="pill ${inj.status==='soins'?'crit':'info'}">${STATUS_LABEL[inj.status]}</span>`:''}</td>
    ${F.map(([k,l,t])=>t==='chk'?`<td><input type="checkbox" name="${k}-${p.id}" ${x&&x[k]?'checked':''} aria-label="${l} ${esc(p.name)}"></td>`:`<td><input type="number" step="any" name="${k}-${p.id}" value="${esc(x&&x[k]!=null?x[k]:'')}" ${k==='min'&&dur?`placeholder="${esc(dur)}"`:''} aria-label="${l} ${esc(p.name)}"></td>`).join('')}</tr>`;}).join('');
}
function readGrid(form,kind,cat){const F=GF[kind];const out={};playersOf(cat).forEach(p=>{const on=form.elements['on-'+p.id];if(!on||!on.checked)return;const o={};
  F.forEach(([k,l,t])=>{const el=form.elements[k+'-'+p.id];if(!el)return;if(t==='chk')o[k]=el.checked;else{const v=num(el.value);if(v!=null)o[k]=v;}});out[p.id]=o;});return out;}
const ENTRY={};
/* ---------- AFFECTATION DES JOUEURS À UNE SÉANCE + FENÊTRE RPE 4h ---------- */
const RPE_WINDOW_MS=4*3600*1000;
function rpeState(s){if(!s||!s.rpeOpenedAt)return {sent:false,open:false};const end=s.rpeOpenedAt+RPE_WINDOW_MS;const now=Date.now();return {sent:true,end,open:now<end,remain:end-now};}
function rpeFilledCount(s){if(!s||!s.players)return 0;return Object.values(s.players).filter(x=>x&&(x.rpe!=null||(x.partRpe&&Object.keys(x.partRpe).length))).length;}
function fmtRemain(ms){if(ms<=0)return '0 min';const m=Math.floor(ms/60000);const h=Math.floor(m/60);return h?h+' h '+String(m%60).padStart(2,'0'):m+' min';}
ENTRY.assign=()=>{
  const cat=UI.assignCat||(cats().find(c=>playersOf(c).length))||defCat();const date=UI.assignDate||UI.ref;
  const ps=playersOf(cat);
  const templates=Object.values(DATA.templates||{}).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const todays=[
    ...Object.values(DATA.sessions).filter(s=>s.date===date&&s.cat===cat).map(s=>Object.assign({__col:'sessions'},s)),
    ...Object.values(DATA.matches).filter(m=>m.date===date&&m.cat===cat).map(m=>Object.assign({__col:'matches'},m,{title:'Match vs '+(m.opponent||''),type:'Match'}))
  ].sort((a,b)=>(a.title||a.type||'').localeCompare(b.title||b.type||''));
  const presence=ps.map(p=>{const inj=activeInjury(p.id,date);const def=!inj||inj.status==='reprise';
    return `<label class="chk" style="display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px"><input type="checkbox" name="ap-${p.id}" ${def?'checked':''}> ${esc(p.name)}${p.number!=null?' <span class="small muted">#'+p.number+'</span>':''}${inj?` <span class="pill ${inj.status==='soins'?'crit':'info'}">${STATUS_LABEL[inj.status]}</span>`:''}</label>`;}).join('');
  const form=`<form data-form="assign" class="stack">
    <div class="fgrid">
      ${fld('as-date','Date',`<input type="date" id="as-date" name="date" value="${date}" data-chg="assignDate">`)}
      ${catFld('as-cat',cat,'data-chg="assignCat"')}
      ${fld('as-tpl','Séance type à affecter',`<select id="as-tpl" name="tpl"><option value="">— Séance vierge —</option>${templates.map(t=>`<option value="${esc(t.id)}">${esc(t.name||t.type||'Modèle')}</option>`).join('')}</select>`,2)}
      ${fld('as-title','Intitulé',`<input type="text" id="as-title" name="title" placeholder="ex. Entraînement du soir">`,2)}
      ${fld('as-dur','Durée (min)',`<input type="number" id="as-dur" name="duration" value="90" min="0">`)}
    </div>
    ${ps.length?`<div><b>${INDIV?'Présence':'Qui était là ?'}</b> <span class="small muted">— coche les ${INDIV?PL.many+' concerné·es':'présents'} (${ps.length} ${PL.many})</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px">${presence}</div>
    <div class="row"><button class="btn pri">Créer et affecter la séance</button></div>`:`<p class="muted">${INDIV?'Aucun·e client·e. Ajoute-les dans « Saisie › '+PL.Many+' ».':'Aucun·e joueur·se en '+esc(cat)+'. Choisis une autre catégorie ou ajoute des joueur·ses dans « Saisie › Joueur·ses ».'}</p>`}
  </form>`;
  const dayList=!todays.length?`<p class="muted">Aucune séance ${fmtD(date)}${INDIV?'':' en '+esc(cat)}.</p>`:todays.map(s=>{
    const st=rpeState(s);const nP=s.players?Object.keys(s.players).length:0;const nR=rpeFilledCount(s);
    let badge,btn;
    if(s.source==='joueur'){badge=`<span class="pill good">Saisie par ${INDIV?'le/la client·e':'le/la joueur·se'} ✓</span>`;btn='';}
    else if(!st.sent){badge='<span class="pill neutral">RPE non envoyé</span>';btn=`<button class="btn pri sm" data-act="sendRpe" data-id="${esc(s.id)}">Envoyer RPE (fenêtre 4 h)</button>`;}
    else if(st.open){badge=`<span class="pill good">Ouvert · ferme dans <b data-chrono="${st.end}">${fmtRemain(st.remain)}</b></span>`;btn=`<button class="btn sm" data-act="sendRpe" data-id="${esc(s.id)}">Prolonger 4 h</button>`;}
    else{badge='<span class="pill warn">Fenêtre fermée</span>';btn=`<button class="btn sm" data-act="sendRpe" data-id="${esc(s.id)}">Rouvrir 4 h</button>`;}
    return `<div class="card flat" style="margin-top:8px"><div class="hrow" style="margin:0"><div><b>${esc(s.title||s.type||'Séance')}</b> <span class="small muted">${esc(s.type||'')}${s.duration?' · '+s.duration+' min':''}</span></div>${badge}</div>
      <div class="hrow" style="margin:6px 0 0"><span class="small muted">${nP} affecté·es · <b>${nR}</b> RPE reçu${nR>1?'s':''}</span><div class="row" style="flex-wrap:nowrap">${btn}<button class="btn sm" data-act="edit" data-col="${s.__col||'sessions'}" data-id="${esc(s.id)}">${s.__col==='matches'?'Ouvrir le match':'Ouvrir la séance'}</button><button class="btn sm danger" data-act="del" data-col="${s.__col||'sessions'}" data-id="${esc(s.id)}">Supprimer</button></div></div></div>`;
  }).join('');
  return `<div class="hrow"><h2>Affectation des ${PL.many}</h2></div>
    <p class="note" style="margin:0 0 10px">Crée la séance du jour et coche ${INDIV?'les '+PL.many+' concerné·es':'les présents'}. Puis clique <b>Envoyer RPE</b> : chaque ${PL.one} dispose alors de <b>4 h</b> pour saisir son RPE depuis son espace perso.</p>
    ${form}
    <h3 style="margin:16px 0 4px">Séances du jour</h3>
    ${dayList}`;
};
// Saisie séance simple : type (entraînement/match) + temps + présent·es, sans détailler les parties.

  const isM=kind==='match';

    ? fld('si-title',INDIV?'Nom de la compétition':'Nom du match',`<input type="text" id="si-title" name="title" placeholder="${INDIV?'ex. 10 km de Paris · Compétition de force':'ex. vs Lyon'}" required>`,2)
    : fld('si-title','Intitulé (optionnel)',`<input type="text" id="si-title" name="title" placeholder="${INDIV?'ex. Séance du jour':'ex. Entraînement du jour'}">`,2);

    ${fld('si-dur','Durée (min)',`<input type="number" id="si-dur" name="duration" value="${isM?(INDIV?60:90):(INDIV?45:75)}" min="0">`)}

  </div>
  ${ps.length?`<div><b>${INDIV?'Qui est concerné·e ?':'Qui était présent·e ?'}</b> <span class="small muted">— coche les ${PL.many} concerné·es (${ps.length})</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px">${ps.map(p=>`<label class="chk"><input type="checkbox" name="pl-${p.id}" checked> ${esc(p.name)}</label>`).join('')}</div>
    <p class="note" style="margin:0">${isM?'Après « Envoyer », chaque '+PL.one+' coché·e reçoit '+(INDIV?'la compétition':'le match')+' dans son espace et note '+(INDIV?'sa difficulté (RPE) et son ressenti':'la difficulté et sa performance')+' (1 → 10).':'Après « Envoyer RPE », chaque '+PL.one+' coché·e reçoit la séance dans son espace et note simplement son RPE (fenêtre 4 h).'}</p>

    :`<p class="muted">${INDIV?'Aucun·e client·e. Ajoute-les dans « Saisie › '+PL.Many+' ».':'Aucun·e '+PL.one+' en '+esc(cat)+'.'}</p>`}
  </form>`;
}
/* Saisie de séance guidée (coaching) : étapes visuelles — pour qui, type, détails, ressenti. */
function coachSessionForm(){
  const clients=playersOf(INDIV_CAT,true);
  if(!clients.length)return `<div class="card"><p class="muted" style="margin:0">Ajoute d'abord des client·es dans « Saisie › Client·es ».</p></div>`;
  const TI={'Course / running':'🏃','Fractionné':'⚡','Renforcement / muscu':'💪','Cardio':'🚴','Mobilité':'🧘','Récupération':'😌','Mixte':'🔀','Salle':'🏋️'};
  const types=S().sessionTypes;const date=UI.assignDate||UI.ref;
  const e=editing('sessions'); // mode édition d'une séance existante
  const edur=e?num(e.duration):null;const pills=[30,45,60,75,90];
  const durCustom=(e&&edur!=null&&!pills.includes(edur))?edur:'';
  const rpeVals=e?Object.values(e.players||{}).map(x=>num(x.rpe)).filter(v=>v!=null):[];

    <div class="ns-step"><div class="ns-head"><span class="ns-num">3</span><h3>Détails</h3></div>
      <div class="fgrid">${fld('ns-date','Date',`<input type="date" id="ns-date" name="date" value="${e?esc(e.date):date}">`)}${fld('ns-title','Intitulé (optionnel)',`<input type="text" id="ns-title" name="title" value="${e&&e.title&&e.title!==e.type?esc(e.title):''}" placeholder="ex. Sortie longue · Haut du corps…">`,2)}</div>
      <div class="ns-sub">Durée</div>
      <div class="ns-chips" style="align-items:center">${pills.map((d,i)=>`<label class="ns-pill"><input type="radio" name="duration" value="${d}" ${ck(e?edur===d:i===2)}>${d} min</label>`).join('')}<span class="ns-dcustom">ou <input type="number" name="durationCustom" value="${durCustom}" placeholder="min" min="0"> min</span></div>
      <div class="ns-sub">Intensité</div>
      <div class="ns-seg2">${['Légère','Modérée','Soutenue','Intense'].map((x,i)=>`<label class="ns-segbtn"><input type="radio" name="intensity" value="${x}" ${ck(e?e.intensity===x:i===1)}>${x}</label>`).join('')}</div></div>
    <div class="ns-step"><div class="ns-head"><span class="ns-num">4</span><h3>Difficulté ressentie (RPE)</h3></div>
      <div class="ns-mode">
        <label class="ns-modeopt"><input type="radio" name="mode" value="client" ${ck(!modeCoach)}><div><b>📲 Le/la client·e le note</b><span>Reçoit la séance dans son espace et note sa difficulté (fenêtre 4 h).</span></div></label>
        <label class="ns-modeopt"><input type="radio" name="mode" value="coach" ${ck(modeCoach)}><div><b>✍️ Je le note maintenant</b><span>Tu saisis directement le RPE de la séance.</span></div></label>
      </div>
      <div class="ns-rpe"><div class="ns-sub">Note de 0 (très facile) à 10 (maximal)</div><div class="ns-rpescale">${range0(11).map(n=>`<label class="ns-rpebtn"><input type="radio" name="rpe" value="${n}" ${ck(rpeVal===n)}>${n}</label>`).join('')}</div></div></div>
    <div class="ns-step"><div class="ns-head"><span class="ns-num">5</span><h3>Notes <span class="muted" style="font-weight:400;font-size:13px">(optionnel)</span></h3></div>

/* Saisie d'une compétition en coaching individuel (course, trail, muscu…) : pas de score/buts, mais résultat, classement, ressenti. */
function competForm(){
  const e=editing('matches');const clients=playersOf(INDIV_CAT,true);
  if(!clients.length)return `<p class="muted">Ajoute d'abord des client·es dans « Saisie › Client·es ».</p>`;
  let pid=UI.competPid&&clients.some(c=>c.id===UI.competPid)?UI.competPid:(e?Object.keys(e.players||{})[0]:clients[0].id);
  const pe=(e&&e.players&&e.players[pid])||{};
  const TYPES=['Course 5 km','Course 10 km','Semi-marathon','Marathon','Trail','Triathlon','Cyclosportive','Compétition de force / muscu','Cross / piste','Autre'];
  return `<form data-form="compet" class="stack"><input type="hidden" name="cat" value="${INDIV_CAT}">${e?`<input type="hidden" name="id" value="${esc(e.id)}">`:''}
    <div class="fgrid">
      ${fld('cp-pid','Client·e',`<select id="cp-pid" name="pid" data-chg="competPid">${clients.map(c=>`<option value="${esc(c.id)}" ${c.id===pid?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`)}
      ${fld('cp-date','Date',`<input type="date" id="cp-date" name="date" value="${esc(e&&e.date||UI.ref)}">`)}
      ${fld('cp-type','Type de compétition',`<select id="cp-type" name="ctype">${opt(TYPES,e&&e.opponent)}</select>`)}
      ${fld('cp-name',"Nom de l'épreuve",`<input type="text" id="cp-name" name="name" value="${esc(e&&e.compName||'')}" placeholder="ex. Marathon de Paris">`,2)}
      ${fld('cp-result','Résultat (temps / performance)',`<input type="text" id="cp-result" name="result" value="${esc(pe.result||'')}" placeholder="ex. 1h48 · 44:30 au 10 km · total 420 kg">`,2)}
      ${fld('cp-rank','Classement (optionnel)',`<input type="text" id="cp-rank" name="rank" value="${esc(pe.rank||'')}" placeholder="ex. 12e / 340">`)}
      ${fld('cp-dur','Durée (min)',`<input type="number" id="cp-dur" name="duration" value="${esc(e&&e.duration||'')}" min="0">`)}
      ${fld('cp-rpe','Difficulté (RPE 0–10)',`<input type="number" id="cp-rpe" name="rpe" min="0" max="10" value="${esc(pe.rpe!=null?pe.rpe:'')}">`)}
      ${fld('cp-perf','Ressenti perf (1–10)',`<input type="number" id="cp-perf" name="perf" min="1" max="10" value="${esc(pe.perf!=null?pe.perf:'')}">`)}

    ${fld('cp-note','Debrief / sensations',`<textarea id="cp-note" name="note" placeholder="Sensations, météo, allure, points à retenir…">${esc(pe.comment||'')}</textarea>`,3)}
    <div class="row">${e?'<button type="button" class="btn" data-act="cancelEdit">Annuler</button>':''}<button class="btn pri">${e?'Enregistrer':'Ajouter la compétition'}</button></div>
  </form>`;
}
ENTRY.smatch=()=>INDIV?competForm():simpleForm('match');
ENTRY.rpe=()=>{
  const cat=UI.assignCat||(cats().find(c=>playersOf(c).length))||defCat();const date=UI.assignDate||UI.ref;
  const sess=Object.values(DATA.sessions).filter(s=>s.date===date&&s.cat===cat).sort((a,b)=>(a.title||a.type||'').localeCompare(b.title||b.type||''));
  const dc=`${fld('rp-date','Date',`<input type="date" id="rp-date" value="${date}" data-chg="assignDate">`)}${INDIV?'':fld('rp-cat','Catégorie',`<select id="rp-cat" data-chg="assignCat">${opt(cats(),cat)}</select>`)}`;
  if(!sess.length)return `<div class="hrow"><h2>Saisir les RPE</h2></div><div class="fgrid">${dc}</div><p class="muted">Aucune séance ${fmtD(date)}${INDIV?'':' en '+esc(cat)}. Crée-la d'abord dans « Affectation ».</p>`;
  const sid=(UI.rpeSess&&sess.find(s=>s.id===UI.rpeSess))?UI.rpeSess:sess[0].id;
  const s=DATA.sessions[sid];
  const affected=Object.keys(s.players||{}).map(id=>DATA.players[id]).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
  const st=rpeState(s);
  const sel=sess.length>1?fld('rp-sess','Séance',`<select id="rp-sess" data-chg="rpeSess">${sess.map(x=>`<option value="${esc(x.id)}" ${x.id===sid?'selected':''}>${esc((x.title||x.type||'Séance'))}</option>`).join('')}</select>`,2):'';
  const rows=affected.length?affected.map(p=>{const me=s.players[p.id]||{};return `<tr><td>${esc(p.name)}</td><td><input type="number" step="any" min="0" max="10" name="rpe-${p.id}" value="${esc(me.rpe!=null?me.rpe:'')}" placeholder="0-10"></td><td class="small muted">${me.partRpe&&Object.keys(me.partRpe).length?'saisi par '+(INDIV?'le/la client·e':'le/la joueur·se'):(me.rpe!=null?'':'—')}</td></tr>`;}).join(''):`<tr><td colspan="3" class="muted">Aucun·e ${PL.one} affecté·e à cette séance.</td></tr>`;
  return `<div class="hrow"><h2>Saisir les RPE</h2>${st.sent?(st.open?`<span class="pill good">Fenêtre ${PL.many} ouverte · <b data-chrono="${st.end}">${fmtRemain(st.remain)}</b></span>`:`<span class="pill warn">Fenêtre ${PL.many} fermée</span>`):`<span class="pill neutral">RPE non envoyé aux ${PL.many}</span>`}</div>
    <form data-form="rpe" class="stack"><input type="hidden" name="sid" value="${esc(sid)}"><div class="fgrid">${dc}${sel}</div>
    ${affected.length?`<div class="row" style="align-items:center;gap:8px;flex-wrap:wrap"><label style="margin:0">Même RPE pour tout le monde</label><input type="number" id="rp-fill" min="0" max="10" step="any" value="5" style="width:90px"><button type="button" class="btn sm" data-act="rpeFillAll">Appliquer à tous</button><span class="small muted">puis « Enregistrer les RPE »</span></div>`:''}
    <div class="tw"><table class="gridin"><thead><tr><th>${PL.One}</th><th>RPE (0-10)</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row">${!st.sent?`<button type="button" class="btn" data-act="sendRpe" data-id="${esc(sid)}">Envoyer aux ${PL.many} (4 h)</button>`:''}<button class="btn pri">Enregistrer les RPE</button></div></form>`;

const PDF_MAX=2.6*1024*1024; // ~2,6 Mo max par PDF (limite de stockage)
async function pdfPut(id,dataUrl){const r=await fetch('/api/storage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set',key:DB_PREFIX+':pdf:'+id,value:dataUrl})});if(!r||!r.ok)throw new Error('save');}
async function pdfGet(id){try{const r=await fetch('/api/storage?action=get&key='+encodeURIComponent(DB_PREFIX+':pdf:'+id)+'&_='+Date.now(),{cache:'no-store'});const j=await r.json();return j&&j.value?j.value:null;}catch(e){return null;}}
async function pdfDelKey(id){try{await fetch('/api/storage?key='+encodeURIComponent(DB_PREFIX+':pdf:'+id),{method:'DELETE'});}catch(e){}}

  const tick=()=>{const els=$$('[data-chrono]');if(!els.length){clearInterval(CHRONO_TIMER);CHRONO_TIMER=null;return;}
    let closed=false;els.forEach(el=>{const remain=(+el.dataset.chrono)-Date.now();if(remain<=0){closed=true;el.textContent='0 min';}else el.textContent=fmtRemain(remain);});

/* Identifiants par défaut : prénom@aca.com + mot de passe = 3 premières lettres du prénom + 123 */
function slugName(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function firstName(n){return (n||'').trim().split(/\s+/)[0]||'';}
function defLogin(name){const f=slugName(firstName(name));return f?f+'@aca.com':'';}
function defPass(name){const f=slugName(firstName(name));return f?f.slice(0,3)+'123':'';}
FORMS.player=async f=>{const e=editing('players');const v=Object.fromEntries(new FormData(f));const id=e?e.id:uid();
  const name=v.name.trim();
  // on autorise le @ et le . (adresse type prénom@aca.com) ; si vide on génère l'identifiant par défaut
  let login=(v.login||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9@._-]+/g,'');
  if(!login)login=defLogin(name);
  let pass=(v.pass||'').trim();if(!pass)pass=defPass(name);
  await put('players',id,Object.assign({},e||{},{id,name,cat:v.cat,pos:v.pos,sport:v.sport!=null?v.sport:(e&&e.sport),number:num(v.number),birth:v.birth,sex:v.sex!=null?v.sex:(e&&e.sex||''),height:num(v.height),mass:num(v.mass),vmax:num(v.vmax),photo:v.photo||'',goal:v.goal!=null?v.goal:(e&&e.goal||''),login,pass,active:!!v.active}));UI.edit=null;toast(e?(INDIV?'Client·e modifié·e':'Joueur modifié'):(INDIV?'Client·e ajouté·e':'Joueur ajouté'));render();};

function ensureJsPDF(){
  return new Promise((res,rej)=>{
    const get=()=>window.jspdf&&window.jspdf.jsPDF;
    if(get())return res(get());
    const srcs=['jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js'];
    let i=0;const tryNext=()=>{
      if(i>=srcs.length)return rej(new Error('load-failed'));
      const s=document.createElement('script');s.src=srcs[i++];
      s.onload=()=>get()?res(get()):tryNext();
      s.onerror=tryNext;document.head.appendChild(s);
    };tryNext();
  });
}

  }

  const panelProfil=`
    <div class="card"><div class="row">${lvPill(s.lv)}${s.reasons.map(r=>`<span class="pill ${r.l>=3?'crit':r.l===2?'warn':'neutral'}">${esc(r.t)}</span>`).join('')||'<span class="small muted">Aucun signal particulier</span>'}</div></div>
    <div class="grid g4">${kpi('Wellness',s.w.today!=null?r0(s.w.today):'–','%',s.w.mean!=null?'Habitude '+r0(s.w.mean)+' %':'')}${kpi('Charge 7 j',r0(w.sum),'UA',w.chg!=null?(w.chg>0?'+':'')+r0(w.chg)+' % vs 3 sem.':'')}${kpi('🧠 Charge mentale 7 j',mHas?r0(m7):'–','UA',mHas&&w.sum?r0(m7/w.sum*100)+' % de la charge phys.':'sRPE mentale')}${kpi('ACWR',s.e.acwr!=null?r2(s.e.acwr):'–','','EWMA 7/28 j')}${kpi('Matchs',mn,'',r0(mm)+' min · '+g+' B · '+a+' PD')}</div>
    <div class="grid g2">
      <div class="card"><h3>Infos</h3><div class="stack small">
        <div class="row sb"><span>Catégorie</span><b>${esc(p.cat)}</b></div>
        <div class="row sb"><span>Poste</span><b>${esc(p.pos||'—')}</b></div>
        ${p.number?`<div class="row sb"><span>Numéro</span><b>${esc(p.number)}</b></div>`:''}
        ${p.birth?`<div class="row sb"><span>Âge</span><b>${r1(age(p.birth,ref))} ans</b></div>`:''}
        ${p.height?`<div class="row sb"><span>Taille</span><b>${r0(p.height)} cm</b></div>`:''}
        ${p.mass?`<div class="row sb"><span>Poids</span><b>${r1(p.mass)} kg</b></div>`:''}
        <div class="row sb"><span>Vmax réf.</span><b>${r1(vref(p))} km/h</b></div>
      </div></div>
      <div class="card"><h3>Musculation</h3>${Object.keys(mx.values||{}).length?`<div class="stack small">${Object.entries(mx.values).filter(([k,v])=>num(v)).map(([k,v])=>`<div class="row sb"><span>${esc(k)}</span><b>${fr(num(v),1)} kg${p.mass?' · '+r2(num(v)/p.mass)+' × PDC':''}</b></div>`).join('')}</div>`:'<p class="muted small">Pas de 1RM saisi</p>'}</div>
    </div>`;

  let panelMatch;
  if(pMatches.length){
    const bySeason={};pMatches.forEach(x=>{const sl=seasonLabel(x.date);(bySeason[sl]=bySeason[sl]||[]).push(x);});
    panelMatch=Object.keys(bySeason).sort().reverse().map(sl=>{
      const list=bySeason[sl];let M=0,Tit=0,min=0,gg=0,aa=0,yy=0,rr=0;const rt=[];
      list.forEach(x=>{const e=x.players[p.id];M++;if(e.starter)Tit++;min+=num(e.min)||0;gg+=num(e.goals)||0;aa+=num(e.assists)||0;yy+=num(e.yellow)||0;rr+=num(e.red)||0;if(num(e.rating)!=null)rt.push(num(e.rating));});
      return `<div class="card"><div class="hrow"><h3>Saison ${sl}</h3><span class="small muted">${M} match${M>1?'s':''} · ${yy} 🟨 · ${rr} 🟥</span></div>
        <div class="grid g6" style="margin-bottom:10px">${kpi('Matchs',M,'')}${kpi('Titul.',Tit,'')}${kpi('Minutes',r0(min),'')}${kpi('Buts',gg,'')}${kpi('Passes déc.',aa,'')}${kpi('Note moy.',rt.length?r1(mean(rt)):'–','/10')}</div>
        <div class="tw"><table><thead><tr><th>Date</th><th>Adversaire</th><th>Compét.</th><th class="n">Min</th><th>Statut</th><th class="n">B</th><th class="n">PD</th><th class="n">Cart.</th><th class="n">Note</th></tr></thead><tbody>
        ${list.map(x=>{const e=x.players[p.id];return `<tr><td>${fmtShort(x.date)}</td><td>${esc(x.opponent||'')}</td><td class="small">${esc(x.competition||x.cat||'')}</td><td class="n">${r0(num(e.min))}</td><td>${e.starter?'Titulaire':'Remplaçant'}</td><td class="n">${num(e.goals)||''}</td><td class="n">${num(e.assists)||''}</td><td class="n">${num(e.yellow)?'<span class="pill warn">J</span>':''}${num(e.red)?'<span class="pill crit">R</span>':''}</td><td class="n">${num(e.rating)!=null?r1(num(e.rating)):'–'}</td></tr>`;}).join('')}
        </tbody></table></div></div>`;
    }).join('');
  } else panelMatch='<div class="card"><p class="muted" style="margin:0">Aucun match enregistré pour ce/cette '+PL.one+'. Saisis un match dans l’onglet « Compétition ».</p></div>';

  const tileStyle='class="card flat" style="text-align:center;padding:10px 8px"';
  const tvStyle='style="font-size:19px;font-weight:700;font-family:var(--fd)"';
  const testTiles=[
    (p.height?`<div ${tileStyle}><div ${tvStyle}>${r0(p.height)}<span class="small muted"> cm</span></div><div class="small muted">Taille</div></div>`:''),
    (p.mass?`<div ${tileStyle}><div ${tvStyle}>${r1(p.mass)}<span class="small muted"> kg</span></div><div class="small muted">Poids</div></div>`:''),
    ...tests.map(x=>{const d=x.prev?x.last.v-x.prev.v:null;const flat=d===0;const up=d!=null&&!flat&&((x.t.better==='high'&&d>0)||(x.t.better==='low'&&d<0));const col=(d==null||flat)?'var(--muted)':(up?'var(--good)':'var(--crit)');const arrow=d==null?'':(flat?'→':(d>0?'▲':'▼'));return `<div ${tileStyle}><div ${tvStyle}>${fr(x.last.v,2)}<span class="small muted"> ${esc(x.t.unit)}</span></div><div class="small muted">${esc(x.t.name)}</div>${d!=null?`<div class="small" style="color:${col}">${arrow} ${fr(Math.abs(d),2)}</div>`:''}</div>`;})
  ].filter(Boolean).join('');
  // Tuiles d'asymétrie gauche/droite : % de symétrie = min/max × 100.
  const asymTiles=(S().asym||[]).map(pr=>{const sd=testSeries(p.id,pr.d),sg=testSeries(p.id,pr.g);const d=sd.length?sd[sd.length-1].v:null,gv=sg.length?sg[sg.length-1].v:null;if(d==null||gv==null||!d||!gv)return '';const sym=Math.round(Math.min(d,gv)/Math.max(d,gv)*100);const col=sym>=90?'var(--good)':sym>=80?'var(--warn)':'var(--crit)';return `<div ${tileStyle}><div style="font-size:19px;font-weight:700;font-family:var(--fd);color:${col}">${sym}<span class="small muted"> %</span></div><div class="small muted">Asym. ${esc(pr.label)}</div><div class="small muted">D ${fr(d,0)} · G ${fr(gv,0)}</div></div>`;}).filter(Boolean).join('');
  const allTiles=testTiles+asymTiles;
  const panelTests=`<div class="card"><h3>Tests physiques — dernières valeurs</h3>
    ${allTiles?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px">${allTiles}</div>`:'<p class="muted small">Aucune donnée de test.</p>'}
    ${tests.length?`<div class="tw" style="margin-top:12px"><table><thead><tr><th>Test</th><th class="n">Dernier</th><th class="n">Précédent</th><th>Date</th></tr></thead><tbody>${tests.map(x=>`<tr><td>${esc(x.t.name)}</td><td class="n"><b>${fr(x.last.v,2)}</b> ${esc(x.t.unit)}</td><td class="n">${x.prev?fr(x.prev.v,2):'–'}</td><td>${fmtShort(x.last.date)}</td></tr>`).join('')}</tbody></table></div>`:''}
    <p class="note" style="margin-top:10px">Ajoute ou modifie des tests (VMA, side hop, triple hop, 30-15…) dans « Saisie → Tests » et configure la liste dans « Paramètres → Tests ».</p></div>`;

  const panelEval=pReports.length?pReports.map(r=>{const gg=repGlobal(r);const th=r.themes||{};const chips=REP_THEMES.map(t=>{const c=th[t[0]];return (c&&c.note)?`<span class="pill neutral">${esc(t[1])} : ${c.note}/5</span>`:'';}).filter(Boolean).join(' ');
    return `<div class="card"><div class="hrow"><h3>${fmtD(r.date)} · <span class="pill ${r.type==='Match'?'crit':'neutral'}">${esc(r.type)}</span></h3>${gg!=null?`<span><b>${gg}</b><span class="muted">/5</span></span>`:''}</div>
      <p class="small muted" style="margin:0 0 6px">${esc(r.type==='Match'?('vs '+(r.opponent||'?')):(r.sessionTheme||'Entraînement'))}</p>
      <div class="row" style="flex-wrap:wrap;gap:6px">${chips||'<span class="small muted">Pas de note par thème</span>'}</div>
      ${r.strengths?`<p class="small" style="margin:8px 0 0"><b>Points forts :</b> ${esc(r.strengths)}</p>`:''}${r.axes?`<p class="small" style="margin:4px 0 0"><b>Axes de progrès :</b> ${esc(r.axes)}</p>`:''}</div>`;
  }).join(''):`<div class="card"><p class="muted" style="margin:0">Aucune évaluation pour ce/cette ${PL.one}. Crée un compte rendu dans l’onglet « Compte rendu ».</p></div>`;

  const panelInj=`<div class="card"><div class="hrow"><h3>Blessures</h3><button class="btn sm" data-act="injFor" data-id="${esc(p.id)}">Déclarer une blessure</button></div>
    ${inj.length?`<div class="stack">${inj.map(i=>`<div class="row sb"><span><b>${esc(i.zone)}</b> · ${esc(i.type||'')} · ${fmtD(i.date)}</span><span class="row"><span class="pill ${i.status==='apte'?'good':i.status==='soins'?'crit':'info'}">${STATUS_LABEL[i.status]}</span><button class="btn sm" data-act="medOpen" data-id="${esc(i.id)}">Fiche</button></span></div>`).join('')}</div>`:'<p class="muted small">Aucune blessure enregistrée</p>'}</div>`;

  const panelProg=`
    <div class="card"><h3>Wellness, 28 jours</h3>${lineChart({labels:days,series:[{name:'Wellness',values:wv,color:COL_TR,dots:true}],yMin:30,yMax:100,refs:[{v:S().th.well,label:'Seuil'}],h:150})}</div>
    <div class="card"><h3>Charge quotidienne (sRPE)</h3>${barChart({labels:days,values:lv,colors:isM.map(m=>m?COL_MATCH:COL_TR),unit:'UA',h:150,legend:CHART_LEG})}</div>
    ${mHas?`<div class="card"><h3>🧠 Charge mentale quotidienne (sRPE mentale)</h3>${barChart({labels:days,values:mv,colors:isM.map(m=>m?'#ff9a8b':'#f2617a'),unit:'UA',h:150,legend:[['Entraînement','#f2617a'],['Match','#ff9a8b']]})}<p class="note">Charge mentale = note de contrainte mentale (0→10) × durée, déclarée par le ${PL.one} dans son questionnaire.</p></div>`:''}
    <div class="card"><h3>ACWR</h3>${lineChart({labels:days,series:[{name:'ACWR',values:ac,color:COL_TR}],band:[S().th.acwrLo,S().th.acwrHi],h:140,fmt:v=>r2(v),yMin:0})}<p class="note">Zone verte : ${r1(S().th.acwrLo)} à ${r1(S().th.acwrHi)}.</p></div>`;

  const panels={profil:panelProfil,match:panelMatch,gps:panelGps,tests:panelTests,eval:panelEval,inj:panelInj,prog:panelProg};
  const ai=activeInjury(p.id,ref);
  const headTags=`${lvPill(s.lv)}${ai?`<span class="pill crit">🩹 ${esc(ai.zone||ai.type||'Blessure')}</span>`:''}${s.w&&s.w.today!=null?`<span class="pill ${s.w.today>=S().th.well?'good':'warn'}">Wellness ${r0(s.w.today)} %</span>`:''}${w&&w.sum?`<span class="pill neutral">Charge 7 j ${r0(w.sum)} UA</span>`:''}`;

  host.innerHTML=`<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Fiche de ${esc(p.name)}">
    <div class="pfhead">
      ${pAvatar(p,'xl')}
      <div class="pfmeta">
        <div class="eyebrow">${esc(p.cat)}${p.pos?' · '+esc(p.pos):''}${p.number?' · n° '+esc(p.number):''}</div>
        <h2>${esc(p.name)}</h2>
        <div class="pfsub">${p.birth?r1(age(p.birth,ref))+' ans · ':''}${p.height?r0(p.height)+' cm · ':''}${p.mass?r1(p.mass)+' kg · ':''}Vmax réf. ${r1(vref(p))} km/h</div>
        <div class="pftags">${headTags}</div>
      </div>
      <div class="row" style="align-self:flex-start;z-index:1;flex-wrap:nowrap"><button class="btn sm" data-act="edit" data-col="players" data-id="${esc(p.id)}">✎ Modifier</button><button class="btn sm" data-act="closeDrawer" aria-label="Fermer">✕</button></div>
    </div>
    <div class="subtabs drawertabs">${dtabs.map(([k,l])=>`<button class="${DTAB===k?'on':''}" data-act="drawerTab" data-id="${k}">${l}</button>`).join('')}</div>
    ${panels[DTAB]||panelProfil}
  </aside>`;
  document.body.style.overflow='hidden';
}

/* ---------- ACTIONS ---------- */
const ACT={
  tab:b=>{UI.drawer=null;markSeen(b.dataset.id);go(b.dataset.id);},
  pdfSave:async b=>{
    const fileEl=$('#pdf-file');const msg=$('#pdf-msg');const setMsg=(t,ok)=>{if(msg){msg.className='small '+(ok?'good':'crit');msg.textContent=t;}};
    const f=fileEl&&fileEl.files&&fileEl.files[0];
    if(!f){setMsg('Choisis un fichier PDF.');return;}
    if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){setMsg('Le fichier doit être un PDF.');return;}
    if(f.size>PDF_MAX){setMsg('PDF trop lourd ('+Math.round(f.size/1024/1024*10)/10+' Mo). Maximum ~2,5 Mo.');return;}
    const cid=($('#pdf-client')&&$('#pdf-client').value)||UI.pdfClient;const name=(($('#pdf-name')&&$('#pdf-name').value)||f.name.replace(/\.pdf$/i,'')).trim()||'Programme';
    b.disabled=true;setMsg('Import en cours…',true);
    try{
      const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(f);});
      const id='pdf-'+uid();await pdfPut(id,dataUrl);
      await put('pdfprograms',id,{id,cid,name,date:TODAY,size:f.size});
      UI.pdfClient=cid;toast('Programme PDF importé');render();
    }catch(e){setMsg('Échec de l\'import (fichier peut-être trop lourd). Réessaie avec un PDF plus léger.');b.disabled=false;}
  },
  pdfOpen:async b=>{const id=b.dataset.id;const old=b.textContent;b.disabled=true;b.textContent='…';const data=await pdfGet(id);b.disabled=false;b.textContent=old;
    if(!data){toast('PDF introuvable');return;}
    try{const parts=data.split(',');const bin=atob(parts[1]||'');const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);const blob=new Blob([arr],{type:'application/pdf'});const url=URL.createObjectURL(blob);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){window.open(data,'_blank');}
  },
  pdfDel:async b=>{if(!b.classList.contains('arm')){b.classList.add('arm');const t=b.textContent;b.textContent='Confirmer';setTimeout(()=>{if(b.isConnected){b.classList.remove('arm');b.textContent=t;}},3000);return;}
    const id=b.dataset.id;await pdfDelKey(id);await del('pdfprograms',id);toast('Programme supprimé');render();},
  spMore:()=>{UI.sheet=UI.sheet==='more'?null:'more';renderSpaceNav();},
  spPerf:()=>{UI.sheet=UI.sheet==='perf'?null:'perf';renderSpaceNav();},
  spEntry:()=>{UI.sheet=UI.sheet==='entry'?null:'entry';renderSpaceNav();},
  spClose:()=>{UI.sheet=null;renderSpaceNav();},
  saveTemplate:async()=>{const f=$('form[data-form="session"]');if(!f)return;const v=Object.fromEntries(new FormData(f));
    const procedes=[];for(let i=0;i<8;i++){const type=(v['pc-type-'+i]||'').trim();const temps=num(v['pc-temps-'+i]);const zone=num(v['pc-zone-'+i]);const rpe=num(v['pc-rpe-'+i]);if(type||temps!=null||zone!=null||rpe!=null)procedes.push({type,temps,zone,rpe});}
    if(!procedes.length){toast('Ajoute au moins un procédé avant d\'enregistrer un modèle');return;}
    const name=prompt('Nom de la séance type :',v.title||v.type||'Modèle');if(name==null)return;
    const id=uid();await put('templates',id,{id,name:(name.trim()||v.type||'Modèle'),cat:v.cat,type:v.type,objective:v.objective,title:v.title,duration:num(v.duration),content:v.content,procedes,staffNotes:{physique:v['sn-physique']||'',technique:v['sn-technique']||'',gb:v['sn-gb']||'',tactique:v['sn-tactique']||'',mental:v['sn-mental']||''}});
    toast('Séance type enregistrée');render();},
  cat:b=>{UI.cat=b.dataset.id;saveUI();render();},
  today:()=>{UI.ref=TODAY;render();},
  player:b=>{UI.drawer=b.dataset.id;UI.drawerTab='profil';renderDrawer();},
  drawerTab:b=>{UI.drawerTab=b.dataset.id;renderDrawer();},
  joueurNav:b=>{const roster=playersOf(UI.cat,true);let i=roster.findIndex(x=>x.id===UI.joueurSel);if(i<0)i=0;i=Math.max(0,Math.min(roster.length-1,i+(+b.dataset.d)));if(roster[i]){UI.joueurSel=roster[i].id;saveUI();render();}},
  chargeNav:b=>{const roster=playersOf(UI.cat,true);let i=roster.findIndex(x=>x.id===UI.chargePid);if(i<0)i=0;i=Math.max(0,Math.min(roster.length-1,i+(+b.dataset.d)));if(roster[i]){UI.chargePid=roster[i].id;render();}},
  seanceOpen:b=>{UI.seanceSel=b.dataset.id;render();const el=document.getElementById('seance-detail');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},
  seanceClose:()=>{UI.seanceSel=null;render();},
  calToday:()=>{UI.seanceFrom=null;UI.seanceTo=null;saveUI();render();},
  calCurve:()=>{const seq=['charge','hooper','off'];UI.seanceCurve=seq[(seq.indexOf(UI.seanceCurve||'charge')+1)%3];saveUI();render();},
  ppPhoto:()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const MAX=440;let w=img.width,h=img.height;const sc=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let data;try{data=c.toDataURL('image/jpeg',0.82);}catch(err){toast('Image illisible');return;}if(data.length>900000){toast('Image trop lourde, essaie une photo plus petite');return;}const hid=document.getElementById('pp-photo');if(hid)hid.value=data;const prev=document.getElementById('pp-photo-prev');if(prev){prev.style.backgroundImage=`url('${data}')`;prev.textContent='';}const rm=document.querySelector('[data-act="ppPhotoClear"]');if(rm)rm.hidden=false;formDirty=true;};img.onerror=()=>toast('Image illisible');img.src=rd.result;};rd.readAsDataURL(f);};inp.click();},
  ppPhotoClear:()=>{const hid=document.getElementById('pp-photo');if(hid)hid.value='';const prev=document.getElementById('pp-photo-prev');if(prev){prev.style.backgroundImage='';prev.textContent=prev.dataset.ini||'?';}const rm=document.querySelector('[data-act="ppPhotoClear"]');if(rm)rm.hidden=true;formDirty=true;},
  closeDrawer:()=>{UI.drawer=null;renderDrawer();},
  perfToggle:()=>{UI.perfOpen=!UI.perfOpen;renderNav();},
  goPerf:b=>{UI.perfOpen=false;go(b.dataset.id);},
  loadPdf:()=>exportLoadPdf(),
  qsHide:()=>{UI.qsDismiss=true;try{saveUI();}catch(e){}render();},
  entryToggle:()=>{UI.entryOpen=!UI.entryOpen;renderNav();},
  goSeason:()=>{UI.entryOpen=false;go('seasonplan');},
  spLevel:b=>{const cat=spKey();const plan=spGet(cat);const i=+b.dataset.wk,key=b.dataset.key;const w=plan.weeks[i]=plan.weeks[i]||{};
    if(key.indexOf('content.')===0){const ck=key.slice(8);w.content=w.content||{};w.content[ck]=((+w.content[ck]||0)+1)%6;}else{w[key]=((+w[key]||0)+1)%6;}spSave(cat,plan);},
  spPhase:b=>{const cat=spKey();const plan=spGet(cat);const i=+b.dataset.wk;const w=plan.weeks[i]=plan.weeks[i]||{};const cur=SP_PHASES.findIndex(p=>p[0]===(w.phase||''));w.phase=SP_PHASES[(cur+1)%SP_PHASES.length][0];spSave(cat,plan);},
  spMicro:b=>{UI.spMicro=+b.dataset.wk;renderDrawer();},
  closeMicro:()=>{UI.spMicro=null;renderDrawer();document.body.style.overflow='';},
  spMicroNav:b=>{const d=+b.dataset.d;UI.spMicro=Math.max(0,Math.min(SP_WEEKS-1,(UI.spMicro||0)+d));renderDrawer();},
  spMicroCopy:()=>{const cat=spKey();const plan=spGet(cat);const i=UI.spMicro;if(i==null)return;if(i>=SP_WEEKS-1){toast('Dernière semaine de la saison');return;}const w=plan.weeks[i]=plan.weeks[i]||{};const nw=plan.weeks[i+1]=plan.weeks[i+1]||{};nw.micro=JSON.parse(JSON.stringify(w.micro||{theme:'',note:'',days:[]}));spSave(cat,plan);UI.spMicro=i+1;renderDrawer();toast('Microcycle copié vers la semaine suivante');},
  spMicroPdf:()=>spMicroPrint(),
  spLogo:b=>{const i=+b.dataset.wk;const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;if(f.size>600000){toast('Image trop lourde (max ~600 Ko)');return;}const r=new FileReader();r.onload=()=>{const cat=spKey();const plan=spGet(cat);const w=plan.weeks[i]=plan.weeks[i]||{};w.logo=r.result;spSave(cat,plan);toast('Logo ajouté');};r.readAsDataURL(f);};inp.click();},
  spLogoDel:b=>{const i=+b.dataset.wk;const cat=spKey();const plan=spGet(cat);const w=plan.weeks[i]=plan.weeks[i]||{};delete w.logo;spSave(cat,plan);},
  spRefresh:()=>{render();toast('Planification actualisée');},

  spStart:t=>{const cat=spKey();const plan=spGet(cat);plan.start=t.value||spStartDefault();spSave(cat,plan);},
  spMicro:t=>{const cat=spKey();const plan=spGet(cat);const i=UI.spMicro;if(i==null)return;const w=plan.weeks[i]=plan.weeks[i]||{};w.micro=w.micro||{theme:'',note:'',days:[]};w.micro.days=w.micro.days||[];
    if(t.dataset.d!=null){const d=+t.dataset.d;w.micro.days[d]=w.micro.days[d]||{};w.micro.days[d][t.dataset.f]=t.value;}else{w.micro[t.dataset.f]=t.value;}
    spSave(cat,plan,true);if(t.tagName==='SELECT')renderDrawer();},
  spMicroGoto:t=>{UI.spMicro=+t.value;renderDrawer();},
  spOver:t=>{if(t.dataset.k==='plan')UI.spOverPlan=t.checked;else if(t.dataset.k==='real')UI.spOverReal=t.checked;render();},
  spGps:t=>{UI.spGpsMetric=t.value;render();},
  gpsSel:t=>{UI.gpsEvent=t.value;UI.gpsPlOff={};render();},
  gpsMetric:t=>{UI.gpsMetric=t.value;render();},
  gpsTitle:t=>{const c=t.dataset.col,id=t.dataset.id;const ev=DATA[c]&&DATA[c][id];if(!ev)return;const e2=JSON.parse(JSON.stringify(ev));e2.title=t.value;put(c,id,e2,true);},
  gpsDur:t=>{const c=t.dataset.col,id=t.dataset.id;const ev=DATA[c]&&DATA[c][id];if(!ev)return;const e2=JSON.parse(JSON.stringify(ev));e2.duration=num(t.value);put(c,id,e2,true);},
  gpsSplitName:t=>{const c=t.dataset.col,id=t.dataset.id,sid=t.dataset.sid;const ev=DATA[c]&&DATA[c][id];if(!ev||!ev.splits)return;const e2=JSON.parse(JSON.stringify(ev));const s=(e2.splits||[]).find(s=>s.id===sid);if(s){s.name=t.value;put(c,id,e2,true);}},
  gpsSplitDur:t=>{const c=t.dataset.col,id=t.dataset.id,sid=t.dataset.sid;const ev=DATA[c]&&DATA[c][id];if(!ev||!ev.splits)return;const e2=JSON.parse(JSON.stringify(ev));const s=(e2.splits||[]).find(s=>s.id===sid);if(s){s.dur=num(t.value);put(c,id,e2,true);}},
  rpeSess:t=>{UI.rpeSess=t.value;render();},
  indivClient:t=>{UI.indivClient=t.value;render();},
  reminderToggle:async t=>{await saveSettings({reminders:t.checked});toast(t.checked?'Rappels activés':'Rappels désactivés');},
  pe:t=>{const d=UI.progDraft;if(!d)return;const p=(t.dataset.path||'').split(':');const v=t.value;
    if(p[0]==='plan'){d.name=v;return;}
    if(p[0]==='w'){const w=d.weeks[+p[1]];if(w)w[p[2]]=v;return;}
    if(p[0]==='s'){const s=d.weeks[+p[1]]&&d.weeks[+p[1]].sessions[+p[2]];if(!s)return;const f=p[3];
      if(f==='km')s.km=v===''?null:num(v);
      else if(f==='kind'){s.kind=v;render();}
      else s[f]=v;return;}
    if(p[0]==='e'){const s=d.weeks[+p[1]]&&d.weeks[+p[1]].sessions[+p[2]];const e=s&&s.exercises[+p[3]];if(!e)return;const f=p[4];
      if(f==='dose'){e.fixed=v;delete e.series;delete e.sets;delete e.reps;}
      else e[f]=v;return;}}
};
/* GPS CSV */
let GPS_PARSED=null;
function gpsParse(){const txt=$('#gp-csv').value.trim();const out=$('#gp-prev');if(!txt){out.innerHTML='<p class="small" style="color:var(--crit)">Colle d’abord les données.</p>';return;}
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());const sep=[';','\t',','].map(s=>[s,lines[0].split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const head=lines[0].split(sep).map(h=>norm(h));
  const find=(...keys)=>head.findIndex(h=>keys.some(k=>h.includes(k)));
  const col={name:find('joueur','player','nom','name','athlete'),dist:find('distancetotale','totaldistance','distance','dist'),hsr:find('hsr','highspeed','hauteintensite','haute','hid'),sprint:find('sprint'),acc:find('acceleration','acc'),dec:find('deceleration','dec'),vmax:find('vmax','maxspeed','vitessemax','topspeed','maxvel'),min:find('minute','duree','duration','min'),pload:find('playerload','chargejoueur','playerld')};
  if(col.name<0){out.innerHTML='<p class="small" style="color:var(--crit)">Colonne du nom du joueur introuvable.</p>';return;}
  const mode=UI.gpsImpMode||'new';const split=($('#gp-split')&&$('#gp-split').value.trim())||'';let cat,target;
  if(mode==='existing'){const selEl=$('#gp-ev');if(!selEl||!selEl.value){out.innerHTML='<p class="small">Choisis une séance.</p>';return;}const [c,id]=selEl.value.split('|');const ev=DATA[c]&&DATA[c][id];if(!ev){out.innerHTML='<p class="small">Choisis une séance.</p>';return;}cat=ev.cat;target={mode:'existing',c,id,split};}
  else{const typ=UI.gpsImpType||'training';cat=INDIV?INDIV_CAT:(($('#gp-cat')&&$('#gp-cat').value.trim())||cats()[0]||'');const title=($('#gp-title')&&$('#gp-title').value.trim())||'';const date=($('#gp-date')&&$('#gp-date').value)||UI.ref;const dur=$('#gp-dur')?num($('#gp-dur').value):null;target={mode:'new',typ,cat,title,date,dur,split};}
  const ps=playersOf(cat,true);const rows=[];
  lines.slice(1).forEach(l=>{const a=l.split(sep);const nm=norm(a[col.name]);if(!nm)return;const p=ps.find(p=>norm(p.name)===nm)||ps.find(p=>norm(p.name).startsWith(nm)||nm.startsWith(norm(p.name)));
    const g=k=>col[k]>=0?num(String(a[col[k]]||'').replace(',','.').replace(/\s/g,'')):null;rows.push({raw:a[col.name],p,v:{dist:g('dist'),hsr:g('hsr'),sprint:g('sprint'),acc:g('acc'),dec:g('dec'),vmax:g('vmax'),min:g('min'),pload:g('pload')}});});
  GPS_PARSED={target,rows};const ok=rows.filter(r=>r.p).length;
  out.innerHTML=`<p class="small">${ok} ligne${ok>1?'s':''} associée${ok>1?'s':''} à un joueur sur ${rows.length} (catégorie ${esc(cat||'—')}). Colonnes détectées : ${Object.entries(col).filter(([k,v])=>v>=0).map(([k])=>k).join(', ')}.</p>
  <div class="tw"><table><thead><tr><th>Ligne</th><th>${PL.One}</th><th class="n">Dist.</th><th class="n">HSR</th><th class="n">Sprint</th><th class="n">Acc.</th><th class="n">Déc.</th><th class="n">Vmax</th><th class="n">P.Load</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.raw)}</td><td>${r.p?esc(r.p.name):'<span class="pill warn">Non trouvé</span>'}</td>${['dist','hsr','sprint','acc','dec','vmax','pload'].map(k=>`<td class="n">${r.v[k]??'–'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:8px"><button class="btn pri" data-act="gpsApply" ${ok?'':'disabled'}>${(UI.gpsImpMode||'new')==='new'?'Créer l’import':'Ajouter à la séance'}</button></div>`;}
async function gpsApply(){if(!GPS_PARSED)return;const {target,rows}=GPS_PARSED;let c,id,ev;
  if(target.mode==='existing'){c=target.c;id=target.id;ev=JSON.parse(JSON.stringify(DATA[c][id]));}
  else{id='gps-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    if(target.typ==='match'){c='matches';const opp=(target.title||'').replace(/^.*\bvs\b\s*/i,'').trim()||(target.title||'');ev={id,date:target.date,cat:target.cat,opponent:opp,title:target.title||'Match',duration:target.dur||90,venue:'',competition:'',gf:'',ga:'',players:{},gpsImport:true};}
    else{c='sessions';ev={id,date:target.date,cat:target.cat,type:'Terrain',title:target.title||'Séance',duration:target.dur||'',objective:'',content:'',players:{},gpsImport:true};}}
  ev.players=ev.players||{};ev.splits=ev.splits||[];
  /* données existantes (agrégat sans split) → on les conserve comme 1er split */
  if(ev.splits.length===0&&Object.values(ev.players).some(e=>num(e.dist)!=null&&!e.sp)){const bid='sp0';ev.splits.push({id:bid,name:'Séance (existant)'});
    Object.values(ev.players).forEach(e=>{if(num(e.dist)!=null&&!e.sp){e.sp={};e.sp[bid]={min:num(e.min),dist:num(e.dist),hsr:num(e.hsr),sprint:num(e.sprint),acc:num(e.acc),dec:num(e.dec),vmax:num(e.vmax),pload:num(e.pload)};}});}
  const sid='sp'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);
  const splitName=(target.split&&target.split.trim())||('Split '+(ev.splits.length+1));
  ev.splits.push({id:sid,name:splitName});
  rows.forEach(r=>{if(!r.p)return;const e=ev.players[r.p.id]||{};const sp={};Object.entries(r.v).forEach(([k,v])=>{if(v!=null)sp[k]=v;});e.sp=e.sp||{};e.sp[sid]=sp;gpsRecalc(e);ev.players[r.p.id]=e;});
  await put(c,id,ev);GPS_PARSED=null;toast(target.mode==='new'?'Import GPS créé (split « '+splitName+' »)':'Split « '+splitName+' » ajouté');UI.gpsEvent=id;UI.gpsHist=false;go('gps');}

/* ---------- ÉVÉNEMENTS ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(!f)return;if(b.tagName==='BUTTON'&&b.type!=='submit')e.preventDefault();f(b,e);});
// Clic en dehors de la barre : referme les menus déroulants ouverts (Saisie, Performance) pour ne pas gêner.
// Phase capture : on teste la cible avant que renderNav ne reconstruise la barre.
document.addEventListener('click',e=>{if(!UI.entryOpen&&!UI.perfOpen)return;if(e.target.closest&&e.target.closest('#nav'))return;UI.entryOpen=false;UI.perfOpen=false;renderNav();},true);
document.addEventListener('change',e=>{const t=e.target;if(t.id==='refDate'){UI.ref=t.value||TODAY;render();return;}if(t.dataset&&t.dataset.chg&&CHG[t.dataset.chg])CHG[t.dataset.chg](t);});
document.addEventListener('input',e=>{const t=e.target;if(t.closest('form'))formDirty=true;if(t.dataset&&t.dataset.fill){const k=t.dataset.fill;const form=t.closest('form');$$('#grid tr',form).forEach(tr=>{const on=tr.querySelector('input[name^="on-"]');const inp=tr.querySelector(`input[name^="${k}-"]`);if(on&&on.checked&&inp)inp.value=t.value;});}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();formDirty=false;const h=FORMS[f.dataset.form];if(h)h(f,e.submitter);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(UI.spMicro!=null){UI.spMicro=null;renderDrawer();document.body.style.overflow='';return;}if(UI.drawer||UI.fill){if(UI.fill){UI.fill=null;renderDrawer();document.body.style.overflow='';reloadData();}else{UI.drawer=null;renderDrawer();}}}});
// Fermeture du cadre de saisie staff demandée depuis l'intérieur (bouton « ← Retour »).
window.addEventListener('message',e=>{if(e&&e.data==='blueperf-close-fill'&&UI.fill&&ACT.closeFill)ACT.closeFill();});
boot();
/* Rechargement pour récupérer les dernières données (RPE/charges saisis par les joueur·ses, etc.).
   On évite de recharger pendant une saisie en cours (formulaire modifié). */
(function(){
  const boot=document.getElementById('boot');
  const hideLoad=()=>{if(boot)boot.classList.add('hidden');const sp=document.getElementById('splash');if(sp)sp.classList.add('hidden');};
  // Masque le voile + le squelette de chargement dès que la navigation est rendue.
  if(boot){const nav=document.getElementById('nav');const done=()=>{if(nav&&nav.children.length){hideLoad();if(obs)obs.disconnect();}};const obs=new MutationObserver(done);if(nav)obs.observe(nav,{childList:true});done();setTimeout(hideLoad,9000);}
  const safe=()=>!(typeof formDirty!=='undefined'&&formDirty);
  // Rafraîchissement DOUX : les données sont déjà rechargées en continu (polling toutes les 8 s) ;
  // au retour sur l'onglet on ré-affiche par-dessus l'interface (voile semi-transparent), sans page blanche.
  let lastRefresh=Date.now();
  function softRefresh(){ if(document.hidden||!safe())return; if(boot){boot.classList.remove('solid');boot.classList.remove('hidden');} try{render();}catch(e){} if(boot)setTimeout(()=>boot.classList.add('hidden'),350); lastRefresh=Date.now(); const f=document.getElementById('reloadfab'); if(f)f.style.display='none'; }
  // Bouton flottant « Recharger » quand la page reste ouverte longtemps — recharge toutes les données.
  const fab=document.createElement('button'); fab.id='reloadfab'; fab.type='button'; fab.textContent='🔄 Recharger';
  fab.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:100001;display:none;background:var(--accent);color:var(--accent-ink);border:0;border-radius:22px;padding:11px 20px;font-family:inherit;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer';
  fab.onclick=async()=>{ fab.style.display='none'; try{ if(typeof reloadData==='function'){await reloadData();} else {location.reload();return;} }catch(e){ location.reload(); return; } lastRefresh=Date.now(); };
  function maybeShowFab(){ if(document.hidden||document.getElementById('updbar')||(typeof formDirty!=='undefined'&&formDirty))return; if(Date.now()-lastRefresh>20*60*1000){ if(!fab.isConnected)document.body.appendChild(fab); fab.style.display='block'; } }
  let PAGE_TAG=null;
  async function checkVersion(){ try{ const r=await fetch(location.pathname+'?v='+Date.now(),{method:'HEAD',cache:'no-store'}); const et=r.headers.get('etag')||r.headers.get('last-modified'); if(et){ if(PAGE_TAG&&et!==PAGE_TAG)showUpdateBanner(); PAGE_TAG=et; } }catch(e){} }
  function showUpdateBanner(){ if(document.getElementById('updbar'))return; const d=document.createElement('div'); d.id='updbar'; d.innerHTML='🔄 Une nouvelle version est disponible. <button>Recharger</button>'; document.body.appendChild(d); d.querySelector('button').onclick=()=>{if(boot){boot.classList.add('solid');boot.classList.remove('hidden');}location.reload();}; }
  checkVersion();
  let hiddenAt=0;
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)hiddenAt=Date.now();
    else if(hiddenAt&&Date.now()-hiddenAt>15000){ checkVersion(); softRefresh(); }
  });
  setInterval(()=>{ if(!document.hidden){ checkVersion(); maybeShowFab(); } },90000);
})();
</script>
