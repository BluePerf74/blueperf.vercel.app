<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
/* Thème partagé avec l'app principale (même origine) : lit bp_theme et se met à jour en direct. */
(function(){function a(){var p=null;try{p=localStorage.getItem('bp_theme')}catch(e){}var r=document.documentElement;if(p==='light'||p==='dark')r.setAttribute('data-theme',p);else r.removeAttribute('data-theme');}a();try{window.addEventListener('storage',function(e){if(!e||e.key==='bp_theme'||e.key===null)a();});}catch(e){}})();
</script>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<script src="/i18n-dict.js?v=2" defer></script>
<script src="/i18n-dom.js?v=2" defer></script>
<link rel="stylesheet" href="/ui-polish.css?v=1">
<title>Elite Adapt — Académie</title>
<link rel="icon" href="/elite-adapt-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=ea3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EFF2F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --line:#DCE2EA; --line-2:#C9D1DD;
  --ink:#0E1A2C; --ink-2:#3B495D; --muted:#667386;
  --accent:#1B46C9; --accent-ink:#FFFFFF; --accent-soft:#E4EBFB;
  --s2:#0C8A8A; --s3:#8A5CC7;
  --good:#1D8752; --good-soft:#DDF1E5; --warn:#B7760A; --warn-soft:#FBEFD6; --crit:#C23A2E; --crit-soft:#F9E0DD;
  --nav:#0E1A2C; --nav-ink:#C7D1E0; --nav-ink-2:#8190A6; --nav-active:#1B2B45;
  --shadow:0 1px 2px rgba(14,26,44,.06),0 4px 14px rgba(14,26,44,.05);
  --fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#090E16; --surface:#111925; --surface-2:#0D141E; --line:#213046; --line-2:#2D3F58;
    --ink:#E6ECF4; --ink-2:#B6C1D0; --muted:#8392A7;
    --accent:#7B9BFF; --accent-ink:#08101E; --accent-soft:#18264A;
    --s2:#3CC4C0; --s3:#B792F0;
    --good:#43C283; --good-soft:#12301F; --warn:#E3AA3E; --warn-soft:#33260C; --crit:#F16B5E; --crit-soft:#3A1714;
    --nav:#060A10; --nav-ink:#B9C4D4; --nav-ink-2:#6F7E94; --nav-active:#15213A;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#090E16; --surface:#111925; --surface-2:#0D141E; --line:#213046; --line-2:#2D3F58;
  --ink:#E6ECF4; --ink-2:#B6C1D0; --muted:#8392A7;
  --accent:#7B9BFF; --accent-ink:#08101E; --accent-soft:#18264A;
  --s2:#3CC4C0; --s3:#B792F0;
  --good:#43C283; --good-soft:#12301F; --warn:#E3AA3E; --warn-soft:#33260C; --crit:#F16B5E; --crit-soft:#3A1714;
  --nav:#060A10; --nav-ink:#B9C4D4; --nav-ink-2:#6F7E94; --nav-active:#15213A;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:block;min-height:100%}
/* NAV — barre horizontale en haut */
.nav{background:var(--nav);color:var(--nav-ink);padding:8px 14px;position:sticky;top:0;z-index:30;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 10px}
.brand{padding:0 12px 0 0;margin-right:4px;flex:none;display:flex;align-items:center;gap:8px;line-height:1}
.brand .mark{height:24px;width:auto;flex:none}
.brand b.wm,.brand b.ad{font-family:var(--fd);font-size:18px;letter-spacing:.02em;line-height:1;white-space:nowrap;display:inline}
.brand b.wm{color:#fff}
.brand b.ad{color:#ff9a8b;margin-left:4px}
.brand span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--nav-ink-2);border-left:1px solid rgba(255,255,255,.18);padding-left:8px;margin-left:4px}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:row;flex-wrap:wrap;gap:2px 3px;align-items:center}
.nav li{position:relative;flex:none}
.nav button.ni{width:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;background:none;border:0;color:var(--nav-ink);padding:8px 11px;border-radius:7px;cursor:pointer;text-align:left;font-weight:500;white-space:nowrap}
.nav button.ni:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.ni.on{background:var(--nav-active);color:#fff;box-shadow:inset 0 -3px 0 #6E8FFF}
.nav .sub{position:absolute;top:100%;left:0;margin-top:4px;background:var(--nav);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:6px;min-width:170px;box-shadow:0 10px 26px rgba(0,0,0,.5);z-index:40;display:flex;flex-direction:column}
.nav .sub button.ni{font-size:13px;padding:7px 10px;width:100%}
.nav .chev{font-size:10px;opacity:.7;transition:transform .15s}
.nav .open .chev{transform:rotate(90deg)}
.badge{font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;border-radius:20px;background:rgba(255,255,255,.1)}
.badge.crit{background:#C23A2E;color:#fff}
.badge.warn{background:#B7760A;color:#fff}
.navfoot{margin-left:auto;font-size:11px;color:var(--nav-ink-2);padding:4px 8px;white-space:nowrap;flex:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.ok{background:#43C283}.dot.loc{background:#E3AA3E}
/* MAIN */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:static;background:transparent;border-bottom:1px solid var(--line);padding-block:12px;padding-inline:24px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.top h1{font-family:var(--fd);font-weight:700;font-size:28px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.top .ctx{font-size:12px;color:var(--muted);margin-top:3px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.content{padding-block:20px 60px;padding-inline:24px;display:flex;flex-direction:column;gap:18px;max-width:1500px;width:100%}
.banner{border:1px solid var(--line-2);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.banner p{margin:0;max-width:75ch}
/* CARDS & GRID */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card h2,.card h3{margin:0 0 10px;font-family:var(--fd);font-weight:600;letter-spacing:.01em}
.card h2{font-size:20px}
.card h3{font-size:17px}
.hrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 12px;margin-bottom:10px}
.hrow h2,.hrow h3{margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--fd);font-size:34px;font-weight:700;line-height:1.05}
.kpi .v small{font-size:16px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--accent),var(--s3));opacity:.85}
/* AVATARS */
.avatar{display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-family:var(--fd);font-weight:700;border-radius:50%;background-size:cover;background-position:center;width:34px;height:34px;font-size:14px;line-height:1;flex:none;overflow:hidden;border:1px solid var(--line);vertical-align:middle}
.avatar.xs{width:26px;height:26px;font-size:11px}
.avatar.lg{width:76px;height:76px;font-size:28px}
.avatar.xl{width:104px;height:104px;font-size:38px;border-radius:22px}
.nmcell{display:inline-flex;align-items:center;gap:9px}
/* PROFILE HEADER (fiche joueur) */
.pfhead{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pfhead::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);opacity:.6;pointer-events:none}
.pfhead .pfmeta{flex:1;min-width:0;z-index:1}
.pfhead h2{margin:0;font-family:var(--fd);font-size:34px;line-height:1;letter-spacing:.01em}
.pfhead .pfsub{font-size:12.5px;color:var(--muted);margin-top:5px}
.pftags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pftags .pill{font-size:11.5px}
/* GPS / stat tiles réutilisables */
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-width:0}
.stat .sv{font-family:var(--fd);font-size:25px;font-weight:700;line-height:1}
.stat .sv small{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
.stat .sl{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.03em}
.stat .sd{font-size:11px;margin-top:3px;font-weight:600}
.pf-list{margin:5px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.pf-list li{position:relative;padding:7px 10px 7px 26px;border-radius:8px;font-size:13px;background:var(--surface-2);border:1px solid var(--line)}
.pf-list li::before{position:absolute;left:9px;top:7px;font-weight:700}
.pf-list.good li{background:var(--good-soft);border-color:transparent;color:var(--ink)}
.pf-list.good li::before{content:"✓";color:var(--good)}
.pf-list.warn li{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.pf-list.warn li::before{content:"▸";color:var(--warn)}
.sect-head{margin:4px 0 -6px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.sect-title{margin:0;font-family:var(--fd);font-size:19px;font-weight:600}
/* CALENDRIER DES SÉANCES */
.cal2{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cal2-row{display:grid;align-items:stretch;border-bottom:1px solid var(--line);position:relative;min-width:max-content}
.cal2-row:last-child{border-bottom:0}
.cal2-head{position:sticky;top:0;z-index:4;background:var(--surface-2)}
.cal2-th{padding:8px 6px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;border-left:1px solid var(--line)}
.cal2-th.today{color:var(--accent);background:var(--accent-soft)}
.cal2-th2{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.cal2-name{padding:9px 11px;position:sticky;left:0;z-index:2;background:var(--surface);display:flex;gap:9px;align-items:center;border-right:1px solid var(--line-2)}
.cal2-head .cal2-name{background:var(--surface-2)}
.cal2-cell{padding:6px;border-left:1px solid var(--line);min-height:66px;display:flex;flex-direction:column}
.cal2-inner{flex:1;display:flex;flex-direction:column;gap:3px;justify-content:center}
.cal2-load{height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden;margin-top:5px}
.cal2-load i{display:block;height:100%;border-radius:3px}
.cal2-tag{font-size:11px;font-weight:700;text-align:center}
.cal2-chip{font-size:10px;font-weight:700;padding:3px 5px;border-radius:5px;background:var(--surface);border:1px solid var(--line-2);text-align:center;line-height:1.15;letter-spacing:.02em;color:var(--ink-2)}
.cal2-chip.val{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.cal2-chip.inval{border-color:var(--crit);color:var(--crit);box-shadow:inset 3px 0 0 var(--crit)}
.cal2-chip.plan{border-style:dashed;color:var(--accent);border-color:var(--accent);background:transparent}
.cal2-dash{color:var(--muted);text-align:center}
.st-done{background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.st-rest{background:var(--surface-2)}
.st-inj{background:color-mix(in srgb,var(--crit) 16%,var(--surface))}
.st-ill{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.st-rea{background:color-mix(in srgb,var(--s3) 16%,var(--surface))}
.st-plan{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.st-abs{background:color-mix(in srgb,var(--crit) 8%,var(--surface))}
.st-empty{background:var(--surface)}
.cal2-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.cal2-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* SAISIE DE SÉANCE GUIDÉE (coaching) */
.ns-wrap{max-width:780px;display:flex;flex-direction:column;gap:14px}
.ns-step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.ns-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ns-num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-family:var(--fd);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.ns-head h3{margin:0;font-size:17px}
.ns-hint{font-size:12px;color:var(--muted);margin-left:auto}
.ns-sub{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 7px}
.ns-chips{display:flex;flex-wrap:wrap;gap:8px}
.ns-client{display:inline-flex;align-items:center;gap:7px;padding:5px 13px 5px 5px;border:1.5px solid var(--line-2);border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;transition:border-color .12s,background .12s,color .12s;background:var(--surface)}
.ns-client input{display:none}
.ns-client:hover{border-color:var(--accent)}
.ns-client:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ns-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
.ns-type{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1.5px solid var(--line-2);border-radius:13px;cursor:pointer;text-align:center;font-weight:600;font-size:12.5px;transition:border-color .12s,background .12s,color .12s}
.ns-type input{display:none}
.ns-type:hover{border-color:var(--accent)}
.ns-type:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ns-ico{font-size:26px;line-height:1}
.ns-pill{display:inline-flex;align-items:center;gap:4px;padding:9px 15px;border:1.5px solid var(--line-2);border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.ns-pill input[type=radio]{display:none}
.ns-pill:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ns-dcustom{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.ns-dcustom input{width:72px}
.ns-seg2{display:inline-flex;flex-wrap:wrap;gap:6px}
.ns-segbtn{padding:9px 15px;border:1.5px solid var(--line-2);border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}
.ns-segbtn input{display:none}
.ns-segbtn:has(input:checked){border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.ns-mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ns-modeopt{display:flex;gap:10px;padding:13px;border:1.5px solid var(--line-2);border-radius:12px;cursor:pointer}
.ns-modeopt input{margin-top:3px;flex:none}
.ns-modeopt b{display:block;font-size:13.5px;margin-bottom:3px}
.ns-modeopt span{font-size:11.5px;color:var(--muted);line-height:1.35}
.ns-modeopt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.ns-rpe{max-height:0;overflow:hidden;opacity:0;transition:max-height .2s,opacity .2s}
.ns-mode:has(input[value="coach"]:checked) ~ .ns-rpe{max-height:200px;opacity:1;margin-top:12px}
.ns-rpescale{display:flex;flex-wrap:wrap;gap:6px}
.ns-rpebtn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line-2);border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}
.ns-rpebtn input{display:none}
.ns-rpebtn:has(input:checked){border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.ns-save{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:2px 0 4px}
.ns-editbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:9px 14px;font-weight:600;font-size:13.5px}
.ns-save .btn.pri{font-size:15px;padding:12px 24px}
@media(max-width:560px){.ns-mode{grid-template-columns:1fr}}
/* transitions / polish */
.card{transition:box-shadow .16s,border-color .16s,transform .16s}
.btn{transition:border-color .14s,color .14s,background .14s,box-shadow .14s}
.seg button{transition:background .14s,color .14s}
.nav button.ni{transition:background .14s,color .14s}
.plink{transition:color .12s}
.muted{color:var(--muted)}
.small{font-size:12px}
.note{font-size:12px;color:var(--muted);max-width:80ch}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sb{justify-content:space-between}
/* PILLS */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.pill .ic{width:7px;height:7px;border-radius:50%;background:currentColor}
/* TABLES */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.wrap{white-space:normal;min-width:220px}
.plink{background:none;border:0;padding:0;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.plink:hover{color:var(--accent);text-decoration-color:var(--accent)}
.hm td.c{text-align:center;font-size:12px;font-weight:600;min-width:38px;padding:5px 4px}
/* FORMS */

function makeApiDb(){
  const cache={},listeners={},timers={},queue={},pending={},failed={};let retryTimer=null;
  // Résilience hors-ligne : une écriture qui échoue (réseau coupé) est ré-essayée automatiquement.
  // save() renvoie TOUJOURS l'instantané complet de la collection → le ré-essai est idempotent (aucun risque de doublon).
  function updateSyncUI(){try{Store.syncPending=Object.keys(failed).filter(c=>failed[c]).length;renderNavFoot();}catch(e){}}
  function scheduleRetry(){if(retryTimer)return;retryTimer=setInterval(()=>{const cols=Object.keys(failed).filter(c=>failed[c]);if(!cols.length){clearInterval(retryTimer);retryTimer=null;return;}cols.forEach(c=>save(c));},10000);}
  async function fetchCol(col){
    try{const r=await fetch('/api/storage?action=get&key='+encodeURIComponent(DB_PREFIX+':'+col)+'&_='+Date.now(),{cache:'no-store'});
      if(!r.ok)return null;const j=await r.json();return j&&j.value?JSON.parse(j.value):{};}catch(e){return null;}
  }
  function emit(col){const map=cache[col]||{};const docs=Object.keys(map).map(id=>({id,data:()=>map[id]}));(listeners[col]||[]).forEach(cb=>{try{cb({docs});}catch(e){}});}
  function save(col){
    pending[col]=(pending[col]||0)+1;
    queue[col]=(queue[col]||Promise.resolve()).then(async()=>{
      let ok=false;
      try{const r=await fetch('/api/storage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set',key:DB_PREFIX+':'+col,value:JSON.stringify(cache[col]||{})})});ok=!!(r&&r.ok);}catch(e){ok=false;}
      failed[col]=!ok;if(!ok)scheduleRetry();
      pending[col]=Math.max(0,(pending[col]||1)-1);
      updateSyncUI();
    });
    return queue[col];
  }
  async function poll(col){if(pending[col])return;const m=await fetchCol(col);if(m&&!pending[col]){cache[col]=m;emit(col);}}
  return {collection(col){return {
    onSnapshot(cb,err){(listeners[col]=listeners[col]||[]).push(cb);
      fetchCol(col).then(m=>{cache[col]=m||{};emit(col);}).catch(e=>{if(err)err(e);});
      if(!timers[col])timers[col]=setInterval(()=>poll(col),8000);
      return ()=>{};},
    doc(id){return {
      set(obj){cache[col]=cache[col]||{};cache[col][id]=obj;emit(col);return save(col);},
      delete(){cache[col]=cache[col]||{};delete cache[col][id];emit(col);return save(col);}
    };}
  };}};
}
function makeSample(){
  return async function(prompt,opts){
    opts=opts||{};
    let r;
    try{r=await fetch('/api/reco',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt}),signal:opts.signal});}
    catch(e){if(e&&e.name==='AbortError'){const a=new Error('cancelled');a.code='cancelled';throw a;}const x=new Error('reco');x.code='error';throw x;}
    if(!r.ok){let code='error';try{const j=await r.json();code=j.code||code;}catch(e){}
      if(r.status===429)code='rate_limited';const err=new Error('reco '+r.status);err.code=code;throw err;}
    const j=await r.json();const text=j.text||'';
    if(opts.onText){try{opts.onText({text});}catch(e){}}
    return {text,truncated:!!j.truncated};
  };
}
function makeDownloads(){
  return {save:async({filename,data})=>{
    const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }};
}

  Store.db=db;Store.mode='db';
  const fresh=empty();Store.fresh=fresh;const pending=new Set(COLS);
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});fresh[col]=o;
      if(pending.has(col)){pending.delete(col);if(!pending.size)firstLoad();}

const pday=(pid,d)=>(IDX[pid]&&IDX[pid].days[d])||null;

   k1=1, k2=2, τ1=45 j (fitness/aptitude), τ2=15 j (fatigue). Réponse impulsionnelle récursive.

function fitnessFatigue(pid,end,show){
  const tau1=45,tau2=15,k1=1,k2=2,look=150;

function activeInjury(pid,ref){return Object.values(DATA.injuries).filter(i=>i.pid===pid&&i.date<=ref&&i.status!=='apte').sort((a,b)=>b.date.localeCompare(a.date))[0]||null;}

  if(w.today!=null){if(w.today<th.well)up(3,'Wellness '+r0(w.today)+' %');else if(w.z!=null&&w.z<th.wz*1.6)up(3,'Wellness très bas vs habitude (z '+r1(w.z)+')');else if(w.z!=null&&w.z<th.wz)up(2,'Wellness sous son habitude (z '+r1(w.z)+')');}

  const injP={};Object.values(DATA.injuries).forEach(i=>{(injP[i.pid]=injP[i.pid]||[]).push(i);});
  const isIll=i=>/malad|grippe|angine|virus|gastro|fi[eè]vre|rhume/i.test(((i&&i.type)||'')+' '+((i&&i.zone)||''));
  const injOn=(pid,d)=>(injP[pid]||[]).filter(i=>i.date<=d&&(i.returnDate?d<=i.returnDate:(i.status!=='apte'))).sort((a,b)=>b.date.localeCompare(a.date))[0]||null;

  let maxCharge=1;if(curve==='charge')roster.forEach(p=>days.forEach(d=>{const x=pday(p.id,d);if(x&&x.load>maxCharge)maxCharge=x.load;}));
  const loadBar=(p,d)=>{if(curve==='off')return '';const x=pday(p.id,d);const v=curve==='charge'?(x?x.load:0):wOf(p.id,d);if(v==null||v<=0)return '';const mx=curve==='charge'?maxCharge:100;const frac=Math.max(0,Math.min(1,v/mx));const pct=Math.round(Math.max(4,frac*100));let col,lvl;

      else{const evs=byPD[p.id+'|'+d]||[];
        if(evs.length){cls=future?'st-plan':'st-done';inner=evs.map(e=>{let vc='';if(!e._m&&!future){const pl=e.players[p.id];if(pl&&(pl.rpe!=null||(pl.partRpe&&Object.keys(pl.partRpe).length)))vc=' val';else if(dayDiff(ref,d)>2)vc=' inval';}const note=(e.content||e.report)?' 📄':'';return `<span class="cal2-chip${vc}">${esc((e.title||e.type||'Séance').toUpperCase())}${note}</span>`;}).join('');}

  const legend=`<div class="cal2-legend">${[['Entraîné','var(--good)'],['Repos','var(--muted)'],['Blessure','var(--crit)'],['Réathlé','var(--s3)'],['Malade','var(--warn)'],['Absent','#8a93a6'],['Planifiée','var(--accent)'],['Validée (RPE saisi)','var(--good)'],['Non validée > 48 h','var(--crit)']].map(([l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`;
  const barLegend=curve==='off'?'':`<div class="cal2-legend" style="margin:8px 0 0">${(curve==='charge'?[['Charge légère','var(--good)'],['Modérée','#d99a00'],['Élevée','#e8792b'],['Très élevée','var(--crit)']]:[['Wellness bon','var(--good)'],['Moyen','#d99a00'],['Bas','var(--crit)']]).map(([l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}<span class="muted">← barre en bas de chaque case</span></div>`;

/* ===================== ÉVALUATION DE LA CHARGE D'ENTRAÎNEMENT =====================
   D'après le cours « Training Work Load » : CE = durée × RPE (Foster, CR-10),
   Monotonie & Contrainte (Foster 1998), ACWR aiguë/chronique (Gabbett 2016),
   modèle Fitness-Fatigue (Banister). */
function acwrZone(a){return a==null?null:a<0.8?['Sous-charge','warn','Charge en baisse — risque de désentraînement si prolongé.']:a<=1.3?['Zone optimale','good','« Sweet spot » : progression maîtrisée (Gabbett).']:a<=1.5?['À surveiller','warn','Montée de charge marquée — surveiller la récupération.']:['Risque élevé','crit','Pic de charge aiguë — risque de blessure nettement accru.'];}
VIEWS.charge=()=>{
  const roster=playersOf(UI.cat,true);if(!roster.length)return emptyPlayers();
  let pid=UI.chargePid;if(!pid||!DATA.players[pid]||!roster.some(x=>x.id===pid))pid=roster[0].id;
  const p=DATA.players[pid];const ref=UI.ref;const th=S().th;
  const idx=roster.findIndex(x=>x.id===pid);
  const days=range(addDays(ref,-41),ref);
  const lv=days.map(d=>{const x=pday(pid,d);return x?x.load:0;});
  const isSess=days.map(d=>{const x=pday(pid,d);return x&&x.n>0;});
  const acR=days.map(d=>ewma(pid,d).acwr);
  const w=weekStats(pid,ref);const e=ewma(pid,ref);
  const ff=fitnessFatigue(pid,ref,42);
  const az=acwrZone(e.acwr);const monoHi=w.mono!=null&&w.mono>th.monotony;
  const cur=ff[ff.length-1],prevP=ff.length>7?ff[ff.length-8]:null;const formTrend=cur&&prevP?cur.perf-prevP.perf:null;
  const sel=`<div class="row" style="gap:8px;align-items:center;flex-wrap:nowrap">
    <button class="btn sm" data-act="chargeNav" data-d="-1" ${idx<=0?'disabled':''}>‹</button>
    <select data-chg="chargePid" style="width:auto;max-width:260px;font-weight:600">${roster.map(x=>`<option value="${esc(x.id)}" ${x.id===pid?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <button class="btn sm" data-act="chargeNav" data-d="1" ${idx>=roster.length-1?'disabled':''}>›</button></div>`;
  const kpis=`<div class="grid g4">
    ${kpi('Charge 7 j (sRPE)',r0(w.sum),'UA',w.chg!=null?(w.chg>0?'+':'')+r0(w.chg)+' % vs 3 sem.':'Durée × RPE')}
    ${kpi('Monotonie',w.mono!=null?r2(w.mono):'–','',`Variabilité des charges · cible < ${th.monotony}`,monoHi?'warn':null)}
    ${kpi('Contrainte (strain)',w.strain!=null?r0(w.strain):'–','','Charge hebdo × monotonie (Foster)')}
    ${kpi('ACWR',e.acwr!=null?r2(e.acwr):'–','',az?az[0]:'Aiguë / chronique',az?(az[1]==='good'?null:az[1]):null)}</div>`;
  const dailyCard=`<div class="card"><div class="hrow"><h3>Charge quotidienne (sRPE, 42 j)</h3><span class="small muted">CE = durée × RPE</span></div>
    ${barChart({labels:days,values:lv,colors:isSess.map(m=>m?'var(--accent)':'var(--line-2)'),unit:'UA',h:150})}<p class="note">Chaque barre = la charge d'une journée (RPE ressenti × minutes). Alterner jours durs et jours légers limite la monotonie.</p></div>`;
  const acwrCard=`<div class="card"><div class="hrow"><h3>ACWR — charge aiguë / chronique</h3>${az?`<span class="pill ${az[1]}">${az[0]}</span>`:''}</div>
    ${lineChart({labels:days,series:[{name:'ACWR',values:acR,color:'var(--accent)'}],band:[th.acwrLo,th.acwrHi],refs:[{v:1.5,label:'Risque',color:'var(--crit)'}],h:160,fmt:v=>r2(v),yMin:0})}<p class="note">Zone verte ${r1(th.acwrLo)}–${r1(th.acwrHi)} = « sweet spot » (Gabbett 2016). Au-delà de 1,5 : risque de blessure accru.</p></div>`;
  const ffCard=`<div class="card"><div class="hrow"><h3>Modèle Fitness–Fatigue (Banister)</h3><span class="small muted">τ₁=45 j · τ₂=15 j</span></div>
    ${lineChart({labels:ff.map(x=>x.date),series:[{name:'Aptitude (fitness)',values:ff.map(x=>x.fit),color:'var(--good)'},{name:'Fatigue',values:ff.map(x=>x.fat),color:'var(--crit)'},{name:'Forme (perf. modélisée)',values:ff.map(x=>x.perf),color:'var(--accent)',dots:true}],h:170,fmt:v=>r0(v)})}
    <p class="note">La <b>forme</b> = aptitude − 2×fatigue. Quand la fatigue (court terme) retombe après une charge, la forme remonte : c'est l'<b>affûtage</b>.</p></div>`;
  // interprétation
  const notes=[];
  if(az)notes.push(`<div class="row sb"><span><b>ACWR ${e.acwr!=null?r2(e.acwr):'–'}</b> — ${az[0]}</span><span class="pill ${az[1]}">${az[1]==='good'?'OK':'!'}</span></div><p class="small muted" style="margin:2px 0 10px">${az[2]}</p>`);
  if(monoHi)notes.push(`<div class="row sb"><span><b>Monotonie ${r2(w.mono)}</b> — trop uniforme</span><span class="pill warn">!</span></div><p class="small muted" style="margin:2px 0 10px">Monotonie élevée + contrainte élevée = plus de risque de maladie/surmenage (Foster). Ajoute une séance nettement plus légère (RPE ≤ 3) et une séance clé plus intense.</p>`);
  if(w.chg!=null&&Math.abs(w.chg)>th.weekChg)notes.push(`<div class="row sb"><span><b>Variation hebdo ${w.chg>0?'+':''}${r0(w.chg)} %</b></span><span class="pill ${Math.abs(w.chg)>25?'crit':'warn'}">!</span></div><p class="small muted" style="margin:2px 0 10px">Variation de charge d'une semaine à l'autre élevée (> ${th.weekChg} %) : progresser par paliers (~10 %/semaine) sécurise l'adaptation.</p>`);
  if(formTrend!=null)notes.push(`<div class="row sb"><span><b>Forme (modèle)</b> ${formTrend>=0?'en hausse ↗':'en baisse ↘'}</span><span class="pill ${formTrend>=0?'good':'warn'}">${formTrend>=0?'↗':'↘'}</span></div><p class="small muted" style="margin:2px 0 6px">${formTrend>=0?'La fatigue retombe plus vite que l\'aptitude : bon moment pour une échéance.':'La fatigue domine encore : prévoir de la récupération avant une échéance importante.'}</p>`);
  const interp=`<div class="card"><h3>Lecture & recommandations</h3>${notes.join('')||'<p class="muted small" style="margin:0">Pas assez de données pour évaluer la charge. Enregistre des séances avec RPE et durée.</p>'}</div>`;
  const refs=`<div class="card flat"><div class="small muted" style="line-height:1.6"><b>Méthode (références du cours) :</b> CE = durée × RPE, échelle CR-10 (Foster 1998, 2001) · Monotonie & Contrainte (Foster 1998) · ACWR aiguë:chronique & « sweet spot » (Gabbett 2016 ; Blanch & Gabbett 2016) · Charge interne vs externe (Impellizzeri 2004, 2019) · Modèle Fitness-Fatigue (Banister ; Clarke & Skiba 2013).</div></div>`;
  const header=`<div class="sect-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h2 class="sect-title">📈 Évaluation de la charge — ${esc(p.name)}</h2>${sel}</div>`;
  return `${header}${kpis}<div class="grid g2">${dailyCard}${acwrCard}</div>${ffCard}${interp}${refs}`;
};

/* ===================== RÉCUPÉRATION ===================== */
VIEWS.recovery=()=>{
  const ps=playersOf(UI.cat);if(!ps.length)return emptyPlayers();const ref=UI.ref;const th=S().th;
  const rows=ps.map(p=>{const s=playerStatus(p,ref);const w=weekStats(p.id,ref);const e=ewma(p.id,ref);
    let prio=0;const reasons=[];
    if(s.inj){prio+=3;reasons.push('🩹 '+(s.inj.zone||'blessure'));}
    if(e.acwr!=null&&e.acwr>1.3){prio+=2;reasons.push('ACWR '+r2(e.acwr));}
    if(s.w&&s.w.today!=null&&s.w.today<th.well){prio+=2;reasons.push('forme '+r0(s.w.today)+'%');}
    if(w.mono!=null&&w.mono>th.monotony){prio+=1;reasons.push('monotonie '+r2(w.mono));}
    return {p,prio,reasons};}).filter(r=>r.prio>0).sort((a,b)=>b.prio-a.prio);
  const prioCard=`<div class="card"><div class="hrow"><h2>🧊 Priorité récupération</h2><span class="small muted">${PL.Many} à surveiller aujourd'hui</span></div>
    ${rows.length?`<div class="stack" style="gap:8px">${rows.map(r=>`<div class="row sb" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px"><span><b>${esc(r.p.name)}</b> <span class="small muted">${r.reasons.join(' · ')}</span></span><span class="pill ${r.prio>=4?'crit':'warn'}">${r.prio>=4?'Récup. prioritaire':'À alléger'}</span></div>`).join('')}</div>`:'<p class="muted small" style="margin:0">Aucune alerte : charges et formes dans le vert. 👍</p>'}</div>`;
  const protocols=[['😴 Sommeil','7–9 h, horaires réguliers. Le premier levier de récupération.'],['💧 Hydratation','Réhydrater ~150 % des pertes (peser avant/après si possible), ajouter du sodium après une grosse séance.'],['🍽️ Nutrition post-effort','Glucides + protéines dans les 30–60 min (ratio ~3:1) pour reconstituer le glycogène.'],['🧊 Froid / contrastes','Immersion froide 10–15 °C, 10–15 min après un match intense.'],['🚴 Récupération active','20–30 min à faible intensité (vélo, mobilité) le lendemain d\'un match.'],['🧘 Charge mentale','Alterner jours durs / faciles, limiter la monotonie, prévoir des coupures.']];
  const proCard=`<div class="card"><div class="hrow"><h2>Protocoles de récupération</h2></div><div class="grid g2">${protocols.map(([t,d])=>`<div class="card flat"><b>${t}</b><p class="small muted" style="margin:6px 0 0">${d}</p></div>`).join('')}</div></div>`;
  return prioCard+proCard;
};

const CHART_LEG=INDIV?[['Séance',COL_TR],['Compétition',COL_MATCH]]:[['Entraînement',COL_TR],['Match',COL_MATCH]];
function emptyPlayers(){return `<div class="card"><h2>${INDIV?'Aucun·e client·e':'Aucun joueur'+(UI.cat!=='Tous'?' en '+esc(UI.cat):'')}</h2><p class="muted">${INDIV?'Ajoute tes client·es pour que les tableaux se remplissent.':'Ajoute ton effectif pour que les tableaux se remplissent.'}</p><button class="btn pri" data-act="goEntry" data-id="player">${INDIV?'Ajouter des client·es':'Ajouter des joueurs'}</button></div>`;}
function kpi(label,v,unit,d,cls){return `<div class="card kpi"><div class="eyebrow">${label}</div><div class="v" ${cls?`style="color:var(--${cls})"`:''}>${v}${unit?`<small>${unit}</small>`:''}</div>${d?`<div class="d">${d}</div>`:''}</div>`;}
function teamDaily(ps,end,n,key='load'){const labels=[],vals=[],isM=[];for(let i=n-1;i>=0;i--){const d=addDays(end,-i);labels.push(d);const v=ps.map(p=>pday(p.id,d)).filter(x=>x&&x[key]>0);vals.push(v.length?mean(v.map(x=>x[key])):0);isM.push(v.some(x=>x.match));}return{labels,vals,isM};}
function teamWell(ps,end,n,key){const labels=[],vals=[];for(let i=n-1;i>=0;i--){const d=addDays(end,-i);labels.push(d);const v=ps.map(p=>{const e=wEntry(p.id,d);return key?num(e&&e[key]):wScore(e);}).filter(x=>x!=null);vals.push(v.length?mean(v):null);}return{labels,vals};}
function chgTxt(c){if(c==null)return 'Pas encore d’historique';const s=(c>0?'+':'')+r0(c)+' % vs moyenne des 3 semaines précédentes';return s;}

VIEWS.overview=()=>{

    <h3 style="margin:14px 0 6px">Check-in wellness du jour non rempli${wellMiss.length?' ('+wellMiss.length+')':''}</h3>
    ${wellMiss.length?`<div>${wellMiss.map(p=>`<button class="btn sm" data-act="fillPlayer" data-id="${esc(p.id)}" data-tab="sante" style="margin:0 8px 8px 0">${esc(p.name)} →</button>`).join('')}</div>`:'<p class="muted" style="margin:0">Tout le monde a rempli son wellness du jour ✅</p>'}

    .filter(x=>inCat(x.e)&&x.e.players&&x.e.date<=ref&&x.e.date>=addDays(ref,-21))
    .map(x=>{const assigned=Object.keys(x.e.players).filter(pid=>DATA.players[pid]);const miss=assigned.filter(pid=>{const pl=x.e.players[pid];return pl&&pl.rpe==null&&!(pl.partRpe&&Object.keys(pl.partRpe).length);});return {col:x.col,id:x.e.id,date:x.e.date,title:x.e.title||x.e.type||'Séance',cat:x.e.cat,names:miss.map(pid=>DATA.players[pid].name)};})
    .filter(x=>x.names.length>0).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  const rpeMissCard=`<div class="card"><div class="hrow"><h2>RPE à compléter</h2><span class="small muted">séances & matchs des 21 derniers jours</span></div>
    ${rpeMiss.length?`<div class="tw"><table><thead><tr><th>Date</th><th>${INDIV?'Séance':'Séance / match'}</th><th>RPE manquants</th><th></th></tr></thead><tbody>
      ${rpeMiss.map(x=>`<tr><td>${fmtD(x.date)}</td><td>${esc(x.title)}${(!INDIV&&UI.cat==='Tous')?' · '+esc(x.cat):''}</td>
        <td><span class="pill warn">${x.names.length}</span> <span class="small muted">${esc(x.names.slice(0,4).join(', '))}${x.names.length>4?'…':''}</span></td>
        <td><button class="btn sm pri" data-act="rpeComplete" data-col="${x.col}" data-id="${esc(x.id)}">Compléter</button></td></tr>`).join('')}
    </tbody></table></div>`:'<p class="muted" style="margin:0">Tous les RPE des 21 derniers jours sont saisis 👍</p>'}</div>`;
  return `${quickstart()}<div class="grid g6">
    ${kpi('Disponibles',ps.length-unavail,'/'+ps.length,unavail?unavail+' blessé'+(unavail>1?'s':'')+(INDIV?' ou en reprise':' ou en réathlé'):(INDIV?'Tout le monde est disponible':'Tout le groupe est disponible'))}

    ${kpi('Wellness du jour',wt.length?r0(mean(wt)):'–',wt.length?'%':'',`${wt.length}/${ps.length} questionnaires remplis`)}
    ${kpi('Charge 7 jours',r0(l7),'UA',l7&&pa?chgTxt((l7-pa)/pa*100):'Moyenne par '+PL.one+' (sRPE)')}
    ${kpi('ACWR moyen',ac!=null?r2(ac):'–','',`Zone cible ${r1(th.acwrLo)}–${r1(th.acwrHi)} (EWMA 7/28 j)`,ac!=null?(acwrCls(ac)==='good'?null:acwrCls(ac)):null)}
    ${INDIV?kpi('Séances (7 j)',Object.values(DATA.sessions).filter(x=>inCat(x)&&x.date>=addDays(ref,-6)&&x.date<=ref).length,'','toutes séances confondues'):kpi('Prochain match',nm?(dayDiff(nm.date,ref)===0?'J':'J-'+dayDiff(nm.date,ref)):'–','',nm?esc(fmtD(nm.date)+' · '+nm.label):'Aucun match planifié')}
  </div>
  ${squadCard}
  ${toFillCard}
  ${rpeMissCard}
  ${relanceCard}
  <div class="grid g2">
    <div class="card"><div class="hrow"><h2>${INDIV?"Charge d'entraînement, 28 jours":"Charge d'équipe, 28 jours"}</h2><span class="small muted">sRPE moyen par ${PL.one} présent·e</span></div>
      ${barChart({labels:td.labels,values:td.vals,colors:td.isM.map(m=>m?COL_MATCH:COL_TR),unit:'UA',legend:CHART_LEG,marks:injMarksIn(td.labels)})}</div>
    <div class="card"><div class="hrow"><h2>Wellness d'équipe, 28 jours</h2><span class="small muted">Score moyen sur 100</span></div>
      ${lineChart({labels:tw.labels,series:[{name:'Wellness',values:tw.vals,color:COL_TR,area:true}],yMin:40,yMax:100,refs:[{v:th.well,label:'Seuil '+th.well+' %'}],fmt:v=>r0(v)})}</div>
  </div>

      <div class="tw"><table><thead><tr><th>${PL.One}</th>${UI.cat==='Tous'&&!INDIV?'<th>Cat.</th>':''}<th>${INDIV?'Sport':'Poste'}</th><th>Statut</th><th class="n">Forme</th><th class="n">ACWR</th><th class="n">Charge 7 j</th>${INDIV?'':`<th class="n">≥${th.vmaxPct} % Vmax</th>`}<th>Motifs</th></tr></thead><tbody>
      ${st.map(({p,s})=>`<tr><td>${plinkA(p.id)}</td>${UI.cat==='Tous'&&!INDIV?`<td>${esc(p.cat)}</td>`:''}<td>${esc(INDIV?(p.sport||'—'):(p.pos||''))}</td><td>${lvPill(s.lv)}</td>
        <td class="n">${s.w.today!=null?`<span class="pill ${wCls(s.w.today)}">${r0(s.w.today)} %</span>`:'<span class="muted">–</span>'}</td>

        <td class="n">${r0(weekStats(p.id,ref).sum)}</td>${INDIV?'':`<td class="n">${s.vx==null?'–':s.vx===0?"aujourd'hui":'il y a '+s.vx+' j'}</td>`}
        <td class="wrap small">${s.reasons.filter(r=>r.l>=1).map(r=>esc(r.t)).join(' · ')||'<span class="muted">RAS</span>'}</td></tr>`).join('')}
      </tbody></table></div></div>

        ${today.length?today.map(e=>`<div class="ent ${e.type==='Match'?'match':''}"><b>${esc(e.title||e.objective)}</b><span class="muted">${esc(e.cat)} · ${esc(e.type)} · ${r0(e.duration)} min · ${esc(e.intensity||'')}</span></div>`).join(''):'<p class="muted" style="margin:0">Rien de planifié ce jour.</p>'}</div>
      <div class="card"><div class="hrow"><h2>À retenir</h2>${INDIV?'':'<button class="btn sm" data-act="tab" data-id="reco">Toutes les recos</button>'}</div>
        <div class="stack">${recos.length?recos.map(r=>`<div class="stack" style="gap:2px"><span class="pill ${r.p==='hi'?'crit':r.p==='md'?'warn':'good'}" style="align-self:flex-start">${r.p==='hi'?'Priorité haute':r.p==='md'?'À surveiller':'Info'}</span><b>${esc(r.title)}</b><span class="small muted">${esc(r.action)}</span></div>`).join(''):'<p class="muted">Rien de particulier.</p>'}</div></div>

};

/* ---------- SANTÉ & FORME ---------- */
/* ===== Cycle menstruel (profils féminins ; pour l'instant activé pour Sarah) =====
   Repères physiologiques généraux pour adapter la charge — ce n'est pas un avis médical. */
function menstruAllowed(p){if(!p)return false;const n=(p.name||'').trim().toLowerCase();return /^sarah\b/.test(n)||p.sex==='F';}
function mParse(d){return Date.parse(d+'T12:00:00');}
function mDaysBetween(a,b){return Math.round((mParse(b)-mParse(a))/86400000);}
function menstruStarts(pid){const r=DATA.menstru&&DATA.menstru[pid];const s=(r&&Array.isArray(r.starts))?r.starts.slice().sort():[];return s;}
function menstruEnds(pid){const r=DATA.menstru&&DATA.menstru[pid];const s=(r&&Array.isArray(r.ends))?r.ends.slice().sort():[];return s;}
// Fin des règles rattachée à un début : première fin ≥ ce début et avant le début suivant.
function menstruEndFor(starts,ends,start){if(!start||!ends||!ends.length)return null;const si=starts.indexOf(start);const nextStart=(si>=0&&si<starts.length-1)?starts[si+1]:null;for(const e of ends.slice().sort()){if(mDaysBetween(start,e)>=0&&(!nextStart||mDaysBetween(e,nextStart)>0))return e;}return null;}
// Durée réelle des règles (début→fin inclus) si connue, sinon 5 j par défaut.
function menstruReglesLen(start,end,L){if(!start||!end)return Math.min(5,L);return Math.min(L,Math.max(1,mDaysBetween(start,end)+1));}
function menstruCycleLen(starts){if(!starts||starts.length<2)return 28;const g=[];for(let i=1;i<starts.length;i++){const d=mDaysBetween(starts[i-1],starts[i]);if(d>=18&&d<=40)g.push(d);}if(!g.length)return 28;return Math.min(35,Math.max(21,Math.round(g.reduce((a,b)=>a+b,0)/g.length)));}
function menstruZones(L,reglesLen){const ovul=Math.max(11,L-14);const z=[];
  z.push({key:'regles',name:'Règles',from:1,to:Math.min(Math.max(1,reglesLen||5),L),level:'watch',color:'#C0392B',advice:"Énergie parfois plus basse, pertes de fer : garder le mouvement mais ajuster l'intensité au ressenti."});
  const folFrom=Math.min(6,L),folTo=Math.max(folFrom,ovul-2);
  z.push({key:'folliculaire',name:'Folliculaire',from:folFrom,to:folTo,level:'ok',color:'#1E9E6A',advice:"Phase souvent la plus favorable : bon moment pour les séances intenses, la force et le travail de qualité."});
  z.push({key:'ovulation',name:'Ovulation',from:Math.max(1,ovul-1),to:Math.min(L,ovul+1),level:'care',color:'#E08A0B',advice:"Laxité ligamentaire accrue : vigilance sur l'impact, les pivots, la pliométrie et les changements de direction (risque de blessure au genou)."});
  const lutFrom=Math.min(L,ovul+2),lutTo=Math.max(lutFrom,L-4);
  z.push({key:'luteale',name:'Lutéale',from:lutFrom,to:lutTo,level:'ok',color:'#2E78C7',advice:"Phase intermédiaire : charge normale possible, soigner la récupération et le sommeil."});
  z.push({key:'premenstruel',name:'Prémenstruel',from:Math.max(1,L-3),to:L,level:'care',color:'#B9770E',advice:"Fatigue et SPM possibles : alléger si besoin l'intensité des séances physiques, privilégier technique et récupération."});
  return z;}
function menstruDayOf(lastStart,ref,L){if(!lastStart)return null;const d=mDaysBetween(lastStart,ref);if(d<0)return null;return (d%L)+1;}
function menstruZoneForDay(zones,day){if(day==null)return null;for(const z of zones){if(day>=z.from&&day<=z.to)return z;}return null;}
function menstruBar(zones,L,day){
  const segs=zones.map(z=>{const len=z.to-z.from+1;return `<div style="flex:${len};min-width:0;background:${z.color}26;border-top:3px solid ${z.color};padding:7px 4px;text-align:center"><div style="font-size:10px;font-weight:700;color:${z.color};text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${z.name}</div><div style="font-size:9.5px;color:var(--muted)">J${z.from}${z.to>z.from?'–'+z.to:''}</div></div>`;}).join('');
  const pos=day!=null?Math.min(100,Math.max(0,((day-0.5)/L)*100)):null;
  const marker=pos!=null?`<div style="position:absolute;top:-5px;bottom:-5px;left:${pos}%;width:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)"><div style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink)">▼</div></div>`:'';
  return `<div style="position:relative;margin:20px 0 6px"><div style="display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line)">${segs}</div>${marker}</div>`;
}
function menstruCard(){
  const ps=playersOf(UI.cat);
  const mps=ps.filter(p=>menstruAllowed(p)||menstruStarts(p.id).length);
  if(!mps.length)return '';
  if(!UI.menstruPid||!mps.some(p=>p.id===UI.menstruPid))UI.menstruPid=mps[0].id;
  const pid=UI.menstruPid;const p=DATA.players[pid];
  const starts=menstruStarts(pid);const last=starts.length?starts[starts.length-1]:null;
  const ends=menstruEnds(pid);const lastEnd=menstruEndFor(starts,ends,last);
  const reglesLen=menstruReglesLen(last,lastEnd,menstruCycleLen(starts));
  const L=menstruCycleLen(starts);const zones=menstruZones(L,reglesLen);const day=menstruDayOf(last,UI.ref,L);const zone=menstruZoneForDay(zones,day);
  const next=last?addDays(last,L):null;
  const sel=`<select data-chg="menstruPid" aria-label="${PL.One}" style="width:auto">${mps.map(x=>{const s=menstruStarts(x.id);const lst=s.length?s[s.length-1]:null;const recent=lst&&mDaysBetween(lst,UI.ref)>=0&&mDaysBetween(lst,UI.ref)<=10;return `<option value="${esc(x.id)}" ${x.id===pid?'selected':''}>${esc(x.name)}${recent?' 🩸':''}</option>`;}).join('')}</select>`;
  let vigil='';

  const W=ms.filter(m=>res(m)==='V').length,N=ms.filter(m=>res(m)==='N').length,L=ms.filter(m=>res(m)==='D').length;
  const m=ms.find(x=>x.id===UI.compMatch)||ms[0];
  const season=ps.map(p=>{let n=0,st=0,min=0,g=0,a=0,y=0,rt=[],poss=0,dist=0,dmin=0;ms.forEach(x=>{if(x.cat!==p.cat)return;poss+=num(x.duration)||90;const e=x.players&&x.players[p.id];if(!e||!num(e.min))return;n++;if(e.starter)st++;min+=num(e.min);g+=num(e.goals)||0;a+=num(e.assists)||0;y+=num(e.yellow)||0;if(num(e.rating)!=null)rt.push(num(e.rating));if(num(e.dist)!=null){dist+=num(e.dist);dmin+=num(e.min);}});
    return{p,n,st,min,g,a,y,rt:mean(rt),pct:poss?min/poss*100:null,d90:dmin?dist/dmin*90:null};});
  const sp=DATA.players[UI.compPlayer]&&inCat(DATA.players[UI.compPlayer])?DATA.players[UI.compPlayer]:ps[0];
  let indiv='';
  if(sp){const log=ms.filter(x=>x.cat===sp.cat).slice().reverse().map(x=>({x,e:(x.players||{})[sp.id]}));const s=season.find(r=>r.p.id===sp.id)||{};
    indiv=`<div class="card"><div class="hrow"><h2>Vue individuelle</h2><select id="compPl" style="width:auto">${ps.map(p=>`<option value="${esc(p.id)}" ${p.id===sp.id?'selected':''}>${esc(p.name)}${UI.cat==='Tous'?' ('+esc(p.cat)+')':''}</option>`).join('')}</select></div>
    <div class="grid g6" style="margin-bottom:14px">${kpi('Matchs',s.n??0,'',(s.st??0)+' titularisations')}${kpi('Minutes',r0(s.min),'',s.pct!=null?r0(s.pct)+' % du temps possible':'')}${kpi('Buts',s.g??0,'')}${kpi('Passes déc.',s.a??0,'')}${kpi('Note moyenne',s.rt!=null?r1(s.rt):'–','/10')}${kpi('Distance / 90 min',s.d90?r0(s.d90):'–','m')}</div>
    <div class="grid g2"><div>${barChart({labels:log.map(l=>l.x.date),values:log.map(l=>num(l.e&&l.e.min)||0),unit:'min',h:170,tips:log.map(l=>fmtD(l.x.date)+' vs '+l.x.opponent+'\n'+(num(l.e&&l.e.min)||0)+' min')})}<div class="small muted" style="text-align:center">Minutes jouées par match</div></div>
    <div>${lineChart({labels:log.map(l=>l.x.date),series:[{name:'Note',values:log.map(l=>num(l.e&&l.e.rating)),color:COL_TR,dots:true}],yMin:0,yMax:10,h:170,fmt:v=>r1(v)})}<div class="small muted" style="text-align:center">Note du staff</div></div></div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Adversaire</th><th>Score</th><th class="n">Min</th><th>Tit.</th><th class="n">B</th><th class="n">PD</th><th class="n">Note</th><th class="n">Dist.</th><th class="n">HSR</th><th class="n">Vmax</th></tr></thead><tbody>
    ${log.slice().reverse().map(({x,e})=>`<tr><td>${fmtD(x.date)}</td><td>${esc(x.opponent)}</td><td>${esc(x.gf)}–${esc(x.ga)}</td><td class="n">${e?r0(num(e.min)):'–'}</td><td>${e&&e.starter?'Oui':e?'Non':'<span class="muted">Absent</span>'}</td><td class="n">${e?num(e.goals)||0:'–'}</td><td class="n">${e?num(e.assists)||0:'–'}</td><td class="n">${e?r1(num(e.rating)):'–'}</td><td class="n">${e?r0(num(e.dist)):'–'}</td><td class="n">${e?r0(num(e.hsr)):'–'}</td><td class="n">${e?r1(num(e.vmax)):'–'}</td></tr>`).join('')}
    </tbody></table></div></div>`;}
  let detail='<div class="empty">Aucun match enregistré.</div>';
  if(m){const rows=Object.entries(m.players||{}).filter(([pid])=>DATA.players[pid]).map(([pid,e])=>({p:DATA.players[pid],e})).sort((a,b)=>(b.e.starter?1:0)-(a.e.starter?1:0)||(num(b.e.min)||0)-(num(a.e.min)||0));
    detail=`<div class="row sb" style="margin-bottom:10px"><div><div class="eyebrow">${esc(m.competition||'')} · ${fmtD(m.date,{weekday:'long',day:'numeric',month:'long'})} · ${esc(m.venue||'')}</div>
      <div style="font-family:var(--fd);font-size:30px;font-weight:700">${esc(m.cat)} ${esc(m.gf)} – ${esc(m.ga)} ${esc(m.opponent)} <span class="pill ${res(m)==='V'?'good':res(m)==='D'?'crit':'neutral'}" style="vertical-align:middle">${res(m)==='V'?'Victoire':res(m)==='D'?'Défaite':'Nul'}</span></div></div>
      <div class="row"><button class="btn sm" data-act="edit" data-col="matches" data-id="${esc(m.id)}">Modifier</button></div></div>
    <div class="tw"><table><thead><tr><th>${PL.One}</th><th>Tit.</th><th class="n">Min</th><th class="n">Buts</th><th class="n">PD</th><th class="n">Cartons</th><th class="n">Note</th><th class="n">RPE</th><th class="n">Distance</th><th class="n">HSR</th><th class="n">Sprint</th><th class="n">Vmax</th></tr></thead><tbody>
    ${rows.map(({p,e})=>`<tr><td>${plinkA(p.id)}</td><td>${e.starter?'Oui':'Non'}</td><td class="n">${r0(num(e.min))}</td><td class="n">${num(e.goals)||''}</td><td class="n">${num(e.assists)||''}</td><td class="n">${num(e.yellow)?'<span class="pill warn">J</span>':''}${num(e.red)?'<span class="pill crit">R</span>':''}</td><td class="n">${r1(num(e.rating))}</td><td class="n">${r0(num(e.rpe))}</td><td class="n">${r0(num(e.dist))}</td><td class="n">${r0(num(e.hsr))}</td><td class="n">${r0(num(e.sprint))}</td><td class="n">${r1(num(e.vmax))}</td></tr>`).join('')}
    </tbody></table></div>`;}
  return `<div class="grid g6">${kpi('Matchs',ms.length,'')}${kpi('Victoires',W,'','',W?'good':null)}${kpi('Nuls',N,'')}${kpi('Défaites',L,'')}${kpi('Buts marqués',sum(ms.map(x=>num(x.gf))),'',ms.length?r1(sum(ms.map(x=>num(x.gf)))/ms.length)+' par match':'')}${kpi('Buts encaissés',sum(ms.map(x=>num(x.ga))),'',ms.length?r1(sum(ms.map(x=>num(x.ga)))/ms.length)+' par match':'')}</div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,2.2fr)">
    <div class="card"><div class="hrow"><h2>Matchs</h2><button class="btn sm pri" data-act="goEntry" data-id="match">Saisir un match</button></div>
      <div class="stack" style="gap:6px;max-height:520px;overflow:auto">${ms.map(x=>`<button class="btn" style="justify-content:space-between;${m&&x.id===m.id?'border-color:var(--accent);color:var(--accent)':''}" data-act="compMatch" data-id="${esc(x.id)}"><span>${fmtShort(x.date)} · ${esc(x.cat)} · ${esc(x.opponent)}</span><span class="pill ${res(x)==='V'?'good':res(x)==='D'?'crit':'neutral'}">${esc(x.gf)}–${esc(x.ga)}</span></button>`).join('')||'<p class="muted">Aucun match.</p>'}</div></div>
    <div class="card">${detail}</div>
  </div>
  <div class="card"><div class="hrow"><h2>Statistiques de la saison</h2><span class="small muted">% temps de jeu = minutes jouées / minutes possibles</span></div>
    <div class="tw"><table><thead><tr><th>${PL.One}</th><th>Poste</th><th class="n">Matchs</th><th class="n">Tit.</th><th class="n">Minutes</th><th>Temps de jeu</th><th class="n">Buts</th><th class="n">PD</th><th class="n">Cartons J</th><th class="n">Note moy.</th><th class="n">Dist./90</th></tr></thead><tbody>
    ${season.sort((a,b)=>b.min-a.min).map(r=>`<tr><td>${plinkA(r.p.id)}</td><td>${esc(r.p.pos||'')}</td><td class="n">${r.n}</td><td class="n">${r.st}</td><td class="n"><b>${r0(r.min)}</b></td><td style="min-width:120px"><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${clamp(r.pct||0,0,100)}%"></i></div><span class="small">${r.pct!=null?r0(r.pct)+' %':'–'}</span></div></td><td class="n">${r.g}</td><td class="n">${r.a}</td><td class="n">${r.y}</td><td class="n">${r.rt!=null?r1(r.rt):'–'}</td><td class="n">${r.d90?r0(r.d90):'–'}</td></tr>`).join('')}
    </tbody></table></div></div>${indiv}`;
};
POST.comp=()=>{const s=$('#compPl');if(s)s.onchange=()=>{UI.compPlayer=s.value;render();};};
</script>

<script>
/* ---------- ENTRAÎNEMENT ---------- */
function planStatus(e){if(e.type==='Match'){const m=Object.values(DATA.matches).some(x=>x.date===e.date&&x.cat===e.cat);return m?'done':e.date<TODAY?'miss':'todo';}
  if(e.done)return 'done';const s=Object.values(DATA.sessions).some(x=>x.date===e.date&&x.cat===e.cat&&(x.type===e.type||e.type==='Mixte'||x.type==='Mixte'));return s?'done':e.date<TODAY?'miss':'todo';}
const PS={done:'<span class="pill good">Réalisé</span>',miss:'<span class="pill crit">Non réalisé</span>',todo:'<span class="pill neutral">À venir</span>'};
function entCls(e){return e.type==='Match'?'match':e.type==='Récupération'?'rec':e.type==='Salle'?'salle':'';}
/* ================= PLANIFICATION SAISON (périodisation) ================= */
const SP_WEEKS=40;
const SP_PHASES=[
  ['','—','#2a3a52'],
  ['ppr','PPR / Reprise','#8a6d3b'],
  ['prepa','Préparation','#c0563a'],
  ['comp','Compétition','#3a6ea5'],
  ['transition','Transition','#2f8f6b'],
  ['coupure','Coupure','#555b66']
];
const SP_CONTENT=[
  ['explo','Explo + Réactivité','#e0c040'],
  ['submax','Submax (HSR/RSA)','#e08a3a'],
  ['vitesse','Vitesse + Appui','#e5604d'],
  ['coord','Chgt direction / Coord.','#a06ff0'],
  ['vma','VMA / Récup','#2fbf71']
];
const SP_COLW=46;
function spKey(){return INDIV?INDIV_CAT:(UI.cat==='Tous'?(cats()[0]||'U15'):UI.cat);}
function spStartDefault(){const now=new Date(TODAY+'T12:00:00Z');const y=now.getUTCMonth()>=6?now.getUTCFullYear():now.getUTCFullYear()-1;let d=new Date(Date.UTC(y,7,1));while(d.getUTCDay()!==1)d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10);}
function spGet(cat){const s=DATA.seasonplan&&DATA.seasonplan[cat];return {cat,start:(s&&s.start)||spStartDefault(),weeks:JSON.parse(JSON.stringify((s&&s.weeks)||{}))};}
async function spSave(cat,plan,silent){await put('seasonplan',cat,plan,silent);}
function spW(plan,i){return plan.weeks[i]||{};}
function isoWeekNum(s){const d=new Date(s+'T12:00:00Z');const day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day+3);const first=new Date(Date.UTC(d.getUTCFullYear(),0,4));return 1+Math.round(((d-first)/86400000-3+((first.getUTCDay()+6)%7))/7);}
function spIsMatch(plan,i,cat){const a=addDays(plan.start,7*i),b=addDays(a,6);return Object.values(DATA.matches).some(m=>m&&m.cat===cat&&m.date>=a&&m.date<=b)||Object.values(DATA.plan).some(p=>p&&p.type==='Match'&&p.cat===cat&&p.date>=a&&p.date<=b);}
function spReal(plan,i,cat){const a=addDays(plan.start,7*i),b=addDays(a,6);let load=0;const pids=new Set();const scan=o=>Object.values(o).forEach(s=>{if(!s||s.cat!==cat||s.date<a||s.date>b)return;Object.entries(s.players||{}).forEach(([pid,e])=>{if(e&&e.rpe!=null){load+=e.rpe*(e.min||s.duration||0);pids.add(pid);}});});scan(DATA.sessions);scan(DATA.matches);return pids.size?Math.round(load/pids.size):0;}
function spEst(w){return (+w.vol||0)*(+w.int||0)*40;}
function spChart(plan,cat){
  const W=SP_WEEKS*SP_COLW,H=200,band=16,padTop=34,padBot=22,plotH=H-padTop-padBot;
  let phases='',bars='',dots='',matches='',ticks='',logos='';const lp=[];
  for(let i=0;i<SP_WEEKS;i++){const w=spW(plan,i);const x=i*SP_COLW,cx=x+SP_COLW/2;
    const vol=+w.vol||0,int=+w.int||0;
    const ph=SP_PHASES.find(p=>p[0]===(w.phase||''))||SP_PHASES[0];
    phases+=`<rect x="${x}" y="0" width="${SP_COLW}" height="${band}" fill="${ph[2]}" opacity="${w.phase?0.92:0.22}"/>`;
    const bh=(vol/5)*plotH;bars+=`<rect x="${x+7}" y="${H-padBot-bh}" width="${SP_COLW-14}" height="${bh}" rx="3" fill="#3b82f6" opacity="0.82"><title>S${isoWeekNum(addDays(plan.start,7*i))} · Volume ${vol}/5 · Intensité ${int}/5${w.opp?' · vs '+w.opp:''}</title></rect>`;
    const crest=spCrest(w);if(crest){const sz=18;logos+=`<image href="${crest}" x="${(cx-sz/2).toFixed(1)}" y="${Math.max(band+2,H-padBot-bh-sz-3).toFixed(1)}" width="${sz}" height="${sz}"><title>${esc(w.opp||'')}</title></image>`;}
    lp.push([cx,H-padBot-(int/5)*plotH,int]);
    if(spIsMatch(plan,i,cat))matches+=`<circle cx="${cx}" cy="${band+9}" r="4.5" fill="#E7A13B"><title>Semaine de match</title></circle>`;
    SP_CONTENT.forEach((c,ci)=>{const lv=+((w.content||{})[c[0]])||0;if(lv>0)dots+=`<circle cx="${cx}" cy="${padTop-4+ci*5}" r="${1.5+lv*0.9}" fill="${c[2]}" opacity="0.92"><title>${c[1]} ${lv}/5</title></circle>`;});
    if(i%2===0)ticks+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="9" fill="#7E90A8">S${isoWeekNum(addDays(plan.start,7*i))}</text>`;
  }
  const line=`<polyline points="${lp.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="#E5604D" stroke-width="2.2"/>`+lp.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#E5604D"><title>Intensité ${p[2]}/5</title></circle>`).join('');
  // superpositions de charge (échelles indépendantes, valeur au survol)
  const overlay=(vals,color,dash,unit)=>{const mx=Math.max(1,...vals.map(v=>+v||0));const pts=vals.map((v,i)=>[i*SP_COLW+SP_COLW/2,H-padBot-((+v||0)/mx)*plotH,+v||0]);
    return `<polyline points="${pts.map(p=>p[0]+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2" ${dash?'stroke-dasharray="5 4"':''} opacity="0.9"/>`+pts.map(p=>p[2]?`<circle cx="${p[0]}" cy="${p[1].toFixed(1)}" r="2.6" fill="${color}"><title>${p[2]} ${unit||''}</title></circle>`:'').join('');};
  let over='';
  if(UI.spOverPlan)over+=overlay(range0(SP_WEEKS).map(i=>spEst(spW(plan,i))),'#c9a227',true,'UA');
  if(UI.spOverReal)over+=overlay(range0(SP_WEEKS).map(i=>spReal(plan,i,cat)),'#2FBF71',false,'UA');
  if(UI.spGpsMetric)over+=overlay(range0(SP_WEEKS).map(i=>spGps(plan,i,cat,UI.spGpsMetric)),'#38bdf8',false,GPS_METRICS[UI.spGpsMetric]||'');
  return `<div style="overflow-x:auto" id="sp-chart"><svg width="${W}" height="${H}" style="display:block;min-width:100%">${phases}${matches}${bars}${line}${over}${dots}${logos}${ticks}</svg></div>`;
}
const GPS_METRICS={dist:'Distance (m)',hsr:'HSR (m)',sprint:'Sprint (m)'};
function spGps(plan,i,cat,metric){if(!metric)return 0;const a=addDays(plan.start,7*i),b=addDays(a,6);let tot=0;const pids=new Set();const scan=o=>Object.values(o).forEach(s=>{if(!s||s.cat!==cat||s.date<a||s.date>b)return;Object.entries(s.players||{}).forEach(([pid,e])=>{const v=num(e&&e[metric]);if(v!=null){tot+=v;pids.add(pid);}});});scan(DATA.sessions);scan(DATA.matches);return pids.size?Math.round(tot/pids.size):0;}
function spBarsCell(i,key,lv,color){const bars=[5,4,3,2,1].map(n=>`<div style="height:3px;margin:1.5px 0;border-radius:2px;background:${n<=lv?color:'rgba(255,255,255,.12)'}"></div>`).join('');return `<td data-act="spLevel" data-wk="${i}" data-key="${key}" title="${lv}/5 — clique pour changer" style="cursor:pointer;padding:5px;text-align:center;min-width:${SP_COLW}px;width:${SP_COLW}px">${bars}</td>`;}
function spTxtCell(i,key,val){return `<td style="padding:2px;min-width:${SP_COLW}px;width:${SP_COLW}px"><input data-chg="spText" data-wk="${i}" data-key="${key}" value="${esc(val||'')}" style="width:100%;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:4px;font-size:11px"></td>`;}
function spPhaseCell(i,phase){const ph=SP_PHASES.find(p=>p[0]===(phase||''))||SP_PHASES[0];return `<td data-act="spPhase" data-wk="${i}" title="clique pour changer la phase" style="cursor:pointer;padding:3px;text-align:center;min-width:${SP_COLW}px;width:${SP_COLW}px"><span style="display:block;background:${ph[2]};color:#fff;border-radius:5px;padding:4px 2px;font-size:9.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ph[1])}</span></td>`;}
/* Écusson de démonstration (placeholder) généré depuis le nom de l'adversaire —
   l'utilisateur peut téléverser le vrai logo pour l'écraser. */
const _crestCache={};
function demoCrest(name){if(!name)return'';if(_crestCache[name])return _crestCache[name];
  const init=name.split(/\s+/).map(s=>s[0]).filter(Boolean).join('').slice(0,3).toUpperCase();
  const cols=['#c0563a','#3a6ea5','#2f8f6b','#8a5cc7','#b7760a','#0e6f55','#1b46c9','#0c8a8a','#a0402f'];let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;const col=cols[h%cols.length];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="46" viewBox="0 0 40 46"><path d="M3 3 H37 V27 Q37 40 20 45 Q3 40 3 27 Z" fill="${col}" stroke="#ffffff" stroke-width="2"/><text x="20" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">${init}</text></svg>`;
  const url='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));_crestCache[name]=url;return url;}
function spCrest(w){return w.logo||(w.opp?demoCrest(w.opp):'');}
function spLogoCell(i,w){const logo=w.logo,ph=!logo&&w.opp?demoCrest(w.opp):'',src=logo||ph;
  if(src)return `<td style="text-align:center;padding:3px;min-width:${SP_COLW}px;width:${SP_COLW}px;position:relative"><img src="${src}" data-act="spLogo" data-wk="${i}" title="Clique pour changer le logo" style="height:28px;width:auto;max-width:${SP_COLW-6}px;cursor:pointer;vertical-align:middle;${logo?'':'opacity:.5'}">${logo?`<button data-act="spLogoDel" data-wk="${i}" title="Retirer le logo" style="position:absolute;top:1px;right:4px;background:#e5604d;color:#fff;border:0;border-radius:50%;width:15px;height:15px;font-size:10px;line-height:15px;cursor:pointer;padding:0">×</button>`:''}</td>`;
  return `<td data-act="spLogo" data-wk="${i}" title="Ajouter un logo du club" style="text-align:center;cursor:pointer;min-width:${SP_COLW}px;width:${SP_COLW}px"><span style="display:inline-block;border:1px dashed var(--line);border-radius:6px;padding:4px 9px;font-size:14px;color:var(--muted)">+</span></td>`;}
VIEWS.seasonplan=()=>{
  const allCats=!INDIV&&UI.cat==='Tous';
  const cat=spKey();const plan=spGet(cat);
  const lbl=i=>({wk:isoWeekNum(addDays(plan.start,7*i)),d:addDays(plan.start,7*i)});
  const th=`<th style="position:sticky;left:0;z-index:3;background:var(--nav);min-width:150px;width:150px;text-align:left;padding:6px 8px"></th>`;
  const headWk=`<tr>${th}${range0(SP_WEEKS).map(i=>{const {wk,d}=lbl(i);const m=spIsMatch(plan,i,cat);return `<th data-act="spMicro" data-wk="${i}" title="Clique pour ouvrir le microcycle détaillé de la semaine" style="cursor:pointer;min-width:${SP_COLW}px;width:${SP_COLW}px;padding:5px 2px;text-align:center;font-size:10px;color:${m?'#E7A13B':'var(--ink-2)'}">S${wk}<br><span class="muted" style="font-weight:400">${fmtShort(d)}</span>${m?'<br>⚽':''}<br><span style="color:var(--accent);font-size:12px">🔍</span></th>`;}).join('')}</tr>`;
  const rowLbl=t=>`<td style="position:sticky;left:0;z-index:2;background:var(--surface-2);min-width:150px;width:150px;font-size:11px;font-weight:600;color:var(--ink-2);padding:5px 8px;white-space:nowrap">${t}</td>`;
  const rows=[];
  rows.push(`<tr>${rowLbl('Phase')}${range0(SP_WEEKS).map(i=>spPhaseCell(i,spW(plan,i).phase)).join('')}</tr>`);
  rows.push(`<tr>${rowLbl('Événement')}${range0(SP_WEEKS).map(i=>spTxtCell(i,'event',spW(plan,i).event)).join('')}</tr>`);

const DAYTPL={'J+1':['Récupération / compensation','Titulaires : récupération active 30–40 min (vélo, mobilité, soins). Non-joueurs et joueurs < 45 min : compensation avec jeu réduit + course à haute intensité pour compenser la charge du match.'],
 'J+2':['Récupération ou repos','Repos ou séance légère. Idéal pour le suivi individuel (entretiens, soins).'],

 'J-4':['Force & tension','Jeux réduits (4c4 à 6c6, petits espaces), accélérations/décélérations, musculation force (charges lourdes, faible volume).'],
 'J-3':['Volume & endurance','Grands espaces (8c8 à 11c11), endurance intermittente type 15-15 à 100-110 % VIFT, courses haute intensité : c’est la séance la plus volumineuse.'],

function buildRecos(){
  const ref=UI.ref;const th=S().th;const out=[];const cs=UI.cat==='Tous'?cats():[UI.cat];
  cs.forEach(cat=>{
    const ps=playersOf(cat);if(!ps.length)return;const pre=UI.cat==='Tous'?cat+' · ':'';const healthy=ps.filter(p=>!activeInjury(p.id,ref));
    const nm=nextMatch(cat,ref);const dm=nm?dayDiff(nm.date,ref):null;
    // vitesse max (football uniquement : exposition sprint / prévention ischios)
    if(!INDIV){const noV=healthy.filter(p=>{const v=lastVmaxExpo(p,ref);return v==null||v>th.vmaxDays;});
    if(noV.length>=Math.max(2,healthy.length*.25)){out.push({p:'hi',cat,title:pre+`Exposition à la vitesse maximale insuffisante (${noV.length} joueurs)`,why:`Aucune course ≥ ${th.vmaxPct} % de leur Vmax depuis plus de ${th.vmaxDays} jours. L'exposition régulière au sprint est un facteur clé de prévention des lésions des ischio-jambiers.`,
      action:dm!=null&&dm>=2&&dm<=4?`À placer ${dm===2?'aujourd’hui (J-2)':'à J-2'} : 3 à 5 sprints de 30–40 m lancés, récupération complète (2–3 min).`:'Prochaine séance de vitesse : 3 à 5 sprints de 30–40 m lancés, récupération complète, en début de séance après l’échauffement.',players:noV.map(p=>p.id)});}
    else if(noV.length){out.push({p:'md',cat,title:pre+`${noV.length} joueur${noV.length>1?'s':''} à exposer à la vitesse max`,why:`Pas de sprint ≥ ${th.vmaxPct} % Vmax depuis plus de ${th.vmaxDays} jours.`,action:'Ajouter 2–3 sprints lancés en fin d’échauffement pour ces joueurs.',players:noV.map(p=>p.id)});}}
    // variation de charge
    const ws=healthy.map(p=>weekStats(p.id,ref));const l7=mean(ws.map(w=>w.sum).filter(v=>v>0)),pa=mean(ws.map(w=>w.prevAvg).filter(v=>v>0));
    if(l7&&pa){const c=(l7-pa)/pa*100;
      if(c>th.weekChg)out.push({p:c>th.weekChg*2?'hi':'md',cat,title:pre+`Charge en hausse de ${r0(c)} % sur 7 jours`,why:`Charge moyenne ${r0(l7)} UA contre ${r0(pa)} UA sur les 3 semaines précédentes. Au-delà de +${th.weekChg} %, le risque de blessure augmente.`,action:'Réduire le volume des prochaines séances (−20 à −30 % de durée ou d’espace), conserver l’intensité par pics.'});
      else if(c<-30&&!(dm!=null&&dm<=2))out.push({p:'md',cat,title:pre+`Charge en baisse de ${r0(-c)} %`,why:'Une baisse durable réduit la charge chronique et expose à un pic lors du retour à la normale.',action:'Remonter progressivement le volume (+10 à 15 % par semaine) si le calendrier le permet.'});}
    // ACWR individuels
    const hi=healthy.filter(p=>{const e=ewma(p.id,ref);return e.acwr!=null&&e.days>=21&&e.acwr>th.acwrHi;});
    if(hi.length)out.push({p:'md',cat,title:pre+`ACWR élevé pour ${hi.length} ${hi.length>1?PL.many:PL.one}`,why:`Charge aiguë supérieure à ${th.acwrHi} fois la charge chronique.`,action:INDIV?'Alléger les prochaines séances (volume réduit), garder l’intensité par pics.':'Individualiser : limiter le temps de jeu en jeux réduits, pas de complément haute intensité.',players:hi.map(p=>p.id)});
    const lo=healthy.filter(p=>{const e=ewma(p.id,ref);return e.acwr!=null&&e.days>=21&&e.acwr<th.acwrLo;});
    if(lo.length)out.push({p:'lo',cat,title:pre+`Sous-charge pour ${lo.length} ${lo.length>1?PL.many:PL.one}`,why:`ACWR inférieur à ${th.acwrLo} : la charge récente est faible par rapport à l'habitude.`,action:INDIV?'Augmenter progressivement le volume (séance supplémentaire ou durée allongée) pour maintenir la condition.':'Compléments de charge : jeux réduits additionnels ou intermittent court (15-15) pour maintenir la condition.',players:lo.map(p=>p.id)});
    // non-joueurs (football : compensation après match)
    if(!INDIV){const pm=prevMatch(cat,ref);if(pm&&dayDiff(ref,pm.date)<=3){const nj=healthy.filter(p=>{const e=(pm.players||{})[p.id];return !e||(num(e.min)||0)<45;});
      if(nj.length)out.push({p:'md',cat,title:pre+`Compensation pour ${nj.length} joueur${nj.length>1?'s':''} (< 45 min au dernier match)`,why:`Match du ${fmtD(pm.date)} contre ${pm.opponent}. Sans compensation, leur charge haute intensité chute.`,action:'Séance de compensation à J+1 ou J+2 : jeu réduit 4c4 + 6 à 8 courses de 60–80 m à haute intensité + 3 sprints.',players:nj.map(p=>p.id)});}}
    // force
    const strength=Object.values(DATA.sessions).filter(s=>s.cat===cat&&s.date<=ref&&dayDiff(ref,s.date)<7&&(s.type==='Salle'||s.objective==='Force'||s.objective==='Puissance / explosivité')).length;
    if(strength<2)out.push({p:strength===0?'hi':'md',cat,title:pre+`${strength} séance${strength>1?'s':''} de force sur 7 jours`,why:'Deux stimulations de force par semaine sont recommandées pour progresser (une seule suffit pour maintenir en période chargée).',action:dm!=null&&dm>=4?'Programmer une séance de force à J-4 (charges lourdes, faible volume) et une à J+2.':'Placer la séance de force à J+2 ou J-4 la semaine prochaine, jamais à J-1.'});
    // monotonie
    const mono=mean(ws.map(w=>w.mono).filter(v=>v!=null));if(mono!=null&&mono>th.monotony)out.push({p:'md',cat,title:pre+`Monotonie élevée (${r2(mono)})`,why:'Les charges quotidiennes sont trop uniformes : la variation entre jours durs et jours légers favorise l’adaptation.',action:'Alterner davantage : une séance nettement plus légère (RPE ≤ 3) et une séance clé plus intense.'});
    // wellness
    const tw=teamWell(ps,ref,28);const l3=mean(tw.vals.slice(-3)),b=mean(tw.vals.slice(0,-3));if(l3!=null&&b&&l3-b<-5)out.push({p:'hi',cat,title:pre+`Wellness en baisse (${r1(l3-b)} points sur 3 jours)`,why:`Score moyen ${r0(l3)} % contre ${r0(b)} % habituellement.`,action:'Alléger la prochaine séance, vérifier sommeil et charge scolaire (contrôles, examens), rappel hydratation et nutrition.'});
    const lowW=ps.filter(p=>{const w=wStats(p.id,ref);return w.today!=null&&(w.today<th.well||(w.z!=null&&w.z<th.wz*1.6));});
    if(lowW.length)out.push({p:'hi',cat,title:pre+`Wellness bas aujourd’hui : ${lowW.map(p=>p.name).join(', ')}`,why:'Score sous le seuil ou très en dessous de l’habitude de la personne.',action:'Échange individuel avant la séance ; séance adaptée (volume réduit) si le ressenti se confirme à l’échauffement.',players:lowW.map(p=>p.id)});
    // tests
    const bt=testBatteries(cat);const lastT=bt.length?bt[bt.length-1].date:null;if(!lastT||dayDiff(ref,lastT)>56)out.push({p:'lo',cat,title:pre+'Batterie de tests à programmer',why:lastT?`Dernière batterie le ${fmtD(lastT)}, il y a ${dayDiff(ref,lastT)} jours.`:'Aucune batterie de tests enregistrée.',action:'Programmer CMJ, sprint 10/30 m, 505 et 30-15 IFT sur une semaine sans match en milieu de semaine (J-4 ou J-3). Un CMJ hebdomadaire aide aussi à suivre la fatigue.'});
    // croissance
    // réathlé
    Object.values(DATA.injuries).filter(i=>i.status==='reathle'&&DATA.players[i.pid]&&DATA.players[i.pid].cat===cat).forEach(i=>{const ph=S().rtp[i.phase||0];if(!ph)return;const cr=(i.criteria&&i.criteria[i.phase||0])||[];const left=ph.criteria.filter((c,k)=>!cr[k]);
      out.push({p:'lo',cat,title:pre+`${pname(i.pid)} : réathlé, phase ${(i.phase||0)+1} (${ph.name})`,why:`${i.zone}, ${dayDiff(ref,i.date)} jours depuis la blessure.`,action:left.length?'Critères restants : '+left.join(' ; ')+'.':'Tous les critères de la phase sont validés : passage à la phase suivante possible.',players:[i.pid]});});
    // planning
    const mon=mondayOf(ref);const pl=Object.values(DATA.plan).filter(e=>e.cat===cat&&e.date>=mon&&e.date<=addDays(mon,6));
    if(!Object.values(DATA.plan).some(e=>e.cat===cat&&e.date>=addDays(mon,7)&&e.date<=addDays(mon,13)))out.push({p:'lo',cat,title:pre+'Semaine prochaine non planifiée',why:'Aucune séance planifiée pour la semaine suivante.',action:'Utiliser « Dupliquer vers la semaine suivante » dans Entraînement puis ajuster.'});
    const missed=pl.filter(e=>planStatus(e)==='miss');if(missed.length)out.push({p:'lo',cat,title:pre+`${missed.length} séance${missed.length>1?'s':''} planifiée${missed.length>1?'s':''} non réalisée${missed.length>1?'s':''} cette semaine`,why:missed.map(e=>fmtD(e.date)+' : '+(e.title||e.objective)).join(' · '),action:'Marquer « Fait » si elles ont eu lieu, ou reporter l’objectif manqué sur un autre jour.'});
  });
  const o={hi:0,md:1,lo:2};return out.sort((a,b)=>o[a.p]-o[b.p]);
}

/* ---------- PERFORMANCE : TESTING ---------- */
/* Série complète d'un test pour un joueur (avec notes). */
function testSeriesFull(pid,tid){const o=[];Object.values(DATA.tests).sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{const v=b.results&&b.results[tid]?num(b.results[tid][pid]):null;if(v!=null)o.push({date:b.date,v,note:(b.notes&&b.notes[tid]&&b.notes[tid][pid])||''});});return o;}
function testedOn(pid,tid,date){return Object.values(DATA.tests).some(b=>b.date===date&&b.results&&b.results[tid]&&b.results[tid][pid]!=null);}
/* Mesures anthropométriques traitées comme des tests (Poids, Taille) — valeur courante aussi sur la fiche. */
const MEAS=[{id:'__mass',name:'Poids',unit:'kg',better:'any',field:'mass'},{id:'__height',name:'Taille',unit:'cm',better:'any',field:'height'}];
function measField(tid){const m=MEAS.find(x=>x.id===tid);return m?m.field:null;}
function allTests(){return MEAS.concat(S().tests);}
function tdef(id){return allTests().find(t=>t.id===id)||{id,name:id,unit:'',better:'high'};}
/* Dernière valeur d'une mesure/test : historique des sessions, sinon valeur courante de la fiche. */
function measLast(pid,tid){const sf=testSeriesFull(pid,tid);if(sf.length)return sf[sf.length-1];const f=measField(tid);if(f){const p=DATA.players[pid];if(p&&p[f]!=null)return{date:null,v:num(p[f])};}return null;}
/* Enregistre des valeurs (un seul test, une date) pour plusieurs joueurs ; fusionne dans la session du jour. */
async function saveTestValues(testId,date,list){ // list:[{pid,value,note}]
  const byCat={};list.forEach(r=>{const raw=(r.value==null?'':String(r.value)).trim();if(raw==='')return;const n=parseFloat(raw.replace(',','.'));if(isNaN(n))return;const p=DATA.players[r.pid];if(!p)return;const c=p.cat||'Tous';(byCat[c]=byCat[c]||[]).push({pid:r.pid,n,note:(r.note||'').trim()});});
  let count=0;
  for(const cat of Object.keys(byCat)){
    const bat=Object.values(DATA.tests).find(b=>b.date===date&&b.cat===cat);
    const id=bat?bat.id:uid();
    const results=bat?JSON.parse(JSON.stringify(bat.results||{})):{};
    const notes=bat?JSON.parse(JSON.stringify(bat.notes||{})):{};
    results[testId]=results[testId]||{};notes[testId]=notes[testId]||{};
    byCat[cat].forEach(r=>{results[testId][r.pid]=r.n;if(r.note)notes[testId][r.pid]=r.note;else delete notes[testId][r.pid];count++;});
    await put('tests',id,{id,date,cat,label:bat?bat.label:'Saisie',results,notes},true);
  }
  // Poids / Taille : on met aussi à jour la valeur courante sur la fiche du joueur (IMC, etc.).
  const field=measField(testId);
  if(field)for(const cat of Object.keys(byCat))for(const r of byCat[cat]){const p=DATA.players[r.pid];if(!p)continue;const np=Object.assign({},p);np[field]=field==='height'?Math.round(r.n):Math.round(r.n*10)/10;await put('players',r.pid,np,true);}
  return count;
}
