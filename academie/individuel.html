<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elite Adapt Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
/* Layout: sticky header, scrolling main, floating glass bar with a raised blue calendar button */
--bg:#080d19;--surface:#0f1626;--surface2:#151e33;--line:#1f2a44;--line2:#2b3a5c;
--text:#e9eefb;--mute:#8d9ab8;--dim:#5d6b8a;
--blue:#3b82f6;--blue2:#2563eb;--sky:#60a5fa;--coral:#ff7a59;
--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;
--fd:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Barlow',system-ui,sans-serif;
color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--fd);letter-spacing:.01em;margin:0;line-height:1.1}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
#root{height:100%;overflow-y:auto;padding-bottom:130px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(8,13,25,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 17px var(--fd);background:linear-gradient(135deg,var(--blue),var(--coral));color:#fff}
.brand b{font:700 20px var(--fd)}.brand b i{font-style:normal;color:var(--coral)}
.brand small{display:block;font:600 10px var(--fb);letter-spacing:.14em;color:var(--mute);margin-top:-2px}
.top-r{display:flex;align-items:center;gap:8px}
.staff{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line2);border-radius:99px;padding:4px 11px;font-size:12px}
.staff b{font-weight:600;letter-spacing:.06em}
select,input,textarea{background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;min-width:0}
select{max-width:190px}
.ib{background:var(--surface2);border:1px solid var(--line2);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--text)}
.ib:hover{border-color:var(--sky)}
main{max-width:1180px;margin:0 auto;padding:18px 16px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{font-size:34px}.ph p{margin:2px 0 0;color:var(--mute);font-size:13px;text-transform:capitalize}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}.sync.loc i{background:var(--warn)}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line2);border-radius:99px;background:var(--surface);margin-bottom:18px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:9px 16px;border-radius:99px;font-weight:500;white-space:nowrap}
.seg button.on{background:linear-gradient(90deg,var(--sky),#a78bfa);color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface2);border-radius:11px;padding:8px 13px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--sky)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.p:hover{background:var(--blue2)}
.btn.d{color:var(--bad)}.btn.s{padding:5px 9px;font-size:12px;border-radius:9px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{font-size:20px;margin-bottom:10px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.gcard{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:16px;padding:14px 16px;cursor:pointer}
.gcard:hover{border-color:var(--c)}
.gh{display:flex;justify-content:space-between;gap:8px}.gh h3{font-size:24px}.gh p{margin:2px 0;color:var(--mute);font-size:12px}
.gn{font:700 30px var(--fd);color:var(--c)}
.gf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--c);font-weight:600;font-size:13px}
.avs{display:flex}.avs .av{margin-right:-6px;border:2px solid var(--surface)}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:#06101f;font-weight:700;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line2);background:var(--surface2);color:var(--text)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--mute))}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.good{--c:var(--good)}.warn{--c:var(--warn)}.bad{--c:var(--bad)}.blue{--c:var(--sky)}.mute{--c:var(--mute)}
.cc{position:relative;cursor:pointer}.cc input{position:absolute;opacity:0;inset:0;cursor:pointer}
.cc:has(input:checked){background:var(--blue);border-color:var(--blue);color:#fff}
.crow{display:grid;grid-template-columns:minmax(200px,1.4fr) 1fr 1fr 130px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;margin-bottom:8px}
.crow:hover{border-color:var(--sky)}
.crow .nm{display:flex;gap:11px;align-items:center}.crow b{display:block}.crow small,.sub{color:var(--mute);font-size:12px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--sky));border-radius:9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi small{color:var(--mute);font-size:12px}.kpi b{display:block;font:700 30px var(--fd);line-height:1.1}.kpi span{font-size:12px;color:var(--mute)}
.tabs2{display:flex;gap:6px;overflow-x:auto;margin:14px 0;border-bottom:1px solid var(--line)}
.tabs2 button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:8px 12px;white-space:nowrap}
.tabs2 button.on{color:var(--text);border-color:var(--blue)}
.chart{width:100%;height:auto;display:block}.gl{stroke:var(--line);stroke-width:1}.ax{fill:var(--mute);font-size:10px}
.bp{fill:none;stroke:var(--line2);stroke-dasharray:3 3}.ba{fill:var(--blue)}.ba.cur{fill:var(--coral)}
.bp2{fill:rgba(96,165,250,.26);stroke:rgba(96,165,250,.55);stroke-width:1}.ba2{fill:#3b82f6}.ba2.cur{fill:#ffb199}
.gridw{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px}
.gt{border-collapse:collapse;font-size:12px;width:max-content;min-width:100%}
.gt th{position:sticky;left:0;z-index:1;background:var(--surface2);text-align:left;font-weight:600;padding:10px 12px;min-width:130px;border-bottom:1px solid var(--line)}
.gt td{min-width:52px;text-align:center;padding:8px 4px;border-bottom:1px solid var(--line);color:var(--mute)}
.gt td.cw{background:rgba(59,130,246,.12)}
.gg{display:flex;flex-direction:column;gap:2px;align-items:center}
.gb{width:34px;height:6px;border:0;padding:0;border-radius:2px;background:var(--line2)}
.gb:hover:not(:disabled){background:var(--mute)}
.gb.vol.on{background:var(--blue)}.gb.rpe.on{background:var(--coral)}
.gv{margin-top:4px;font-size:11px;color:var(--text)}
.ba3{fill:#3b72d9}.bf{fill:rgba(59,114,217,.32)}
.chartw{overflow-x:auto;padding-bottom:4px}.bl{fill:var(--mute);font-size:11px}.bl.hi{fill:var(--text);font-weight:600}.rl{fill:#cdd6ee;font-size:11px}.rl.hi{fill:#ff9b80;font-weight:600;font-size:12px}
#tip{position:fixed;z-index:70;pointer-events:none;display:none;max-width:260px;background:#0b1220;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.5)}#tip b{display:block;font-size:13px;margin-bottom:2px}#tip span{display:block;color:var(--mute)}#tip span:last-child{color:var(--text)}
.chartw [data-tip]{cursor:pointer}.chartw rect[data-tip]:hover{filter:brightness(1.3)}
.ws{display:flex;gap:6px;margin-top:6px}.ws button{flex:1;padding:11px 0;border-radius:10px;border:2px solid transparent;background:color-mix(in srgb,var(--c) 16%,var(--surface2));font:700 20px var(--fd)}.ws button.on{background:var(--c);color:#07101f;border-color:#fff}
.wc{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--c);color:#07101f;font:700 16px var(--fd)}.wc.sm{width:24px;height:24px;border-radius:7px;font-size:13px}
.zb{cursor:pointer;font-size:13px;padding:6px 12px}.zb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line2)}
.tbl td{padding:8px;border-bottom:1px solid var(--line)}.tblw{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}.field input,.field select,.field textarea{color:var(--text);font-size:14px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
textarea{width:100%;min-height:70px;resize:vertical}
.empty{text-align:center;color:var(--mute);padding:28px 12px;border:1px dashed var(--line2);border-radius:14px}
.srow{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--c,var(--blue));border-radius:12px;background:var(--surface);margin-bottom:7px;cursor:pointer}
.srow:hover{border-color:var(--sky)}.srow b{display:block}
.rpeb{min-width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:700 17px var(--fd);background:var(--c);color:#07101f;flex:none}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:11px;color:var(--mute);text-align:center;text-transform:uppercase;letter-spacing:.08em}
.cell{min-height:92px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;cursor:pointer;overflow:hidden}
.cell.o{opacity:.45}.cell.t{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cell>b{font-size:12px;color:var(--mute)}
.cs{display:block;font-size:11px;padding:2px 5px;margin-top:3px;border-radius:5px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs.pend{outline:1px dashed var(--warn)}.cs.dn{opacity:.7}
.dots{display:none;gap:3px;flex-wrap:wrap;margin-top:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.tl{display:flex;height:34px;border-radius:10px;overflow:hidden;position:relative;margin:10px 0 16px}
.tl div{background:var(--c);display:grid;place-items:center;font-size:11px;font-weight:600;color:#06101f;overflow:hidden;white-space:nowrap}
.tl em{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff}
.rg{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px}.rg button{min-width:0;padding:0}
.rg button{aspect-ratio:1;border-radius:11px;border:2px solid transparent;background:color-mix(in srgb,var(--c) 22%,var(--surface2));font:700 22px var(--fd)}
.rg button.on{background:var(--c);color:#07101f;border-color:#fff}
.sc{display:flex;gap:5px}.sc button{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--line2);background:var(--surface2)}.sc button.on{background:var(--blue);border-color:var(--blue)}
.tag{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line2);font-size:13px;margin:0 6px 6px 0}
.tag button{background:none;border:0;color:var(--mute);padding:0}
.rrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.4fr auto;gap:6px;margin-bottom:6px}.rrow input{padding:7px}
.rrow.h{color:var(--mute);font-size:11px;text-transform:uppercase}
/* floating bar */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));height:66px;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;background:rgba(16,24,41,.86);backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:28px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:30}
#bar button{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;border-radius:18px}
#bar button.on{color:var(--sky)}#bar button.on span.ic{background:rgba(96,165,250,.16)}
#bar span.ic{padding:4px 14px;border-radius:14px;display:grid}
#bar button.mid{position:relative;top:-18px;color:#fff;padding:0}
#bar button.mid span.ic{width:58px;height:58px;padding:0;border-radius:50%;place-items:center;background:linear-gradient(145deg,#60a5fa,#2563eb);box-shadow:0 8px 24px rgba(37,99,235,.55);border:3px solid var(--bg);margin:0 auto}
#bar button.mid.on span.ic{box-shadow:0 8px 28px rgba(96,165,250,.8)}
#bar button.mid svg{width:26px;height:26px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(3,6,14,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.open{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:20px;width:min(560px,100%);max-height:92%;overflow-y:auto}.sheet.w{width:min(860px,100%)}
.sheet h2{font-size:26px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--text);color:#07101f;padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;display:none}
.mt{margin-top:14px}
@media(max-width:640px){
.rg{grid-template-columns:repeat(6,minmax(0,1fr))}
.crow{grid-template-columns:1fr}.cell{min-height:56px}.cs{display:none}.dots{display:flex}
.rrow{grid-template-columns:1fr 1fr}.rrow input:first-child{grid-column:1/-1}.staff{display:none}.ph h1{font-size:28px}}
@media(prefers-reduced-motion:no-preference){.btn,.gcard,.crow,.srow{transition:border-color .15s}}
</style>
</head>

<div id="root"><header class="top" id="top"></header><main id="app"></main></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=(p='')=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const fmtD=(s,o)=>parse(s).toLocaleDateString('fr-FR',o||{day:'numeric',month:'short'});
const fmtLong=s=>parse(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const ageOf=b=>{if(!b)return null;const d=parse(b),t=new Date();let a=t.getFullYear()-d.getFullYear();if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))a--;return a};
const sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>a.length?sum(a)/a.length:0;
const stdev=a=>{const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
const initials=n=>String(n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DOW=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const ICONS={home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',list:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 12h6M9 16h6"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',l:'<path d="m15 18-6-6 6-6"/>',r:'<path d="m9 18 6-6-6-6"/>',up:'<path d="m18 15-6-6-6 6"/>',dn:'<path d="m6 9 6 6 6-6"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',edit:'<path d="M17 3a2.85 2.85 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',check:'<path d="M20 6 9 17l-5-5"/>',target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',dumb:'<path d="M6.5 6.5 17.5 17.5M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7"/>',folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',ul:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>'};

function weekStats(cid,w,raw0){const e=addDays(w,6),cur=w<=TODAY&&TODAY<=e;const ss=S.sessions.filter(s=>s.clientId===cid&&s.date>=w&&s.date<=e);const pl=ss,dn=ss.filter(isDone);
const pv=sum(pl.map(s=>s.dur||0)),pL=sum(pl.map(s=>(s.rpeTarget||0)*(s.dur||0))),av=sum(dn.map(s=>s.durDone||s.dur||0)),aL=sum(dn.map(sLoad));
const raw={pv,pr:pv?pL/pv:null};const se=S.seasons[cid],t=!raw0&&se&&se.targets&&se.targets[w];let ppv=pv,ppr=pv?pL/pv:null,ppL=pL;if(t){if(t.vol!=null)ppv=t.vol;if(t.rpe!=null)ppr=t.rpe;ppL=ppv*(ppr||0)}
const th=parse(w);th.setDate(th.getDate()+3);const wk=Math.ceil(((th-new Date(th.getFullYear(),0,1))/864e5+1)/7);
return{w,wk,label:fmtD(w,{day:'numeric',month:'numeric'}),cur,past:e<TODAY,fut:w>TODAY,pv:ppv,pL:Math.round(ppL),pr:ppr,av,aL,ar:av?aL/av:null,n:ss.length,nd:dn.length,raw,gap:ppL>0&&e<TODAY?(aL-ppL)/ppL*100:null}}
function seasonChart(rows){const pc=(a,b)=>b?(a>=b?'+':'')+Math.round((a-b)/b*100)+' %':'';const T=(r,k)=>{const wt='Semaine S'+r.wk+' ('+fmtD(r.w,{day:'numeric',month:'short'})+' au '+fmtD(addDays(r.w,6),{day:'numeric',month:'short'})+')';return k==='pv'?'Volume prévu¦'+wt+'¦'+r.pv+' min · charge prévue '+r.pL+' UA':k==='av'?'Volume réalisé¦'+wt+'¦'+r.av+' min'+(r.pv?' ('+pc(r.av,r.pv)+' par rapport aux '+r.pv+' min prévues)':'')+'¦'+r.nd+' séance'+(r.nd>1?'s':'')+' avec RPE':k==='pr'?'Intensité prévue¦'+wt+'¦RPE moyen prévu : '+r.pr.toFixed(1):'Intensité réelle¦'+wt+'¦RPE moyen réel : '+r.ar.toFixed(1)+(r.pr!=null?' (prévu '+r.pr.toFixed(1)+')':'')+'¦Charge réelle : '+r.aL+' UA'};const slot=78,pl=10,pr=10,pt=22,pb=42,H=280,n=rows.length||1,W=pl+pr+n*slot,ih=H-pt-pb,base=pt+ih,bw=24;const mx=Math.max(60,...rows.map(r=>Math.max(r.pv,r.av)));const Yb=v=>base-ih*.55*v/mx,Yr=v=>pt+ih*.46*(1-v/10);let g='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+base+'" y2="'+base+'"/>',curX=null;
rows.forEach((r,i)=>{const cx=pl+slot*i+slot/2;if(r.cur){curX=cx;g+='<rect x="'+(cx-slot/2+2)+'" y="'+pt+'" width="'+(slot-4)+'" height="'+(ih+pb-6)+'" rx="10" fill="rgba(59,130,246,.09)"/>'}
const xp=cx-bw-2,xa=cx+2;if(r.pv){g+='<rect data-tip="'+esc(T(r,'pv'))+'" x="'+xp+'" y="'+Yb(r.pv)+'" width="'+bw+'" height="'+(base-Yb(r.pv))+'" rx="6" fill="'+(r.nd?'#3a4a70':'rgba(59,114,217,.4)')+'"/><text x="'+(xp+bw/2)+'" y="'+(Yb(r.pv)-5)+'" text-anchor="middle" class="bl">'+r.pv+'</text>'}

g+='<text class="ax" x="'+cx+'" y="'+(H-24)+'" text-anchor="middle" style="fill:var(--text);font-size:12px;font-weight:600">S'+r.wk+'</text><text class="ax" x="'+cx+'" y="'+(H-9)+'" text-anchor="middle">'+r.label+'</text>'});
const pts=k=>rows.map((r,i)=>r[k]!=null?[pl+slot*i+slot/2,Yr(r[k]),r[k]]:null),path=a=>{let d='',o=false;a.forEach(p=>{if(!p){o=false;return}d+=(o?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);o=true});return d};
const P=pts('pr'),A=pts('ar');g+='<path d="'+path(P)+'" fill="none" stroke="#e9eefb" stroke-width="1.8" stroke-dasharray="5 4" opacity=".75"/><path d="'+path(A)+'" fill="none" stroke="#080d19" stroke-width="6" opacity=".6"/><path d="'+path(A)+'" fill="none" stroke="#ff7a59" stroke-width="2.8" stroke-linejoin="round"/>';
g+='<path data-tip="'+esc('Courbe d\u2019intensité prévue¦RPE moyen prévu de chaque semaine, pondéré par la durée des séances')+'" d="'+path(P)+'" fill="none" stroke="transparent" stroke-width="14"/><path data-tip="'+esc('Courbe d\u2019intensité réelle¦RPE moyen réel de chaque semaine, pondéré par la durée des séances')+'" d="'+path(A)+'" fill="none" stroke="transparent" stroke-width="14"/>';
rows.forEach((r,i)=>{const p=P[i],a=A[i];if(p)g+='<circle data-tip="'+esc(T(r,'pr'))+'" cx="'+p[0]+'" cy="'+p[1]+'" r="11" fill="transparent"/>';if(a)g+='<circle data-tip="'+esc(T(r,'ar'))+'" cx="'+a[0]+'" cy="'+a[1]+'" r="11" fill="transparent"/>';if(p)g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.6" fill="#080d19" stroke="#e9eefb" stroke-width="1.6"/>';if(a)g+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4.6" fill="#ff7a59"/>';
const up=(a&&p)?a[2]>=p[2]:true;if(p)g+='<text x="'+p[0]+'" y="'+(p[1]+(up&&a?17:-9))+'" text-anchor="middle" class="rl">'+p[2].toFixed(1)+'</text>';if(a)g+='<text x="'+a[0]+'" y="'+(a[1]+(up||!p?-10:18))+'" text-anchor="middle" class="rl hi">'+a[2].toFixed(1)+'</text>'});
return'<div class="chartw" id="chartw" data-cur="'+(curX||0)+'"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Volume en minutes et intensité moyenne par semaine, prévu et réalisé">'+g+'</svg></div><div class="leg"><span><i style="background:#3a4a70"></i>Volume prévu (min)</span><span><i style="background:#3b72d9"></i>Volume réalisé (min)</span><span><i style="border-top:2px dashed #e9eefb;height:0;vertical-align:3px"></i>RPE prévu</span><span><i style="background:#ff7a59;height:4px;vertical-align:3px"></i>RPE réel</span></div>'}
function seasonAnalysis(cid,s0,nw){const rows=[];for(let i=0;i<nw;i++)rows.push(weekStats(cid,addDays(s0,7*i)));const done=rows.filter(r=>r.past&&r.pv>0),ro=!isCoach();
const tp=sum(done.map(r=>r.pv)),ta=sum(done.map(r=>r.av)),lp=sum(done.map(r=>r.pL)),la=sum(done.map(r=>r.aL));const rec=done.slice(-2),mg=rec.length?avg(rec.map(r=>r.gap)):null;const nxt=rows.find(r=>r.fut||r.cur&&r.w+6>=TODAY&&r.w>TODAY)||rows.find(r=>r.fut);

const tbl='<div class="tblw"><table class="tbl"><tr><th>Semaine</th><th>Volume prévu</th><th>Volume réel</th><th>Charge prévue</th><th>Charge réelle</th><th>Écart</th><th>RPE moy. prévu / réel</th><th></th></tr>'+rows.map(r=>{const z=r.gap==null?'':Math.abs(r.gap)<=10?'good':Math.abs(r.gap)<=25?'warn':'bad';return'<tr'+(r.cur?' style="background:rgba(59,130,246,.1)"':'')+'><td>'+r.label+(r.cur?' <span class="pill blue">en cours</span>':'')+'</td><td>'+r.pv+' min</td><td>'+(r.nd?r.av+' min':'–')+'</td><td>'+r.pL+'</td><td>'+(r.nd?r.aL:'–')+'</td><td>'+(r.gap!=null?'<span class="pill '+z+'">'+(r.gap>0?'+':'')+Math.round(r.gap)+' %</span>':'–')+'</td><td>'+(r.pr!=null?r.pr.toFixed(1):'–')+' / '+(r.ar!=null?r.ar.toFixed(1):'–')+'</td><td>'+(!ro&&(r.fut||r.cur)&&r.n?'<button class="btn s" data-act="weekAdjust" data-c="'+cid+'" data-w="'+r.w+'">Moduler</button>':'')+'</td></tr>'}).join('')+'</table></div>';
return'<div class="kpis mt"><div class="kpi"><small>Volume réalisé / prévu</small><b>'+h(ta)+'</b><span>prévu '+h(tp)+' ('+pct(ta,tp)+')</span></div><div class="kpi"><small>Charge réalisée / prévue</small><b>'+la.toLocaleString('fr-FR')+'</b><span>prévu '+lp.toLocaleString('fr-FR')+' UA ('+pct(la,lp)+')</span></div><div class="kpi"><small>RPE moyen réel / prévu</small><b>'+(ta?(la/ta).toFixed(1):'–')+'</b><span>prévu '+(tp?(lp/tp).toFixed(1):'–')+'</span></div></div>'+tip+'<div class="card mt"><h3>Volume (barres) et intensité (courbe)</h3>'+seasonChart(rows)+'</div>'+seasonGrid(cid,rows)+'<div class="card mt"><h3>Prévu et réalisé semaine par semaine</h3><p class="sub">Charge = RPE × minutes (UA). L\u2019écart se calcule sur les semaines terminées.</p>'+tbl+'</div>'}

function pdfPage(doc,it,cl){const W=210,M=14,CW=[62,28,32,28,32],H=HEAD[it.kind]||HEAD.libre;let y;
doc.setFillColor(8,13,25);doc.rect(0,0,W,30,'F');doc.setFillColor(59,130,246);doc.rect(0,30,W,1.4,'F');doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(255,255,255);doc.text('Elite',M,15);doc.setTextColor(255,122,89);doc.text('Adapt',M+doc.getTextWidth('Elite '),15);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(160,175,205);doc.text('COACHING INDIVIDUEL',M,21);doc.text(S.settings.coach,W-M,15,{align:'right'});
y=44;doc.setTextColor(15,23,42);doc.setFont('helvetica','bold');doc.setFontSize(20);const tl=doc.splitTextToSize(it.title,W-2*M);doc.text(tl,M,y);y+=tl.length*8;doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90,100,125);doc.text([cl?cl.name:'',it.date?fmtLong(it.date):''].filter(Boolean).join('  |  '),M,y);y+=6;doc.text('Durée prévue : '+(it.dur||'-')+' min   |   RPE cible : '+(it.rpeTarget||it.rpe||'-')+' / 10',M,y);y+=9;
const head=()=>{doc.setFillColor(37,99,235);doc.rect(M,y,W-2*M,7,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(8.5);let x=M;H.forEach((h,i)=>{doc.text(h,x+2,y+4.8);x+=CW[i]});y+=7};
if(it.kind==='pdf'){doc.text('Document PDF joint.',M,y);return}
head();doc.setFont('helvetica','normal');doc.setFontSize(9);(it.rows||[]).forEach((r,n)=>{const cells=['a','b','c','d','e'].map((k,i)=>doc.splitTextToSize(r[k]||'',CW[i]-4));const h=Math.max(...cells.map(c=>c.length))*4.2+3.4;if(y+h>272){doc.addPage();y=20;head();doc.setFont('helvetica','normal');doc.setFontSize(9)}
if(n%2===0){doc.setFillColor(243,246,252);doc.rect(M,y,W-2*M,h,'F')}doc.setTextColor(15,23,42);let x=M;cells.forEach((c,i)=>{doc.setFont('helvetica',i===0?'bold':'normal');doc.text(c,x+2,y+4.6);x+=CW[i]});y+=h});
if(it.notes){y+=7;if(y>255){doc.addPage();y=20}doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(37,99,235);doc.text('Consignes',M,y);y+=5;doc.setFont('helvetica','normal');doc.setTextColor(40,50,70);const nl=doc.splitTextToSize(it.notes,W-2*M);doc.text(nl,M,y);y+=nl.length*4.6}
y+=8;if(y<262){doc.setDrawColor(59,130,246);doc.roundedRect(M,y,W-2*M,14,3,3);doc.setFontSize(9);doc.setTextColor(40,50,70);doc.text('Après la séance, note ton RPE (0 à 10) et ta durée dans l’application Elite Adapt.',M+4,y+8.5)}}
function buildPDF(items,cl){const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});items.forEach((it,i)=>{if(i)doc.addPage();pdfPage(doc,it,cl)});return doc}
const capCache={};async function cap(n){if(!(n in capCache)){try{capCache[n]=await window.claude.use(n)}catch(e){capCache[n]=null}}return capCache[n]}
function textOf(it){return[it.title,it.date||'',...(it.rows||[]).map(r=>[r.a,r.b,r.c,r.d,r.e].filter(Boolean).join(' | ')),it.notes||''].join('\n')}
async function saveFile(name,blob,fallback){
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500);toast('Fichier téléchargé');return}catch(e){}
  openModal('<h2>Téléchargement indisponible</h2><p class="sub">Copie le contenu ci-dessous.</p><textarea readonly style="min-height:220px">'+esc(fallback||'')+'</textarea><div class="row mt"><span class="sp"></span><button class="btn p" data-act="closeModal">Fermer</button></div>')}
async function exportPDF(items,cl,name){if(!window.jspdf){toast('Le module PDF n’a pas pu se charger');return}try{const doc=buildPDF(items,cl);await saveFile(name+'.pdf',doc.output('blob'),items.map(textOf).join('\n\n'))}catch(e){toast('Export impossible : '+e.message)}}
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function dataToBlob(u){const p=u.split(','),m=/:(.*?);/.exec(p[0])[1],b=atob(p[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:m})}
function fileSize(){return sum(Object.values(S.files).map(x=>x.length))}
function pickFile(cb){const i=document.createElement('input');i.type='file';i.accept='application/pdf';i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>250*1024||fileSize()+f.size*1.4>700*1024){toast('PDF trop lourd (250 Ko max, 700 Ko au total)');return}const r=new FileReader();r.onload=()=>cb(f,r.result);r.readAsDataURL(f)};i.click()}

const tdef=id=>S.catalog.find(t=>t.id===id);
const fv=v=>(+(+v).toFixed(2)).toString().replace('.',',');
function tResults(c,tid){const t=(c.tests||[]).find(x=>x.tid===tid);return t?t.entries.slice().sort((a,b)=>a.date.localeCompare(b.date)):[]}
function addResult(cid,tid,date,value,note){const c=client(cid),d=tdef(tid);c.tests=c.tests||[];let t=c.tests.find(x=>x.tid===tid);if(!t){t={id:uid('t'),tid,name:d.name,unit:d.unit,better:d.better,entries:[]};c.tests.push(t)}t.entries.push({date,value:+value,note:note||''})}
const tBest=(es,b)=>b==='low'?Math.min(...es.map(e=>e.value)):b==='high'?Math.max(...es.map(e=>e.value)):es[es.length-1].value;
const dpill=(dv,better,unit)=>{if(!dv)return'';const c=better==='none'?'blue':((better==='low'?dv<0:dv>0)?'good':'warn');return'<span class="pill '+c+'">'+(dv>0?'+':'')+fv(dv)+' '+esc(unit)+'</span>'};
const tcatPill=d=>'<span class="pill" style="--c:'+TCOL[d.cat]+'">'+TCATS[d.cat]+'</span>';
const tcatChips=(act,cur)=>'<div class="row" style="margin-bottom:12px">'+[['all','Tous']].concat(Object.keys(TCATS).map(k=>[k,TCATS[k]])).map(x=>'<button class="chip" style="'+(cur===x[0]?'background:var(--blue);border-color:var(--blue)':'')+'" data-act="'+act+'" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';

function testCard(c,t){const d=tdef(t.tid)||{name:t.name,unit:t.unit,better:t.better,cat:'perso',desc:''};const es=t.entries.map((e,i)=>Object.assign({i},e)).sort((a,b)=>a.date.localeCompare(b.date));if(!es.length)return'';
const last=es[es.length-1],prev=es[es.length-2],first=es[0],best=tBest(es,d.better),pr=es.length>1&&d.better!=='none'&&last.value===best;
const oth=S.clients.filter(x=>x.id!==c.id).map(x=>tResults(x,t.tid)).filter(r=>r.length).map(r=>r[r.length-1].value),grp=oth.length?avg(oth):null;
return'<div class="card"><div class="row">'+tcatPill(d)+'<span class="sp"></span><button class="btn s p" data-act="resultAdd" data-c="'+c.id+'" data-t="'+t.tid+'" aria-label="Ajouter un résultat">'+ic('plus')+'</button></div><h3 style="margin-top:6px">'+esc(d.name)+'</h3><div class="row" style="align-items:baseline"><b style="font:700 36px var(--fd)">'+fv(last.value)+'</b><span class="sub">'+esc(d.unit)+' · '+fmtD(last.date,{day:'numeric',month:'short',year:'numeric'})+'</span>'+(pr?'<span class="pill good">Record</span>':'')+'</div><div class="row" style="margin:4px 0 8px">'+(prev?dpill(+(last.value-prev.value).toFixed(2),d.better,d.unit)+'<span class="sub">vs test précédent</span>':'')+(es.length>2?dpill(+(last.value-first.value).toFixed(2),d.better,d.unit)+'<span class="sub">depuis le début</span>':'')+'</div>'+lineChart(es.map(e=>({l:fmtD(e.date),v:e.value})),{u:d.unit,color:TCOL[d.cat],h:120})+'<p class="sub" style="margin:8px 0 4px">Meilleur : <b style="color:var(--text)">'+fv(best)+' '+esc(d.unit)+'</b>'+(grp!=null?' · moyenne du groupe (dernier test) : <b style="color:var(--text)">'+fv(grp)+'</b>':'')+'</p><div class="tblw"><table class="tbl"><tr><th>Date</th><th>Valeur</th><th>Note</th><th></th></tr>'+es.slice().reverse().slice(0,4).map(e=>'<tr><td>'+fmtD(e.date,{day:'numeric',month:'short',year:'numeric'})+'</td><td><b>'+fv(e.value)+'</b> '+esc(d.unit)+'</td><td>'+esc(e.note||'')+'</td><td><button class="btn s d" data-act="resDel" data-t="'+t.tid+'" data-e="'+e.i+'" aria-label="Supprimer">'+ic('x')+'</button></td></tr>').join('')+'</table></div></div>'}
function tabTests(c){const f=ui.testCat||'all',have=(c.tests||[]).filter(t=>t.entries.length),rec=S.catalog.filter(d=>d.for.includes(catOf(c))&&!have.some(t=>t.tid===d.id)).slice(0,8);

function latestAll(tid){return S.clients.map(c=>{const r=tResults(c,tid);return r.length?{c,last:r[r.length-1],prev:r[r.length-2],best:tBest(r,(tdef(tid)||{}).better)}:null}).filter(Boolean)}
function sortRank(l,better){return l.slice().sort((a,b)=>better==='low'?a.last.value-b.last.value:better==='high'?b.last.value-a.last.value:a.c.name.localeCompare(b.c.name))}
function ovTests(){const f=ui.tcat||'all',l=S.catalog.filter(d=>f==='all'||d.cat===f).filter(d=>!ui.tq||d.name.toLowerCase().includes(ui.tq.toLowerCase()));

function openRank(tid){const d=tdef(tid),r=sortRank(latestAll(tid),d.better),vals=r.map(x=>x.last.value),mx=Math.max(...vals),mn=Math.min(...vals);

/* ---------- wellness quotidien ---------- */
const WITEMS=[['sleep','Sommeil','Qualité de ta nuit'],['energy','Énergie','Fraîcheur du jour (5 = en pleine forme)'],['sore','Courbatures','Douleurs musculaires (5 = aucune)'],['stress','Stress','Niveau de stress (5 = serein)'],['mood','Humeur','Moral général']];
const WLAB=['','Très mauvais','Mauvais','Moyen','Bon','Très bon'];
const WCOL=['','#ef4444','#f97316','#facc15','#84cc16','#22c55e'];
const ZONES=['Cou','Épaule','Dos','Hanche','Cuisse','Genou','Mollet','Cheville','Pied','Autre'];
const wScore=w=>Math.round((WITEMS.reduce((a,i)=>a+(w[i[0]]||0),0)-5)/20*100);
const wStatus=w=>{const s=wScore(w),mn=Math.min(...WITEMS.map(i=>w[i[0]]||5));return s<50||mn===1?{c:'bad',l:'À surveiller'}:s<70||mn===2?{c:'warn',l:'Vigilance'}:{c:'good',l:'En forme'}};
const wOf=(cid,d)=>S.wellness.find(w=>w.clientId===cid&&w.date===d);
const wList=cid=>S.wellness.filter(w=>w.clientId===cid).sort((a,b)=>a.date.localeCompare(b.date));
const wc=(v,sm)=>'<span class="wc'+(sm?' sm':'')+'" style="--c:'+WCOL[v]+'">'+v+'</span>';
const wAvg=(cid,from,to)=>{const l=wList(cid).filter(w=>w.date>=from&&w.date<=to);return l.length?avg(l.map(wScore)):null};
const saisieSeg=()=>segHTML('saisieTab',ui.saisieTab||'wellness',[['wellness','Wellness du jour'],['rpe','RPE séance']]);
function viewSaisie(){return ui.saisieTab==='rpe'?viewRpe():viewWellness()}
function wCta(c){const w=wOf(c.id,TODAY);if(!w)return'<div class="card" style="margin-bottom:12px;border-color:var(--blue)"><h3>Questionnaire wellness du jour</h3><p class="sub" style="margin:0 0 10px">1 minute : sommeil, énergie, courbatures, stress, humeur.</p><button class="btn p" data-act="nav" data-p="rpe" data-tab="wellness">'+ic('zap')+' Remplir maintenant</button></div>';const s=wStatus(w);return'<div class="card" style="margin-bottom:12px"><div class="row"><h3 class="sp">Wellness du jour</h3><span class="pill '+s.c+'">'+s.l+'</span></div><b style="font:700 34px var(--fd)">'+wScore(w)+'</b> <span class="sub">/ 100</span></div>'}
function wTile(c){const w=wOf(c.id,TODAY);return w?'<div class="kpi"><small>Wellness du jour</small><b>'+wScore(w)+'</b><span>'+wStatus(w).l+'</span></div>':'<div class="kpi"><small>Wellness du jour</small><b>–</b><span>Non rempli</span></div>'}
function wMissing(){const l=S.clients.filter(c=>!wOf(c.id,TODAY));return'<h3 class="mt" style="margin-bottom:8px">Wellness non rempli ('+l.length+')</h3>'+(l.map(c=>'<div class="srow" style="--c:var(--warn)" data-act="openWellness" data-id="'+c.id+'"><div class="sp"><b>'+esc(c.name)+'</b></div><span class="pill warn">À relancer</span></div>').join('')||empty('Tout le monde a répondu.'))}
function viewWellness(){const coach=isCoach();if(!coach)ui.rpeClient=ui.athleteId;if(!ui.rpeClient||!client(ui.rpeClient))ui.rpeClient=(S.clients[0]||{}).id;const c=client(ui.rpeClient);if(!c)return empty('Ajoute un client pour saisir un questionnaire.');
const sel=coach?'<div class="row" style="margin-bottom:12px">'+S.clients.map(x=>'<button class="chip" style="'+(x.id===c.id?'background:var(--blue);border-color:var(--blue)':'')+'" data-act="rpeClient" data-id="'+x.id+'">'+esc(x.name)+(wOf(x.id,TODAY)?' ✓':'')+'</button>').join('')+'</div>':'';
if(ui.wDone){const d=ui.wDone;return pageHead('Saisie','Questionnaire enregistré')+saisieSeg()+'<div class="card" style="text-align:center"><b style="font:700 64px var(--fd);color:'+(d.st.c==='good'?'var(--good)':d.st.c==='warn'?'var(--warn)':'var(--bad)')+'">'+d.score+'</b><div class="sub">sur 100</div><span class="pill '+d.st.c+'">'+d.st.l+'</span><p class="mt">'+(d.st.c==='good'?'Belle forme, bonne séance.':'Ton coach voit ce résultat et pourra adapter la séance.')+'</p><div class="row mt" style="justify-content:center"><button class="btn p" data-act="wRpe">Saisir un RPE</button><button class="btn" data-act="wHist">Voir l’historique</button></div></div>'}
const d=ui.wDate||TODAY,ex=wOf(c.id,d)||{};ui.wZones=(ex.zones||[]).slice();ui.zPick=null;
return pageHead('Saisie','Questionnaire wellness quotidien')+saisieSeg()+sel+'<form class="card" data-form="wellness" id="wf"><div class="row"><h3 class="sp">Comment te sens-tu ?</h3><input type="date" id="wDate" value="'+d+'" max="'+TODAY+'" min="'+addDays(TODAY,-14)+'" aria-label="Date du questionnaire"></div>'+(coach?'<p class="sub">Saisie pour '+esc(c.name)+'.</p>':'')+(ex.id?'<p class="sub">Déjà rempli pour ce jour : tu peux le modifier.</p>':'')
+WITEMS.map(i=>'<div class="mt"><b>'+i[1]+'</b> <span class="sub">'+i[2]+'</span><div class="ws" data-ws="'+i[0]+'">'+[1,2,3,4,5].map(n=>'<button type="button" style="--c:'+WCOL[n]+'" class="'+(ex[i[0]]===n?'on':'')+'" data-act="wPick" data-k="'+i[0]+'" data-v="'+n+'" aria-label="'+i[1]+' '+n+' : '+WLAB[n]+'">'+n+'</button>').join('')+'</div></div>').join('')
+'<p class="sub">1 = très mauvais · 5 = très bon</p><div class="fg mt">'+field('Heures de sommeil','<input name="hours" type="number" step=".25" min="0" max="16" value="'+(ex.hours||'')+'">')+field('FC de repos (bpm)','<input name="rhr" type="number" min="25" max="140" value="'+(ex.rhr||'')+'">')+field('Poids du matin (kg)','<input name="weight" type="number" step=".1" value="'+(ex.weight||'')+'">')+'</div><h3 class="mt" style="font-size:16px">Zones de gêne ou de douleur</h3><div class="row" id="zones">'+zonesHTML()+'</div><p class="sub">Pour une zone latérale (genou, cheville…), choisis le côté.</p><div class="mt">'+field('Commentaire','<textarea name="comment" placeholder="Précisions, douleur, contexte">'+esc(ex.comment||'')+'</textarea>')+'</div><div class="row mt"><span class="sub" id="wscore"></span><span class="sp"></span><button class="btn p" type="submit">'+ic('check')+' Enregistrer</button></div></form>'}
/* ---------- suivi coach ---------- */
function ovWellness(){const rows=S.clients.map(c=>({c,w:wOf(c.id,TODAY)})),fl=rows.filter(r=>r.w),st=fl.map(r=>wStatus(r.w));
const tr=c=>{const a=wAvg(c.id,addDays(TODAY,-6),TODAY),b=wAvg(c.id,addDays(TODAY,-13),addDays(TODAY,-7));if(a==null||b==null)return'<span class="sub">–</span>';const d=Math.round(a-b);return'<span class="pill '+(d>=5?'good':d<=-5?'warn':'blue')+'">'+(d>0?'+':'')+d+'</span>'};
return'<div class="kpis"><div class="kpi"><small>Réponses du jour</small><b>'+fl.length+' / '+rows.length+'</b><span>'+(rows.length-fl.length)+' à relancer</span></div><div class="kpi"><small>À surveiller</small><b style="color:var(--bad)">'+st.filter(s=>s.c==='bad').length+'</b><span>statut rouge</span></div><div class="kpi"><small>Vigilance</small><b style="color:var(--warn)">'+st.filter(s=>s.c==='warn').length+'</b><span>statut orange</span></div><div class="kpi"><small>Score moyen</small><b>'+(fl.length?Math.round(avg(fl.map(r=>wScore(r.w)))):'–')+'</b><span>sur 100</span></div></div><div class="card"><div class="tblw"><table class="tbl"><tr><th>Client</th>'+WITEMS.map(i=>'<th>'+i[1]+'</th>').join('')+'<th>Score</th><th>Sommeil (h)</th><th>Gênes</th><th>Tendance 7 j</th><th></th></tr>'+rows.map(r=>{const w=r.w,s=w&&wStatus(w);return'<tr style="cursor:pointer" data-act="openWellness" data-id="'+r.c.id+'"><td><b>'+esc(r.c.name)+'</b></td>'+(w?WITEMS.map(i=>'<td>'+wc(w[i[0]],1)+'</td>').join('')+'<td><span class="pill '+s.c+'">'+wScore(w)+'</span></td><td>'+(w.hours||'–')+'</td><td>'+esc((w.zones||[]).join(', ')||'–')+'</td>':'<td colspan="8"><span class="pill warn">Non rempli aujourd’hui</span></td>')+'<td>'+tr(r.c)+'</td><td><button class="btn s" data-act="wFor" data-id="'+r.c.id+'">'+ic('edit')+'</button></td></tr>'}).join('')+'</table></div></div><p class="sub mt">Score = moyenne des 5 réponses ramenée sur 100. Statut rouge sous 50, orange sous 70, ou dès qu’une réponse est à 1 ou 2.</p>'}
function tabWellness(c){const l=wList(c.id),t=wOf(c.id,TODAY),a7=wAvg(c.id,addDays(TODAY,-6),TODAY),a28=wAvg(c.id,addDays(TODAY,-27),TODAY),h=l.filter(w=>w.date>=addDays(TODAY,-6)&&w.hours).map(w=>+w.hours),n28=l.filter(w=>w.date>=addDays(TODAY,-27)).length;
const days=[];for(let i=13;i>=0;i--)days.push(addDays(TODAY,-i));
const hm='<div class="tblw"><table class="tbl hm"><tr><th></th>'+days.map(d=>'<th style="text-align:center;padding:4px 2px">'+parse(d).getDate()+'</th>').join('')+'</tr>'+WITEMS.map(i=>'<tr><th scope="row" style="text-transform:none;font-size:12px;color:var(--text)">'+i[1]+'</th>'+days.map(d=>{const w=wOf(c.id,d);return'<td style="text-align:center;padding:3px">'+(w?'<span class="wc sm" style="--c:'+WCOL[w[i[0]]]+'" data-tip="'+esc(i[1]+'¦'+fmtD(d,{day:'numeric',month:'long'})+'¦'+w[i[0]]+' / 5 : '+WLAB[w[i[0]]])+'">'+w[i[0]]+'</span>':'<span class="sub">·</span>')+'</td>'}).join('')+'</tr>').join('')+'<tr><th scope="row" style="text-transform:none;font-size:12px;color:var(--text)">Score</th>'+days.map(d=>{const w=wOf(c.id,d);return'<td style="text-align:center;padding:3px;font-size:11px">'+(w?'<b style="color:var(--'+wStatus(w).c+')">'+wScore(w)+'</b>':'<span class="sub">·</span>')+'</td>'}).join('')+'</tr></table></div>';
const zc={};l.filter(w=>w.date>=addDays(TODAY,-13)).forEach(w=>(w.zones||[]).forEach(z=>zc[z]=(zc[z]||0)+1));
const cm=l.filter(w=>w.comment).slice(-5).reverse();
return'<div class="kpis">'+wTile(c)+'<div class="kpi"><small>Moyenne 7 jours</small><b>'+(a7!=null?Math.round(a7):'–')+'</b><span>sur 100</span></div><div class="kpi"><small>Moyenne 28 jours</small><b>'+(a28!=null?Math.round(a28):'–')+'</b><span>'+n28+' jours remplis</span></div><div class="kpi"><small>Sommeil (7 j)</small><b>'+(h.length?(avg(h)).toFixed(1).replace('.',','):'–')+'</b><span>heures par nuit</span></div></div><div class="row" style="margin-bottom:12px"><button class="btn p" data-act="wFor" data-id="'+c.id+'">'+ic('edit')+' '+(t?'Modifier':'Remplir')+' le questionnaire du jour</button></div><div class="grid g2"><div class="card"><h3>Score wellness (30 jours)</h3>'+lineChart(l.filter(w=>w.date>=addDays(TODAY,-29)).map(w=>({l:fmtD(w.date),v:wScore(w)})),{min:0,max:100,color:'var(--good)',u:'/100'})+'</div><div class="card"><h3>Zones de gêne (14 jours)</h3>'+(Object.keys(zc).length?Object.keys(zc).sort((a,b)=>zc[b]-zc[a]).map(z=>'<span class="tag" style="border-color:var(--warn)">'+z+' · '+zc[z]+' j</span>').join(''):'<p class="sub">Aucune gêne signalée.</p>')+'<h3 class="mt" style="font-size:16px">Derniers commentaires</h3>'+(cm.map(w=>'<div class="srow" style="cursor:default"><div class="sp"><small class="sub">'+fmtD(w.date,{day:'numeric',month:'long'})+'</small><div>'+esc(w.comment)+'</div></div></div>').join('')||'<p class="sub">Aucun commentaire.</p>')+'</div></div><div class="card mt"><h3>14 derniers jours</h3>'+hm+'</div>'}

/* ---------- synchronisation (serveur Elite Adapt /api/storage + hors-ligne) ----------
   Tout l'état S est enregistré en ligne sous une seule clé « ci:state ». À chaque modif :
   enregistrement local immédiat (localStorage, via lsSave) PUIS envoi au serveur. Si le
   réseau est coupé, on marque une poussée « en attente » et on réessaie au retour de la
   connexion. Une relecture régulière récupère les changements faits depuis un autre appareil. */
const RKEY='ci:state';
const myId=uid('v');
let pushT=null,_pushing=false,_pendPush=false;
function queueRemote(){clearTimeout(pushT);pushT=setTimeout(pushNow,900)}
async function pushNow(){
  if(_pushing){_pendPush=true;return}
  _pushing=true;
  const payload=JSON.stringify({json:JSON.stringify(S),t:S._t||0,by:myId});
  try{
    if(payload.length>950000){ui.sync='loc';toast('Données trop volumineuses pour la synchronisation');}
    else{
      const r=await fetch('/api/storage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set',key:RKEY,value:payload})});
      if(!r.ok)throw 0;
      try{localStorage.removeItem(RKEY+':pending')}catch(e){}
      ui.sync='on';
    }
  }catch(e){
    try{localStorage.setItem(RKEY+':pending','1')}catch(e){}
    ui.sync='loc';
  }
  _pushing=false;offBadge();
  if(_pendPush){_pendPush=false;queueRemote()}
}
function adopt(r){S=fixSchema(r);lsSave();if(ui.modal)ui.dirty=true;else rerender()}
/* undefined = réseau KO ; null = en ligne mais rien d'enregistré ; sinon {S,t,by} */
async function pullRemote(){
  try{
    const r=await fetch('/api/storage?action=get&key='+encodeURIComponent(RKEY)+'&_='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    const j=await r.json();
    if(j&&j.value){const w=JSON.parse(j.value);if(w&&w.json)return{S:JSON.parse(w.json),t:w.t||0,by:w.by};}
    return null;
  }catch(e){return undefined;}
}
async function initRemote(fresh){
  const rem=await pullRemote();
  if(rem){                                   // des données existent en ligne
    clearTimeout(pushT);                      // annule une éventuelle poussée de démonstration
    if(fresh||(rem.t||0)>(S._t||0)||!S._t)adopt(rem.S); // au 1er démarrage, le serveur fait foi
    else queueRemote();                       // le local est plus récent → on pousse
    ui.sync='on';
  }else if(rem===null){                       // en ligne, rien d'enregistré → on pousse notre état
    queueRemote();ui.sync='on';
  }else{                                       // hors-ligne : on garde le local
    ui.sync='loc';
  }
  if(!ui.modal)rerender();offBadge();
  try{if(localStorage.getItem(RKEY+':pending')&&navigator.onLine!==false)queueRemote();}catch(e){}
  // réception des changements d'un autre appareil (relecture légère régulière)
  setInterval(async()=>{
    if(document.hidden||ui.modal||navigator.onLine===false)return;
    const x=await pullRemote();
    if(x&&x.by!==myId&&(x.t||0)>(S._t||0))adopt(x.S);
  },20000);
  window.addEventListener('online',()=>{offBadge();let p=false;try{p=!!localStorage.getItem(RKEY+':pending')}catch(e){}if(p)queueRemote();});
  window.addEventListener('offline',()=>{ui.sync='loc';offBadge();if(!ui.modal)rerender();});
}
/* Bandeau discret quand on est hors-ligne : les saisies sont gardées et seront synchronisées. */
function offBadge(){
  const offline=(typeof navigator!=='undefined'&&navigator.onLine===false);
  let pending=false;try{pending=!!localStorage.getItem(RKEY+':pending')}catch(e){}
  let el=document.getElementById('offline-banner');
  if(!el){if(!document.body)return;el=document.createElement('div');el.id='offline-banner';document.body.appendChild(el);
    const s=document.createElement('style');s.textContent="#offline-banner{position:fixed;left:0;right:0;top:0;z-index:9999;transform:translateY(-120%);transition:transform .3s;font:600 13px/1.3 var(--fb);padding:8px 14px;text-align:center;color:#fff;background:linear-gradient(90deg,#f59e0b,#ef4444);box-shadow:0 2px 10px rgba(0,0,0,.25)}#offline-banner.show{transform:translateY(0)}";document.head.appendChild(s);}
  if(offline||pending){el.className='show';el.textContent=offline?'Hors-ligne — tes saisies sont enregistrées et seront synchronisées':'Synchronisation en attente…';}
  else el.className='';
}
/* ---------- démarrage ---------- */
(function boot(){
  let fresh=false;
  try{const raw=localStorage.getItem(LS);if(raw)S=fixSchema(JSON.parse(raw))}catch(e){}
  if(!S||!S.clients.length&&!S.programs.length){seedData();fresh=true;}
  ui.athleteId=(S.clients[0]||{}).id;render();initRemote(fresh);
  if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})});}
})();
