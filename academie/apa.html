/* ===== Backend Blueperf : /api/storage (comme le reste de l'app), remplace window.claude =====
   Chaque collection est un objet {id:données} stocké sous la clé "<space>:<collection>". */
function makeApaDb(prefix){
  const cache={},listeners={},timers={};
  async function fetchCol(col){try{const r=await fetch('/api/storage?action=get&key='+encodeURIComponent(prefix+':'+col)+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)return{};const j=await r.json();return j&&j.value?JSON.parse(j.value):{};}catch(e){return{};}}
  async function saveCol(col){try{await fetch('/api/storage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set',key:prefix+':'+col,value:JSON.stringify(cache[col]||{})})});}catch(e){}}
  function emit(col){const map=cache[col]||{};const docs=Object.keys(map).map(id=>({id,data:()=>map[id]}));(listeners[col]||[]).forEach(cb=>{try{cb({docs});}catch(e){}});}
  function ensureTimer(col){if(timers[col])return;timers[col]=setInterval(async()=>{const m=await fetchCol(col);cache[col]=m;emit(col);},8000);}
  const addL=(col,cb)=>{(listeners[col]=listeners[col]||[]).push(cb);return()=>{const a=listeners[col]||[];const i=a.indexOf(cb);if(i>=0)a.splice(i,1);};};
  const split=p=>{const i=p.indexOf('/');return[p.slice(0,i),p.slice(i+1)];};
  return {
    collection(col){return{onSnapshot(cb,err){const off=addL(col,cb);fetchCol(col).then(m=>{cache[col]=m;emit(col);}).catch(e=>{if(err)err(e);});ensureTimer(col);return off;}};},
    doc(path){const[col,id]=split(path);return{
      async set(obj){if(cache[col]===undefined)cache[col]=await fetchCol(col);cache[col][id]=obj;emit(col);await saveCol(col);},
      async get(){if(cache[col]===undefined)cache[col]=await fetchCol(col);const d=cache[col][id];return{exists:d!==undefined,data:()=>d};},
      async delete(){if(cache[col]===undefined)cache[col]=await fetchCol(col);delete cache[col][id];emit(col);await saveCol(col);},
      onSnapshot(cb,err){const wrap=()=>{const d=(cache[col]||{})[id];cb({exists:d!==undefined,data:()=>d});};const off=addL(col,wrap);fetchCol(col).then(m=>{cache[col]=m;wrap();}).catch(e=>{if(err)err(e);});ensureTimer(col);return off;}
    };}
  };
}
/* Crée le dossier d'un client venu de l'espace de connexion partagé (clé = son identifiant). */
async function ensureClient(code,name){
  try{const c=await ctx.db.doc('clients/'+code).get();
    if(!c.exists){const parts=(name||'').trim().split(/\s+/);await ctx.db.doc('clients/'+code).set({p:{prenom:parts[0]||name||'',nom:parts.slice(1).join(' ')},t:{},created:new Date().toISOString()});}
    const a=await ctx.db.doc('assign/'+code).get();if(!a.exists)await ctx.db.doc('assign/'+code).set({rm:[]});
    const l=await ctx.db.doc('links/'+code).get();if(!l.exists)await ctx.db.doc('links/'+code).set({code,at:new Date().toISOString()});
  }catch(e){}
}

/* courbe SVG minimaliste */
function lineChart(series){const pts=series.filter(p=>Number.isFinite(p.v));if(pts.length<2)return'';
 const W=320,H=94,pl=8,pr=8,pt=10,pb=20;
 const xs=i=>pl+i*(W-pl-pr)/(pts.length-1);
 let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));if(mn===mx){mn-=1;mx+=1}
 const ys=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 const d=pts.map((p,i)=>`${i?'L':'M'}${xs(i).toFixed(1)} ${ys(p.v).toFixed(1)}`).join(' ');
 const dots=pts.map((p,i)=>`<circle class="dot" cx="${xs(i).toFixed(1)}" cy="${ys(p.v).toFixed(1)}" r="3"/>`).join('');
 const labs=pts.map((p,i)=>`<text x="${xs(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(p.lab||'')}</text>`).join('');
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution"><line class="axis" x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}"/><path class="ln" d="${d}"/>${dots}${labs}</svg>`}

 color=color||'#2b8ff0';const fv=v=>Number.isInteger(v)?String(v):String(Math.round(v*10)/10).replace('.',',');
 const W=300,H=118,pl=10,pr=12,pt=22,pb=22;
 const xs=i=>pl+i*(W-pl-pr)/(pts.length-1);
 let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));if(mn===mx){mn-=1;mx+=1}
 const ys=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 const line=pts.map((p,i)=>`${i?'L':'M'}${xs(i).toFixed(1)} ${ys(p.v).toFixed(1)}`).join(' ');
 const area=`M${xs(0).toFixed(1)} ${(H-pb).toFixed(1)} `+pts.map((p,i)=>`L${xs(i).toFixed(1)} ${ys(p.v).toFixed(1)}`).join(' ')+` L${xs(pts.length-1).toFixed(1)} ${(H-pb).toFixed(1)} Z`;
 const dots=pts.map((p,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.v).toFixed(1)}" r="3" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('');
 const vals=pts.map((p,i)=>{if(pts.length>4&&i!==0&&i!==pts.length-1)return'';return`<text x="${xs(i).toFixed(1)}" y="${(ys(p.v)-7).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${color}">${esc(fv(p.v))}</text>`}).join('');
 const labs=pts.map((p,i)=>`<text x="${xs(i).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="8" fill="#8a97a8">${esc(p.lab||'')}</text>`).join('');
 const gid='pg'+Math.random().toString(36).slice(2,7);
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#dfe5ee"/><path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${vals}${labs}</svg>`}

/* alertes de base à partir des séances et bilans */

 if(withP.length>=2){const l2=withP.slice(-2);if(l2.every(s=>s.presence==='abs_j'||s.presence==='abs_n'))out.push(['Absences répétées','bad'])}

/* ---------- Séances ---------- */
ctx.sdraft=null;ctx.bdraft=null;
function newSeance(code,dup){ctx.sdraft=dup?Object.assign({},dup,{id:uid6(),date:todayISO(),presence:'present'}):{code,id:uid6(),date:todayISO(),type:'individuel',duree:'',lieu:'',presence:'present',forme:5,douleur:0,douleur_loc:'',fatigue:3,borg:11,fc:'',tolerance:'bonne',contenu:'',adaptations:'',obs:'',emarge:false};S.ui.sub='seances';render();window.scrollTo(0,0)}
async function saveSeance(){const s=ctx.sdraft;if(!s)return;const rec=JSON.parse(JSON.stringify(s));
 if(ctx.db){try{await ctx.db.doc('seances/'+s.code+'__'+s.id).set(rec)}catch(e){toast('Enregistrement impossible');return}}
 ctx.cache.seances=ctx.cache.seances||{};ctx.cache.seances[s.code+'__'+s.id]=rec;ctx.sdraft=null;render();window.scrollTo(0,0);toast('Séance enregistrée')}
async function delSeance(code,id){if(ctx.db){try{await ctx.db.doc('seances/'+code+'__'+id).delete()}catch(e){}}delete (ctx.cache.seances||{})[code+'__'+id];render();toast('Séance supprimée')}

const sfNum=(k,l,u,o={})=>`<label class="f"><span>${l}</span><span class="inp"><input data-sf="${k}" type="number" inputmode="decimal" min="${o.min??0}" ${o.max!=null?`max="${o.max}"`:''} step="${o.step||1}" value="${esc(ctx.sdraft[k])}">${u?`<em>${u}</em>`:''}</span></label>`;
const sfRange=(k,l,min,max)=>`<label class="f"><span>${l}</span><div class="rng"><div class="rr"><input data-sf="${k}" type="range" min="${min}" max="${max}" step="1" value="${esc(ctx.sdraft[k]===''?min:ctx.sdraft[k])}"><span class="rv" data-rv="${k}">${esc(ctx.sdraft[k]===''?'–':ctx.sdraft[k])}</span></div></div></label>`;
const sfTxt=(k,l,ph='')=>`<label class="f"><span>${l}</span><input data-sf="${k}" type="text" value="${esc(ctx.sdraft[k])}" placeholder="${esc(ph)}"></label>`;
const sfTa=(k,l,ph='')=>`<label class="f wide"><span>${l}</span><textarea data-sf="${k}" placeholder="${esc(ph)}">${esc(ctx.sdraft[k])}</textarea></label>`;
const sfSel=(k,l,opts)=>`<label class="f"><span>${l}</span><select data-sf="${k}">${opts.map(([v,t])=>`<option value="${v}" ${String(ctx.sdraft[k])===String(v)?'selected':''}>${t}</option>`).join('')}</select></label>`;
const sfOpt=(k,opts)=>`<div class="lk" role="radiogroup">${opts.map(([v,t])=>`<label><input type="radio" name="sf-${k}" data-sf="${k}" value="${v}" ${String(ctx.sdraft[k])===String(v)?'checked':''}><span>${t}</span></label>`).join('')}</div>`;

subviews.seances=function(){const code=ctx.sel;if(ctx.sdraft&&ctx.sdraft.code!==code)ctx.sdraft=null;
 if(ctx.sdraft){const s=ctx.sdraft;return`<div class="card mbody" style="border-top:0;padding-top:18px"><div class="hd"><h2>Séance</h2><span class="note">Saisie rapide</span></div>
  <div class="grid"><label class="f"><span>Date</span><input data-sf="date" type="date" value="${esc(s.date)}"></label>${sfSel('type','Format',[['individuel','Individuel'],['collectif','Collectif']])}${sfNum('duree','Durée','min',{max:300})}${sfTxt('lieu','Lieu')}</div>
  <p class="sec">Présence</p>${sfOpt('presence',PRES)}
  <p class="sec">État du jour</p><div class="grid">${sfRange('forme','Forme (0–10)',0,10)}${sfRange('douleur','Douleur (0–10)',0,10)}${sfRange('fatigue','Fatigue (0–10)',0,10)}</div>${sfTxt('douleur_loc','Localisation de la douleur','ex. genou droit')}
  <p class="sec">Effort et tolérance</p><div class="grid">${sfRange('borg','Effort perçu (Borg 6–20)',6,20)}${sfNum('fc','FC moyenne','bpm',{max:250})}${sfSel('tolerance','Tolérance',TOL)}</div>
  <p class="sec">Contenu réalisé</p>${sfTa('contenu','Exercices, séries, répétitions, charge, durée…')}${sfTa('adaptations','Adaptations faites en séance')}${sfTa('obs','Observations')}
  <label class="chk" style="margin-top:6px"><input type="checkbox" data-sf="emarge" ${s.emarge?'checked':''}><span>Présence émargée par le bénéficiaire</span></label>
  <div class="mfoot"><button class="btn" data-act="scancel">Annuler</button><button class="btn pri" data-act="ssave">Enregistrer la séance</button></div></div>`}
 const list=seancesOf(code),al=alertsOf(code);
 const head=`<div class="bar"><div style="min-width:220px"><p class="lead" style="margin:0">Fiches de séance de ce bénéficiaire, pensées pour la tablette en salle.</p>${al.length?`<div class="alert" style="margin-top:8px">${al.map(a=>`<span class="pill ${a[1]}">${esc(a[0])}</span>`).join('')}</div>`:''}</div><span class="ctl"><button class="btn pri" data-act="snew">+ Nouvelle séance</button>${list.length?'<button class="btn" data-act="sdup">Dupliquer la dernière</button>':''}</span></div>`;
 if(!list.length)return head+'<p class="empty" style="margin-top:14px">Aucune séance enregistrée pour l’instant.</p>';
 const cards=list.slice().reverse().map(s=>{const pc=s.presence==='present'?'ok':s.presence==='abs_j'?'warn':'bad';
  return`<div class="card scard"><div class="sh"><b>${esc(dISO(s.date))}</b><div class="meta"><span class="pill ${pc}">${presLabel(s.presence)}</span><span class="pill">${s.type==='collectif'?'Collectif':'Individuel'}</span>${s.duree?`<span class="pill">${esc(s.duree)} min</span>`:''}${s.lieu?`<span class="pill">${esc(s.lieu)}</span>`:''}</div></div>${s.presence==='present'?`<div class="meta"><span class="pill">Forme ${esc(s.forme)}/10</span><span class="pill ${numv(s.douleur)>=5?'bad':''}">Douleur ${esc(s.douleur)}/10${s.douleur_loc?' · '+esc(s.douleur_loc):''}</span><span class="pill">Fatigue ${esc(s.fatigue)}/10</span>${s.borg?`<span class="pill">Borg ${esc(s.borg)}</span>`:''}${s.fc?`<span class="pill">${esc(s.fc)} bpm</span>`:''}${s.tolerance?`<span class="pill">Tolérance ${esc(tolLabel(s.tolerance)).toLowerCase()}</span>`:''}${s.emarge?'<span class="pill ok">Émargée</span>':''}</div>`:''}${s.contenu?`<p class="obs">${esc(s.contenu)}</p>`:''}${s.adaptations?`<p class="obs"><b>Adaptations.</b> ${esc(s.adaptations)}</p>`:''}${s.obs?`<p class="obs"><b>Obs.</b> ${esc(s.obs)}</p>`:''}<div class="mfoot" style="border-top:0;padding-top:0"><button class="btn del" data-act="sdel" data-sid="${esc(s.id)}">Supprimer</button></div></div>`}).join('');
 return head+`<div class="slist" style="margin-top:14px">${cards}</div>`};

/* ---------- Bilans datés + comparaison + courbes ---------- */
function newBilan(code){ctx.bdraft={code,id:uid6(),date:todayISO(),type:bilansOf(code).length?'reeval':'initial',note:''};render();window.scrollTo(0,0)}
async function saveBilan(){const b=ctx.bdraft;if(!b)return;const cur=ctx.cache.clients[b.code]||{};const rec={code:b.code,id:b.id,date:b.date,type:b.type,note:b.note||'',t:JSON.parse(JSON.stringify(cur.t||{}))};
 if(ctx.db){try{await ctx.db.doc('bilans/'+b.code+'__'+b.id).set(rec)}catch(e){toast('Enregistrement impossible');return}}
 ctx.cache.bilans=ctx.cache.bilans||{};ctx.cache.bilans[b.code+'__'+b.id]=rec;ctx.bdraft=null;render();window.scrollTo(0,0);toast('Bilan enregistré')}
async function delBilan(code,id){if(ctx.db){try{await ctx.db.doc('bilans/'+code+'__'+id).delete()}catch(e){}}delete (ctx.cache.bilans||{})[code+'__'+id];render();toast('Bilan supprimé')}

subviews.bilans=function(){const code=ctx.sel;if(ctx.bdraft&&ctx.bdraft.code!==code)ctx.bdraft=null;
 const head=`<div class="bar"><p class="lead" style="margin:0;min-width:220px">Chaque bilan fige les valeurs de l’onglet <b>Tests</b> à une date. La comparaison et les courbes se calculent automatiquement.</p><button class="btn pri" data-act="bsnap">+ Enregistrer un bilan daté</button></div>`;
 if(ctx.bdraft){const b=ctx.bdraft;return`<div class="card mbody" style="border-top:0;padding-top:18px"><div class="hd"><h2>Nouveau bilan</h2></div><p class="note">Les valeurs actuelles de l’onglet <b>Tests</b> seront figées dans ce bilan daté.</p><div class="grid"><label class="f"><span>Date</span><input data-bf="date" type="date" value="${esc(b.date)}"></label><label class="f"><span>Type</span><select data-bf="type">${Object.entries(BT).map(([v,t])=>`<option value="${v}" ${b.type===v?'selected':''}>${t}</option>`).join('')}</select></label></div><label class="f wide"><span>Note (facultatif)</span><textarea data-bf="note">${esc(b.note||'')}</textarea></label><div class="mfoot"><button class="btn" data-act="bcancel">Annuler</button><button class="btn pri" data-act="bsave">Enregistrer le bilan</button></div></div>`}
 const B=bilansOf(code);
 if(!B.length)return head+'<p class="empty" style="margin-top:14px">Aucun bilan figé. Renseignez l’onglet Tests puis enregistrez un premier bilan (initial).</p>';
 const timeline=`<div class="card sect"><h2>Historique des bilans</h2><div class="tbl"><table><thead><tr><th>Date</th><th>Type</th><th>Note</th><th></th></tr></thead><tbody>${B.slice().reverse().map(b=>`<tr><td><b>${esc(dISO(b.date))}</b></td><td>${BT[b.type]||b.type}</td><td>${esc(b.note||'')}</td><td class="r"><button class="btn del" data-act="bdel" data-bid="${esc(b.id)}">Supprimer</button></td></tr>`).join('')}</tbody></table></div></div>`;
 const init=B[0],last=B[B.length-1];
 const rows=METRICS.map(mt=>{const dc=mt.dc||0,vi=numv((init.t||{})[mt.k]),vl=numv((last.t||{})[mt.k]);if(!Number.isFinite(vi)&&!Number.isFinite(vl))return'';
  let delta='–',pct='–',cls='',flag='';
  if(Number.isFinite(vi)&&Number.isFinite(vl)){const d=vl-vi;delta=(d>0?'+':'')+fmt(d,dc);if(vi!==0)pct=(d>0?'+':'')+fmt(d/vi*100,0)+' %';const good=mt.dir===0?null:d*mt.dir>0;if(d!==0)cls=good==null?'':good?'up':'down';if(mt.mcid&&mt.dir&&Math.abs(d)>=mt.mcid)flag=good?'<span class="pill ok">Cliniquement pertinent</span>':'<span class="pill bad">Baisse notable</span>'}
  return`<tr><td>${mt.l}${mt.u?` <span class="note">(${mt.u})</span>`:''}</td><td>${fmt(vi,dc)}</td><td>${fmt(vl,dc)}</td><td class="${cls}">${delta}</td><td class="${cls}">${pct}</td><td>${flag}</td></tr>`}).filter(Boolean).join('');
 const cmp=rows&&B.length>=2?`<div class="card sect"><h2>Comparaison initial → dernier bilan</h2><p class="note">${esc(dISO(init.date))} · ${BT[init.type]} → ${esc(dISO(last.date))} · ${BT[last.type]}</p><div class="tbl"><table class="cmp"><thead><tr><th>Test</th><th>Initial</th><th>Dernier</th><th>Δ</th><th>%</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`:'';
 const charts=METRICS.map(mt=>{const series=B.map(b=>({v:numv((b.t||{})[mt.k]),lab:dISO(b.date).replace(/\s?\d{4}$/,'')})).filter(p=>Number.isFinite(p.v));if(series.length<2)return'';return`<div class="res"><h4>${mt.l}${mt.u?' ('+mt.u+')':''}</h4>${lineChart(series)}</div>`}).filter(Boolean).join('');
 const chartWrap=charts?`<div class="card sect"><h2>Courbes d’évolution</h2><div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${charts}</div></div>`:'';
 return head+timeline+cmp+chartWrap};

/* saisie des brouillons séance / bilan (sans autosave) */
function sdbfInput(e){const t=e.target;
 if(t.dataset.sf&&ctx.sdraft){const k=t.dataset.sf;if(t.type==='radio'){if(t.checked)ctx.sdraft[k]=t.value}else if(t.type==='checkbox')ctx.sdraft[k]=t.checked;else ctx.sdraft[k]=t.value;if(t.type==='range'){const rv=V.querySelector(`[data-rv="${k}"]`);if(rv)rv.textContent=t.value}}
 if(t.dataset.bf&&ctx.bdraft)ctx.bdraft[t.dataset.bf]=t.value}
V.addEventListener('input',sdbfInput);V.addEventListener('change',sdbfInput);

/* actions séance / bilan */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='snew')newSeance(ctx.sel);
 else if(a==='sdup'){const l=seancesOf(ctx.sel);newSeance(ctx.sel,l[l.length-1])}
 else if(a==='ssave')saveSeance();
 else if(a==='scancel'){ctx.sdraft=null;render()}
 else if(a==='sdel')delSeance(ctx.sel,b.dataset.sid);
 else if(a==='bsnap')newBilan(ctx.sel);
 else if(a==='bsave')saveBilan();
 else if(a==='bcancel'){ctx.bdraft=null;render()}
 else if(a==='bdel')delBilan(ctx.sel,b.dataset.bid)});
</script>

<script>
/* ===================== MODULE 2 : OBJECTIFS SMART · CONSENTEMENTS · DOCUMENTS D'ENTRÉE ===================== */
/* Collections : objectifs/{code}__{id}, docs/{code}__{id}, consents/{code}. */
const OBJ_STATUS=[['en_cours','En cours','warn'],['atteint','Atteint','ok'],['partiel','Partiel','warn'],['non_atteint','Non atteint','bad']];
const OBJ_PRIO=[['haute','Haute'],['moyenne','Moyenne'],['basse','Basse']];
const CONSENTS=[['participation','Participation à l’activité physique adaptée'],['sante','Collecte et traitement des données de santé'],['image','Droit à l’image (facultatif)'],['partage','Partage d’informations avec le médecin et les autres professionnels']];
const DOCTYPES=[['prescription','Prescription / avis médical'],['certificat','Certificat médical'],['convention','Convention / contrat'],['autre','Autre document']];
const dtLabel=v=>(DOCTYPES.find(x=>x[0]===v)||[,v||'—'])[1];
const prioLabel=v=>(OBJ_PRIO.find(x=>x[0]===v)||[,v||''])[1];
const objStatus=v=>OBJ_STATUS.find(x=>x[0]===v)||OBJ_STATUS[0];
const objectifsOf=code=>Object.values(ctx.cache.objectifs||{}).filter(o=>o&&o.code===code).sort((a,b)=>String(a.created).localeCompare(String(b.created)));
const docsOf=code=>Object.values(ctx.cache.docs||{}).filter(d=>d&&d.code===code).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
const consentsOf=code=>(ctx.cache.consents||{})[code]||{};
const in30=()=>new Date(Date.now()+30*864e5).toISOString().slice(0,10);

/* alertes documents + consentement, chaînées à alertsOf (module 1) */
function extraAlerts(code){const out=[],today=todayISO(),soon=in30();
 docsOf(code).forEach(d=>{if(d.expiry){if(d.expiry<today)out.push([`${dtLabel(d.type)} expiré`,'bad']);else if(d.expiry<=soon)out.push([`${dtLabel(d.type)} à renouveler`,'warn'])}});
 if(!(consentsOf(code).sante||{}).ok)out.push(['Consentement données de santé manquant','warn']);
 return out}

/* ---------- Objectifs SMART ---------- */
ctx.odraft=null;ctx.ddraft=null;
function newObjectif(code,ex){ctx.odraft=ex?Object.assign({},ex):{code,id:uid6(),intitule:'',critere:'',cible:'',echeance:'',priorite:'moyenne',statut:'en_cours',created:new Date().toISOString()};render();window.scrollTo(0,0)}
async function saveObjectif(){const o=ctx.odraft;if(!o)return;if(!String(o.intitule||'').trim()){toast('Intitulé requis');return}const rec=JSON.parse(JSON.stringify(o));
 if(ctx.db){try{await ctx.db.doc('objectifs/'+o.code+'__'+o.id).set(rec)}catch(e){toast('Enregistrement impossible');return}}
 ctx.cache.objectifs=ctx.cache.objectifs||{};ctx.cache.objectifs[o.code+'__'+o.id]=rec;ctx.odraft=null;render();toast('Objectif enregistré')}
async function delObjectif(code,id){if(ctx.db){try{await ctx.db.doc('objectifs/'+code+'__'+id).delete()}catch(e){}}delete (ctx.cache.objectifs||{})[code+'__'+id];render();toast('Objectif supprimé')}

const ofTxt=(k,l,ph='')=>`<label class="f"><span>${l}</span><input data-of="${k}" type="text" value="${esc(ctx.odraft[k])}" placeholder="${esc(ph)}"></label>`;
const ofSel=(k,l,opts)=>`<label class="f"><span>${l}</span><select data-of="${k}">${opts.map(([v,t])=>`<option value="${v}" ${String(ctx.odraft[k])===String(v)?'selected':''}>${t}</option>`).join('')}</select></label>`;

subviews.objectifs=function(){const code=ctx.sel;if(ctx.odraft&&ctx.odraft.code!==code)ctx.odraft=null;
 if(ctx.odraft){const o=ctx.odraft;return`<div class="card mbody" style="border-top:0;padding-top:18px"><div class="hd"><h2>Objectif</h2><span class="note">Formulation SMART : spécifique, mesurable, atteignable, réaliste, temporel</span></div><div class="grid">${ofTxt('intitule','Intitulé','ex. Monter deux étages sans s’arrêter')}${ofTxt('critere','Critère de mesure','ex. nombre d’étages')}${ofTxt('cible','Valeur cible','ex. 2 étages')}<label class="f"><span>Échéance</span><input data-of="echeance" type="date" value="${esc(o.echeance)}"></label>${ofSel('priorite','Priorité',OBJ_PRIO)}${ofSel('statut','Statut',OBJ_STATUS.map(x=>[x[0],x[1]]))}</div><div class="mfoot"><button class="btn" data-act="ocancel">Annuler</button><button class="btn pri" data-act="osave">Enregistrer l’objectif</button></div></div>`}
 const list=objectifsOf(code);
 const head=`<div class="bar"><p class="lead" style="margin:0;min-width:220px">Objectifs partagés avec le bénéficiaire, formulés de façon SMART. Mettez à jour le statut au fil du suivi.</p><button class="btn pri" data-act="onew">+ Nouvel objectif</button></div>`;
 if(!list.length)return head+'<p class="empty" style="margin-top:14px">Aucun objectif défini.</p>';
 const cards=list.map(o=>{const st=objStatus(o.statut);return`<div class="card scard"><div class="sh"><b>${esc(o.intitule)}</b><div class="meta"><span class="pill ${st[2]}">${st[1]}</span>${o.priorite?`<span class="pill">Priorité ${esc(prioLabel(o.priorite).toLowerCase())}</span>`:''}${o.echeance?`<span class="pill">Échéance ${esc(dISO(o.echeance))}</span>`:''}</div></div>${(o.critere||o.cible)?`<p class="obs">${o.critere?esc(o.critere):''}${o.cible?`${o.critere?' · ':''}cible : ${esc(o.cible)}`:''}</p>`:''}<div class="mfoot" style="border-top:0;padding-top:0"><button class="btn" data-act="oedit" data-oid="${esc(o.id)}">Modifier</button><button class="btn del" data-act="odel" data-oid="${esc(o.id)}">Supprimer</button></div></div>`}).join('');
 return head+`<div class="slist" style="margin-top:14px">${cards}</div>`};

/* ---------- Consentements + Documents d'entrée ---------- */
async function toggleConsent(code,type,checked){const cur=JSON.parse(JSON.stringify(consentsOf(code)));cur[type]=checked?{ok:true,date:todayISO()}:{ok:false};
 if(ctx.db){try{await ctx.db.doc('consents/'+code).set(cur)}catch(e){toast('Enregistrement impossible');return}}
 ctx.cache.consents=ctx.cache.consents||{};ctx.cache.consents[code]=cur;render()}
function newDoc(code,ex){ctx.ddraft=ex?Object.assign({},ex):{code,id:uid6(),type:'prescription',date:todayISO(),expiry:'',ref:'',note:'',created:new Date().toISOString()};render();window.scrollTo(0,0)}
async function saveDoc(){const d=ctx.ddraft;if(!d)return;const rec=JSON.parse(JSON.stringify(d));
 if(ctx.db){try{await ctx.db.doc('docs/'+d.code+'__'+d.id).set(rec)}catch(e){toast('Enregistrement impossible');return}}
 ctx.cache.docs=ctx.cache.docs||{};ctx.cache.docs[d.code+'__'+d.id]=rec;ctx.ddraft=null;render();toast('Document enregistré')}
async function delDoc(code,id){if(ctx.db){try{await ctx.db.doc('docs/'+code+'__'+id).delete()}catch(e){}}delete (ctx.cache.docs||{})[code+'__'+id];render();toast('Document supprimé')}

const dfTxt=(k,l,ph='')=>`<label class="f"><span>${l}</span><input data-df="${k}" type="text" value="${esc(ctx.ddraft[k])}" placeholder="${esc(ph)}"></label>`;

subviews.documents=function(){const code=ctx.sel;if(ctx.ddraft&&ctx.ddraft.code!==code)ctx.ddraft=null;
 const cons=consentsOf(code);
 const consCard=`<div class="card sect"><h2>Consentements</h2><p class="note" style="margin-bottom:12px">Recueil du consentement éclairé, horodaté. Le consentement aux données de santé est requis avant toute saisie (RGPD).</p><div style="display:flex;flex-direction:column;gap:10px">${CONSENTS.map(([k,l])=>{const c=cons[k]||{};return`<label class="chk" style="display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2)"><span style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-consent="${k}" ${c.ok?'checked':''}><span style="font-weight:500">${l}</span></span>${c.ok&&c.date?`<span class="pill ok">Recueilli le ${esc(dISO(c.date))}</span>`:'<span class="pill warn">Non recueilli</span>'}</label>`}).join('')}</div></div>`;
 if(ctx.ddraft){const d=ctx.ddraft;return consCard+`<div class="card mbody" style="padding-top:18px;margin-top:14px"><div class="hd"><h2>Document d’entrée</h2></div><div class="grid"><label class="f"><span>Type</span><select data-df="type">${DOCTYPES.map(([v,t])=>`<option value="${v}" ${d.type===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="f"><span>Date</span><input data-df="date" type="date" value="${esc(d.date)}"></label><label class="f"><span>Date d’expiration</span><input data-df="expiry" type="date" value="${esc(d.expiry)}"></label>${dfTxt('ref','Référence / lien','n° ou URL du document')}</div><label class="f wide"><span>Pathologies, contre-indications, précautions, signes d’alerte</span><textarea data-df="note">${esc(d.note)}</textarea></label><div class="mfoot"><button class="btn" data-act="dcancel">Annuler</button><button class="btn pri" data-act="dsave">Enregistrer le document</button></div></div>`}
 const list=docsOf(code);
 const docHead=`<div class="bar" style="margin-top:14px"><div style="min-width:220px"><h2 style="font-size:24px">Documents d’entrée</h2><p class="note" style="margin:4px 0 0">Prescription, certificat, convention. L’application enregistre les métadonnées et alerte avant expiration ; joignez le document papier ou PDF au dossier.</p></div><button class="btn pri" data-act="dnew">+ Ajouter un document</button></div>`;
 const docList=list.length?`<div class="slist" style="margin-top:12px">${list.map(d=>{const today=todayISO(),exp=d.expiry&&d.expiry<today,soon=d.expiry&&!exp&&d.expiry<=in30();return`<div class="card scard"><div class="sh"><b>${esc(dtLabel(d.type))}</b><div class="meta"><span class="pill">Daté du ${esc(dISO(d.date))}</span>${d.expiry?`<span class="pill ${exp?'bad':soon?'warn':'ok'}">${exp?'Expiré le':'Valide jusqu’au'} ${esc(dISO(d.expiry))}</span>`:''}${d.ref?`<span class="pill">${esc(d.ref)}</span>`:''}</div></div>${d.note?`<p class="obs">${esc(d.note)}</p>`:''}<div class="mfoot" style="border-top:0;padding-top:0"><button class="btn" data-act="dedit" data-did="${esc(d.id)}">Modifier</button><button class="btn del" data-act="ddel" data-did="${esc(d.id)}">Supprimer</button></div></div>`}).join('')}</div>`:'<p class="empty" style="margin-top:12px">Aucun document enregistré.</p>';
 return consCard+docHead+docList};

/* saisie des brouillons objectif / document + bascule consentement */
function odfInput(e){const t=e.target;if(t.dataset.of&&ctx.odraft)ctx.odraft[t.dataset.of]=t.value;if(t.dataset.df&&ctx.ddraft)ctx.ddraft[t.dataset.df]=t.value}
V.addEventListener('input',odfInput);V.addEventListener('change',odfInput);
V.addEventListener('change',e=>{if(e.target.dataset.consent)toggleConsent(ctx.sel,e.target.dataset.consent,e.target.checked)});

/* actions objectifs / documents */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='onew')newObjectif(ctx.sel);
 else if(a==='oedit')newObjectif(ctx.sel,(ctx.cache.objectifs||{})[ctx.sel+'__'+b.dataset.oid]);
 else if(a==='osave')saveObjectif();
 else if(a==='ocancel'){ctx.odraft=null;render()}
 else if(a==='odel')delObjectif(ctx.sel,b.dataset.oid);
 else if(a==='dnew')newDoc(ctx.sel);
 else if(a==='dedit')newDoc(ctx.sel,(ctx.cache.docs||{})[ctx.sel+'__'+b.dataset.did]);
 else if(a==='dsave')saveDoc();
 else if(a==='dcancel'){ctx.ddraft=null;render()}
 else if(a==='ddel')delDoc(ctx.sel,b.dataset.did)});
</script>

<script>
/* ===================== MODULE 3 : PROGRAMME INDIVIDUALISÉ (FITT-VP) ===================== */
/* Collection : programmes/{code}__{id}. Versions, blocs FITT-VP, modèles par pathologie, rappel des contre-indications. */
const PCATS=[['endurance','Endurance'],['renfo','Renforcement'],['equilibre','Équilibre'],['mobilite','Mobilité']];
const pcatLabel=v=>(PCATS.find(c=>c[0]===v)||[,v||''])[1];
const programmesOf=code=>Object.values(ctx.cache.programmes||{}).filter(p=>p&&p.code===code).sort((a,b)=>String(a.created).localeCompare(String(b.created)));
const PMODELS=[
 {id:'cardiometab',nom:'Cardio-métabolique (HTA, DT2, obésité)',blocs:[
   {cat:'endurance',freq:'3 à 5 /sem',intensite:'Borg 12–14 (test de la parole)',type:'Marche rapide, vélo',temps:'30–45 min',volume:'150 min/sem',progression:'+5 min par semaine'},
   {cat:'renfo',freq:'2 à 3 /sem',intensite:'Borg 13–15, 8–12 répétitions',type:'Grands groupes musculaires, élastiques/poids',temps:'20–30 min',volume:'1 à 3 séries',progression:'+1 série puis charge'},
   {cat:'mobilite',freq:'quotidien',intensite:'Indolore',type:'Étirements, mobilité articulaire',temps:'10 min',volume:'—',progression:'maintien'}]},
 {id:'senior',nom:'Vieillissement, prévention des chutes',blocs:[
   {cat:'equilibre',freq:'2 à 3 /sem',intensite:'Progressif, sécurisé',type:'Appui unipodal, tandem, transferts',temps:'15 min',volume:'—',progression:'réduire les appuis'},
   {cat:'renfo',freq:'2 à 3 /sem',intensite:'Borg 12–14',type:'Lever de chaise, montée de marche',temps:'20 min',volume:'1 à 3 séries',progression:'+répétitions puis charge'},
   {cat:'endurance',freq:'5 /sem',intensite:'Modéré',type:'Marche',temps:'20–30 min',volume:'—',progression:'+distance'}]},
 {id:'onco',nom:'Oncologie (pendant / après traitement)',blocs:[
   {cat:'endurance',freq:'3 /sem',intensite:'Borg 11–13, adapté à la fatigue',type:'Marche, vélo',temps:'20–30 min',volume:'selon tolérance',progression:'selon fatigue'},
   {cat:'renfo',freq:'2 /sem',intensite:'Léger à modéré',type:'Renforcement global',temps:'20 min',volume:'1 à 2 séries',progression:'prudente'}]},
 {id:'resp',nom:'Respiratoire (BPCO, asthme)',blocs:[
   {cat:'endurance',freq:'3 à 5 /sem',intensite:'Dyspnée 3–4/10 (Borg CR10)',type:'Marche, vélo, réentraînement',temps:'20–30 min',volume:'—',progression:'par paliers'},
   {cat:'renfo',freq:'2 à 3 /sem',intensite:'Modéré',type:'Membres inférieurs et supérieurs',temps:'20 min',volume:'1 à 3 séries',progression:'+charge'}]},
 {id:'msk',nom:'Locomoteur / douleur chronique (lombalgie, arthrose)',blocs:[
   {cat:'mobilite',freq:'quotidien',intensite:'Indolore',type:'Mobilité, étirements doux',temps:'10–15 min',volume:'—',progression:'amplitude'},
   {cat:'renfo',freq:'2 à 3 /sem',intensite:'Progressif, sans douleur',type:'Gainage, renforcement ciblé',temps:'20–30 min',volume:'1 à 3 séries',progression:'+répétitions'},
   {cat:'endurance',freq:'3 à 5 /sem',intensite:'Modéré',type:'Marche, vélo, natation',temps:'20–30 min',volume:'—',progression:'+durée'}]}];

/* rappel des contre-indications en en-tête */
function ciHeader(code){const bits=[];if(S.p&&S.p.precau)bits.push(S.p.precau);const d=docsOf(code).find(x=>x.type==='prescription')||docsOf(code).find(x=>x.type==='certificat');if(d&&d.note)bits.push(d.note);
 return bits.length?`<div class="banner" style="background:var(--bad-bg);color:var(--bad)"><span><b>⚠ Contre-indications & précautions :</b> ${esc(bits.join(' · '))}</span></div>`:''}

ctx.pdraft=null;
function newProg(code,blocs){const n=programmesOf(code).length+1;ctx.pdraft={code,id:uid6(),version:'v'+n,debut:todayISO(),fin:'',objectifs:'',adaptations:'',criteres:'',blocs:blocs?JSON.parse(JSON.stringify(blocs)):[{cat:'endurance',freq:'',intensite:'',type:'',temps:'',volume:'',progression:''}],created:new Date().toISOString()};render();window.scrollTo(0,0)}
async function saveProg(){const p=ctx.pdraft;if(!p)return;const rec=JSON.parse(JSON.stringify(p));
 if(ctx.db){try{await ctx.db.doc('programmes/'+p.code+'__'+p.id).set(rec)}catch(e){toast('Enregistrement impossible');return}}
 ctx.cache.programmes=ctx.cache.programmes||{};ctx.cache.programmes[p.code+'__'+p.id]=rec;ctx.pdraft=null;render();toast('Programme enregistré')}
async function delProg(code,id){if(ctx.db){try{await ctx.db.doc('programmes/'+code+'__'+id).delete()}catch(e){}}delete (ctx.cache.programmes||{})[code+'__'+id];render();toast('Programme supprimé')}

const pbRow=(bl,i)=>`<div class="card" style="padding:12px 14px;margin-top:10px"><div class="bar"><select class="sel" data-pb="${i}.cat" style="min-width:150px">${PCATS.map(([v,t])=>`<option value="${v}" ${bl.cat===v?'selected':''}>${t}</option>`).join('')}</select><button class="btn del" data-act="pbdel" data-i="${i}">Retirer</button></div><div class="grid" style="margin-top:10px"><label class="f"><span>Fréquence</span><input data-pb="${i}.freq" type="text" value="${esc(bl.freq)}" placeholder="ex. 3 /sem"></label><label class="f"><span>Intensité</span><input data-pb="${i}.intensite" type="text" value="${esc(bl.intensite)}" placeholder="Borg / FC / parole"></label><label class="f"><span>Type</span><input data-pb="${i}.type" type="text" value="${esc(bl.type)}" placeholder="ex. marche, renfo"></label><label class="f"><span>Temps</span><input data-pb="${i}.temps" type="text" value="${esc(bl.temps)}" placeholder="ex. 30 min"></label><label class="f"><span>Volume</span><input data-pb="${i}.volume" type="text" value="${esc(bl.volume)}" placeholder="ex. 150 min/sem"></label><label class="f"><span>Progression</span><input data-pb="${i}.progression" type="text" value="${esc(bl.progression)}" placeholder="ex. +5 min/sem"></label></div></div>`;
const progCard=(p,active)=>`<div class="card scard"><div class="sh"><b>Programme ${esc(p.version||'')}</b><div class="meta">${active?'<span class="pill ok">Actif</span>':'<span class="pill">Ancienne version</span>'}${p.debut?`<span class="pill">Du ${esc(dISO(p.debut))}${p.fin?' au '+esc(dISO(p.fin)):''}</span>`:''}<span class="pill">${(p.blocs||[]).length} bloc(s)</span></div></div>${p.objectifs?`<p class="obs"><b>Objectifs.</b> ${esc(p.objectifs)}</p>`:''}${(p.blocs&&p.blocs.length)?`<div class="tbl"><table><thead><tr><th>Catégorie</th><th>Fréq.</th><th>Intensité</th><th>Type</th><th>Temps</th><th>Volume</th><th>Progression</th></tr></thead><tbody>${p.blocs.map(b=>`<tr><td>${pcatLabel(b.cat)}</td><td>${esc(b.freq)}</td><td>${esc(b.intensite)}</td><td>${esc(b.type)}</td><td>${esc(b.temps)}</td><td>${esc(b.volume)}</td><td>${esc(b.progression)}</td></tr>`).join('')}</tbody></table></div>`:''}${p.adaptations?`<p class="obs"><b>Adaptations.</b> ${esc(p.adaptations)}</p>`:''}${p.criteres?`<p class="obs"><b>Critères d’arrêt / seuils d’alerte.</b> ${esc(p.criteres)}</p>`:''}<div class="mfoot" style="border-top:0;padding-top:0"><button class="btn" data-act="pedit" data-pid="${esc(p.id)}">Modifier</button><button class="btn" data-act="pdup" data-pid="${esc(p.id)}">Dupliquer</button><button class="btn del" data-act="pdel" data-pid="${esc(p.id)}">Supprimer</button></div></div>`;

subviews.programme=function(){const code=ctx.sel;if(ctx.pdraft&&ctx.pdraft.code!==code)ctx.pdraft=null;
 if(ctx.pdraft){const p=ctx.pdraft;return ciHeader(code)+`<div class="card mbody" style="border-top:0;padding-top:18px"><div class="hd"><h2>Programme individualisé</h2><span class="note">Structure FITT-VP</span></div><div class="grid"><label class="f"><span>Version</span><input data-pf="version" type="text" value="${esc(p.version)}"></label><label class="f"><span>Début</span><input data-pf="debut" type="date" value="${esc(p.debut)}"></label><label class="f"><span>Fin prévue</span><input data-pf="fin" type="date" value="${esc(p.fin)}"></label></div><label class="f wide"><span>Objectifs liés</span><textarea data-pf="objectifs" placeholder="objectifs visés par ce programme">${esc(p.objectifs)}</textarea></label><p class="sec">Blocs d’entraînement (FITT-VP)</p>${p.blocs.map((b,i)=>pbRow(b,i)).join('')}<div style="margin-top:10px"><button class="btn" data-act="pbadd">+ Ajouter un bloc</button></div><label class="f wide" style="margin-top:12px"><span>Adaptations liées à la pathologie</span><textarea data-pf="adaptations">${esc(p.adaptations)}</textarea></label><label class="f wide"><span>Critères d’arrêt / seuils d’alerte</span><textarea data-pf="criteres" placeholder="ex. arrêt si douleur > 4/10, essoufflement anormal, malaise">${esc(p.criteres)}</textarea></label><div class="mfoot"><button class="btn" data-act="pcancel">Annuler</button><button class="btn pri" data-act="psave">Enregistrer le programme</button></div></div>`}
 const list=programmesOf(code),activeId=list.length?list[list.length-1].id:null;
 const head=`<div class="bar"><p class="lead" style="margin:0;min-width:220px">Programme individualisé FITT-VP. Chaque enregistrement crée une nouvelle version ; la plus récente est active.</p><button class="btn pri" data-act="pnew">+ Nouveau programme</button></div><details class="card" style="padding:12px 14px;margin-top:12px"><summary style="cursor:pointer;font-weight:600;color:var(--nav)">Partir d’un modèle par pathologie</summary><div class="alert" style="margin-top:10px">${PMODELS.map(m=>`<button class="btn" data-act="pmodel" data-model="${m.id}">${esc(m.nom)}</button>`).join('')}</div></details>`;
 if(!list.length)return ciHeader(code)+head+'<p class="empty" style="margin-top:14px">Aucun programme. Créez-en un ou partez d’un modèle.</p>';
 return ciHeader(code)+head+`<div class="slist" style="margin-top:14px">${list.slice().reverse().map(p=>progCard(p,p.id===activeId)).join('')}</div>`};

/* saisie du brouillon programme (champs + blocs) */
function pfInput(e){const t=e.target;if(t.dataset.pf&&ctx.pdraft)ctx.pdraft[t.dataset.pf]=t.value;
 if(t.dataset.pb&&ctx.pdraft){const parts=t.dataset.pb.split('.'),i=+parts[0],f=parts[1];if(ctx.pdraft.blocs[i])ctx.pdraft.blocs[i][f]=t.value}}
V.addEventListener('input',pfInput);V.addEventListener('change',pfInput);

/* actions programme */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='pnew')newProg(ctx.sel);
 else if(a==='pmodel'){const m=PMODELS.find(x=>x.id===b.dataset.model);if(m)newProg(ctx.sel,m.blocs)}
 else if(a==='pedit'){const src=(ctx.cache.programmes||{})[ctx.sel+'__'+b.dataset.pid];if(src){ctx.pdraft=JSON.parse(JSON.stringify(src));render();window.scrollTo(0,0)}}
 else if(a==='pdup'){const src=(ctx.cache.programmes||{})[ctx.sel+'__'+b.dataset.pid];if(src){const n=programmesOf(ctx.sel).length+1;ctx.pdraft=Object.assign(JSON.parse(JSON.stringify(src)),{id:uid6(),version:'v'+n,debut:todayISO(),created:new Date().toISOString()});render();window.scrollTo(0,0)}}
 else if(a==='psave')saveProg();
 else if(a==='pcancel'){ctx.pdraft=null;render()}
 else if(a==='pdel')delProg(ctx.sel,b.dataset.pid);
 else if(a==='pbadd'&&ctx.pdraft){ctx.pdraft.blocs.push({cat:'renfo',freq:'',intensite:'',type:'',temps:'',volume:'',progression:''});render()}
 else if(a==='pbdel'&&ctx.pdraft){ctx.pdraft.blocs.splice(+b.dataset.i,1);render()}});
</script>

<script>
/* ===================== MODULE 4 : TABLEAU DE BORD PAR BÉNÉFICIAIRE + EXPORT PDF ===================== */
/* Tableau de bord (assiduité, ressenti au fil des séances) + documents imprimables (bilan, programme). */

/* ---- tableau de bord par bénéficiaire ---- */
function clientDash(code){const Ss=seancesOf(code);const pres=Ss.filter(s=>s.presence==='present').length,abs=Ss.filter(s=>s.presence&&s.presence!=='present').length;const taux=pres+abs?Math.round(pres/(pres+abs)*100):null;
 const objs=objectifsOf(code),atteints=objs.filter(o=>o.statut==='atteint').length;
 const presSe=Ss.filter(s=>s.presence==='present');
 const serie=key=>presSe.map(s=>({v:numv(s[key]),lab:dISO(s.date).replace(/\s?\d{4}$/,'')})).filter(p=>Number.isFinite(p.v));
 const kp=(l,v,s)=>`<div class="card kpi"><span class="lab">${l}</span><span class="n">${v}</span><p>${s}</p></div>`;
 const charts=[['Douleur en séance',serie('douleur')],['Fatigue en séance',serie('fatigue')],['Effort perçu (Borg)',serie('borg')]].map(([l,se])=>se.length>=2?`<div class="res"><h4>${l}</h4>${lineChart(se)}</div>`:'').filter(Boolean).join('');
 return `<div class="kpis">${kp('Séances réalisées',pres,abs?abs+' absence(s)':'assiduité suivie')}${kp('Taux de présence',taux!=null?taux+' %':'–','séances enregistrées')}${kp('Objectifs atteints',atteints+' / '+objs.length,objs.length?'au fil du suivi':'aucun objectif')}${kp('Bilans datés',bilansOf(code).length,'pour les courbes')}</div>`+(charts?`<div class="card sect"><h2>Ressenti au fil des séances</h2><div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${charts}</div></div>`:'');}

/* ---- documents imprimables ---- */
/* Feuille de style autonome du rapport (fenêtre d'export) — mêmes classes que le rendu imprimable,
   appliquées à l'écran ET à l'impression pour que l'aperçu soit identique au PDF. */
const REPORT_CSS=`*{box-sizing:border-box}

.pband h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:27px;font-weight:700;margin:0;color:#fff;letter-spacing:.3px;line-height:1.05}

.pk .n{display:block;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;color:#132234;margin:2px 0 1px;font-variant-numeric:tabular-nums}

.up{color:#1f9d57}.down{color:#e0503f}.flat{color:#6a7788}

.palert{display:flex;gap:7px;align-items:flex-start;background:#fdf1dc;border:1px solid #f0d9a8;color:#7a5712;border-radius:8px;padding:8px 11px;font-size:11px;margin:0 0 13px;break-inside:avoid}

.pfoot{margin-top:6px;padding-top:9px;border-top:1px solid #e3e8ef;color:#8a97a8;font-size:9.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
@media print{body{background:#fff}.pbar{display:none!important}.pconf{margin:0 0 12px}.ppage{max-width:none;margin:0;box-shadow:none;border-radius:0;padding:0}@page{margin:12mm}}`;
/* Export : ouvre le rapport dans une vraie fenêtre (contexte top-level fiable, hors iframe),
   100 % en local — aucune donnée n'est envoyée à un serveur. Repli sur l'impression intégrée
   si les pop-up sont bloquées. */
function pdoc(html,title){title=title||'Rapport APA';
 const conf=`<div class="pconf">🔒 <span><b>Document confidentiel — données de santé (RGPD).</b> Généré localement, sans transmission à un serveur. À conserver de façon sécurisée et à ne communiquer qu’au bénéficiaire ou aux professionnels autorisés.</span></div>`;
 const doc=`<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>${esc(title)}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"><style>${REPORT_CSS}</style></head><body><div class="pbar"><button class="pri" onclick="window.print()">⬇ Enregistrer en PDF</button><button class="sec" onclick="window.close()">Fermer</button><span class="hint">Choisissez « Enregistrer en PDF » comme imprimante. Pensez à cocher « Graphiques d’arrière-plan ».</span></div><div class="ppage">${conf}${html}</div></body></html>`;
 let w=null;try{w=window.open('','_blank');}catch(e){}
 if(w&&w.document){w.document.open();w.document.write(doc);w.document.close();try{w.focus()}catch(e){}return}
 /* repli : impression de la page intégrée (#printdoc + @media print) */
 const el=document.getElementById('printdoc');if(el){el.innerHTML=html;try{toast('Autorisez les fenêtres pop-up pour un meilleur export PDF')}catch(e){}window.print()}}
/* Chargement à la demande de jsPDF + html2canvas (fichiers locaux, dans /academie). */
let _pdfLibs=null;
function loadPdfLibs(){if(_pdfLibs)return _pdfLibs;
 const load=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)});
 _pdfLibs=(async()=>{if(!(window.jspdf&&window.jspdf.jsPDF))await load('jspdf.umd.min.js');if(!window.html2canvas)await load('html2canvas.min.js');return window.jspdf&&window.jspdf.jsPDF&&window.html2canvas})();
 return _pdfLibs}
function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'rapport'}
let _pdfBusy=false;
/* Vrai export PDF : rend le rapport coloré en image (html2canvas), le découpe proprement
   en pages A4 (coupures entre blocs, jamais au milieu) et télécharge le fichier .pdf.
   Tout est local — aucune donnée n'est envoyée à un serveur. Repli sur pdoc() si échec. */
async function exportPdf(html,title,filename){
 if(_pdfBusy)return;_pdfBusy=true;
 try{try{toast('Génération du PDF…')}catch(e){}
  let okLibs=false;try{okLibs=await loadPdfLibs()}catch(e){okLibs=false}
  const J=window.jspdf&&window.jspdf.jsPDF,H2C=window.html2canvas;
  if(!okLibs||!J||!H2C){return pdoc(html,title)}
  const conf=`<div class="pconf">🔒 <span><b>Document confidentiel — données de santé (RGPD).</b> Généré localement, sans transmission à un serveur. À conserver de façon sécurisée et à ne communiquer qu’au bénéficiaire ou aux professionnels autorisés.</span></div>`;
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1';
  host.innerHTML=`<style>${REPORT_CSS}</style><div class="ppage" style="max-width:none;margin:0;box-shadow:none;border-radius:0;padding:26px 30px">${conf}${html}</div>`;
  document.body.appendChild(host);
  try{
   if(document.fonts&&document.fonts.ready){try{await document.fonts.ready}catch(e){}}
   await new Promise(r=>setTimeout(r,80));
   const target=host.querySelector('.ppage');
   const S=2;
   const canvas=await H2C(target,{scale:S,backgroundColor:'#ffffff',logging:false,useCORS:true});
   const doc=new J({orientation:'portrait',unit:'pt',format:'a4'});
   const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight();
   const pageCanvasH=Math.floor(canvas.width*(ph/pw));
   const bottoms=Array.from(target.children).map(b=>Math.round((b.offsetTop+b.offsetHeight)*S));
   const total=canvas.height;let start=0,page=0;
   while(start<total){
    let end=start+pageCanvasH;
    if(end>=total){end=total}else{let best=-1;for(const b of bottoms){if(b>start+40&&b<=end)best=b}if(best>start)end=best}
    const h=end-start;const c=document.createElement('canvas');c.width=canvas.width;c.height=h;
    const cx=c.getContext('2d');cx.fillStyle='#ffffff';cx.fillRect(0,0,c.width,h);
    cx.drawImage(canvas,0,start,canvas.width,h,0,0,canvas.width,h);
    if(page>0)doc.addPage();
    doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,h*(pw/canvas.width));
    start=end;page++;if(page>40)break}
   doc.save(filename||'rapport.pdf');
   try{toast('PDF téléchargé')}catch(e){}
  }catch(e){pdoc(html,title)}
  finally{host.remove()}
 }finally{_pdfBusy=false}}
function buildBilanDoc(code){const c=ctx.cache.clients[code]||{};const gi=grpInfo(S.a);
 const consent=consentsOf(code),cons=CONSENTS.filter(([k])=>(consent[k]||{}).ok).map(([k,l])=>l+' (le '+dISO(consent[k].date)+')');
 const objs=objectifsOf(code),atteints=objs.filter(o=>o.statut==='atteint').length,docs=docsOf(code),B=bilansOf(code),progs=programmesOf(code),prog=progs[progs.length-1];
 const Ss=seancesOf(code),pres=Ss.filter(s=>s.presence==='present').length,abs=Ss.filter(s=>s.presence&&s.presence!=='present').length,taux=pres+abs?Math.round(pres/(pres+abs)*100):null;
 const presSe=Ss.filter(s=>s.presence==='present');
 const mods=MODS.filter(m=>m.kind!=='a'&&act(m)).map(m=>({m,t:m.calc().t})).filter(x=>x.t.length);
 const dlab=b=>dISO(b.date).replace(/\s?\d{4}$/,'');
 // --- bandeau d'en-tête ---
 const sub=[S.p.age?esc(S.p.age)+' ans':'',S.p.sexe==='F'?'Femme':S.p.sexe==='H'?'Homme':'','Édité le '+dISO(todayISO()),S.p.eval?esc(S.p.eval):''].filter(Boolean).join(' · ');
 const chip=(gi.fin?`<b>${esc(gget(gi.fin)[1])}</b>`:'<b>Suivi APA</b>')+(gi.med?'<br>avis médical requis':taux!=null?'<br>'+taux+' % de présence':'');
 let h=`<div class="pband"><div><h1>Bilan APA — ${esc(cname(c))}</h1><p class="psub">${sub}</p></div><div class="pchip">${chip}</div></div>`;
 if(S.p.precau)h+=`<div class="palert"><span>⚠️</span><span><b>Précautions / contre-indications :</b> ${esc(S.p.precau)}</span></div>`;
 // --- cartes KPI (deltas colorés) ---
 let testKpis=[];
 if(B.length>=2){const init=B[0],last=B[B.length-1];testKpis=METRICS.map(mt=>{const vi=numv((init.t||{})[mt.k]),vl=numv((last.t||{})[mt.k]);if(!Number.isFinite(vi)||!Number.isFinite(vl)||vi===vl)return null;const d=vl-vi,imp=mt.dir>0?d>0:mt.dir<0?d<0:null,cls=(imp===null)?'flat':imp?'up':'down',arr=d>0?'▲':d<0?'▼':'→';return{lab:mt.l,n:fmt(vl,mt.dc||0)+(mt.u?' <span class="u">'+mt.u+'</span>':''),d:`<span class="${cls}">${arr} ${d>0?'+':''}${fmt(d,mt.dc||0)}</span> <span class="u">vs ${fmt(vi,mt.dc||0)}</span>`}}).filter(Boolean);}
 const pool=[];
 if(taux!=null)pool.push({lab:'Taux de présence',n:taux+' <span class="u">%</span>',d:`<span class="flat">${pres} séance(s)${abs?' · '+abs+' abs.':''}</span>`});
 if(objs.length)pool.push({lab:'Objectifs atteints',n:atteints+' <span class="u">/ '+objs.length+'</span>',d:`<span class="flat">${objs.filter(o=>o.statut==='en_cours').length} en cours</span>`});
 pool.push(...testKpis);
 pool.push({lab:'Bilans datés',n:(B.length||'—'),d:`<span class="flat">${B.length>=2?'évolution suivie':'référence'}</span>`});
 if(mods.length)pool.push({lab:'Modules mesurés',n:mods.length,d:'<span class="flat">test(s) / questionnaire(s)</span>'});
 const cards=pool.slice(0,4);
 h+=`<div class="pk-grid" style="grid-template-columns:repeat(${Math.min(cards.length,4)||1},1fr)">${cards.map(k=>`<div class="pk"><span class="lab">${k.lab}</span><span class="n">${k.n}</span><span class="d">${k.d}</span></div>`).join('')}</div>`;
 // --- courbes d'évolution des tests ---
 const tcharts=METRICS.map(mt=>{const se=B.map(b=>({v:numv((b.t||{})[mt.k]),lab:dlab(b)})).filter(p=>Number.isFinite(p.v));return se.length>=2?`<div class="pcg"><h4>${esc(mt.l)}${mt.u?' ('+mt.u+')':''}</h4>${printChart(se,'#2b8ff0')}</div>`:''}).filter(Boolean).join('');
 if(tcharts)h+=`<div class="psect"><h2>Courbes d’évolution des tests</h2><div class="pcharts">${tcharts}</div></div>`;
 // --- tableau comparatif des tests ---
 if(B.length>=2){const init=B[0],last=B[B.length-1];const rows=METRICS.map(mt=>{const dc=mt.dc||0,vi=numv((init.t||{})[mt.k]),vl=numv((last.t||{})[mt.k]);if(!Number.isFinite(vi)&&!Number.isFinite(vl))return'';const d=(Number.isFinite(vi)&&Number.isFinite(vl))?vl-vi:NaN;const imp=Number.isFinite(d)&&d!==0?(mt.dir>0?d>0:mt.dir<0?d<0:null):null;const cls=(imp===null)?'flat':imp?'up':'down';return`<tr><td>${esc(mt.l)}${mt.u?' ('+mt.u+')':''}</td><td class="num">${fmt(vi,dc)}</td><td class="num">${fmt(vl,dc)}</td><td class="num ${cls}">${Number.isFinite(d)?(d>0?'+':'')+fmt(d,dc):'—'}</td></tr>`}).filter(Boolean).join('');
  if(rows)h+=`<div class="psect"><h2>Évolution des tests · ${dISO(init.date)} → ${dISO(last.date)}</h2><table class="ptbl"><thead><tr><th>Test</th><th style="text-align:right">Initial</th><th style="text-align:right">Dernier</th><th style="text-align:right">Δ</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
 else if(B.length===1){const init=B[0];const rows=METRICS.map(mt=>{const vi=numv((init.t||{})[mt.k]);return Number.isFinite(vi)?`<tr><td>${esc(mt.l)}${mt.u?' ('+mt.u+')':''}</td><td class="num">${fmt(vi,mt.dc||0)}</td></tr>`:''}).filter(Boolean).join('');if(rows)h+=`<div class="psect"><h2>Bilan initial · ${dISO(init.date)}</h2><table class="ptbl"><thead><tr><th>Test</th><th style="text-align:right">Valeur</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
 // --- ressenti au fil des séances ---
 const rcharts=[['Douleur en séance','douleur','#e0503f'],['Fatigue en séance','fatigue','#c88a1e'],['Effort perçu (Borg)','borg','#2b8ff0']].map(([l,key,col])=>{const se=presSe.map(s=>({v:numv(s[key]),lab:dISO(s.date).replace(/\s?\d{4}$/,'')})).filter(p=>Number.isFinite(p.v));return se.length>=2?`<div class="pcg"><h4>${l}</h4>${printChart(se,col)}</div>`:''}).filter(Boolean).join('');
 if(rcharts)h+=`<div class="psect"><h2>Ressenti au fil des séances</h2><div class="pcharts">${rcharts}</div></div>`;
 // --- objectifs ---
 if(objs.length)h+=`<div class="psect"><h2>Objectifs</h2><table class="ptbl"><thead><tr><th>Objectif</th><th>Cible</th><th>Échéance</th><th>Statut</th></tr></thead><tbody>${objs.map(o=>{const st=objStatus(o.statut);return`<tr><td>${esc(o.intitule)}</td><td>${esc(o.cible||'—')}</td><td>${o.echeance?dISO(o.echeance):'—'}</td><td><span class="pbadge ${st[2]}">${st[1]}</span></td></tr>`}).join('')}</tbody></table></div>`;
 // --- programme ---
 if(prog&&prog.blocs&&prog.blocs.length)h+=`<div class="psect"><h2>Programme ${esc(prog.version||'')}</h2>${prog.objectifs?`<p class="pnote" style="margin:-4px 0 9px"><b>Objectifs.</b> ${esc(prog.objectifs)}</p>`:''}<table class="ptbl"><thead><tr><th>Catégorie</th><th>Fréq.</th><th>Intensité</th><th>Type</th><th>Temps</th><th>Progression</th></tr></thead><tbody>${prog.blocs.map(b=>`<tr><td>${pcatLabel(b.cat)}</td><td>${esc(b.freq)}</td><td>${esc(b.intensite)}</td><td>${esc(b.type)}</td><td>${esc(b.temps)}</td><td>${esc(b.progression)}</td></tr>`).join('')}</tbody></table></div>`;
 // --- documents ---
 if(docs.length)h+=`<div class="psect"><h2>Documents</h2><table class="ptbl"><thead><tr><th>Type</th><th>Date</th><th>Expiration</th><th>Réf.</th></tr></thead><tbody>${docs.map(d=>`<tr><td>${esc(dtLabel(d.type))}</td><td>${d.date?dISO(d.date):'—'}</td><td>${d.expiry?dISO(d.expiry):'—'}</td><td>${esc(d.ref||'—')}</td></tr>`).join('')}</tbody></table></div>`;
 // --- consentements ---
 if(cons.length)h+=`<div class="psect"><h2>Consentements recueillis</h2><ul class="plist">${cons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 // --- synthèse des mesures ---
 if(mods.length)h+=`<div class="psect"><h2>Synthèse des mesures</h2>${mods.map(x=>`<p style="margin:4px 0 2px"><b>${esc(x.m.title)}</b></p><ul class="plist">${x.t.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`).join('')}</div>`;
 h+=`<div class="pfoot"><span>Blueperf · Activité physique adaptée</span><span>${esc(cname(c))} · ${dISO(todayISO())}</span></div>`;
 return h}
function buildProgDoc(code){const c=ctx.cache.clients[code]||{};const progs=programmesOf(code),prog=progs[progs.length-1];
 if(!prog)return`<div class="pband"><div><h1>Mon programme — ${esc(cname(c))}</h1><p class="psub">Activité physique adaptée</p></div><div class="pchip"><b>APA</b></div></div><div class="psect"><h2>Programme</h2><p>Aucun programme enregistré pour l’instant.</p></div>`;
 const sub=[esc(cname(c)),dISO(todayISO())].filter(Boolean).join(' · ');
 let h=`<div class="pband"><div><h1>Mon programme d’activité physique adaptée</h1><p class="psub">${sub}</p></div><div class="pchip"><b>${esc(prog.version||'v1')}</b>${prog.debut?'<br>dès le '+dISO(prog.debut):''}</div></div>`;
 if(prog.objectifs)h+=`<div class="psect" style="background:#f2faf5;border-color:#bfe6cf"><h2>Mes objectifs</h2><p>${esc(prog.objectifs)}</p></div>`;
 if(S.p.precau)h+=`<div class="palert"><span>⚠️</span><span><b>Précautions :</b> ${esc(S.p.precau)}</span></div>`;
 h+=`<div class="psect"><h2>Mon programme semaine par semaine</h2><table class="ptbl"><thead><tr><th>Type d’exercice</th><th>Combien de fois</th><th>Intensité</th><th>Quoi</th><th>Durée</th><th>Progression</th></tr></thead><tbody>${prog.blocs.map(b=>`<tr><td><b>${pcatLabel(b.cat)}</b></td><td>${esc(b.freq)}</td><td>${esc(b.intensite)}</td><td>${esc(b.type)}</td><td>${esc(b.temps)}</td><td>${esc(b.progression)}</td></tr>`).join('')}</tbody></table></div>`;
 if(prog.adaptations)h+=`<div class="psect"><h2>Adaptations</h2><p>${esc(prog.adaptations)}</p></div>`;
 if(prog.criteres)h+=`<div class="palert" style="background:#fdeae7;border-color:#f3c0b8;color:#9a2e22"><span>🛑</span><span><b>Quand s’arrêter ou consulter :</b> ${esc(prog.criteres)}</span></div>`;
 h+=`<div class="pfoot"><span>Blueperf · Activité physique adaptée</span><span>${esc(cname(c))} · ${dISO(todayISO())}</span></div>`;
 return h}

/* ---- enrichit la synthèse : tableau de bord + boutons d'export ---- */
const _syn0=subviews.synthese;
subviews.synthese=function(){const code=ctx.sel;
 const exp=`<div class="bar" style="margin-bottom:14px"><span class="note" style="min-width:220px">Tableau de bord du bénéficiaire. L’export télécharge directement un fichier PDF (bandeau, courbes, couleurs), généré localement — document confidentiel (données de santé).</span><span class="ctl"><button class="btn pri" data-act="pdfbilan">Exporter le bilan (PDF)</button><button class="btn" data-act="pdfprog">Programme à remettre (PDF)</button></span></div>`;
 return exp+clientDash(code)+_syn0()}

/* ---- enrichit le texte copiable (objectifs, programme, assiduité) ---- */
const _synText0=synText;
synText=function(){let o=_synText0();const code=ctx.sel;
 const objs=objectifsOf(code);if(objs.length)o+='\nObjectifs\n'+objs.map(x=>'- '+x.intitule+' ['+objStatus(x.statut)[1]+']').join('\n')+'\n';
 const progs=programmesOf(code),prog=progs[progs.length-1];if(prog&&prog.blocs&&prog.blocs.length)o+='\nProgramme '+(prog.version||'')+'\n'+prog.blocs.map(b=>'- '+pcatLabel(b.cat)+' : '+[b.freq,b.intensite,b.type,b.temps].filter(Boolean).join(', ')).join('\n')+'\n';
 const Ss=seancesOf(code),pres=Ss.filter(s=>s.presence==='present').length,abs=Ss.filter(s=>s.presence&&s.presence!=='present').length;if(pres+abs)o+='\nAssiduité : '+pres+' séance(s), '+abs+' absence(s)\n';
 return o}

/* ---- actions export ---- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
 if(b.dataset.act==='pdfbilan'){const nm=cname(ctx.cache.clients[ctx.sel]||{});exportPdf(buildBilanDoc(ctx.sel),'Bilan APA — '+nm,'Bilan-APA-'+slug(nm)+'-'+todayISO()+'.pdf')}
 else if(b.dataset.act==='pdfprog'){const nm=cname(ctx.cache.clients[ctx.sel]||{});exportPdf(buildProgDoc(ctx.sel),'Programme APA — '+nm,'Programme-APA-'+slug(nm)+'-'+todayISO()+'.pdf')}});
</script>
