<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* Thème partagé avec l'app Elite Adapt (même origine) : lit bp_theme et se met à jour en direct. */
(function(){function a(){var p=null;try{p=localStorage.getItem('bp_theme')}catch(e){}var r=document.documentElement;if(p==='light'||p==='dark')r.setAttribute('data-theme',p);else r.removeAttribute('data-theme');}a();try{window.addEventListener('storage',function(e){if(!e||e.key==='bp_theme'||e.key===null)a();});}catch(e){}})();
</script>
<title>Elite Adapt — Performance Football</title>
<link rel="icon" href="/elite-adapt-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Direction : tableau de bord de staff, bleu marine et bleu électrique, cartes denses sur fond froid */
:root{
  --bg:#eef1f6;--card:#fff;--soft:#f5f7fb;--ink:#0e1a2b;--mut:#5b6b82;--line:#dde3ec;
  --accent:#1e5bff;--accent-ink:#fff;--nav:#0b1730;--navink:#dbe5f7;
  --good:#14a05a;--warn:#e8a008;--bad:#d8344a;--info:#17a2c4;--viol:#7a5af8;--grey:#8c98ad;
  --good-bg:#e3f5eb;--warn-bg:#fdf2d7;--bad-bg:#fbe3e7;--info-bg:#dff3f8;--viol-bg:#ebe6fe;--grey-bg:#e9edf3;
  --shadow:0 1px 2px rgba(14,26,43,.06),0 4px 14px rgba(14,26,43,.05);
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;--f-body:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a111f;--card:#111b2f;--soft:#0e1729;--ink:#e8eef9;--mut:#93a4bf;--line:#233250;
  --accent:#5b8dff;--accent-ink:#06122b;--nav:#060c18;--navink:#c9d6ee;
  --good:#2fc77c;--warn:#f2b83a;--bad:#f0627a;--info:#3cc3e0;--viol:#9b82ff;--grey:#7e8ba3;
  --good-bg:#10301f;--warn-bg:#3a2e0d;--bad-bg:#3d1620;--info-bg:#0d2f38;--viol-bg:#241d4a;--grey-bg:#1b2740;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a111f;--card:#111b2f;--soft:#0e1729;--ink:#e8eef9;--mut:#93a4bf;--line:#233250;
  --accent:#5b8dff;--accent-ink:#06122b;--nav:#060c18;--navink:#c9d6ee;
  --good:#2fc77c;--warn:#f2b83a;--bad:#f0627a;--info:#3cc3e0;--viol:#9b82ff;--grey:#7e8ba3;
  --good-bg:#10301f;--warn-bg:#3a2e0d;--bad-bg:#3d1620;--info-bg:#0d2f38;--viol-bg:#241d4a;--grey-bg:#1b2740;
  --shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.2px;text-wrap:balance}
h1{font-size:30px;font-weight:700}h2{font-size:20px;font-weight:600}h3{font-size:16px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--nav);color:var(--navink);display:flex;align-items:center;gap:18px;padding:8px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff}
.logo{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 210deg,#1e5bff,#17a2c4,#1e5bff);position:relative}
.logo:after{content:"";position:absolute;inset:7px;border-radius:50%;border:3px solid #fff}
.bt{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1;display:flex;flex-direction:column}
.bt small{font-weight:500;font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.7}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nb{position:relative}
.nb>button,.nl{background:none;border:0;color:var(--navink);font:600 14px var(--f-body);padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.nb>button:hover,.nl:hover{background:rgba(255,255,255,.08)}
.nb>button.on,.nl.on{background:var(--accent);color:var(--accent-ink)}
.nb .car{font-size:9px;opacity:.7}
.dd{position:absolute;top:100%;left:0;min-width:200px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);padding:6px;display:none;z-index:40}
.nb.open .dd{display:block}
.dd button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:500 14px var(--f-body);padding:9px 12px;border-radius:7px;cursor:pointer}
.dd button:hover{background:var(--soft)}.dd button.on{background:var(--accent);color:var(--accent-ink)}
.tools{display:flex;gap:10px;align-items:center}
.sync{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.1)}
.sync.ok{background:rgba(47,199,124,.2);color:#8be7b9}
/* layout */
main{max-width:1560px;margin:0 auto;padding:18px 18px 60px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph p{margin:2px 0 0;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1100px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card>header small{display:block;color:var(--mut);font-size:12.5px;margin-top:1px}
.mt{margin-top:14px}
.chart{position:relative;height:250px}.chart.tall{height:330px}.chart.short{height:200px}
/* kpi */
.kpi{display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--accent))}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1.05}
.kpi .v small{font-size:15px;color:var(--mut);font-weight:500;margin-left:4px}
.kpi .s{font-size:12.5px;color:var(--mut)}
/* controls */
.btn{font:600 14px var(--f-body);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:inherit;border-color:var(--line)}
.top .btn.ghost{color:var(--navink);border-color:rgba(255,255,255,.2)}
.btn.sec{background:var(--soft);color:var(--ink);border-color:var(--line)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.nl:focus-visible,.nb>button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:500 14px var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input[type=number]{width:74px}input[type=date]{width:140px}input[type=time]{width:100px}
textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);font-weight:600}
label.f input,label.f select{font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;padding:6px 12px;font:600 13px var(--f-body);color:var(--mut);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font:600 14px var(--f-body);color:var(--mut);cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--grey-bg);color:var(--mut)}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}.pill.viol{background:var(--viol-bg);color:var(--viol)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--soft)}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
td input[type=number]{width:62px;padding:4px 6px}
.stick{position:sticky;left:0;background:var(--card);z-index:2}
th.stick{background:var(--soft);z-index:3}
tbody tr:hover td.stick{background:var(--soft)}
/* calendar */
.cal th,.cal td{padding:4px 5px;text-align:center;min-width:74px}
.cal th.stick,.cal td.stick{text-align:left;min-width:150px;padding-left:10px}
.cal .dh{font-size:11px;line-height:1.2}.cal .dh b{display:block;color:var(--ink);font-size:12px;text-transform:none;letter-spacing:0}
.cal .today{box-shadow:inset 0 -3px 0 var(--accent)}
.cell{display:block;width:100%;border:0;border-radius:6px;padding:4px 3px;font:600 11.5px var(--f-body);cursor:pointer;line-height:1.15;background:var(--grey-bg);color:var(--mut)}
.cell small{display:block;font-weight:500;font-size:10.5px;opacity:.85}
.cell.ok{background:var(--good-bg);color:var(--good)}.cell.miss{background:var(--warn-bg);color:var(--warn)}
.cell.bad{background:var(--bad-bg);color:var(--bad)}.cell.rea{background:var(--info-bg);color:var(--info)}
.cell.viol{background:var(--viol-bg);color:var(--viol)}.cell.plan{background:transparent;border:1px dashed var(--line);color:var(--mut)}
.cell.none{background:transparent;cursor:default}
.bar{height:8px;border-radius:99px;background:var(--grey-bg);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* misc blocks */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:12.5px}
.chip button{background:none;border:0;cursor:pointer;color:var(--mut);padding:0;font-size:14px;line-height:1}
.empty{color:var(--mut);padding:18px;text-align:center;font-size:14px}
.muted{color:var(--mut)}.sm{font-size:13px}.b{font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.slotg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.phase{display:flex;gap:8px;align-items:center;padding:6px 0}
.reco{border-left:4px solid var(--grey);padding:8px 12px;background:var(--soft);border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:2px}
.reco.rouge{border-color:var(--bad)}.reco.orange{border-color:var(--warn)}.reco.vert{border-color:var(--good)}.reco.bleu{border-color:var(--info)}
.reco b{font-size:14px}.reco span{font-size:13px;color:var(--mut)}
.pitch{width:100%;height:auto;display:block;border-radius:10px;touch-action:none;user-select:none}
.tok{cursor:grab}.tok text{pointer-events:none}
/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(5,10,22,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto}
.modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:18px;width:min(720px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.sc{overflow-x:auto}
.week td,.week th{white-space:normal;vertical-align:top;min-width:150px}
.week input[type=text],.week select,.week textarea{width:100%}
.week textarea{min-height:64px}

/* planification : barres de niveau */
.eq{display:grid;grid-template-columns:150px 1fr 44px;align-items:stretch;margin-top:6px}
.eql{display:flex;flex-direction:column;justify-content:center;gap:6px;padding-right:10px;font-size:13px}
.eqb{display:inline-flex;gap:4px}
.eqb button{width:26px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:700 15px/1 var(--f-body);cursor:pointer;padding:0}
.eqb button:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.eqcols{display:grid;grid-template-columns:repeat(var(--n),1fr);cursor:ns-resize;touch-action:none;user-select:none}
.eqcols .col{position:relative;display:flex;flex-direction:column;gap:2px;padding:0 1px;height:var(--h)}
.eqcols .col i{flex:1;border-radius:2px;background:var(--grey-bg)}
.eqcols .col i.on{background:var(--c)}
.eqcols .col.cur{outline:1.5px solid var(--ink);outline-offset:0;border-radius:3px}
.eqcols .col b.mk{position:absolute;left:0;right:0;height:3px;margin-bottom:-1.5px;background:var(--ink);border-top:1px solid var(--card);border-bottom:1px solid var(--card);pointer-events:none}
.eqcols.zs{cursor:default;height:26px;align-items:stretch}
.zb{font:600 11px var(--f-body);display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:5px;border:1px solid;margin:0 1px;padding:0 4px}

.hv{cursor:crosshair}.hv:hover{fill:rgba(128,140,170,.16)}

/* ===== Rebrand Elite Adapt : couleurs, logo, barre flottante en bas ===== */
:root{--accent:#1B46C9;--accent-ink:#fff;--nav:#0E1A2C;--bg:#EFF2F6;--card:#FFFFFF;--soft:#F6F8FB;--ink:#0E1A2C;--mut:#667386;--line:#DCE2EA}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#7B9BFF;--accent-ink:#08101E;--nav:#060A10;--bg:#090E16;--card:#111925;--soft:#0D141E;--ink:#E6ECF4;--mut:#8392A7;--line:#213046}}
:root[data-theme="dark"]{--accent:#7B9BFF;--accent-ink:#08101E;--nav:#060A10;--bg:#090E16;--card:#111925;--soft:#0D141E;--ink:#E6ECF4;--mut:#8392A7;--line:#213046}
.top .logo{background:none!important;border-radius:0;width:auto;height:28px}
.top .logo:after{display:none}
.ea-mark{height:26px;width:auto;display:block}
.ea-logo-wrap{position:relative;display:inline-flex;align-items:center}
.ea-season{position:absolute;top:-8px;right:-2px;font-size:13px;line-height:1;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
main{padding-bottom:116px!important}
#botbar{position:fixed;left:0;right:0;bottom:0;z-index:50;pointer-events:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bb-in{pointer-events:auto;max-width:600px;margin:0 auto;display:flex;gap:2px;padding:8px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border:1px solid color-mix(in srgb,var(--line) 85%,#fff 15%);border-radius:28px;box-shadow:0 14px 34px -10px rgba(0,0,0,.4)}
.bb-b{flex:1;appearance:none;background:none;border:0;cursor:pointer;color:var(--mut);font:600 10.5px/1.12 var(--f-body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;text-align:center}
.bb-b .ic{width:46px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:14px;transition:background .15s}
.bb-b .ic svg{width:22px;height:22px}
.bb-b span{display:block;max-width:82px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-b.on{color:var(--accent)}
.bb-b.on .ic{background:color-mix(in srgb,var(--accent) 16%,transparent)}
#botsheet[hidden]{display:none}
.bs-bg{position:fixed;inset:0;background:rgba(5,10,22,.45);z-index:55}
.bs-panel{position:fixed;left:0;right:0;bottom:0;z-index:56;background:var(--card);border-radius:18px 18px 0 0;border:1px solid var(--line);padding:10px 12px calc(18px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;box-shadow:0 -12px 40px rgba(0,0,0,.3)}
.bs-h{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 10px}
.bs-h b{font-family:var(--f-display);font-size:17px}
.bs-x{appearance:none;background:none;border:0;font-size:18px;color:var(--mut);cursor:pointer;line-height:1}
.bs-list{display:flex;flex-direction:column;gap:4px}
.bs-i{display:block;width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:600 14.5px var(--f-body);color:var(--ink);cursor:pointer}
.bs-i.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* De-box GLOBAL du contenu : plus d'encadré de couleur, texte directement sur la page.
   (La fenêtre modale .mbox et la barre du bas gardent leur cadre.) */
#main .card{background:none;border:0;box-shadow:none;border-radius:0;padding:0}
#main .card>header{margin-bottom:9px}
#main .grid{gap:24px}
#main .kpi{background:none;border:0;box-shadow:none;border-radius:0;padding:1px 0 1px 13px}
#main .kpi:before{border-radius:3px}
#main .tw{border:0;border-radius:0}
#main .slot{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="ea-logo-wrap"><img class="ea-mark" src="/elite-adapt-mark.svg" alt="Elite Adapt" onerror="this.onerror=null;this.src='/elite-adapt-icon.svg'"><span class="ea-season" id="eaSeason"></span></span><span class="bt">Elite Adapt<small>Performance Football</small></span></div>
  <div class="tools">
    <span class="sync" id="sync" title="État de la sauvegarde">En ligne</span>
    <button class="btn ghost sm" data-a="squad">Effectif</button>
  </div>
</header>
<main id="main"></main>
<nav id="botbar" aria-label="Navigation"></nav>
<div id="botsheet" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';
/* ================= Utilitaires ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iso = d => { const z = d.getTimezoneOffset(); return new Date(d.getTime() - z * 60000).toISOString().slice(0, 10); };

    mk('c5', { type: 'bar', data: { labels: lab, datasets: [{ type: 'bar', label: 'Douleurs signalées', data: days.map(d => pains(d).length), backgroundColor: col('--bad'), ...thin(), yAxisID: 'y' }, { type: 'line', label: 'Index Hooper moyen', data: hi, borderColor: col('--accent'), backgroundColor: col('--accent'), borderWidth: 2, pointRadius: 0, tension: .3, spanGaps: true, yAxisID: 'y2' }] }, options: opts({ y2: true, yt: 'Joueurs', y2t: 'Index (4–28)', y2min: 4, y2max: 28, y2zero: false, yticks: { precision: 0 } }) });

    </div>

/* ================= Séances (calendrier) ================= */
VIEWS.seances = () => {
  const w = UI.calWeeks, st = UI.calStart, days = range(st, add(st, w * 7 - 1));
  const evs = events(), by = {}; evs.forEach(e => (by[e.date] = by[e.date] || []).push(e));
  const cols = []; days.forEach(d => { if (by[d]) by[d].forEach(e => cols.push({ d, e })); else cols.push({ d, e: null }); });
  const head1 = cols.map(c => `<th class="dh ${c.d === TODAY ? 'today' : ''}">${JOURS[dow(c.d)]}<b>${fd(c.d)}</b>${c.e ? `<span title="${esc(c.e.nom)}">${esc(c.e.short.length > 11 ? c.e.short.slice(0, 10) + '…' : c.e.short)}</span>` : ''}</th>`).join('');
  const body = S.players.map(p => `<tr><td class="stick b">${esc(p.nom)} <span class="muted sm">${esc(p.poste)}</span></td>${cols.map(c => calCell(c, p)).join('')}</tr>`).join('');
  const win = UI.presWin, ws = add(TODAY, -win + 1);
  const past = evs.filter(e => e.date >= ws && e.date <= TODAY);
  const rows = S.players.map(p => { const o = { id: p.id, n: p.nom, N: past.length, ok: 0, absent: 0, blesse: 0, malade: 0, rea: 0, repos: 0, nc: 0 }; past.forEach(e => { const c = cell(e, p.id); if (c.st === 'present') o.ok++; else if (c.st) o[c.st]++; }); o.pct = o.N ? o.ok / o.N * 100 : 0; return o; });
  const tot = { ok: sum(rows.map(r => r.ok)), N: sum(rows.map(r => r.N)) };
  const pc = v => v >= 85 ? 'var(--good)' : v >= 65 ? 'var(--warn)' : 'var(--bad)';
  return head('Séances', 'Calendrier de l\'effectif et taux de présence', `<div class="row"><button class="btn ghost sm" data-a="calMove" data-v="-${w * 7}">◀</button><label class="f">Début<input type="date" data-b="UI.calStart" data-r="1" value="${st}"></label><button class="btn ghost sm" data-a="calMove" data-v="${w * 7}">▶</button><button class="btn ghost sm" data-a="calToday">Aujourd'hui</button></div>${seg([[1, '1 sem.'], [2, '2 sem.'], [4, '4 sem.']], w, 'calWeeks')}`) +
    card('Calendrier des séances', `<div class="legend" style="margin-bottom:8px"><span><i class="dot" style="color:var(--good)"></i>Séance réalisée (RPE)</span><span><i class="dot" style="color:var(--warn)"></i>RPE manquant</span><span><i class="dot" style="color:var(--bad)"></i>Blessé</span><span><i class="dot" style="color:var(--info)"></i>Réathlétisation</span><span><i class="dot" style="color:var(--viol)"></i>Malade</span><span><i class="dot" style="color:var(--grey)"></i>Absent, repos</span><span>Cliquez sur une case pour modifier</span></div><div class="tw cal"><table><thead><tr><th class="stick">Joueur</th>${head1}</tr></thead><tbody>${body}</tbody></table></div>`) +
    `<div class="mt">` + card('Taux de présence aux séances', `<div class="row" style="margin-bottom:10px">${seg([[28, '4 semaines'], [56, '8 semaines'], [100, '100 jours']], win, 'presWin')}<span class="muted sm">Équipe : <b>${tot.ok}/${tot.N}</b> séances réalisées, soit ${r0(tot.N ? tot.ok / tot.N * 100 : 0)} %</span></div>
    <div class="tw"><table><thead><tr><th>Joueur</th><th class="c">Réalisées</th><th>Taux</th><th class="c">Absent</th><th class="c">Blessé</th><th class="c">Réathl.</th><th class="c">Malade</th><th class="c">Repos</th><th class="c">Non conv.</th></tr></thead><tbody>${rows.map(r => `<tr><td class="b">${esc(r.n)}</td><td class="c num"><b>${r.ok}</b>/${r.N}</td><td style="min-width:150px"><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${r.pct}%;background:${pc(r.pct)}"></i></div><b class="num">${r0(r.pct)} %</b></div></td><td class="c">${r.absent || ''}</td><td class="c">${r.blesse || ''}</td><td class="c">${r.rea || ''}</td><td class="c">${r.malade || ''}</td><td class="c">${r.repos || ''}</td><td class="c">${r.nc || ''}</td></tr>`).join('')}</tbody></table></div>`);
};
function calCell(c, p) {
  const t = c.d === TODAY ? 'today' : '';
  if (!c.e) { const s = dayStatus(p.id, c.d); if (s === 'blesse' || s === 'rea' || s === 'malade') return `<td class="${t}"><span class="cell ${s === 'blesse' ? 'bad' : s === 'rea' ? 'rea' : 'viol'} none" style="opacity:.55">${STAT[s][0].slice(0, 6)}.</span></td>`; return `<td class="${t}"></td>`; }
  const k = cell(c.e, p.id), nm = c.e.short.length > 11 ? c.e.short.slice(0, 10) + '…' : c.e.short, at = `data-a="cellEdit" data-ev="${c.e.id}" data-k="${c.e.k}" data-pid="${p.id}"`;
  let cls = 'plan', tx = esc(nm);
  if (!k.st) { if (c.d <= TODAY) { cls = 'none'; tx = '·'; } }
  else if (k.st === 'present') { if (k.bench) { cls = ''; tx = 'Banc'; } else if (k.rpe) { cls = 'ok'; tx = `${esc(nm)}<small>RPE ${k.rpe}${c.e.k === 'm' ? ' · ' + k.min + '\'' : ''}</small>`; } else { cls = 'miss'; tx = c.d <= TODAY ? 'RPE ?' : esc(nm); } }
  else if (k.st === 'rea') { cls = 'rea'; tx = `Réathl.${k.rpe ? `<small>RPE ${k.rpe}</small>` : ''}`; }
  else if (k.st === 'blesse') { cls = 'bad'; tx = 'Blessé'; } else if (k.st === 'malade') { cls = 'viol'; tx = 'Malade'; }
  else if (k.st === 'absent') { cls = ''; tx = 'Absent'; } else if (k.st === 'repos') { cls = ''; tx = 'Repos'; } else if (k.st === 'nc') { cls = ''; tx = 'Non conv.'; }
  return `<td class="${t}"><button class="cell ${cls}" ${at} title="${esc(c.e.nom)}">${tx}</button></td>`;
}
A.calMove = el => { UI.calStart = add(UI.calStart, +el.dataset.v); render(); };

  const cur = k => { const v = T(k)[i]; return v; };
  const w0 = wkS[i], w1 = wkS[i - 7], dl7 = w1 ? (w0 / w1 - 1) * 100 : null;
  const [zl, zc] = zoneAcwr(acE[i]);

  const ws = weeks.map(w => { const d = add(w, 6) > TODAY ? TODAY : add(w, 6); const k = DAYS_ALL.indexOf(d); return k >= 0 ? teamSer('strain', pids)[k] : null; });

    mk('k2', { type: 'bar', data: { labels: lab, datasets: [{ label: 'Forme (TSB = CTL − ATL)', data: tsb.slice(off), backgroundColor: tsb.slice(off).map(v => v >= 0 ? col('--good') : col('--bad')), ...thin({ maxBarThickness: 8 }) }] }, options: opts({ legend: false, zero: false, yt: 'TSB', xt: 12 }) });
    const flat = v => Array(n).fill(v);
    mk('k3', { type: 'line', data: { labels: lab, datasets: [{ label: 'ACWR glissant 7/28', data: acR.slice(off), borderColor: col('--accent'), backgroundColor: col('--accent'), borderWidth: 2, pointRadius: 0, tension: .3, spanGaps: true }, { label: 'ACWR EWMA', data: acE.slice(off), borderColor: col('--viol'), backgroundColor: col('--viol'), borderWidth: 2, pointRadius: 0, tension: .3, spanGaps: true }, { label: '0,8', data: flat(.8), borderColor: col('--info'), borderDash: [5, 4], borderWidth: 1, pointRadius: 0 }, { label: '1,3', data: flat(1.3), borderColor: col('--warn'), borderDash: [5, 4], borderWidth: 1, pointRadius: 0 }, { label: '1,5', data: flat(1.5), borderColor: col('--bad'), borderDash: [5, 4], borderWidth: 1, pointRadius: 0 }] }, options: opts({ yt: 'Ratio', zero: false, xt: 12, min: 0.4 }) });
    mk('k4', { type: 'bar', data: { labels: weeks.map(dl), datasets: [{ type: 'bar', label: 'Charge hebdo (AU)', data: wl, backgroundColor: col('--accent'), ...thin({ maxBarThickness: 18 }) }, { type: 'line', label: 'Monotonie', data: wm, borderColor: col('--warn'), backgroundColor: col('--warn'), borderWidth: 2, pointRadius: 3, tension: .3, yAxisID: 'y2', spanGaps: true }] }, options: opts({ y2: true, yt: 'AU / semaine', y2t: 'Monotonie', xt: 10 }) });

  });

};

<script>
'use strict';
/* ================= Testing ================= */
const tdef = id => S.testDefs.find(t => t.id === id);
const camps = id => S.tests.filter(t => t.t === id).sort((a, b) => a.d.localeCompare(b.d));
function zcol(df, vals, v) { const a = Object.values(vals); const s = sd(a); if (!s || v == null) return ''; const z = (v - mean(a)) / s * (df.best === 'min' ? -1 : 1); return z > .8 ? 'var(--good)' : z < -.8 ? 'var(--bad)' : 'inherit'; }
VIEWS.testing = () => {
  const tabs = `<div class="tabs"><button class="${UI.testSub === 'tests' ? 'on' : ''}" data-a="testSub" data-v="tests">Tests physiques</button><button class="${UI.testSub === 'mesures' ? 'on' : ''}" data-a="testSub" data-v="mesures">Mesures (taille, poids, masse grasse, PHV)</button></div>`;
  return head('Testing', 'Tests athlétiques et mesures anthropométriques') + tabs + (UI.testSub === 'tests' ? testsView() : measView());
};
A.testSub = el => { UI.testSub = el.dataset.v; render(); };
function testsView() {
  const df = tdef(UI.testSel) || S.testDefs[0]; UI.testSel = df.id;
  const key = df.id + UI.testDate;
  if (UI.testDraftKey !== key) { const ex = S.tests.find(t => t.t === df.id && t.d === UI.testDate); UI.testDraft = Object.assign({}, ex ? ex.v : {}); UI.testDraftKey = key; }
  const cs = camps(df.id), last = cs[cs.length - 1], prev = cs[cs.length - 2];
  const rows = last ? S.players.filter(p => last.v[p.id] != null).map(p => ({ p, v: last.v[p.id], pv: prev ? prev.v[p.id] : null })) : [];
  rows.sort((a, b) => df.best === 'min' ? a.v - b.v : b.v - a.v);
  const m = rows.length ? mean(rows.map(r => r.v)) : null;
  Q.push(() => {
    if (!rows.length) return;
    mk('t1', { type: 'bar', data: { labels: rows.map(r => short(r.p.id)), datasets: [{ type: 'bar', label: df.nom + ' (' + df.unite + ')', data: rows.map(r => r.v), backgroundColor: rows.map(r => { const c = zcol(df, last.v, r.v); return c === 'inherit' ? col('--accent') : c; }), ...thin({ maxBarThickness: 16 }) }, { type: 'line', label: 'Moyenne équipe', data: rows.map(() => +m.toFixed(2)), borderColor: col('--warn'), borderDash: [6, 4], borderWidth: 2, pointRadius: 0 }] }, options: opts({ zero: df.best === 'max' && df.cat !== 'x', yt: df.unite, xt: 24 }) });
    const sel = S.players.find(p => p.id === UI.testPlayer) || S.players[0];
    mk('t2', { type: 'line', data: { labels: cs.map(c => fd(c.d)), datasets: [{ label: 'Moyenne équipe', data: cs.map(c => mean(Object.values(c.v))), borderColor: col('--accent'), backgroundColor: col('--accent'), borderWidth: 3, tension: .25, pointRadius: 4 }, { label: sel.nom, data: cs.map(c => c.v[sel.id] ?? null), borderColor: col('--good'), backgroundColor: col('--good'), borderWidth: 2.5, tension: .25, pointRadius: 4, spanGaps: true }, { label: 'Meilleure valeur', data: cs.map(c => df.best === 'min' ? Math.min(...Object.values(c.v)) : Math.max(...Object.values(c.v))), borderColor: col('--warn'), borderDash: [5, 4], borderWidth: 1.5, pointRadius: 2, tension: .25 }] }, options: opts({ zero: false, yt: df.unite }) });
  });
  const lastBy = id => { const c = camps(id); return [c[c.length - 1], c[c.length - 2]]; };
  const matrix = `<div class="tw"><table><thead><tr><th class="stick">Joueur</th>${S.testDefs.map(d => `<th class="r" title="${esc(d.nom)}">${esc(d.nom)}<br><span style="text-transform:none">${esc(d.unite)}</span></th>`).join('')}</tr></thead><tbody>${S.players.map(p => `<tr><td class="stick b">${esc(p.nom)}</td>${S.testDefs.map(d => { const [l, pr] = lastBy(d.id); if (!l || l.v[p.id] == null) return '<td class="r muted">–</td>'; const v = l.v[p.id], pv = pr ? pr.v[p.id] : null; const up = pv == null ? '' : ((d.best === 'max' ? v > pv : v < pv) ? '<span style="color:var(--good)"> ▲</span>' : (v === pv ? '' : '<span style="color:var(--bad)"> ▼</span>')); return `<td class="r num" style="color:${zcol(d, l.v, v)};font-weight:600">${r1(v)}${up}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
  const byCat = {}; S.testDefs.forEach(d => (byCat[d.cat] = byCat[d.cat] || []).push(d));
  const sel = `<optgroup label="">${''}</optgroup>`;

  return `<div class="grid g12">
    ${card('Saisie d\'une campagne de test', `<div class="row" style="margin-bottom:10px"><label class="f">Test${testSelect}</label><label class="f">Date<input type="date" data-b="UI.testDate" data-r="1" value="${UI.testDate}"></label></div>
      <div class="tw" style="max-height:420px;overflow:auto"><table><thead><tr><th>Joueur</th><th>Résultat (${esc(df.unite)})</th></tr></thead><tbody>${S.players.map(p => `<tr><td>${esc(p.nom)}</td><td><input type="number" step="any" data-b="UI.testDraft.${p.id}" value="${UI.testDraft[p.id] ?? ''}"></td></tr>`).join('')}</tbody></table></div>
      <div class="row mt"><button class="btn" data-a="testSave">Enregistrer la campagne</button><span class="muted sm">${df.best === 'min' ? 'Meilleur = valeur la plus basse' : 'Meilleur = valeur la plus haute'}</span></div>
      <details class="mt"><summary class="b sm" style="cursor:pointer">Ajouter un test personnalisé</summary><div class="row mt"><label class="f">Nom<input id="nt-n" type="text" style="width:150px"></label><label class="f">Unité<input id="nt-u" type="text" style="width:70px"></label><label class="f">Catégorie<input id="nt-c" type="text" value="Autre" style="width:100px"></label><label class="f">Meilleur<select id="nt-b"><option value="max">Plus haut</option><option value="min">Plus bas</option></select></label><button class="btn sec sm" data-a="testAdd">Ajouter</button></div></details>`)}

    </div></div>

}
A.testSave = () => {
  const df = tdef(UI.testSel), v = {}; Object.keys(UI.testDraft).forEach(k => { const x = UI.testDraft[k]; if (x != null && x !== '') v[k] = +x; });
  if (!Object.keys(v).length) { toast('Saisissez au moins un résultat.'); return; }
  S.tests = S.tests.filter(t => !(t.t === df.id && t.d === UI.testDate)); S.tests.push({ d: UI.testDate, t: df.id, v }); touch(); toast('Campagne enregistrée'); render();
};
A.testAdd = () => { const n = $('#nt-n').value.trim(); if (!n) { toast('Donnez un nom au test.'); return; } const id = 'x' + uid(); S.testDefs.push({ id, nom: n, unite: $('#nt-u').value.trim() || '', best: $('#nt-b').value, cat: $('#nt-c').value.trim() || 'Autre' }); UI.testSel = id; touch(); render(); };

const PHV = o => o == null ? ['–', ''] : o < -1 ? ['Pré-PHV', 'info'] : o <= 1 ? ['Circa-PHV', 'warn'] : ['Post-PHV', 'good'];
function measView() {
  const key = UI.measDate;
  if (UI.measDraftKey !== key) { const ex = S.measures.find(m => m.d === key); const o = {}; S.players.forEach(p => { const b = ex ? ex.v[p.id] : lastMeasure(p.id); o[p.id] = Object.assign({}, b || {}); delete o[p.id].d; }); UI.measDraft = o; UI.measDraftKey = key; }
  const ms = [...S.measures].sort((a, b) => a.d.localeCompare(b.d));
  const sel = UI.measPlayer;
  Q.push(() => {
    const dates = ms.filter(m => m.v[sel]).map(m => m.d), g = f => dates.map(d => ms.find(m => m.d === d).v[sel][f]);
    mk('m1', { type: 'line', data: { labels: dates.map(fd), datasets: [{ label: 'Taille (cm)', data: g('t'), borderColor: col('--accent'), backgroundColor: col('--accent'), borderWidth: 2.5, tension: .25, pointRadius: 4 }, { label: 'Poids (kg)', data: g('p'), borderColor: col('--good'), backgroundColor: col('--good'), borderWidth: 2.5, tension: .25, pointRadius: 4, yAxisID: 'y2' }] }, options: opts({ zero: false, y2: true, y2zero: false, yt: 'cm', y2t: 'kg' }) });
    mk('m2', { type: 'line', data: { labels: dates.map(fd), datasets: [{ label: 'Masse grasse (%)', data: g('mg'), borderColor: col('--warn'), backgroundColor: col('--warn'), borderWidth: 2.5, tension: .25, pointRadius: 4 }, { label: 'Décalage de maturité (ans)', data: g('phv'), borderColor: col('--viol'), backgroundColor: col('--viol'), borderWidth: 2.5, tension: .25, pointRadius: 4, yAxisID: 'y2' }] }, options: opts({ zero: false, y2: true, y2zero: false, yt: '%', y2t: 'Années vs PHV' }) });
    const L = S.players.map(p => ({ p, m: lastMeasure(p.id) })).filter(x => x.m).sort((a, b) => a.m.phv - b.m.phv);
    mk('m3', { type: 'bar', data: { labels: L.map(x => short(x.p.id)), datasets: [{ label: 'Décalage de maturité (ans)', data: L.map(x => x.m.phv), backgroundColor: L.map(x => col('--' + PHV(x.m.phv)[1])), ...thin({ maxBarThickness: 14 }) }] }, options: opts({ legend: false, zero: false, yt: 'Années vs PHV', xt: 24 }) });
    mk('m4', { type: 'bar', data: { labels: S.players.map(p => short(p.id)), datasets: [{ label: 'Masse grasse (%)', data: S.players.map(p => (lastMeasure(p.id) || {}).mg ?? null), backgroundColor: col('--warn'), ...thin({ maxBarThickness: 14 }) }, { type: 'line', label: 'Moyenne', data: S.players.map(() => +mean(S.players.map(p => (lastMeasure(p.id) || {}).mg).filter(v => v != null)).toFixed(1)), borderColor: col('--ink'), borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0 }] }, options: opts({ yt: '%', xt: 24 }) });
  });
  const grid = S.players.map(p => { const d = UI.measDraft[p.id] || {}; const inp = (f, st) => `<td><input type="number" step="${st}" data-b="UI.measDraft.${p.id}.${f}" value="${d[f] ?? ''}"></td>`; return `<tr><td>${esc(p.nom)}</td>${inp('t', .1)}${inp('p', .1)}${inp('mg', .1)}${inp('phv', .01)}</tr>`; }).join('');
  const table = S.players.map(p => {
    const l = lastMeasure(p.id); if (!l) return ''; const ph = PHV(l.phv);
    const hist = ms.filter(m => m.v[p.id] && m.d >= add(l.d, -365)); let vit = null; if (hist.length > 1) { const a = hist[0], b = hist[hist.length - 1]; const days = (pd(b.d) - pd(a.d)) / 864e5; if (days > 20) vit = (b.v[p.id].t - a.v[p.id].t) / days * 365; }
    const imc = l.p / ((l.t / 100) ** 2), mm = l.p * (1 - l.mg / 100);
    return `<tr><td class="b">${esc(p.nom)}</td><td class="r num">${r1(l.t)}</td><td class="r num">${r1(l.p)}</td><td class="r num">${r1(imc)}</td><td class="r num">${r1(l.mg)}</td><td class="r num">${r1(mm)}</td><td class="r num">${r2(l.phv)}</td><td>${pill(ph[0], ph[1])}</td><td class="r num">${vit == null ? '–' : r1(vit)}</td><td class="muted">${fd(l.d)}</td></tr>`;
  }).join('');
  return `<div class="grid g12">
    ${card('Saisie des mesures', `<label class="f" style="margin-bottom:10px;width:160px">Date de mesure<input type="date" data-b="UI.measDate" data-r="1" value="${UI.measDate}"></label><div class="tw" style="max-height:440px;overflow:auto"><table><thead><tr><th>Joueur</th><th>Taille cm</th><th>Poids kg</th><th>MG %</th><th>PHV ans</th></tr></thead><tbody>${grid}</tbody></table></div><div class="row mt"><button class="btn" data-a="measSave">Enregistrer</button></div><p class="muted sm">PHV : décalage de maturité en années par rapport au pic de croissance (Mirwald). Négatif avant le pic, positif après.</p>`)}
    <div class="grid g2">
      ${card('Croissance et poids', cv('m1'), { sub: 'Joueur sélectionné', act: `<label class="f">Joueur<select data-b="UI.measPlayer" data-r="1">${playerOpts(sel)}</select></label>` })}
      ${card('Masse grasse et maturité', cv('m2'), { sub: 'Joueur sélectionné' })}
      ${card('Statut de maturité de l\'effectif', cv('m3'), { sub: 'Pré-PHV &lt; −1 · Circa-PHV de −1 à +1 · Post-PHV &gt; +1' })}
      ${card('Masse grasse de l\'effectif', cv('m4'))}
    </div></div>
    <div class="mt">${card('Dernières mesures', `<div class="tw"><table><thead><tr><th>Joueur</th><th class="r">Taille</th><th class="r">Poids</th><th class="r">IMC</th><th class="r">MG %</th><th class="r">Masse maigre</th><th class="r">PHV</th><th>Statut</th><th class="r">Croissance cm/an</th><th>Date</th></tr></thead><tbody>${table}</tbody></table></div>`)}</div>`;
}
A.measSave = () => {
  const v = {}; S.players.forEach(p => { const d = UI.measDraft[p.id] || {}; if (d.t != null && d.t !== '' && d.p != null && d.p !== '') v[p.id] = { t: +d.t, p: +d.p, mg: +(d.mg ?? 0), phv: +(d.phv ?? 0) }; });
  if (!Object.keys(v).length) { toast('Renseignez au moins taille et poids.'); return; }
  S.measures = S.measures.filter(m => m.d !== UI.measDate); S.measures.push({ d: UI.measDate, v }); S.measures.sort((a, b) => a.d.localeCompare(b.d)); touch(); UI.measDraftKey = null; toast('Mesures enregistrées'); render();
};

/* ================= Récupération ================= */
const RTYPES = ['Étirements', 'Bottes de récupération', 'Bain froid', 'Cryothérapie', 'Massage', 'Sauna', 'Piscine / balnéo', 'Autre'];
VIEWS.recuperation = () => {
  const d0 = UI.recDate, dr = UI.recDraft;
  const slots = S.recov.filter(s => s.date >= d0 && s.date <= add(d0, 9)).sort((a, b) => a.date.localeCompare(b.date) || a.debut.localeCompare(b.debut));
  const days = {}; slots.forEach(s => (days[s.date] = days[s.date] || []).push(s));
  const tot = sum(slots.map(s => s.ins.length)), cap = sum(slots.map(s => s.cap));
  const typ = {}; slots.forEach(s => typ[s.type] = (typ[s.type] || 0) + s.ins.length);
  Q.push(() => { const k = Object.keys(typ); if (k.length) mk('r1', { type: 'bar', data: { labels: k, datasets: [{ label: 'Joueurs inscrits', data: k.map(x => typ[x]), backgroundColor: col('--accent'), ...thin({ maxBarThickness: 18 }) }] }, options: opts({ legend: false, yt: 'Inscriptions', yticks: { precision: 0 }, xt: 8 }) }); });
  const list = Object.keys(days).map(d => `<h3 style="margin:16px 0 8px;text-transform:capitalize">${fdl(d).replace(/ \d{4}$/, '')}</h3><div class="slotg">${days[d].map(s => { const pct = s.cap ? s.ins.length / s.cap * 100 : 0; const free = S.players.filter(p => !s.ins.includes(p.id)); return `<div class="slot"><div class="row" style="justify-content:space-between"><span class="b">${esc(s.type)}</span><span class="num muted">${s.debut}–${s.fin}</span></div><div class="muted sm">${esc(s.lieu || '')}</div><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${Math.min(100, pct)}%;background:${pct >= 100 ? 'var(--bad)' : 'var(--accent)'}"></i></div><span class="num sm">${s.ins.length}/${s.cap}</span></div><div class="chips">${s.ins.map(id => `<span class="chip">${esc(short(id))}<button data-a="recRem" data-id="${s.id}" data-p="${id}" aria-label="Retirer">×</button></span>`).join('') || '<span class="muted sm">Aucun inscrit</span>'}</div><div class="row"><select id="ra-${s.id}"><option value="">Ajouter un joueur…</option>${free.map(p => `<option value="${p.id}">${esc(p.nom)}</option>`).join('')}</select><button class="btn sec sm" data-a="recAdd" data-id="${s.id}">Inscrire</button><button class="btn ghost sm" data-a="recDel" data-id="${s.id}">Supprimer</button></div></div>`; }).join('')}</div>`).join('') || '<div class="empty">Aucun créneau sur cette période.</div>';
  return head('Récupération', 'Créneaux de récupération : étirements, bottes, bains froids…', `<label class="f">À partir du<input type="date" data-b="UI.recDate" data-r="1" value="${d0}"></label>`) +
    `<div class="grid g12">${card('Nouveau créneau', `<div class="row"><label class="f">Date<input type="date" data-b="UI.recDraft.date" value="${dr.date || d0}"></label><label class="f">Début<input type="time" data-b="UI.recDraft.debut" value="${dr.debut}"></label><label class="f">Fin<input type="time" data-b="UI.recDraft.fin" value="${dr.fin}"></label></div><div class="row mt"><label class="f">Séance<select data-b="UI.recDraft.type">${opt(RTYPES, dr.type)}</select></label><label class="f">Lieu<input type="text" data-b="UI.recDraft.lieu" value="${esc(dr.lieu)}" style="width:150px"></label><label class="f">Places<input type="number" min="1" data-b="UI.recDraft.cap" value="${dr.cap}"></label></div><div class="mt"><button class="btn" data-a="recNew">Créer le créneau</button></div>
      <div class="mt"><h3>Fréquentation</h3><div class="row" style="margin:6px 0"><span class="muted sm">${tot} inscriptions pour ${cap} places sur 10 jours</span></div>${Object.keys(typ).length ? cv('r1', 'short') : ''}</div>`)}
    ${card('Planning', list)}</div>`;
};
A.recNew = () => { const d = UI.recDraft; S.recov.push({ id: uid(), date: d.date || UI.recDate, debut: d.debut, fin: d.fin, type: d.type, lieu: d.lieu, cap: +d.cap || 1, ins: [] }); touch(); toast('Créneau créé'); render(); };
A.recAdd = el => { const v = $('#ra-' + el.dataset.id).value; if (!v) return; const s = S.recov.find(x => x.id === el.dataset.id); if (s.ins.length >= s.cap) { toast('Créneau complet.'); return; } s.ins.push(v); touch(); render(); };
A.recRem = el => { const s = S.recov.find(x => x.id === el.dataset.id); s.ins = s.ins.filter(i => i !== el.dataset.p); touch(); render(); };
A.recDel = el => { S.recov = S.recov.filter(x => x.id !== el.dataset.id); touch(); render(); };

/* ================= Nutrition ================= */
const DT = { rest: { n: 'Repos', cho: 4, pro: 1.8, f: 1.45 }, train: { n: 'Entraînement', cho: 6, pro: 1.8, f: 1.7 }, intense: { n: 'Entraînement intense', cho: 7.5, pro: 1.9, f: 1.9 }, md1: { n: 'Veille de match', cho: 9, pro: 1.6, f: 1.75 }, match: { n: 'Jour de match', cho: 8, pro: 1.8, f: 2.05 } };
function nutri(pid, dt) {
  const m = lastMeasure(pid); if (!m) return null; const t = DT[dt], ffm = m.p * (1 - m.mg / 100), rmr = 500 + 22 * ffm, kcal = rmr * t.f;
  const cho = t.cho * m.p, pro = t.pro * m.p; let lip = (kcal - 4 * cho - 4 * pro) / 9; const minL = .8 * m.p; if (lip < minL) lip = minL;
  const tot = 4 * cho + 4 * pro + 9 * lip, eau = (35 * m.p + (dt === 'rest' ? 0 : dt === 'match' ? 1000 : 600)) / 1000;

A.bOpp = () => { const B = S.board; if (B.tokens.some(t => t.team === 'B')) B.tokens = B.tokens.filter(t => t.team !== 'B'); else FORMS['4-4-2'].forEach((p, i) => B.tokens.push({ id: 'b' + i, x: +(105 - p[0]).toFixed(1), y: p[1], team: 'B', n: i + 1, pid: '' })); touch(); render(); };

A.bXI = () => { const ms = S.matches.filter(m => m.date <= TODAY && m.roles && Object.values(m.roles).includes('T')).sort((a, b) => b.date.localeCompare(a.date))[0]; if (!ms) { toast('Aucun match avec composition.'); return; } const ids = Object.keys(ms.roles).filter(i => ms.roles[i] === 'T'); const order = ['GB', 'DD', 'DC', 'DG', 'MD', 'MC', 'MO', 'AD', 'AG', 'BU']; ids.sort((a, b) => order.indexOf(S.players.find(p => p.id === a).poste) - order.indexOf(S.players.find(p => p.id === b).poste)); S.board.tokens.filter(t => t.team === 'A').forEach((t, i) => t.pid = ids[i] || ''); touch(); toast('XI du ' + fd(ms.date) + ' importé'); render(); };
function initBoard() {
  const svg = $('#pitch'); if (!svg) return;
  const pt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const r = p.matrixTransform(svg.getScreenCTM().inverse()); return [clamp(r.x, 0, 105), clamp(r.y, 0, 68)]; };
  let drag = null, arrow = null, moved = false;
  svg.addEventListener('pointerdown', e => {
    const [x, y] = pt(e), tk = e.target.closest('.tok');
    if (UI.board.tool === 'move' && tk) { drag = { id: tk.dataset.id, el: tk }; moved = false; svg.setPointerCapture(e.pointerId); }
    else if (UI.board.tool === 'arrow') { arrow = { x1: x, y1: y, x2: x, y2: y }; svg.setPointerCapture(e.pointerId); const pv = $('#prev'); pv.setAttribute('x1', x); pv.setAttribute('y1', y); pv.setAttribute('x2', x); pv.setAttribute('y2', y); pv.setAttribute('visibility', 'visible'); }
  });
  svg.addEventListener('pointermove', e => {
    const [x, y] = pt(e);
    if (drag) { moved = true; const t = S.board.tokens.find(k => k.id === drag.id); t.x = +x.toFixed(1); t.y = +y.toFixed(1); drag.el.setAttribute('transform', `translate(${t.x} ${t.y})`); }
    else if (arrow) { arrow.x2 = x; arrow.y2 = y; const pv = $('#prev'); pv.setAttribute('x2', x); pv.setAttribute('y2', y); }
  });
  svg.addEventListener('pointerup', () => {
    if (drag) { if (moved) touch(); else { UI.board.sel = drag.id; drag = null; render(); return; } drag = null; }
    else if (arrow) { if (Math.hypot(arrow.x2 - arrow.x1, arrow.y2 - arrow.y1) > 2) { S.board.arrows.push({ x1: +arrow.x1.toFixed(1), y1: +arrow.y1.toFixed(1), x2: +arrow.x2.toFixed(1), y2: +arrow.y2.toFixed(1) }); touch(); } arrow = null; render(); }
  });
}

/* ================= Recommandations ================= */
function snap(id) {
  const s = ser(id), i = DAYS_ALL.length - 1, d3 = range(add(TODAY, -2), TODAY).map(d => hoop(d, id)).filter(Boolean);
  const pain = range(add(TODAY, -3), TODAY).map(d => hoop(d, id)).filter(h => h && h.dou).map(h => h.dou).pop() || '';
  const inj = injuryAt(id, TODAY), l = loadMap()[id] || {};
  const mins7 = sum(S.matches.filter(m => m.date > add(TODAY, -8) && m.date <= TODAY).map(m => matchMinutes(m)[id] || 0));
  const miss14 = sum(range(add(TODAY, -13), TODAY).map(d => rpeMissing(d).filter(x => x.pid === id).length));
  return { id, nom: pname(id), poste: S.players.find(p => p.id === id).poste, statut: dayStatus(id, TODAY), acwr: s.acwrE[i], tsb: s.tsb[i], mono: s.mono[i], hooper: d3.length ? mean(d3.map(h => h.idx)) : null, douleur: pain, blessure: inj ? inj.zone + ' (' + inj.type + '), retour ' + inj.retour : '', mins7, miss14, charge7: s.week[i] };
}
function buildRecos() {
  const out = S.players.map(p => {
    const x = snap(p.id), it = []; let lvl = 'vert';
    const up = (l, t, d) => { it.push({ l, t, d }); const o = ['vert', 'bleu', 'orange', 'rouge']; if (o.indexOf(l) > o.indexOf(lvl)) lvl = l; };
    if (x.statut === 'blesse') up('rouge', 'Indisponible', x.blessure + '. Suivre le protocole médical, travail du haut du corps et condition physique alternative.');
    else if (x.statut === 'rea') up('bleu', 'Réathlétisation en cours', x.blessure + '. Charger selon la phase du programme, valider chaque étape par des critères objectifs.');
    else if (x.statut === 'malade') up('orange', 'Malade', 'Repos complet, reprise progressive après avis médical.');
    if (x.acwr != null && x.statut !== 'blesse' && x.statut !== 'malade') {
      if (x.acwr > 1.5) up('rouge', 'ACWR ' + r2(x.acwr) + ' : zone de danger', 'Réduire le volume de 30 % sur 2 à 3 séances et limiter les expositions à haute intensité.');
      else if (x.acwr > 1.3) up('orange', 'ACWR ' + r2(x.acwr) + ' : vigilance', 'Éviter de cumuler une hausse de charge. Garder une séance allégée dans la semaine.');
      else if (x.acwr < .8) up('bleu', 'ACWR ' + r2(x.acwr) + ' : sous-charge relative', 'Ajouter une exposition progressive (vitesse, jeu à haute intensité) pour remonter la charge chronique.');
    }
    if (x.hooper != null && x.hooper >= 17) up('orange', 'Hooper élevé (' + r1(x.hooper) + ' en moyenne sur 3 jours)', 'Entretien individuel sur sommeil et stress, séance de récupération conseillée.');
    if (x.douleur) up('rouge', 'Douleur signalée : ' + x.douleur, 'Évaluation par le staff médical avant la prochaine séance, adaptation des contenus.');
    if (x.tsb != null && x.tsb < -25) up('orange', 'Forme négative (TSB ' + r0(x.tsb) + ')', 'Fatigue accumulée : privilégier une séance courte ou une journée de repos.');
    if (x.mono != null && x.mono > 2) up('orange', 'Monotonie ' + r2(x.mono), 'Varier les charges d\'une séance à l\'autre pour réduire la contrainte.');
    if (x.miss14 >= 3) up('bleu', x.miss14 + ' RPE manquants sur 14 jours', 'Relancer le joueur : sans RPE, la charge est sous-estimée.');
    if (!it.length) it.push({ l: 'vert', t: 'Aucun signal d\'alerte', d: 'Poursuivre la programmation prévue.' });
    return { x, lvl, it };
  });
  const ord = { rouge: 0, orange: 1, bleu: 2, vert: 3 };
  out.sort((a, b) => ord[a.lvl] - ord[b.lvl]);
  const team = [], R = out.filter(o => o.lvl === 'rouge').length, O = out.filter(o => o.lvl === 'orange').length;
  const w = wk(TODAY), mc = S.micro[w], next = events().filter(e => e.date > TODAY).slice(0, 3);
  if (R) team.push({ l: 'rouge', t: R + ' joueur(s) en alerte rouge', d: 'Priorité aux décisions individuelles avant de valider la séance collective.' });
  if (O) team.push({ l: 'orange', t: O + ' joueur(s) en vigilance', d: 'Prévoir des variantes allégées dans les ateliers à haute intensité.' });
  if (next.length) team.push({ l: 'bleu', t: 'À venir : ' + next.map(e => JOURS[dow(e.date)] + ' ' + fd(e.date) + ' ' + e.short).join(' · '), d: 'Ajuster la charge de la semaine selon la position par rapport au match.' });
  if (mc) { const sd2 = mean(mc.days.filter(d => d.int).map(d => d.int)); team.push({ l: 'vert', t: 'Intensité moyenne du microcycle : ' + r1(sd2) + '/10', d: 'Comparer à la charge réalisée dans l\'onglet Charge.' }); }
  return { players: out, team };
}
VIEWS.recommandations = () => {
  const R = buildRecos(), ai = UI.reco;
  const rc = r => `<div class="reco ${r.l}"><b>${esc(r.t)}</b><span>${esc(r.d)}</span></div>`;
  const aiBody = ai.loading ? '<div class="empty">Analyse en cours…</div>' : ai.err ? `<div class="empty">${esc(ai.err)}</div>` : ai.data ? `<p>${esc(ai.data.synthese || '')}</p><div class="grid g2">${(ai.data.equipe || []).map(t => `<div class="reco bleu"><b>Équipe</b><span>${esc(t)}</span></div>`).join('')}${(ai.data.joueurs || []).map(j => `<div class="reco ${esc(j.niveau)}"><b>${esc(j.nom)}</b><span>${esc(j.action)}</span></div>`).join('')}</div>` : '<div class="empty">Claude analyse l\'état de forme (charge, ACWR, Hooper, douleurs, disponibilité) et propose des ajustements joueur par joueur.</div>';
  return head('Recommandations', 'Basées sur la charge, le Hooper, les douleurs et la disponibilité de chaque joueur', '') +
    card('Analyse Claude', aiBody, { sub: 'Synthèse générée à partir de l\'état de forme actuel de l\'effectif', act: `<button class="btn" data-a="aiGen"${ai.loading ? ' disabled' : ''}>${ai.data ? 'Régénérer' : 'Générer avec Claude'}</button>` }) +
    `<div class="mt">${card('Lecture d\'équipe', `<div class="grid g2">${R.team.map(rc).join('') || '<div class="empty">Rien à signaler.</div>'}</div>`)}</div>
    <div class="mt">${card('Recommandations par joueur', `<div class="grid g3">${R.players.map(o => `<div class="slot"><div class="row" style="justify-content:space-between"><span class="b">${esc(o.x.nom)}</span>${stPill(o.x.statut === 'dispo' ? 'present' : o.x.statut)}</div>${o.it.map(rc).join('')}</div>`).join('')}</div>`, { sub: 'Règles du staff : ACWR, Hooper, douleurs, forme (TSB), monotonie, RPE manquants' })}</div>`;
};
A.aiGen = async () => {
  UI.reco = { loading: true, data: null, err: '' }; render();
  try {
    const sample = await claude.use('sample');
    if (!sample) { UI.reco = { loading: false, data: null, err: 'La génération par Claude est disponible dans la page publiée, une fois connecté.' }; render(); return; }
    const snaps = S.players.map(p => { const x = snap(p.id); return { nom: x.nom, poste: x.poste, statut: x.statut, acwr: x.acwr == null ? null : +x.acwr.toFixed(2), forme_tsb: Math.round(x.tsb), monotonie: x.mono == null ? null : +x.mono.toFixed(2), hooper_3j: x.hooper == null ? null : +x.hooper.toFixed(1), douleur: x.douleur, blessure: x.blessure, minutes_match_7j: x.mins7, charge_7j: Math.round(x.charge7), rpe_manquants_14j: x.miss14 }; });
    const next = events().filter(e => e.date > TODAY && e.date <= add(TODAY, 7)).map(e => fd(e.date) + ' ' + e.nom);
    const prompt = `Tu es préparateur physique dans un club de football (catégories jeunes et seniors). Voici l'état de forme de l'effectif au ${TODAY}. Hooper : index de 4 à 28, plus il est haut plus le joueur est fatigué. ACWR EWMA : optimal 0,8 à 1,3, danger au-dessus de 1,5. TSB : forme (négative = fatigue). Prochains événements : ${next.join(' ; ') || 'aucun'}.\nDonnées JSON : ${JSON.stringify(snaps)}\n\nRéponds uniquement par un objet JSON de la forme {"synthese":"2 phrases","equipe":["3 à 4 recommandations pour la semaine"],"joueurs":[{"nom":"...","niveau":"rouge|orange|vert","action":"consigne concrète d'une phrase"}]}. N'inclus dans "joueurs" que les 8 joueurs les plus prioritaires. Écris en français, sans formules médicales de diagnostic.`;
    const res = await sample(prompt, { modelTier: 'default' });
    const t = res.text || ''; const a = t.indexOf('{'), b = t.lastIndexOf('}');
    const data = JSON.parse(t.slice(a, b + 1));
    UI.reco = { loading: false, data, err: '' };
  } catch (e) { UI.reco = { loading: false, data: null, err: e && e.code === 'not_granted' ? 'Accès à Claude non autorisé dans ce contexte.' : 'Analyse impossible pour le moment. Réessayez dans un instant.' }; }
  if (UI.route === 'recommandations') render();

};
A.injAdd = () => { const d = UI.injDraft; if (d.retour <= d.debut) { toast('La date de retour doit suivre le début.'); return; } S.injuries.push({ id: 'i' + uid(), pid: d.pid, kind: d.kind, zone: d.zone, type: d.type || (d.kind === 'Maladie' ? 'Maladie' : 'Blessure'), cote: d.cote, grav: d.grav, debut: d.debut, retour: d.retour, reha: null }); touch(); toast('Fiche ajoutée'); UI.injDraft = null; render(); };

const ROLES = [['T', 'Titulaire'], ['R', 'Remplaçant'], ['NC', 'Non convoqué'], ['blesse', 'Blessé'], ['absent', 'Absent'], ['malade', 'Malade'], ['rea', 'Réathlétisation']];
function matchGrid(m) {
  const T = Object.keys(m.roles), g = {}; T.forEach(id => g[id] = Array(m.periodes).fill(0));
  const on = new Set(T.filter(id => m.roles[id] === 'T')), dur = m.dper;
  for (let p = 1; p <= m.periodes; p++) { let seg = 0; (m.chg || []).filter(c => c.per === p).sort((a, b) => a.min - b.min).forEach(c => { if (on.has(c.out)) { on.forEach(id => g[id][p - 1] += c.min - seg); seg = c.min; on.delete(c.out); on.add(c.in); } }); on.forEach(id => g[id][p - 1] += dur - seg); }
  return g;
}
const newMatch = () => { const roles = {}; S.players.forEach(p => { const s = dayStatus(p.id, TODAY); roles[p.id] = s === 'dispo' || s === 'absent' || s === 'repos' ? 'NC' : s; }); return { id: null, date: TODAY, heure: '15:00', type: 'Championnat', adv: '', niveau: 'Régional 1', lieu: 'Domicile', cat: S.cats[1] || S.cats[0], periodes: 2, dper: 45, roles, chg: [], rpe: {}, rpeSent: false, score: [null, null] }; };
VIEWS['saisie-match'] = () => {
  if (!UI.mdraft) UI.mdraft = newMatch(); const D = UI.mdraft;
  D.periodes = +D.periodes || 2; D.dper = +D.dper || 45; D.chg = D.chg.filter(c => c.per <= D.periodes && c.min < D.dper); D.score = D.score || [null, null];

    `<div style="display:grid;grid-template-columns:150px 1fr 44px;font-size:11.5px;color:var(--mut)"><div style="text-align:right;padding-right:8px;font-size:11px">Volume (AU / sem.)</div><div style="display:grid;grid-template-columns:repeat(${n},1fr);margin:3px 0 10px">${xl}</div><div style="padding-left:8px;font-size:11px">Int. /10</div></div>` +

function setLvl(i, m, v) { const w = S.season.weeks[i]; if (m === 'vol') w.v = v; else if (m === 'int') w.i = v; else (w.q = w.q || {})[m] = v; }
