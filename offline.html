<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hors ligne — Blueperf</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#0D1B2A;color:#E6ECF4;font:16px/1.6 system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .wrap{max-width:360px}
  .brand{font-weight:800;font-size:24px;letter-spacing:.02em;margin:0 0 20px}
  .brand span{color:#3DA9FC}
  .ico{font-size:46px;margin-bottom:10px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#AEBACD;margin:0 0 22px}
  button{appearance:none;cursor:pointer;background:#3DA9FC;color:#04121f;border:0;border-radius:11px;padding:13px 22px;font-weight:800;font-size:15px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">BLUE<span>PERF</span></div>
    <div class="ico">📡</div>
    <h1>Pas de connexion</h1>
    <p>Tu sembles hors ligne. Vérifie ta connexion internet, puis réessaie.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
