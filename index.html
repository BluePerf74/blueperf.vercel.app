<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Blueperf — Suivi programme Cindy</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0D1B2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BluePerf">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0D1B2A;
    --navy-2:#16273D;
    --navy-3:#1F3350;
    --chalk:#D9E8DE;
    --paper:#EBF6F0;
    --ink:#122036;
    --ink-soft:#54627A;
    --line:#C4D9CC;
    --grass:#2E7D4F;
    --grass-dark:#1F5D3A;
    --grass-tint:#E3F2E9;
    --amber:#C98A2C;
    --amber-tint:#FBF0DD;
    --red:#B8443B;
    --red-tint:#FAE4E1;
    --shadow: 0 1px 2px rgba(13,27,42,.06), 0 6px 20px rgba(13,27,42,.06);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--chalk);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.num-display{font-family:'Space Grotesk',system-ui,sans-serif;}
  button{font-family:inherit;}
  #app{max-width:560px;margin:0 auto;padding-bottom:60px;min-height:100vh;background:var(--paper);box-shadow:0 0 40px rgba(13,27,42,.05);}

  /* ---------- Header ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--navy);color:var(--chalk);
    padding:14px 18px 0;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;}
  .wordmark{font-family:'Space Grotesk';font-weight:700;font-size:13px;letter-spacing:.13em;color:var(--grass-tint);}
  .view-toggle{display:flex;background:var(--navy-2);border:1px solid #2A3D57;border-radius:20px;padding:2px;}
  .vt-btn{
    font-size:12px;font-weight:600;color:#9FB0C6;background:none;border:none;border-radius:18px;
    padding:5px 12px;cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  .vt-btn:hover{color:#fff;}
  .vt-btn.active{background:var(--grass);color:#fff;}
  .section-switch{margin:12px auto 0;width:fit-content;}
  .section-switch .vt-btn{padding:6px 14px;font-size:11.5px;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .logout-pill{font-size:11px;color:#9FB0C6;background:none;border:1px solid #33455F;border-radius:20px;
    padding:5px 10px;cursor:pointer;white-space:nowrap;}
  .client-switch{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:12px;color:#9FB0C6;}
  .client-switch select{background:var(--navy-2);color:var(--chalk);border:1px solid #2A3D57;border-radius:8px;
    padding:6px 10px;font-size:13px;font-weight:600;font-family:inherit;}
  .topbar h1{font-size:19px;margin:8px 0 14px;font-weight:600;}
  .tabs{display:flex;gap:4px;}
  .tab{
    flex:1;text-align:center;padding:10px 4px;font-size:13.5px;font-weight:600;color:#8FA0B8;
    background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;
    transition:color .15s ease,border-color .15s ease;
  }
  .tab:hover{color:#D7E1EC;}
  .tab.active{color:#FFFFFF;border-bottom-color:var(--grass);}

  /* ---------- Layout helpers ---------- */
  .screen{padding:18px 18px 8px;}
  .section-label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);margin:22px 0 10px;}
  .section-label:first-child{margin-top:4px;}

  /* ---------- Scoreboard ---------- */
  .scoreboard{
    background:var(--navy);color:var(--chalk);border-radius:var(--radius);padding:18px 20px;
    display:flex;align-items:flex-end;justify-content:space-between;margin-top:16px;
  }
  .score-num{font-size:40px;font-weight:700;line-height:1;}
  .score-den{font-size:18px;font-weight:500;color:#9FB0C6;}
  .score-label{font-size:12.5px;color:#9FB0C6;margin-top:6px;}
  .score-bar-wrap{flex:1;margin-left:22px;}
  .score-bar-track{height:6px;background:#26374E;border-radius:4px;overflow:hidden;margin-bottom:6px;}
  .score-bar-fill{height:100%;background:var(--grass);border-radius:4px;}

  /* ---------- Week chips ---------- */
  .week-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;margin:0 -2px;}
  .week-chip{
    flex:0 0 auto;min-width:46px;padding:9px 6px;border-radius:10px;border:1px solid var(--line);
    background:var(--paper);text-align:center;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  }
  .week-chip .wk-n{display:block;font-family:'Space Grotesk';font-size:15px;color:var(--ink);}
  .week-chip.active{background:var(--navy);border-color:var(--navy);}
  .week-chip.active .wk-n, .week-chip.active{color:var(--chalk);}
  .week-chip.deload{border-style:dashed;}
  .week-chip .wk-dot{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:var(--line);}
  .week-chip.done .wk-dot{background:var(--grass);}

  /* ---------- Week header ---------- */
  .week-head{margin-top:16px;}
  .week-head h2{font-size:20px;margin:0 0 2px;}
  .week-meta{font-size:13px;color:var(--ink-soft);}
  .charge-tag{
    display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;
    background:var(--grass-tint);color:var(--grass-dark);margin-top:8px;
  }
  .charge-tag.decharge{background:var(--amber-tint);color:var(--amber);}
  .week-progress{font-size:13px;color:var(--ink-soft);margin-top:10px;}
  .week-progress b{color:var(--ink);}

  /* ---------- Journées (programme jour par jour) ---------- */
  .day-block{margin-top:22px;}
  .day-block:first-child{margin-top:16px;}
  .day-head{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ink-soft);
    padding-bottom:6px;border-bottom:1px solid var(--line);text-transform:uppercase;}
  .day-rest{font-size:12.5px;color:#C7D2DE;padding:10px 0 2px;font-style:italic;}

  /* ---------- Session card ---------- */
  .session-card{
    border:1px solid var(--line);border-radius:var(--radius);margin-top:14px;overflow:hidden;background:var(--paper);
  }
  .session-head{
    display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;gap:10px;
  }
  .session-head-left{display:flex;align-items:center;gap:11px;min-width:0;}
  .session-kind{
    flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:15px;
  }
  .session-kind.renfo{background:var(--navy);color:var(--chalk);}
  .session-kind.course{background:var(--grass-tint);color:var(--grass-dark);}
  .session-kind.football{background:var(--amber-tint);color:var(--amber);}
  .session-kind.natation{background:#DDEEFB;color:#1F6FA8;}
  .session-kind.velo{background:#F3E4FB;color:#7A3FA0;}
  .session-titles{min-width:0;}
  .session-titles .st-name{font-weight:600;font-size:14.5px;}
  .session-titles .st-note{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .chev{color:var(--ink-soft);font-size:12px;flex:0 0 auto;transition:transform .15s;}
  .session-card.open .chev{transform:rotate(180deg);}
  .session-body{border-top:1px solid var(--line);padding:4px 16px 16px;display:none;}
  .session-card.open .session-body{display:block;}

  .ex-row{padding:11px 0;border-bottom:1px solid #EEF1F4;}
  .ex-row:last-of-type{border-bottom:none;}
  .ex-top{display:flex;justify-content:space-between;gap:12px;}
  .ex-name{font-size:13.5px;font-weight:600;}
  .ex-note{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .ex-dose{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--grass-dark);background:var(--grass-tint);
    padding:3px 9px;border-radius:20px;height:fit-content;white-space:nowrap;}
  .ex-explain-toggle{margin-top:6px;background:none;border:none;padding:0;font-size:12px;font-weight:600;
    color:var(--navy-3);cursor:pointer;display:flex;align-items:center;gap:4px;}
  .ex-explain-toggle .chev-sm{font-size:9px;transition:transform .15s;}
  .ex-explain-toggle.open .chev-sm{transform:rotate(180deg);}
  .ex-explain{margin-top:8px;background:var(--chalk);border-radius:10px;padding:11px 13px;font-size:12.5px;
    color:var(--ink);line-height:1.55;}
  .ex-explain .ex-tip{margin:8px 0 0;color:var(--ink-soft);font-style:italic;}
  .ex-explain p{margin:0;}
  .ex-explain p + p{margin-top:8px;}
  .ex-photo{display:block;width:100%;max-width:320px;border-radius:10px;margin-bottom:10px;}

  /* ---------- Éditeur d'exercices (coach) ---------- */
  .ex-edit-row{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--chalk);}
  .ex-edit-top{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .ex-edit-top .ee-name{flex:2;}
  .ex-edit-top .ee-dose{flex:1;}
  .ex-edit-top input{padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;
    font-family:inherit;background:var(--paper);}
  .ee-remove{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
    color:var(--red);font-weight:700;cursor:pointer;}
  .ee-how{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;
    font-family:inherit;background:var(--paper);resize:vertical;}
  .ee-photo-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .ee-photo-preview{max-width:110px;max-height:110px;border-radius:8px;display:block;object-fit:cover;}
  .ee-add{margin-top:4px;width:100%;}

  .validate-row{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .check-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:12px;border-radius:10px;
    border:1.5px solid var(--navy);background:var(--navy);color:var(--chalk);font-weight:600;font-size:14px;cursor:pointer;
  }
  .check-btn.done{background:var(--grass-tint);border-color:var(--grass);color:var(--grass-dark);}
  .check-btn.done::before{content:"✓ ";}
  .done-meta{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:8px;}
  .done-links{display:flex;justify-content:center;gap:14px;margin-top:8px;}
  .done-links button{background:none;border:none;padding:0;font-size:12px;font-weight:600;cursor:pointer;
    color:var(--ink-soft);text-decoration:underline;}
  .done-links button.danger{color:var(--red);}

  .rpe-panel{margin-top:14px;background:var(--chalk);border-radius:12px;padding:14px 16px;}
  .rpe-panel p{margin:0 0 10px;font-size:13px;font-weight:600;}
  .rpe-row{display:flex;align-items:center;gap:12px;}
  .rpe-row input[type=range]{flex:1;accent-color:var(--navy);}
  .rpe-val{font-family:'Space Grotesk';font-size:20px;font-weight:700;width:30px;text-align:center;}
  .rpe-scale-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
  .rpe-save{margin-top:12px;width:100%;padding:10px;border-radius:9px;border:none;background:var(--navy);color:var(--chalk);
    font-weight:600;font-size:13.5px;cursor:pointer;}

  /* ---------- Buttons / misc ---------- */
  .btn-line{background:none;border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;
    color:var(--ink);cursor:pointer;}
  .empty{padding:40px 10px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  /* ---------- Hooper ---------- */
  .hooper-date{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .hooper-date input{flex:1;padding:10px 12px;border-radius:9px;border:1px solid var(--line);font-size:14px;font-family:inherit;}
  .hooper-item{margin-top:20px;}
  .hooper-item-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .hooper-item-head .hi-name{font-weight:600;font-size:14px;}
  .hooper-item-head .hi-val{font-family:'Space Grotesk';font-weight:700;font-size:17px;}
  .hooper-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:5px;line-height:1.3;}
  .hooper-labels span:last-child{text-align:right;max-width:45%;}
  .hooper-labels span:first-child{max-width:45%;}
  input[type=range].hooper-slider{width:100%;accent-color:var(--navy);}
  .save-bar{position:sticky;bottom:0;background:linear-gradient(0deg, var(--paper) 60%, rgba(255,255,255,0));
    padding:18px 0 6px;margin-top:8px;}
  .save-btn{width:100%;padding:13px;border-radius:11px;border:none;background:var(--grass);color:#fff;font-weight:700;
    font-size:14.5px;cursor:pointer;}
  .save-btn:disabled{background:#B9C2CC;}
  .save-confirm{text-align:center;font-size:12.5px;color:var(--grass-dark);margin-top:8px;font-weight:600;}

  .bodymap-wrap{margin-top:16px;background:var(--navy);border-radius:12px;padding:16px 14px;}
  .bodymap-wrap > p{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--chalk);}
  .bm-dual{display:flex;gap:10px;justify-content:center;}
  .bm-dual-col{flex:1;text-align:center;min-width:0;}
  .bm-dual-col h4{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#8FA0B8;font-weight:700;}
  .bm-svg-wrap{display:flex;justify-content:center;}
  .bm-svg-wrap svg{max-width:150px;width:100%;}
  .bm-zone{fill:#3DA9FC;fill-opacity:.14;stroke:#3DA9FC;stroke-opacity:.75;stroke-width:1.2;cursor:pointer;transition:fill .12s,fill-opacity .12s;}
  .bm-zone.sel{fill:#FF6B5B;fill-opacity:.7;stroke:#FF6B5B;stroke-opacity:1;}
  .bm-body-outline{fill:none;stroke:#3DA9FC;stroke-opacity:.55;stroke-width:1.5;}
  .bm-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;}
  .bm-chip{padding:7px 12px;border-radius:20px;border:1px solid #2A3D57;background:var(--navy-2);font-size:12px;
    font-weight:600;color:#9FB0C6;cursor:pointer;}
  .bm-chip.sel{background:rgba(255,107,91,.16);border-color:#FF6B5B;color:#FF6B5B;}

  .history-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #EEF1F4;}
  .history-item:last-child{border-bottom:none;}
  .hi-date{font-size:13.5px;font-weight:600;}
  .hi-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .flag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .flag.faible{background:var(--grass-tint);color:var(--grass-dark);}
  .flag.modere{background:var(--amber-tint);color:var(--amber);}
  .flag.eleve{background:var(--red-tint);color:var(--red);}
  .history-zones{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .badges-block{background:var(--card-bg,#F6F8F7);border:1px solid var(--line-soft,#E2E7EA);border-radius:14px;padding:12px 14px;margin-bottom:16px;}
  .badges-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .badge-pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--amber-tint);color:var(--amber);white-space:nowrap;}
  .badges-empty{font-size:12px;color:var(--ink-soft);}
  .badges-stats{font-size:12.5px;color:var(--ink);margin-bottom:4px;}
  .badges-next{font-size:11.5px;color:var(--ink-soft);}

  .coach-week-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #EEF1F4;cursor:pointer;}
  .coach-week-expand{padding:6px 0 10px;border-bottom:1px solid #EEF1F4;}
  .coach-week-row:last-child{border-bottom:none;}
  .cwr-left .cwr-n{font-weight:600;font-size:13.5px;}
  .cwr-left .cwr-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .cwr-frac{font-family:'Space Grotesk';font-weight:700;font-size:15px;}
  .cwr-frac.full{color:var(--grass-dark);}

  .rpe-list-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EEF1F4;font-size:13px;}
  .rpe-list-item:last-child{border-bottom:none;}
  .rpe-badge{font-family:'Space Grotesk';font-weight:700;background:var(--navy);color:var(--chalk);border-radius:6px;
    padding:1px 8px;font-size:12.5px;}

  .refresh-link{font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;
    padding:0;}

  ::-webkit-scrollbar{height:0;width:0;}

  .save-error-bar{
    position:fixed;left:50%;bottom:18px;transform:translate(-50%, 20px);
    background:var(--red);color:#fff;font-size:13px;font-weight:600;padding:12px 20px;
    border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;z-index:999;max-width:90vw;text-align:center;
  }
  .save-error-bar.show{opacity:1;transform:translate(-50%, 0);}

  /* ---------- Connexion (style StatField) ---------- */
  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:28px; background:radial-gradient(ellipse at 50% 30%, #16273D 0%, var(--navy) 65%);color:var(--chalk);
  }
  .login-card{
    width:100%;max-width:360px;background:#132238;border:1px solid #223A56;border-radius:18px;
    padding:34px 30px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .shield-logo{width:56px;height:auto;margin-bottom:10px;}
  .login-brand{font-size:23px;font-weight:700;margin:0 0 4px;}
  .login-brand span{color:#3DA9FC;}
  .login-sub{color:#9FB0C6;font-size:13.5px;margin:0 0 26px;}
  .login-form{text-align:left;}
  .login-form label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#7E90A8;margin:14px 0 6px;}
  .login-form label:first-of-type{margin-top:0;}
  .login-form input{
    width:100%;padding:12px 14px;border-radius:9px;border:1px solid #2A3D57;background:#0F1D30;
    color:var(--chalk);font-size:14.5px;font-family:inherit;
  }
  .login-form input::placeholder{color:#54627A;}
  .login-submit{
    width:100%;margin-top:22px;padding:13px;border-radius:9px;border:none;background:#2A8CE0;
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  }
  .login-submit:hover{background:#2478C4;}
  .login-error{color:#ffb4a8;font-size:12.5px;margin-top:14px;text-align:center;}

  /* ---------- Dashboard coach (en-tête façon StatField) ---------- */
  .dash-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    padding-bottom:12px;margin-bottom:2px;}
  .dash-brand{display:flex;align-items:center;gap:10px;}
  .dash-brand .shield-logo{width:30px;margin:0;}
  .dash-title{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.03em;}
  .dash-title span{color:#3DA9FC;}
  .dash-title em{font-style:normal;font-weight:500;color:#7E90A8;font-size:12.5px;}
  .dash-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .dash-pill{font-size:11.5px;font-weight:600;color:#C6D1DF;background:#1B2C44;border:1px solid #2A3D57;
    border-radius:20px;padding:6px 12px;white-space:nowrap;}
  .dash-pill.staff{color:#3DA9FC;}
  .dash-pill.staff b{color:#C6D1DF;margin-left:4px;font-weight:700;}
  .dash-logout{font-size:11.5px;font-weight:700;color:#fff;background:#2A5C8A;border:1px solid #3DA9FC;
    border-radius:8px;padding:7px 13px;cursor:pointer;white-space:nowrap;}
  .dash-logout:hover{background:#3470A3;}

  /* ---------- Bilan hebdomadaire (Vue d'ensemble) ---------- */
  .bilan-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .bilan-title{font-family:'Space Grotesk';font-weight:700;font-size:15px;}
  .bilan-desc{font-size:12px;color:var(--ink-soft);line-height:1.6;margin:10px 0 0;}
  .bilan-week-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 14px;
    flex-wrap:wrap;}
  .bilan-week-label{font-weight:700;font-size:13px;text-align:center;flex:1;}
  .bilan-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px;}
  .bilan-table{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px;}
  .bilan-table th{
    text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-soft);padding:8px 6px;
    border-bottom:2px solid var(--line);white-space:nowrap;cursor:default;
  }
  .bilan-table th[data-sort]{cursor:pointer;}
  .bilan-table th:first-child{text-align:left;}
  .bilan-table td{padding:8px 6px;text-align:center;border-bottom:1px solid #EEF1F4;}
  .bilan-name{text-align:left !important;font-weight:600;white-space:nowrap;}
  .bilan-total{font-weight:700;}
  .bilan-cell.done{background:var(--grass-tint);color:var(--grass-dark);font-weight:700;border-radius:6px;}
  .bilan-cell.empty{color:#C7D2DE;}
  .bilan-pct{display:inline-block;padding:3px 9px;border-radius:20px;font-weight:700;font-size:11.5px;}
  .bilan-pct.full{background:var(--grass-tint);color:var(--grass-dark);}
  .bilan-pct.partial{background:var(--amber-tint);color:var(--amber);}
  .bilan-pct.none{background:#EEF1F4;color:var(--ink-soft);}
  .bilan-note{width:130px;padding:6px 8px;border-radius:7px;border:1px solid var(--line);font-size:11.5px;
    font-family:inherit;}
  .export-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .export-controls select{padding:9px 12px;border-radius:9px;border:1px solid var(--line);font-size:13px;
    font-family:inherit;background:var(--paper);}

  /* ---------- Tableau de bord (Vue d'ensemble) ---------- */
  .ov-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px;}
  .ov-stat{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;}
  .ov-stat .ov-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;}
  .ov-stat .ov-val{font-family:'Space Grotesk';font-size:21px;font-weight:700;margin-top:4px;color:var(--ink);}
  .ov-section{margin-top:22px;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:#fff;}
  .ov-section-title{font-family:'Space Grotesk';font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
  .ov-section-desc{font-size:12px;color:var(--ink-soft);margin:6px 0 0;line-height:1.55;}
  .ov-filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .ov-filter-row select,.ov-filter-row input[type=date]{padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    font-size:12.5px;font-family:inherit;background:var(--paper);}
  .ov-alert-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  .ov-list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px solid #EEF1F4;font-size:13px;}
  .ov-list-item:last-child{border-bottom:none;}
  .ov-empty-ok{font-size:13px;color:var(--grass-dark);background:var(--grass-tint);border-radius:10px;
    padding:10px 12px;margin-top:12px;}
  .ov-name-btn{background:none;border:none;padding:0;font-size:13px;font-weight:600;color:var(--ink);
    cursor:pointer;text-align:left;font-family:inherit;}
  .ov-name-btn:hover{color:var(--grass-dark);text-decoration:underline;}
  .ov-sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  @media (max-width:480px){
    .ov-stats-grid{grid-template-columns:repeat(2,1fr);}
    .ov-alert-grid{grid-template-columns:1fr;}
  }

  /* ---------- Suivi entraînement ---------- */
  .training-chart{width:100%;height:auto;margin-top:12px;}
  .training-total{margin-top:14px;font-size:13px;color:var(--ink-soft);}

  /* ---------- Fiche bilan client (export PDF individuel) ---------- */
  #print-fiche{display:none;}
  .fiche-header{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
  .fiche-header .shield-logo{width:44px;margin:0;}
  .fiche-header h1{font-size:20px;margin:0;}
  .fiche-date{font-size:12px;color:var(--ink-soft);margin:2px 0 0;}
  #print-fiche h2{font-size:14px;margin:20px 0 6px;}
  #print-fiche ul{margin:0;padding-left:20px;font-size:13px;line-height:1.7;}
  #print-fiche p{font-size:13px;line-height:1.6;}

  @media print{
    .topbar > .dash-row, .topbar > .topbar-row, .tabs, .client-switch, .bilan-week-nav,
    .refresh-link, .back-link{ display:none !important; }
    body{background:#fff;}
    #app{box-shadow:none;margin:0;max-width:100%;}
    .bilan-table-wrap{overflow:visible;margin:0;padding:0;}
    .printing-fiche .bilan-title, .printing-fiche .bilan-desc, .printing-fiche .export-controls,
    .printing-fiche .bilan-table-wrap{ display:none !important; }
    .printing-fiche #print-fiche{ display:block !important; }
  }

  /* ---------- Mes clients / créateur de séances (coach) ---------- */
  .back-link{background:none;border:none;padding:0;font-size:13px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;margin-bottom:6px;}
  .client-code-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--ink-soft);}
  .client-code-edit-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .client-selfadd-row{margin-top:12px;}
  .client-selfadd-row .na-check{align-items:flex-start;}
  .client-code-edit-row input{flex:1;min-width:110px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    font-size:13px;font-family:'Space Grotesk',monospace;font-weight:700;letter-spacing:.04em;}
  .client-code{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--ink);
    background:var(--chalk);padding:4px 10px;border-radius:8px;}
  .client-actions-row{margin-top:10px;}
  .danger-line{color:var(--red);border-color:var(--red-tint);}

  .builder-week-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:14px;}
  .builder-week-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .builder-week-title{font-weight:700;font-size:15px;}
  .builder-session-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 0;border-bottom:1px solid #EEF1F4;}
  .builder-session-row:last-child{border-bottom:none;}
  .bsr-name{font-weight:600;font-size:13.5px;}
  .bsr-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .bsr-actions{display:flex;gap:8px;flex:0 0 auto;}
  .builder-form{margin-top:12px;background:var(--chalk);border-radius:12px;padding:14px 16px;}
  .bf-row{margin-bottom:12px;}
  .bf-row label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .bf-row input, .bf-row select, .bf-row textarea{
    width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);font-size:13.5px;
    font-family:inherit;background:var(--paper);
  }
  .bf-row textarea{resize:vertical;}
  .bf-actions{display:flex;gap:10px;}
  .na-check-group{display:flex;flex-direction:column;gap:8px;background:var(--chalk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .na-check{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer;}
  .na-check input{width:auto;padding:0;accent-color:var(--grass);}
  .sa-hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .selfadd-fab-wrap{display:flex;justify-content:center;margin-top:16px;}
  .selfadd-fab{display:inline-flex;align-items:center;gap:4px;padding:9px 18px;border-radius:22px;
    border:1.5px dashed var(--grass);background:var(--grass-tint);color:var(--grass-dark);font-size:13px;
    font-weight:700;cursor:pointer;}
  .selfadd-fab:hover{background:var(--grass);color:#fff;border-style:solid;}
  .bf-actions .bf-save{flex:1;}
  .bf-actions .bf-cancel{flex:0 0 auto;}

  /* ---------- Mes clients (coach) ---------- */
  .add-client-row{display:flex;gap:8px;margin-top:12px;}
  .add-client-row input{flex:1;padding:10px 12px;border-radius:9px;border:1px solid var(--line);font-size:14px;
    font-family:inherit;}
  .btn-primary-sm{padding:10px 16px;border-radius:9px;border:none;background:var(--grass);color:#fff;font-weight:700;
    font-size:13.5px;cursor:pointer;white-space:nowrap;}
  .client-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;}
  .client-card.current{border-color:var(--grass);background:var(--grass-tint);}
  .client-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .client-card-name{font-weight:700;font-size:15px;}
  .current-tag{font-size:10.5px;font-weight:700;color:var(--grass-dark);background:#fff;padding:2px 7px;
    border-radius:20px;vertical-align:middle;}
  .client-link-row{display:flex;gap:8px;margin-top:10px;}
  .client-link-row input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    font-size:11px;color:var(--ink-soft);background:var(--paper);}

  /* ---------- Adaptation écran large (ordinateur) : pleine page ---------- */
  @media (min-width: 860px){
    body{background:var(--chalk);}
    #app{max-width:100%;margin:0;border-radius:0;min-height:100vh;box-shadow:none;}
    .topbar{padding:22px 44px 0;}
    .topbar-row, .dash-row, .client-switch, .tabs, .section-switch{max-width:1280px;margin-left:auto;margin-right:auto;}
    .topbar h1{font-size:23px;max-width:1280px;margin-left:auto;margin-right:auto;}
    .screen{padding:26px 44px 44px;max-width:1280px;margin-left:auto;margin-right:auto;}
    .week-scroll{flex-wrap:wrap;overflow-x:visible;}
    .week-chip{min-width:52px;}
    .scoreboard{padding:22px 28px;}
    .session-card{max-width:820px;}
    .client-card{max-width:680px;}
    .bilan-table{min-width:0;width:100%;}
    .nutri-card, .nutri-empty{max-width:820px;}
  }

  /* ---------- Nutrition ---------- */
  :root{
    --protein:#7C5CD9; --protein-tint:#EFEAFB;
    --carb:#C98A2C; --carb-tint:#FBF0DD;
    --lipid:#2E7FC9; --lipid-tint:#E3EEFA;
  }
  .nutri-intro{
    display:flex;gap:10px;align-items:flex-start;background:var(--chalk);border-left:3px solid var(--grass);
    border-radius:10px;padding:12px 14px;margin-top:16px;font-size:12.5px;color:var(--ink-soft);line-height:1.55;
  }
  .nutri-intro b{color:var(--ink);}
  .nutri-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px;background:var(--paper);}
  .nutri-card h3{margin:0 0 10px;font-size:14.5px;}
  .nutri-empty{margin-top:16px;padding:26px 16px;text-align:center;color:var(--ink-soft);font-size:13.5px;
    border:1px dashed var(--line);border-radius:var(--radius);}
  .nutri-empty .btn-primary-sm{margin-top:12px;}

  .daytype-tabs{display:flex;gap:6px;margin-top:16px;}
  .daytype-tab{flex:1;padding:9px 4px;text-align:center;border-radius:9px;border:1px solid var(--line);background:var(--paper);
    font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
  .daytype-tab.active{background:var(--navy);color:var(--chalk);border-color:var(--navy);}
  .daytype-note{font-size:12px;color:var(--ink-soft);margin-top:8px;font-style:italic;}

  .nutri-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .nutri-stat{border:1px solid var(--line);border-radius:12px;padding:12px 13px;position:relative;overflow:hidden;}
  .nutri-stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;}
  .nutri-stat.st-kcal::before{background:var(--amber);}
  .nutri-stat.st-prot::before{background:var(--protein);}
  .nutri-stat.st-carb::before{background:var(--carb);}
  .nutri-stat.st-water::before{background:var(--lipid);}
  .nutri-stat .ns-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;}
  .nutri-stat .ns-val{font-family:'Space Grotesk';font-size:21px;font-weight:700;margin-top:3px;}
  .nutri-stat .ns-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .macro-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:14px 0 10px;background:var(--chalk);}
  .macro-bar span{height:100%;}
  .macro-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-soft);}
  .macro-legend .dot{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:5px;}
  .macro-legend b{color:var(--ink);}

  .plate-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-around;margin-top:14px;}
  .plate-block{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:130px;}
  .plate-block .pb-title{font-size:12px;font-weight:700;text-align:center;}
  .plate-block .pb-sub{font-size:10.5px;color:var(--ink-soft);text-align:center;}
  .plate-legend{display:flex;flex-direction:column;gap:4px;margin-top:2px;width:100%;max-width:160px;}
  .plate-legend .item{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-soft);}
  .plate-legend .dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
  .plate-legend .pct{margin-left:auto;font-weight:700;color:var(--ink);}

  .nutri-food-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EEF1F4;}
  .nutri-food-row:last-child{border-bottom:none;}
  .nutri-food-row .nf-ic{font-size:17px;flex:0 0 auto;}
  .nutri-food-row .nf-name{flex:1;font-size:13px;font-weight:600;min-width:0;}
  .nutri-food-row .nf-note{font-size:11px;color:var(--ink-soft);margin-top:1px;font-weight:400;}
  .nutri-food-row .nf-qty{font-family:'Space Grotesk';font-weight:700;font-size:13px;white-space:nowrap;}

  .micro-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #EEF1F4;font-size:12.5px;}
  .micro-row:last-child{border-bottom:none;}
  .micro-row .mr-name{color:var(--ink);}
  .micro-row .mr-val{color:var(--ink-soft);font-weight:600;}

  .nutri-timeline .tl-row{padding:11px 0;border-bottom:1px solid #EEF1F4;}
  .nutri-timeline .tl-row:last-child{border-bottom:none;}
  .nutri-timeline .tl-time{font-size:11px;font-weight:700;color:var(--grass-dark);text-transform:uppercase;letter-spacing:.03em;}
  .nutri-timeline .tl-title{font-size:13.5px;font-weight:600;margin-top:3px;}
  .nutri-timeline .tl-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}

  .nutri-tip{background:var(--chalk);border-radius:10px;padding:11px 13px;margin-top:10px;font-size:12.5px;
    color:var(--ink);line-height:1.5;}
  .nutri-tip b{color:var(--grass-dark);}

  .nutri-journal-group{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:12px;}
  .njg-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .njg-head .njg-ic{font-size:17px;}
  .njg-head .njg-name{font-weight:600;font-size:13.5px;flex:1;min-width:110px;}
  .njg-head .njg-target{font-size:11px;color:var(--ink-soft);}
  .njg-track{height:9px;border-radius:99px;background:var(--chalk);overflow:hidden;margin-bottom:7px;}
  .njg-fill{height:100%;border-radius:99px;background:var(--grass);}
  .njg-fill.watch{background:var(--amber);}
  .njg-fill.over{background:var(--red);}
  .njg-status{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .njg-status b{color:var(--ink);}
  .njg-tip{display:flex;gap:7px;background:var(--grass-tint);border-radius:8px;padding:9px 11px;margin-bottom:10px;
    font-size:12px;color:var(--grass-dark);line-height:1.5;}
  .njg-add{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .njg-quick{background:var(--chalk);border:1px solid var(--line);border-radius:99px;font-size:11.5px;font-weight:600;
    padding:6px 10px;cursor:pointer;color:var(--ink-soft);}
  .njg-quick:active{background:var(--grass-tint);color:var(--grass-dark);}
  .njg-custom{display:flex;align-items:center;gap:6px;margin-left:auto;}
  .njg-custom input{width:60px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;font-family:inherit;}
  .njg-custom button{border:none;background:var(--grass);color:#fff;font-weight:700;font-size:11.5px;
    padding:6px 12px;border-radius:8px;cursor:pointer;}

  .nutri-log-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #EEF1F4;font-size:12.5px;}
  .nutri-log-row:last-child{border-bottom:none;}
  .nutri-log-row .nl-name{flex:1;color:var(--ink-soft);}
  .nutri-log-row .nl-grams{font-family:'Space Grotesk';font-weight:700;}
  .nutri-log-row .nl-time{font-size:10.5px;color:var(--ink-soft);width:44px;text-align:right;}
  .nutri-log-row .nl-del{border:none;background:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:0 2px;}
  .nutri-log-empty{font-size:12.5px;color:var(--ink-soft);padding:6px 0;}

  .res-formula{background:var(--chalk);border-radius:9px;padding:11px 13px;margin:8px 0;overflow-x:auto;}
  .res-formula code{font-family:ui-monospace,'SF Mono',monospace;font-size:12px;white-space:pre;line-height:1.7;display:block;color:var(--ink);}
  .res-table{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:12px;}
  .res-table th{text-align:left;color:var(--ink-soft);font-weight:700;font-size:10.5px;text-transform:uppercase;
    padding:0 8px 6px 0;border-bottom:1px solid var(--line);}
  .res-table td{padding:7px 8px 7px 0;border-bottom:1px solid #EEF1F4;color:var(--ink-soft);}
  .res-table td:first-child{color:var(--ink);font-weight:500;}
  .res-source{font-size:10.5px;color:#9AA5B5;font-style:italic;margin-top:6px;}
  .res-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:var(--chalk);
    color:var(--ink-soft);padding:3px 8px;border-radius:99px;}

  /* ---------- Dashboard coach (barre de navigation sombre avec menus déroulants) ---------- */
  .cdb-navbar{background:var(--navy);width:100%;}
  .cdb-navbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;
    padding:9px 18px;flex-wrap:wrap;}
  .cdb-brand{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
  .cdb-brand svg{width:22px;height:25px;display:block;}
  .cdb-brand-text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;letter-spacing:.02em;color:#fff;white-space:nowrap;}
  .cdb-brand-text span{color:#3DA9FC;}
  .cdb-menu{display:flex;align-items:center;gap:2px;flex:1 1 auto;flex-wrap:wrap;}
  .cdb-item-wrap{position:relative;}
  .cdb-item{display:flex;align-items:center;gap:5px;background:none;border:none;color:#AFC0D6;font-family:inherit;
    font-size:12px;font-weight:600;padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .cdb-item:hover{background:rgba(255,255,255,.07);color:#fff;}
  .cdb-item.active{background:rgba(61,169,252,.18);color:#fff;}
  .cdb-icon{font-size:13px;line-height:1;}
  .cdb-caret{font-size:8px;margin-left:1px;transition:transform .15s;display:inline-block;}
  .cdb-caret.open{transform:rotate(180deg);}
  .cdb-dropdown{position:absolute;top:calc(100% + 4px);left:0;background:var(--navy-3);
    border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:6px;min-width:210px;
    box-shadow:0 14px 32px rgba(0,0,0,.38);z-index:80;}
  .cdb-dropdown-item{display:block;width:100%;text-align:left;background:none;border:none;color:#D9E3F0;
    font-family:inherit;font-size:12.5px;font-weight:500;padding:9px 11px;border-radius:7px;cursor:pointer;}
  .cdb-dropdown-item:hover{background:rgba(255,255,255,.09);}
  .cdb-dropdown-item.active{background:rgba(61,169,252,.2);color:#fff;font-weight:700;}

<script>
/* =========================================================
   DATA — programme des 12 semaines (issu du programme Blueperf)
   ========================================================= */

const BASE_A = [
  {name:"Échauffement articulaire + activation fessiers/chevilles", fixed:"6-8 min", note:"Montées de genoux, talons-fesses, pas chassés, montées sur pointes",
   how:"Enchaîne les mouvements les uns après les autres pendant la durée indiquée : montées de genoux en marchant, talons-fesses (petites foulées en touchant les fessiers avec les talons), pas chassés sur le côté, puis montées sur la pointe des pieds. L'idée est d'échauffer progressivement les articulations et de réveiller les muscles avant l'effort."},
  {name:"Squat", reps:"10-12", note:"Poids du corps pour commencer, tempo contrôlé, amplitude complète",
   how:"Pieds écartés largeur d'épaules, pointes légèrement ouvertes. Descends comme pour t'asseoir sur une chaise : dos droit, poids sur les talons, genoux qui suivent la direction des pieds, jusqu'à ce que les cuisses soient proches de l'horizontale (ou moins bas si c'est inconfortable). Remonte en poussant sur les talons. On garde le poids du corps pour l'instant, une charge légère pourra être ajoutée plus tard."},
  {name:"Fentes marchées", reps:"10 / jambe", note:"Genou aligné, tronc gainé",
   how:"Fais un grand pas en avant et descends jusqu'à ce que le genou arrière frôle le sol, genou avant aligné avec le pied (il ne dépasse pas trop la pointe). Pousse sur la jambe avant pour avancer directement sur l'autre jambe, en gardant le buste droit."},
  {name:"Extension dorsale (superman)", reps:"12-15", note:"Contraction 2 sec en haut, mouvement lent et contrôlé",
   how:"Allongée sur le ventre, bras tendus devant toi. Lève en même temps la poitrine, les bras et les jambes du sol en contractant le bas du dos et les fessiers, tiens 1-2 secondes en haut, puis redescends doucement sans reposer complètement entre les répétitions."},
  {name:"Pompes (genoux si besoin)", reps:"8-12", note:"Progression selon niveau",
   how:"Mains un peu plus larges que les épaules, corps gainé de la tête aux talons (ou genoux au sol pour une version plus accessible). Descends jusqu'à ce que la poitrine frôle le sol, coudes proches du corps, puis repousse le sol pour remonter."},
  {name:"Équilibre unipodal + variantes", reps:"30-40 sec / côté", note:"Travail cheville — pieds nus si possible",
   how:"Tiens-toi en équilibre sur une jambe, genou légèrement fléchi, regard fixé devant toi. Pour complexifier : ferme les yeux ou pose le pied sur une surface instable (coussin, terrain irrégulier). Change de jambe à la moitié du temps."},
  {name:"Montées sur pointe unipodales", reps:"12-15 / côté", note:"Mollets / péroniers, prévention cheville",
   how:"En appui sur une seule jambe, monte le plus haut possible sur la pointe du pied puis redescends lentement sans reposer complètement le talon entre deux répétitions. Tu peux te tenir légèrement à un support pour l'équilibre."},
  {name:"Gainage ventral + latéral", reps:"30-40 sec / côté", note:"Respiration continue, pas de blocage",
   how:"Gainage ventral : appui sur les avant-bras et les pointes de pieds, corps aligné de la tête aux talons, ventre engagé, sans creuser le bas du dos. Gainage latéral : allongée sur le côté, appui sur un avant-bras, corps aligné, la hanche décollée du sol. Respire normalement pendant tout l'exercice."},
  {name:"Bird-dog / extension lombaire douce", reps:"10 / côté", fixedSeries:2, note:"Ciblé bas du dos, à faire lentement",
   how:"À quatre pattes, tends un bras devant toi et la jambe opposée derrière en même temps, en gardant le dos plat et le bassin stable (il ne bascule pas). Reviens lentement en position de départ puis change de côté."},
  {name:"Retour au calme : étirements + respiration", fixed:"5 min", note:"",
   how:"Étire doucement les muscles sollicités (mollets, ischios, quadriceps, dos) en tenant chaque position 20 à 30 secondes, en respirant calmement pour faciliter la récupération."}
];

const BASE_B = [
  {name:"Échauffement", fixed:"5 min", note:"Mobilité hanches + rachis",
   how:"Mobilise les hanches (rotations, fentes dynamiques) et le dos (rotations du buste, dos rond / dos creux à quatre pattes) pendant la durée indiquée, pour préparer le corps avant les exercices."},
  {name:"Soulevé de terre unijambiste (poids du corps)", reps:"8-10 / jambe", note:"Dos plat, mouvement lent, appui léger si besoin d'équilibre",
   how:"Debout sur une jambe, penche le buste vers l'avant en tendant l'autre jambe vers l'arrière, comme une balance qui bascule, dos bien plat. Descends jusqu'à ce que le buste soit presque à l'horizontale (ou moins bas au début), puis reviens en position debout. Tu peux toucher légèrement le sol du bout des doigts ou te tenir à un mur/une chaise pour t'aider au début."},
  {name:"Hip thrust", reps:"12", note:"Fessiers + protection lombaire",
   how:"Dos appuyé contre un support stable (banc, canapé bas), pieds à plat au sol. Pousse les hanches vers le haut en contractant les fessiers, jusqu'à ce que le corps forme une ligne droite des épaules aux genoux, puis redescends sans reposer complètement."},
  {name:"Y-T-W au sol (activation scapulaire)", reps:"8 par lettre", note:"Mouvement lent, sans forcer sur la nuque",
   how:"Allongée sur le ventre, front légèrement décollé du sol. Lève les bras en formant un Y au-dessus de la tête puis redescends, puis en formant un T sur les côtés puis redescends, puis en formant un W (coudes pliés près du corps) puis redescends. Ce sont de petits mouvements — le contrôle compte plus que l'amplitude."},
  {name:"Planche avec touches d'épaule", reps:"10 touches / côté", note:"Hanches stables, elles ne doivent pas basculer",
   how:"En position de planche (appui sur les mains, bras tendus, corps aligné comme pour une pompe), touche ton épaule gauche avec la main droite puis repose la main, puis touche l'épaule droite avec la main gauche. Le bassin doit rester stable sans tourner à chaque touche — c'est ça qui muscle le gainage anti-rotation."},
  {name:"Marche sur pointes puis sur les talons", reps:"20 pas de chaque", fixedSeries:2, note:"Prévention cheville, pieds nus si possible",
   how:"Marche en ligne droite sur la pointe des pieds pendant une vingtaine de pas, puis reviens en marchant sur les talons (pieds relevés) pendant une vingtaine de pas. Ça renforce les muscles autour de la cheville, sans matériel."},
  {name:"Étirements bas du dos + respiration", fixed:"5 min", note:"Idéalement aussi avant le coucher les autres soirs",
   how:"Position de l'enfant (assise sur les talons, bras tendus devant) ou genoux ramenés contre la poitrine allongée sur le dos, en respirant profondément et lentement pendant toute la durée."}
];

function seanceA(series, opts){
  opts = opts || {};
  let ex = BASE_A.map(e => Object.assign({}, e, {series: e.fixedSeries || series}));
  if(opts.plyo){
    ex.splice(ex.length-1, 0, {name:"Appuis dynamiques / petits sauts bas", reps:"6-8", series:"2-3",
      note:"Amorce vitesse / explosivité — surface adaptée, réception contrôlée",
      how:"Petits sauts sur place ou faibles bondissements avant/latéraux, en cherchant une réception souple et silencieuse (amortis avec les genoux, pas les talons). Reste sur une surface stable et non glissante."});
  }
  if(opts.tests){
    ex.splice(ex.length-1, 0, {name:"Tests de fin de bloc (facultatif)", fixed:"10 min",
      note:"Ex : temps d'équilibre unipodal max, nb de pompes en 1 min — à comparer avec S1",
      how:"Chronomètre le temps que tu tiens en équilibre sur une jambe (yeux ouverts), puis compte le nombre de pompes réalisées en 1 minute avec une bonne technique. Note les résultats pour comparer la progression depuis le début du bloc."});
  }
  return ex;
}
function seanceB(series, courte){
  let ex = BASE_B.map(e => Object.assign({}, e, {series: e.fixedSeries || series}));
  if(courte){
    ex = ex.filter(e => e.name.indexOf("Planche avec touches d'épaule") === -1 && e.name.indexOf("Marche sur pointes") === -1);
  }
  return ex;
}

const RUN_META = [

  {key:'dimanche', label:'Dimanche'}
];
function dayLabel(key){
  const d = DAYS_OF_WEEK.find(x => x.key === key);
  return d ? d.label : '';
}

/*

  à part (liste d'exercices) ; tous les autres types partagent la même structure simple

*/
const KIND_META = {
  renfo:    {icon:'🏋️', label:'Renforcement', unit:'', prefix:'RF'},
  course:   {icon:'🏃', label:'Course',        unit:'km', prefix:'CO'},
  football: {icon:'⚽', label:'Football',       unit:'min', prefix:'FO'},
  natation: {icon:'🏊', label:'Natation',       unit:'m', prefix:'NA'},
  velo:     {icon:'🚴', label:'Vélo',           unit:'km', prefix:'VE'},
};
function kindMeta(k){ return KIND_META[k] || KIND_META.course; }
function kindIconOf(k){ return kindMeta(k).icon; }
function kindLabelOf(k){ return kindMeta(k).label; }
function kindUnitOf(k){ return kindMeta(k).unit; }
function defaultDayForSessionId(id){
  if(id === 'A') return 'lundi';
  if(id === 'B') return 'jeudi';
  if(id === 'R1') return 'mercredi';
  if(id === 'R2') return 'vendredi';
  if(id === 'R3') return 'dimanche';
  return null;
}

function weekSessionDefs(week){
  const defs = [];
  week.renfo.forEach(r => defs.push({id:r.id, kind:"renfo", label:r.label, note:r.note, exercises:r.exercises, day:defaultDayForSessionId(r.id)}));
  week.runKm.forEach((km, i) => defs.push({
    id:"R"+(i+1), kind:"course", label:RUN_META[i].label,
    note: RUN_META[i].note, km: km, day:defaultDayForSessionId("R"+(i+1))
  }));
  return defs;
}
function totalSessionCount(){
  let t = 0;
  WEEKS.forEach(w => t += weekSessionDefs(w).length);
  return t;
}
const TOTAL_SESSIONS = totalSessionCount();

   STORAGE HELPERS
   ---------------------------------------------------------
   Adaptation Vercel : les données "personnelles" (préférences propres à cet
   appareil — quel compte est connecté ici) vivent dans le localStorage du
   navigateur. Les données "partagées" (tout ce que coach et clients doivent
   voir en commun — séances, ressentis, programmes...) passent par l'API
   /api/storage, adossée à une vraie base de données (Upstash Redis).
   ========================================================= */
const LS_PREFIX = 'bp_';

async function sGet(key, shared){
  if(!shared){
    try{ return localStorage.getItem(LS_PREFIX+key); }
    catch(e){ return null; }
  }
  try{
    const r = await fetch('/api/storage?action=get&key='+encodeURIComponent(key)+'&_='+Date.now(), {cache:'no-store'});
    if(!r.ok) return null;
    const j = await r.json();
    return (j && j.value != null) ? j.value : null;
  }catch(e){ return null; }
}
async function sSet(key, value, shared){
  if(!shared){
    try{ localStorage.setItem(LS_PREFIX+key, value); return true; }
    catch(e){ return null; }
  }
  const attempt = async () => {
    const r = await fetch('/api/storage', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'set', key, value})
    });
    return r.ok;
  };
  try{
    if(await attempt()) return true;
  }catch(e){}
  // un raté d'écriture peut être ponctuel (réseau, etc.) — on retente une fois avant d'abandonner
  try{ return (await attempt()) ? true : null; }
  catch(e){ return null; }
}
async function sList(prefix, shared){
  if(!shared){
    try{
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(LS_PREFIX) === 0){
          const bare = k.slice(LS_PREFIX.length);
          if(!prefix || bare.indexOf(prefix) === 0) keys.push(bare);
        }
      }
      return keys;
    }catch(e){ return []; }
  }
  try{
    const r = await fetch('/api/storage?action=list&prefix='+encodeURIComponent(prefix||'')+'&_='+Date.now(), {cache:'no-store'});
    if(!r.ok) return [];
    const j = await r.json();
    return (j && j.keys) ? j.keys : [];
  }catch(e){ return []; }
}
async function sDelete(key, shared){
  if(!shared){
    try{ localStorage.removeItem(LS_PREFIX+key); return true; }
    catch(e){ return null; }
  }
  try{
    const r = await fetch('/api/storage?action=delete&key='+encodeURIComponent(key), {method:'DELETE'});
    return r.ok ? true : null;
  }catch(e){ return null; }
}

/*
  Enregistre une séance puis relit immédiatement ce qui a été écrit, pour être certain que la
  sauvegarde a vraiment pris (plutôt que de supposer que ça a marché et de laisser quelqu'un cocher
  une séance qui, en réalité, ne s'est jamais enregistrée). Renvoie true/false.
*/
/*
  On se fie au résultat renvoyé par l'écriture elle-même plutôt que de la relire aussitôt après :
  une relecture immédiate peut arriver avant que l'écriture soit pleinement propagée côté stockage
  et remonter un faux échec alors que la sauvegarde a réellement fonctionné.
*/
async function saveSession(clientId, weekN, id, data){
  const result = await sSet(sessionKey(clientId, weekN, id), JSON.stringify(data), true);
  if(result){
    // Le total de séances validées / la série en cours peuvent avoir changé : on invalide le
    // cache des badges pour qu'ils se recalculent au prochain affichage du Programme.
    if(state.badgeStats && state.badgeStats.clientId === clientId) state.badgeStats = null;
  }
  return !!result;
}

    sessions: weekSessionDefs(w).map(d => ({
      id:d.id, kind:d.kind, label:d.label, note:d.note, km:d.km, exercises:d.exercises, day:d.day
    }))

  if(raw){
    try{
      const p = JSON.parse(raw);
      if(p && Array.isArray(p.weeks)) prog = p;
    }catch(e){}
  }
  if(!prog) prog = {weeks:[]};
  if(clientId === 'cindy' && prog.weeks.length === 0){
    // Le programme de Cindy ne doit jamais rester vide : on le régénère automatiquement s'il manque.
    prog = {weeks: buildCindyDefaultWeeks()};
    await saveProgram('cindy', prog.weeks);

}

}
function nextSessionId(week, kind){
  const prefix = kindMeta(kind).prefix;
  const count = week.sessions.filter(s => s.kind === kind).length;

}
function exerciseDose(e){

/* ---------- Utilitaires dates / semaines ---------- */
const DAY_LABELS = ['LUN','MAR','MER','JEU','VEN','SAM','DIM'];
function startOfWeek(d){
  const date = new Date(d);
  date.setHours(0,0,0,0);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  return date;
}
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function isoDateStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0'); }
function fmtDDMM(d){ return String(d.getDate()).padStart(2,'0')+"/"+String(d.getMonth()+1).padStart(2,'0'); }
function isoWeekNumber(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}
function isoWeekKeyOf(d){ return d.getFullYear()+"-W"+String(isoWeekNumber(d)).padStart(2,'0'); }

function slugify(name){
  const base = name.toString().trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
  return base || 'client';
}
function uniqueClientId(base, existingIds){
  let id = base, i = 2;
  while(existingIds.indexOf(id) > -1){ id = base+'-'+i; i++; }
  return id;
}
function generateClientCode(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sans 0/O ni 1/I, pour éviter les confusions
  let code = '';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}
/*
  Compare deux codes en ignorant la casse, les espaces et les tirets, pour que la saisie soit
  tolérante (clavier mobile, autocorrection, espace collé par erreur, etc.).
*/
function normalizeCode(s){
  return (s || '').toString().toUpperCase().replace(/[^A-Z0-9]/g, '');
}

/* ---------- Clients (multi-athlètes) ---------- */
async function ensureClientsLoaded(){
  if(state.clients) return state.clients;
  let list = [];
  const raw = await sGet('clients', true);
  if(raw){ try{ list = JSON.parse(raw); }catch(e){ list = []; } }
  let changed = false;
  if(!list.find(c => c.id === 'cindy')){
    list.unshift({id:'cindy', name:'Cindy', code:generateClientCode()});
    changed = true;
  }
  list.forEach(c => { if(!c.code){ c.code = generateClientCode(); changed = true; } });
  list.forEach(c => { if(c.allowSelfAdd == null){ c.allowSelfAdd = false; changed = true; } });
  if(changed){
    let saved = await sSet('clients', JSON.stringify(list), true);
    if(!saved){
      // en cas de raté de sauvegarde ponctuel, on réessaie une fois plutôt que de perdre les codes générés
      await new Promise(r => setTimeout(r, 300));
      saved = await sSet('clients', JSON.stringify(list), true);
    }
  }
  state.clients = list;
  return list;
}

/*
  Migrations ponctuelles, exécutées une seule fois (marqueurs "migration_vX" en stockage partagé) :
  v2 — les toutes premières versions de l'app stockaient les séances/ressentis sans identifiant de
       client (un seul client possible : Cindy). On les reprend sous la clé "cindy".
  v3 — le programme de Cindy était codé en dur dans l'app ; on le convertit en données pour qu'il
       suive le même modèle générique que les programmes créés pour de nouveaux clients.
*/
async function migrateIfNeeded(){
  await ensureClientsLoaded();

  const doneV2 = await sGet('migration_v2', true);
  if(doneV2 !== 'done'){
    const oldSessionKeys = await sList('session:', true);
    for(const k of oldSessionKeys){
      const parts = k.split(':');
      if(parts.length === 3){
        const raw = await sGet(k, true);
        if(raw) await sSet('session:cindy:'+parts[1]+':'+parts[2], raw, true);
        await sDelete(k, true);
      }
    }
    const oldHooperKeys = await sList('hooper:', true);
    for(const k of oldHooperKeys){
      const parts = k.split(':');
      if(parts.length === 2){
        const raw = await sGet(k, true);
        if(raw) await sSet('hooper:cindy:'+parts[1], raw, true);
        await sDelete(k, true);
      }
    }
    await sSet('migration_v2', 'done', true);
  }

  const doneV3 = await sGet('migration_v3', true);
  if(doneV3 !== 'done'){
    const existing = await sGet('program:cindy', true);
    if(!existing){
      await saveProgram('cindy', buildCindyDefaultWeeks());
    }
    await sSet('migration_v3', 'done', true);
  }

  const doneV4 = await sGet('migration_v4', true);
  if(doneV4 !== 'done'){
    // Ajoute un jour de la semaine par défaut aux séances de Cindy créées avant l'introduction
    // de la vue "jour par jour" (les nouveaux programmes créés via le créateur ont déjà ce champ).
    const raw = await sGet('program:cindy', true);
    if(raw){
      try{
        const prog = JSON.parse(raw);
        let changed = false;
        prog.weeks.forEach(w => w.sessions.forEach(s => {
          if(!s.day){
            const d = defaultDayForSessionId(s.id);
            if(d){ s.day = d; changed = true; }
          }
        }));
        if(changed) await saveProgram('cindy', prog.weeks);
      }catch(e){}
    }
    await sSet('migration_v4', 'done', true);
  }
}

async function checkStorageWorks(){
  try{
    const testKey = '__diag_'+Date.now();
    const okPersonal = await sSet(testKey, 'ok', false);
    const okShared = await sSet(testKey, 'ok', true);
    if(!okPersonal || !okShared) return false;
    const g1 = await sGet(testKey, false);
    const g2 = await sGet(testKey, true);
    await sDelete(testKey, false);
    await sDelete(testKey, true);
    return g1 === 'ok' && g2 === 'ok';
  }catch(e){
    return false;
  }
}

async function init(){
  const storageOk = await checkStorageWorks();
  if(!storageOk){
    renderStorageError();
    return;
  }
  await migrateIfNeeded();
  const storedAccess = await sGet('access', false);

  if(storedAccess === 'coach'){
    await bootstrapCoach();
    render();
    return;
  }
  if(storedAccess === 'client'){
    const storedClientId = await sGet('clientId', false);
    if(storedClientId){
      state.access = 'client';
      state.myClientId = storedClientId;
      state.viewAs = 'client';
      state.tab = 'programme';
      render();
      return;
    }
  }
  state.loginStep = 'choice';
  state.loginError = '';
  renderLoginScreen();
}

async function bootstrapCoach(){
  state.access = 'coach';
  await ensureClientsLoaded();
  const creds = await loadCoachCredentials();
  state.coachUsername = creds.username;
  const storedCoachClient = await sGet('coachSelectedClient', false);
  const ids = state.clients.map(c => c.id);
  state.coachClientId = (storedCoachClient && ids.indexOf(storedCoachClient) > -1)
    ? storedCoachClient
    : (ids[0] || 'cindy');
  state.viewAs = 'coach';
  state.tab = 'apercu';
  state.exerciseLibrary = await loadExerciseLibrary();
}

  une séance de renfo, pour pouvoir les repiocher sans retaper le nom/l'explication/la photo à
  chaque fois. Alimentée automatiquement à chaque enregistrement de séance de renfo.
*/
function exerciseLibraryKey(){ return "exerciseLibrary"; }
async function loadExerciseLibrary(){
  const raw = await sGet(exerciseLibraryKey(), true);
  if(!raw) return [];
  try{ const l = JSON.parse(raw); return Array.isArray(l) ? l : []; }catch(e){ return []; }
}
async function saveExerciseLibrary(list){
  return await sSet(exerciseLibraryKey(), JSON.stringify(list), true);
}
function normalizeExerciseName(s){
  return (s||'').toString().trim().toLowerCase();
}
function upsertExerciseLibrary(list, ex){
  const key = normalizeExerciseName(ex.name);
  if(!key) return list;
  const idx = list.findIndex(e => normalizeExerciseName(e.name) === key);
  const entry = {
    id: idx > -1 ? list[idx].id : ('exlib_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
    name: ex.name,
    how: ex.how || (idx > -1 ? list[idx].how : ''),
    photo: ex.photo || (idx > -1 ? list[idx].photo : '')
  };
  if(idx > -1){ list[idx] = entry; } else { list.push(entry); }
  return list;
}

async function computeGlobalStats(){
  if(state.globalStats) return state.globalStats;
  let sessions = 0;
  for(const c of state.clients){
    const p = await loadProgram(c.id);
    sessions += p.weeks.reduce((t,w) => t + w.sessions.length, 0);
  }
  state.globalStats = {clients: state.clients.length, sessions};
  return state.globalStats;
}

async function logout(){
  // on tente une suppression, puis on écrase avec une valeur vide en secours : certains
  // environnements ne supportent pas bien la suppression, mais un set vide bloque quand même
  // toute reconnexion automatique au prochain chargement.
  await sDelete('access', false);
  await sSet('access', '', false);
  await sDelete('clientId', false);
  await sSet('clientId', '', false);
  state.access = 'client';
  state.myClientId = 'cindy';
  state.coachClientId = null;
  state.viewAs = 'client';
  state.tab = null;
  state.builderClientId = null;
  state.builderProgram = null;
  state.program = null;
  state.coachOverview = null;
  state.coachHooperHistory = null;
  state.globalStats = null;
  state.bilanData = null;
  state.healthOverview = null;
  state.trainingData = null;
  state.cachedWeek = null;
  state.cachedClientId = null;
  state.loginError = '';
  renderLoginScreen();
}

function renderLoginScreen(){
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        ${shieldSvg()}
        <h1 class="login-brand">Blue<span>Perf</span></h1>
        <p class="login-sub">Connecte-toi / Log in</p>
        <form id="login-form" class="login-form">
          <label>IDENTIFIANT / USERNAME</label>
          <input type="text" id="login-user" placeholder="Identifiant" autocomplete="username">
          <label>MOT DE PASSE / PASSWORD</label>
          <input type="password" id="login-pass" placeholder="•••" autocomplete="current-password">
          <button type="submit" class="login-submit">Se connecter / Log in</button>
        </form>
        ${state.loginError ? `<div class="login-error">${state.loginError}</div>` : ''}
      </div>
    </div>`;
  document.getElementById('login-form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const user = document.getElementById('login-user').value;
    const pass = document.getElementById('login-pass').value;
    attemptLogin(user, pass);
  });
}

async function attemptLogin(userRaw, passRaw){
  const user = normalizeCode(userRaw);
  const pass = normalizeCode(passRaw);
  if(!user || !pass){
    state.loginError = 'Merci de renseigner ton identifiant et ton mot de passe.';
    renderLoginScreen();
    return;
  }
  const creds = await loadCoachCredentials();
  if(user === normalizeCode(creds.username) && pass === normalizeCode(creds.password)){
    await sSet('access', 'coach', false);
    await bootstrapCoach();
    render();
    return;
  }
  await ensureClientsLoaded();
  const match = state.clients.find(c => normalizeCode(c.id) === user && c.code && normalizeCode(c.code) === pass);
  if(match){
    await sSet('access', 'client', false);
    await sSet('clientId', match.id, false);
    state.access = 'client';
    state.myClientId = match.id;
    state.viewAs = 'client';
    state.tab = 'programme';
    render();
  } else {
    state.loginError = 'Identifiant ou mot de passe incorrect.';
    renderLoginScreen();
  }
}

/* =========================================================
   CLIENT — PROGRAMME
   ========================================================= */
async function renderProgramme(screen){
  const clientId = effectiveClientId();

  if(!state.program || state.program.clientId !== clientId){
    const p = await loadProgram(clientId);
    state.program = {clientId, weeks: p.weeks};
  }
  const weeks = state.program.weeks.slice().sort((a,b) => a.n - b.n);

  if(!weeks.length){
    screen.innerHTML = `<div class="empty">Ton coach n'a pas encore ajouté de séances ici. Reviens un peu plus tard !</div>`;
    return;
  }
  if(!weeks.find(w => w.n === state.week)) state.week = weeks[0].n;
  const week = weeks.find(w => w.n === state.week);
  const defs = week.sessions;

  if(!state.badgeStats || state.badgeStats.clientId !== clientId){
    state.badgeStats = {clientId, stats: await computeSessionBadgeStats(clientId)};
  }

  screen.innerHTML = `
    <div id="badges-slot"></div>
    <div class="week-scroll" id="week-scroll">
      ${weeks.map(w => `<div class="week-chip ${w.n===state.week?'active':''} ${w.deload?'deload':''}" data-week="${w.n}">
        <span class="wk-n">S${w.n}</span><span class="wk-dot"></span>
      </div>`).join('')}
    </div>
    <div class="week-head">
      <h2>Semaine ${week.n}</h2>
      ${week.meso ? `<div class="week-meta">${week.meso}</div>` : ''}
      ${week.charge ? `<span class="charge-tag ${week.deload?'decharge':''}">Charge : ${week.charge}</span>` : ''}
      <div class="week-progress" id="week-progress">Chargement…</div>
    </div>
    <div id="session-list"></div>
    <div id="selfadd-wrap"></div>
  `;
  document.getElementById('badges-slot').innerHTML = badgesBlockHtml(state.badgeStats.stats);
  screen.querySelectorAll('.week-chip').forEach(c => {
    c.addEventListener('click', () => {
      state.week = parseInt(c.getAttribute('data-week'),10);
      state.openSession = null;
      state.pendingRpeFor = null;
      state.selfAddOpen = false;
      renderProgramme(screen);
    });
  });

  setupSelfAdd(screen, clientId, week);

  if(!defs.length){
    document.getElementById('week-progress').innerHTML = '';
    document.getElementById('session-list').innerHTML = `<div class="empty">Pas de séance prévue cette semaine-là.</div>`;
    return;
  }

  // load statuses (une seule fois par semaine/client, réutilisées ensuite pour les re-rendus locaux)
  if(state.cachedWeek !== week.n || state.cachedClientId !== clientId){
    const statuses = {};
    await Promise.all(defs.map(async d => {
      statuses[d.id] = await loadSession(clientId, week.n, d.id);
    }));
    state.sessionCache = statuses;
    state.cachedWeek = week.n;
    state.cachedClientId = clientId;
  }
  const statuses = state.sessionCache;
  const doneCount = Object.values(statuses).filter(s => s.done).length;
  document.getElementById('week-progress').innerHTML = `<b>${doneCount}/${defs.length}</b> séances réalisées cette semaine`;

  const list = document.getElementById('session-list');
  list.innerHTML = dayGroupedSessionsHtml(week.n, defs, statuses);
  bindSessionCards(list, clientId, week.n, defs, statuses);
}

/*
  Permet à un·e client·e autorisé·e (voir Paramètres → "Mots de passe de mes clients") d'ajouter
  lui/elle-même une séance en dehors du programme (foot, natation, vélo…) : déjà réalisée (marquée
  faite tout de suite) ou prévue pour plus tard (elle apparaît alors comme une séance à valider,
  comme les autres). Dans les deux cas, elle est ajoutée directement dans son programme et visible
  aussitôt par le coach.
*/
function setupSelfAdd(screen, clientId, week){
  const wrap = screen.querySelector('#selfadd-wrap');
  if(!wrap) return;
  // renderProgramme (onglet "Programme") n'est affiché que côté vue client (accès direct du/de la
  // client·e OU coach en aperçu "vue client" via le bouton en haut) : dans les deux cas, on montre
  // le bouton d'ajout dès que ce client précis y est autorisé depuis Paramètres.
  const clientRec = (state.clients||[]).find(c => c.id === clientId);
  const canSelfAdd = clientRec && clientRec.allowSelfAdd;
  if(!canSelfAdd){ wrap.innerHTML = ''; return; }

  if(state.selfEditId && !week.sessions.find(s => s.id === state.selfEditId)){
    state.selfEditId = null;
  }

  if(state.selfEditId){
    const def = week.sessions.find(s => s.id === state.selfEditId);
    const status = (state.sessionCache && state.sessionCache[def.id]) || {done:false, rpe:null, completedAt:null};
    wrap.innerHTML = selfAddFormHtml({def, status});
    bindSelfAddForm(wrap, clientId, week, () => {
      state.selfEditId = null;
      renderProgramme(screen);
    }, def.id);
  } else if(state.selfAddOpen){
    wrap.innerHTML = selfAddFormHtml(null);
    bindSelfAddForm(wrap, clientId, week, () => {
      state.selfAddOpen = false;
      renderProgramme(screen);
    }, null);
  } else {

function dayKeyFromDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const idx = (d.getDay() + 6) % 7; // getDay(): 0=dimanche → recalé pour matcher DAYS_OF_WEEK (lundi en premier)
  return DAYS_OF_WEEK[idx].key;
}
function bindSelfAddForm(wrap, clientId, week, onDone, editId){
  const form = wrap.querySelector('#selfadd-form');
  const kindSel = form.querySelector('.sa-kind');
  const unitLabel = form.querySelector('.sa-unit-label');
  const dateInput = form.querySelector('.sa-date');
  const doneCb = form.querySelector('.sa-done');
  const durationRow = form.querySelector('.sa-duration-row');
  const updateUnit = () => {
    const unit = kindUnitOf(kindSel.value);
    unitLabel.textContent = unit === 'min' ? 'Durée (minutes)' : 'Distance ('+unit+')';
    // le foot se saisit déjà en minutes : pas besoin d'un second champ de durée pour la charge.
    durationRow.style.display = unit === 'min' ? 'none' : '';
  };
  const updateDateBounds = () => {
    // une séance "déjà faite" ne peut pas être datée dans le futur ; une séance "à venir" le peut.
    if(doneCb.checked){
      dateInput.setAttribute('max', todayStr());
      if(dateInput.value > todayStr()) dateInput.value = todayStr();
    } else {
      dateInput.removeAttribute('max');
    }
  };
  updateUnit();
  updateDateBounds();
  kindSel.addEventListener('change', updateUnit);
  doneCb.addEventListener('change', updateDateBounds);
  form.querySelector('.sa-cancel').addEventListener('click', onDone);
  form.querySelector('.sa-save').addEventListener('click', async () => {
    const kind = kindSel.value;
    const label = form.querySelector('.sa-label').value.trim() || KIND_META[kind].label;
    const note = form.querySelector('.sa-note').value.trim();
    const value = parseFloat(form.querySelector('.sa-value').value) || 0;
    const durationMin = kindUnitOf(kind) === 'min' ? value : (parseFloat(form.querySelector('.sa-duration').value) || null);
    const dateVal = dateInput.value || todayStr();
    const day = dayKeyFromDate(dateVal);
    const alreadyDone = doneCb.checked;
    const weeks = state.program.weeks;
    const w = weeks.find(x => x.n === week.n);
    let id;
    if(editId){
      id = editId;
      const idx = w.sessions.findIndex(s => s.id === editId);
      if(idx === -1){ onDone(); return; }
      w.sessions[idx] = Object.assign({}, w.sessions[idx], {kind, label, note, day, km: value, durationMin, date: dateVal});
      const ok = await saveProgram(clientId, weeks);
      if(!ok){ showSaveError(); return; }
      const prevStatus = (state.sessionCache && state.sessionCache[id]) || {};
      const newStatus = alreadyDone
        ? {done:true, rpe: prevStatus.rpe != null ? prevStatus.rpe : null, completedAt: dateVal}
        : {done:false, rpe:null, completedAt:null};
      const statusOk = await saveSession(clientId, w.n, id, newStatus);
      if(!statusOk){ showSaveError(); return; }
    } else {
      id = nextSessionId(w, kind);
      const sessionObj = {id, kind, label, note, day, km: value, durationMin, selfAdded:true, date: dateVal};
      w.sessions.push(sessionObj);
      const ok = await saveProgram(clientId, weeks);
      if(!ok){ showSaveError(); return; }
      if(alreadyDone){
        const statusOk = await saveSession(clientId, w.n, id, {done:true, rpe:null, completedAt: dateVal});
        if(!statusOk){ showSaveError(); return; }
      }
    }
    invalidateClientCaches(clientId);
    onDone();
  });
}

function dayGroupedSessionsHtml(weekN, defs, statuses){
  const withDay = DAYS_OF_WEEK.map(day => ({
    day, sessions: defs.filter(d => d.day === day.key)

  const unassigned = defs.filter(d => !d.day);

  let html = withDay.map(({day, sessions}) => {
    if(!sessions.length){
      return `<div class="day-block">
        <div class="day-head">${day.label}</div>
        <div class="day-rest">Repos / libre</div>
      </div>`;
    }
    return `<div class="day-block">
      <div class="day-head">${day.label}</div>
      ${sessions.map(d => sessionCardHtml(weekN, d, statuses[d.id])).join('')}
    </div>`;

  if(unassigned.length){
    html += `<div class="day-block">
      <div class="day-head">Autres séances</div>
      ${unassigned.map(d => sessionCardHtml(weekN, d, statuses[d.id])).join('')}
    </div>`;
  }
  return html;
}

async function computeRecentHooperEntries(clientId, limit){
  const prefix = 'hooper:'+clientId+':';
  const keys = await sList(prefix, true);
  const entries = [];
  await Promise.all(keys.map(async k => {
    const raw = await sGet(k, true);
    if(raw){ try{ entries.push({date:k.slice(prefix.length), data:JSON.parse(raw)}); }catch(e){} }
  }));
  entries.sort((a,b) => b.date.localeCompare(a.date));
  return entries.slice(0, limit || 7);
}

async function renderHooperForm(screen){
  const clientId = effectiveClientId();
  if(state.hooperLoadedDate !== state.hooperDate || state.hooperLoadedClientId !== clientId){
    const existing = await loadHooper(clientId, state.hooperDate);
    state.hooperDraft = existing
      ? {sommeil:existing.sommeil, fatigue:existing.fatigue, stress:existing.stress, courbatures:existing.courbatures, zones:existing.zones||[]}
      : {sommeil:4, fatigue:4, stress:4, courbatures:1, zones:[]};
    state.hooperEntryExists = !!existing;
    state.hooperLoadedDate = state.hooperDate;
    state.hooperLoadedClientId = clientId;
    state.hooperSaved = false;
  }
  const d = state.hooperDraft;
  const recentEntries = await computeRecentHooperEntries(clientId, 7);

  const items = [
    {key:'sommeil', name:'Qualité du sommeil', lo:'1 · très bonne', hi:'7 · très mauvaise'},
    {key:'fatigue', name:'Fatigue', lo:'1 · aucune', hi:'7 · extrême'},
    {key:'stress', name:'Stress', lo:'1 · aucun', hi:'7 · extrême'},
    {key:'courbatures', name:'Courbatures (DOMS)', lo:'1 · aucune', hi:'7 · extrêmes'}
  ];

  screen.innerHTML = `
    <div class="section-label">Ton ressenti du jour</div>
    <div class="hooper-date">
      <input type="date" id="hooper-date-input" value="${state.hooperDate}" max="${todayStr()}">
    </div>
    <div id="hooper-items">
      ${items.map(it => `
        <div class="hooper-item">
          <div class="hooper-item-head"><span class="hi-name">${it.name}</span><span class="hi-val" data-hval="${it.key}">${d[it.key]}</span></div>
          <input type="range" class="hooper-slider" min="1" max="7" step="1" value="${d[it.key]}" data-hslider="${it.key}">
          <div class="hooper-labels"><span>${it.lo}</span><span>${it.hi}</span></div>
        </div>
      `).join('')}
    </div>
    <div id="bodymap-slot"></div>
    <div class="save-bar">
      <button class="save-btn" id="hooper-save">Enregistrer mon ressenti</button>
      ${state.hooperEntryExists ? '<button class="btn-line danger-line" id="hooper-delete" style="margin-top:8px;">Supprimer ce ressenti</button>' : ''}
      ${state.hooperSaved ? '<div class="save-confirm">Ressenti enregistré ✓</div>' : ''}
    </div>

    <div class="section-label" style="margin-top:26px;">Tes derniers ressentis</div>
    <div id="hooper-recent-list">
      ${recentEntries.length ? recentEntries.map(e => {
        const idx = hooperIndex(e.data);
        const flag = hooperFlag(idx);
        return `<div class="history-item">
          <div>
            <div class="hi-date">${fmtDate(e.date)}</div>
            <div class="hi-sub">Sommeil ${e.data.sommeil} · Fatigue ${e.data.fatigue} · Stress ${e.data.stress} · Courbatures ${e.data.courbatures}</div>
            <div class="done-links" style="justify-content:flex-start;margin-top:6px;">
              <button data-goto-hooper="${e.date}">Modifier</button>
              <button class="danger" data-del-hooper-mine="${e.date}">Supprimer</button>
            </div>
          </div>
          <span class="flag ${flag.cls}">${flag.label} · ${idx}/28</span>
        </div>`;
      }).join('') : '<div class="empty">Pas encore de ressenti enregistré.</div>'}
    </div>
  `;

  document.getElementById('hooper-date-input').addEventListener('change', (e) => {
    state.hooperDate = e.target.value || todayStr();
    renderHooperForm(screen);
  });

  const deleteBtn = document.getElementById('hooper-delete');
  if(deleteBtn){
    deleteBtn.addEventListener('click', async () => {
      if(!confirm('Supprimer ce ressenti du '+fmtDate(state.hooperDate)+' ?')) return;
      const ok = await sDelete(hooperKey(clientId, state.hooperDate), true);
      if(!ok){ showSaveError(); return; }
      state.hooperLoadedDate = null; // force le rechargement (entrée par défaut) pour cette date
      renderHooperForm(screen);
    });
  }
  screen.querySelectorAll('[data-goto-hooper]').forEach(b => {
    b.addEventListener('click', () => {
      state.hooperDate = b.getAttribute('data-goto-hooper');
      renderHooperForm(screen);
    });
  });
  screen.querySelectorAll('[data-del-hooper-mine]').forEach(b => {
    b.addEventListener('click', async () => {
      const date = b.getAttribute('data-del-hooper-mine');
      if(!confirm('Supprimer ce ressenti du '+fmtDate(date)+' ?')) return;
      const ok = await sDelete(hooperKey(clientId, date), true);

      if(state.hooperDate === date) state.hooperLoadedDate = null;
      renderHooperForm(screen);

  screen.querySelectorAll('[data-hslider]').forEach(sl => {
