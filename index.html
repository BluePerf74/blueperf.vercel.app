  });

  renderBodyMapSlot();

  document.getElementById('hooper-save').addEventListener('click', async () => {
    const payload = Object.assign({}, state.hooperDraft, {savedAt: new Date().toISOString()});
    const ok = await saveHooper(clientId, state.hooperDate, payload);
    if(!ok){ showSaveError(); return; }
    state.hooperSaved = true;
    renderHooperForm(screen);
  });
}

function renderBodyMapSlot(){
  const slot = document.getElementById('bodymap-slot');
  if(!slot) return;
  if(state.hooperDraft.courbatures <= 1){
    slot.innerHTML = '';
    return;
  }
  const zones = FRONT_ZONES.concat(BACK_ZONES);
  const selected = state.hooperDraft.zones;
  slot.innerHTML = `
    <div class="bodymap-wrap">
      <p>Indique les zones où tu ressens des courbatures</p>
      ${bodyMapDualHtml(selected)}
      <div class="bm-chips">
        ${zones.map(z => `<button class="bm-chip ${selected.indexOf(z.id)>-1?'sel':''}" data-bmchip="${z.id}">${z.label}</button>`).join('')}
      </div>
    </div>
  `;
  function toggleZone(id){
    const i = state.hooperDraft.zones.indexOf(id);
    if(i>-1) state.hooperDraft.zones.splice(i,1); else state.hooperDraft.zones.push(id);
    renderBodyMapSlot();
  }
  slot.querySelectorAll('[data-bmchip]').forEach(c => {
    c.addEventListener('click', () => toggleZone(c.getAttribute('data-bmchip')));
  });
  slot.querySelectorAll('[data-zone]').forEach(z => {
    z.addEventListener('click', () => toggleZone(z.getAttribute('data-zone')));
  });
}

  const loadPoints = [];   // {date, load, kind, clientId} — une entrée par séance validée avec RPE + durée
  const rpeMissing = [];   // séances validées sans RPE renseigné
  const hooperDatesByClient = {};

  await Promise.all(state.clients.map(async c => {
    const program = await loadProgram(c.id);
    const defsByKey = {};
    program.weeks.forEach(w => w.sessions.forEach(s => { defsByKey[w.n+'|'+s.id] = s; }));

    const keys = await sList('session:'+c.id+':', true);
    await Promise.all(keys.map(async k => {
      const raw = await sGet(k, true);
      if(!raw) return;
      let v; try{ v = JSON.parse(raw); }catch(e){ return; }
      if(!(v && v.done)) return;
      sessionsDone++;
      const parts = k.split(':'); // session:clientId:SweekN:sessionId
      const def = defsByKey[parts[2].replace('S','')+'|'+parts[3]];
      if(v.rpe != null){
        rpeFilled++;
        if(v.completedAt && def && def.durationMin){
          loadPoints.push({date:v.completedAt, load:v.rpe*def.durationMin, kind: def.kind || 'course', clientId:c.id});
        }
      } else if(v.completedAt){
        rpeMissing.push({clientId:c.id, name:c.name, date:v.completedAt, label: def ? def.label : parts[3]});
      }
    }));

    const hPrefix = 'hooper:'+c.id+':';
    const hKeys = await sList(hPrefix, true);
    hooperEntriesTotal += hKeys.length;
    hooperDatesByClient[c.id] = new Set(hKeys.map(k => k.slice(hPrefix.length)));
  }));

  rpeMissing.sort((a,b) => b.date.localeCompare(a.date));

  const hooperWatch = state.healthOverview.filter(r => r.flag && r.flag.cls !== 'faible');
  const checkDate = state.ovHooperCheckDate || todayStr();
  const hooperMissing = state.clients.filter(c => !(hooperDatesByClient[c.id] && hooperDatesByClient[c.id].has(checkDate)));
  const injuredNow = state.healthOverview.filter(r => r.activeInjury);
  const inactiveNow = state.healthOverview.filter(r => r.inactiveDays != null && r.inactiveDays >= 5);

  const daysTracked = new Set();
  loadPoints.forEach(p => daysTracked.add(p.date));
  Object.values(hooperDatesByClient).forEach(set => set.forEach(d => daysTracked.add(d)));

  state.ovDashboard = {
    sessionsDone, rpeFilled, hooperEntriesTotal, loadPoints, rpeMissing,
    hooperWatch, hooperMissing, injuredNow, inactiveNow,
    daysTrackedCount: daysTracked.size
  };
}

function ovFilteredLoadSeries(){
  const dash = state.ovDashboard;
  if(!dash) return [];
  const today = new Date(todayStr()+'T00:00:00');
  const rangeStart = addDays(today, -(state.ovRangeDays-1));
  const rangeStartStr = isoDateStr(rangeStart);
  const todayS = todayStr();

  let points = dash.loadPoints.filter(p => p.date >= rangeStartStr && p.date <= todayS);
  if(state.ovClientFilter !== 'all') points = points.filter(p => p.clientId === state.ovClientFilter);
  if(state.ovKindFilter !== 'all') points = points.filter(p => p.kind === state.ovKindFilter);

  if(state.ovGranularity === 'semaine'){
    const buckets = {};
    points.forEach(p => {
      const d = new Date(p.date+'T00:00:00');
      const monday = startOfWeek(d);
      const wk = isoWeekKeyOf(monday);
      if(!buckets[wk]) buckets[wk] = {monday, load:0};
      buckets[wk].load += p.load;
    });
    return Object.values(buckets).sort((a,b) => a.monday-b.monday)
      .map(b => ({value:Math.round(b.load), valueLabel:String(Math.round(b.load)), xLabel:'S'+isoWeekNumber(b.monday)}));
  }

  const byDate = {};
  points.forEach(p => { byDate[p.date] = (byDate[p.date]||0) + p.load; });
  const out = [];
  for(let i=0;i<state.ovRangeDays;i++){
    const d = addDays(rangeStart, i);
    const ds = isoDateStr(d);
    const v = Math.round(byDate[ds]||0);
    out.push({value:v, valueLabel: v ? String(v) : '', xLabel: fmtDDMM(d)});
  }
  // au-delà d'une quinzaine de barres, on n'affiche qu'une étiquette de date sur N pour rester lisible
  if(out.length > 14){
    const every = Math.ceil(out.length/14);
    out.forEach((it,i) => { if(i % every !== 0) it.xLabel = ''; });
  }
  return out;
}

async function renderApercu(screen){
  const weekStart = startOfWeek(addDays(new Date(), state.bilanWeekOffset * 7));
  const weekKey = isoWeekKeyOf(weekStart);
  screen.innerHTML = `<div class="empty">Chargement du bilan…</div>`;
  await buildOverviewDashboard();
  await buildBilanData(weekStart, weekKey);
  drawApercu(screen);
}

async function buildBilanData(weekStart, weekKey){
  const days = [];
  for(let i=0;i<7;i++) days.push(addDays(weekStart, i));
  const dayKeys = days.map(isoDateStr);

  const rows = [];
  for(const c of state.clients){
    const program = await loadProgram(c.id);
    const weeksArr = program.weeks;
    const totalSessions = weeksArr.reduce((t,w) => t + w.sessions.length, 0);
    const activeWeeks = weeksArr.filter(w => w.sessions.length > 0).length || 1;
    const target = totalSessions / activeWeeks;

    const keys = await sList('session:'+c.id+':', true);
    const values = await Promise.all(keys.map(async k => {
      const raw = await sGet(k, true);
      if(!raw) return null;
      try{ return JSON.parse(raw); }catch(e){ return null; }
    }));
    const dayCounts = dayKeys.map(dk => values.filter(v => v && v.done && v.completedAt === dk).length);
    const totalWeek = dayCounts.reduce((a,b) => a+b, 0);
    const pct = target > 0 ? Math.min(100, Math.round((totalWeek/target)*100)) : (totalWeek>0 ? 100 : 0);
    const note = await loadNote(c.id, weekKey);
    rows.push({id:c.id, name:c.name, dayCounts, total: totalWeek, pct, note});
  }
  state.bilanData = {weekKey, weekStart, days, dayKeys, rows};
}

function sortedBilanRows(){
  const {key, dir} = state.bilanSort;
  const rows = state.bilanData.rows.slice();
  rows.sort((a,b) => {
    let av = a[key], bv = b[key];
    if(typeof av === 'string') return av.localeCompare(bv) * dir;
    return (av - bv) * dir;
  });
  return rows;
}

async function buildClientFicheHtml(clientId, periodDays){
  periodDays = periodDays || 7;
  const periodLabel = periodDays >= 30 ? 'mensuel (30 derniers jours)' : 'hebdomadaire (7 derniers jours)';
  const today = new Date(todayStr()+'T00:00:00');
  const withinPeriod = (dateStr) => {
    if(!dateStr) return false;
    const diff = Math.round((today - new Date(dateStr+'T00:00:00')) / 86400000);
    return diff >= 0 && diff < periodDays;
  };

  const name = clientName(clientId);
  const program = await loadProgram(clientId);
  const weeks = program.weeks;
  const prefix = 'session:'+clientId+':';
  const keys = await sList(prefix, true);
  const values = {};
  await Promise.all(keys.map(async k => {
    const raw = await sGet(k, true);
    if(raw){ try{ values[k] = JSON.parse(raw); }catch(e){} }
  }));
  let done = 0, total = 0, donePeriod = 0;
  const allRpes = [];
  weeks.forEach(w => {
    w.sessions.forEach(d => {
      total++;
      const v = values[sessionKey(clientId, w.n, d.id)];
      if(v && v.done){
        done++;
        if(withinPeriod(v.completedAt)) donePeriod++;
        if(v.rpe != null) allRpes.push({label:'Semaine '+w.n+' · '+d.label, rpe:v.rpe, date:v.completedAt});
      }
    });
  });
  allRpes.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const pct = total ? Math.round((done/total)*100) : 0;
  const rpesInPeriod = allRpes.filter(r => withinPeriod(r.date));

  const hPrefix = 'hooper:'+clientId+':';
  const hKeys = await sList(hPrefix, true);
  let latestDate = null;
  hKeys.forEach(k => { const d = k.slice(hPrefix.length); if(!latestDate || d > latestDate) latestDate = d; });
  let hooperLine = 'Aucun ressenti enregistré.';
  if(latestDate){
    const raw = await sGet(hPrefix+latestDate, true);
    if(raw){
      try{
        const latestData = JSON.parse(raw);
        const idx = hooperIndex(latestData);
        const flag = hooperFlag(idx);
        hooperLine = fmtDate(latestDate)+' — '+flag.label+' ('+idx+'/28)';
      }catch(e){}
    }
  }

  const buckets = await computeTrainingBuckets(clientId);
  const totalKm = buckets.reduce((t,b) => t+b.km, 0);
  const kmPeriod = buckets.filter(b => withinPeriod(isoDateStr(b.monday))).reduce((t,b) => t+b.km, 0);

  const loadPoints = await computeTrainingLoad(clientId);
  const acwr = acwrFromPoints(loadPoints);
  let acwrLine = 'Pas encore assez de séances avec RPE et durée renseignés pour calculer la charge.';
  if(acwr){
    acwrLine = acwr.ratio != null
      ? `Charge aiguë (7j) : <b>${acwr.acute} UA</b> · Charge chronique (moy./sem.) : <b>${acwr.chronic} UA</b> · Ratio ACWR : <b>${acwr.ratio}</b> — ${acwr.flag.label}`
      : `Charge aiguë (7j) : <b>${acwr.acute} UA</b>. Historique encore insuffisant pour le ratio.`;
  }

  const injuries = await loadInjuries(clientId);
  const activeInjuries = injuries.filter(i => i.statut !== 'Guérie');

  const tests = await loadTests(clientId);
  const latestTestsByType = TEST_TYPES.map(t => {
    const series = testSeriesFor(tests, t.id);
    return series.length ? {meta:t, last: series[series.length-1]} : null;
  }).filter(Boolean);

  const measurements = await loadMeasurements(clientId);
  const poidsSeries = measureSeriesFor(measurements, 'poids');
  let poidsLine = 'Aucune pesée enregistrée.';
  if(poidsSeries.length){
    const last = poidsSeries[poidsSeries.length-1];
    poidsLine = `${last.value} kg (${fmtDate(last.date)})`;
    const before = poidsSeries.filter(p => !withinPeriod(p.date));
    if(before.length){
      const ref = before[before.length-1];
      const diff = Math.round((last.value - ref.value)*10)/10;
      const sign = diff > 0 ? '+' : '';
      poidsLine += ` — ${sign}${diff} kg sur la période (depuis ${fmtDate(ref.date)})`;
    }
  }

  return `
    <div class="fiche-header">
      ${shieldSvg()}
      <div>
        <h1>Bilan ${periodLabel} de ${name}</h1>
        <p class="fiche-date">Généré le ${fmtDate(todayStr())}</p>
      </div>
    </div>
    <h2>Progression</h2>
    <p><b>${done} / ${total}</b> séances réalisées sur l'ensemble du programme (${pct}%) —
      dont <b>${donePeriod}</b> sur la période affichée.</p>
    <h2>Charge d'entraînement</h2>
    <p>${acwrLine}</p>
    <h2>Dernier ressenti (indice Hooper)</h2>
    <p>${hooperLine}</p>

/* =========================================================
   SUIVI ENTRAÎNEMENT (partagé coach / client)
   ========================================================= */
async function computeTrainingBuckets(clientId){
  const program = await loadProgram(clientId);
  const courseIds = new Set();
  program.weeks.forEach(w => w.sessions.forEach(s => { if(s.kind === 'course') courseIds.add(w.n+'|'+s.id); }));

  const keys = await sList('session:'+clientId+':', true);
  const buckets = {};
  await Promise.all(keys.map(async k => {
    const raw = await sGet(k, true);
    if(!raw) return;
    let v; try{ v = JSON.parse(raw); }catch(e){ return; }
    if(!v || !v.done || !v.completedAt) return;
    // clé de session : "session:<clientId>:S<n>:<id>"
    const parts = k.split(':');
    const wN = parts[2].replace('S','');
    const sId = parts[3];
    if(!courseIds.has(wN+'|'+sId)) return;
    const week = program.weeks.find(w => String(w.n) === wN);
    const session = week ? week.sessions.find(s => s.id === sId) : null;
    if(!session) return;
    const d = new Date(v.completedAt);
    const wk = isoWeekKeyOf(startOfWeek(d));
    if(!buckets[wk]) buckets[wk] = {weekKey:wk, km:0, monday: startOfWeek(d)};
    buckets[wk].km += (session.km || 0);
  }));

  return Object.values(buckets).sort((a,b) => a.monday - b.monday).slice(-10);
}

/*
  Charge d'entraînement (méthode "session-RPE" de Foster) : chaque séance validée avec un RPE et
  une durée renseignés vaut RPE × durée (en minutes), en unités arbitraires (UA). On calcule ensuite
  un ratio charge aiguë (7 derniers jours) / charge chronique (moyenne des 4 dernières semaines,
  soit 28 jours) — l'ACWR — qui est l'indicateur le plus utilisé pour repérer un pic de charge trop
  rapide par rapport à l'habitude du sportif (zone optimale généralement admise : 0,8 à 1,3 ;
  au-delà de 1,5, le risque de blessure augmente nettement).
*/
async function computeTrainingLoad(clientId){
  const program = await loadProgram(clientId);
  const defsByKey = {};
  program.weeks.forEach(w => w.sessions.forEach(s => { defsByKey[w.n+'|'+s.id] = s; }));

  const keys = await sList('session:'+clientId+':', true);
  const points = [];
  await Promise.all(keys.map(async k => {
    const raw = await sGet(k, true);
    if(!raw) return;
    let v; try{ v = JSON.parse(raw); }catch(e){ return; }
    if(!(v && v.done && v.completedAt && v.rpe != null)) return;
    const parts = k.split(':');
    const wN = parts[2].replace('S','');
    const sId = parts[3];
    const def = defsByKey[wN+'|'+sId];
    if(!def || !def.durationMin) return;
    points.push({date: v.completedAt, load: v.rpe * def.durationMin});
  }));
  points.sort((a,b) => a.date.localeCompare(b.date));
  return points;
}
function acwrFromPoints(points){
  if(!points.length) return null;
  const today = new Date(todayStr()+'T00:00:00');
  const sumSince = (days) => points.reduce((t,p) => {
    const diff = Math.round((today - new Date(p.date+'T00:00:00')) / 86400000);
    return (diff >= 0 && diff < days) ? t + p.load : t;
  }, 0);
  const acute = Math.round(sumSince(7));
  const chronic = Math.round(sumSince(28) / 4);
  if(!chronic) return {acute, chronic, ratio:null, flag:null};
  const ratio = acute / chronic;
  let flag;
  if(ratio > 1.5) flag = {cls:'eleve', label:'Risque de surcharge'};
  else if(ratio < 0.8) flag = {cls:'modere', label:'Sous-charge'};
  else flag = {cls:'faible', label:'Zone optimale'};
  return {acute, chronic, ratio: Math.round(ratio*100)/100, flag};
}
function weeklyLoadBuckets(points){
  const buckets = {};
  points.forEach(p => {
    const d = new Date(p.date+'T00:00:00');
    const monday = startOfWeek(d);
    const wk = isoWeekKeyOf(monday);
    if(!buckets[wk]) buckets[wk] = {weekKey:wk, load:0, monday};
    buckets[wk].load += p.load;
  });
  return Object.values(buckets).sort((a,b) => a.monday - b.monday).slice(-8);
}
function loadChartSvg(buckets){
  const items = buckets.map(b => ({
    value: Math.round(b.load), valueLabel: String(Math.round(b.load)),
    xLabel: 'S'+(b.monday ? isoWeekNumber(b.monday) : '?')
  }));
  return barChartSvg(items, {color:'#7C5CD9'});
}
function acwrBlockHtml(acwr, name){
  if(!acwr){
    return `<div class="empty">Pas encore assez de séances avec RPE + durée renseignés pour ${name||'ce profil'} pour calculer la charge.</div>`;
  }
  if(acwr.ratio == null){
    return `<div class="empty">Charge aiguë (7j) : <b>${acwr.acute} UA</b>. Pas encore assez d'historique (4 semaines) pour calculer le ratio.</div>`;
  }
  return `
    <div class="nutri-stat-grid">
      <div class="nutri-stat"><div class="ns-label">Charge aiguë (7j)</div><div class="ns-val">${acwr.acute}</div><div class="ns-sub">UA</div></div>
      <div class="nutri-stat"><div class="ns-label">Charge chronique (moy./sem.)</div><div class="ns-val">${acwr.chronic}</div><div class="ns-sub">UA</div></div>
      <div class="nutri-stat"><div class="ns-label">Ratio ACWR</div><div class="ns-val">${acwr.ratio}</div>
        <div class="ns-sub"><span class="flag ${acwr.flag.cls}">${acwr.flag.label}</span></div></div>
    </div>`;
}

/*
  Tests physiques : sprint, détente (CMJ/SJ), profil force-vitesse. Chaque résultat est daté et
  rattaché à un type de test prédéfini, ce qui permet de tracer une courbe de progression test par
  test dans le temps (les unités et le sens d'amélioration — plus bas = mieux pour un sprint,
  plus haut = mieux pour une détente — dépendent du type).
*/
function testsKey(clientId){ return "tests:"+clientId; }
async function loadTests(clientId){
  const raw = await sGet(testsKey(clientId), true);
  if(!raw) return [];
  try{ const l = JSON.parse(raw); return Array.isArray(l) ? l : []; }catch(e){ return []; }
}
async function saveTests(clientId, list){
  return await sSet(testsKey(clientId), JSON.stringify(list), true);
}
const TEST_TYPES = [
  {id:'sprint10', label:'Sprint 10 m', unit:'s', lowerBetter:true},
  {id:'sprint20', label:'Sprint 20 m', unit:'s', lowerBetter:true},
  {id:'sprint30', label:'Sprint 30 m', unit:'s', lowerBetter:true},
  {id:'cmj', label:'Détente CMJ', unit:'cm', lowerBetter:false},
  {id:'sj', label:'Détente SJ', unit:'cm', lowerBetter:false},
  {id:'fv_f0', label:'Profil force-vitesse — F0', unit:'N/kg', lowerBetter:false},
  {id:'fv_v0', label:'Profil force-vitesse — V0', unit:'m/s', lowerBetter:false},
  {id:'fv_pmax', label:'Profil force-vitesse — Pmax', unit:'W/kg', lowerBetter:false}
];
function testTypeMeta(id){ return TEST_TYPES.find(t => t.id === id) || TEST_TYPES[0]; }
function testSeriesFor(tests, typeId){
  return tests.filter(t => t.type === typeId).slice().sort((a,b) => a.date.localeCompare(b.date));
}
function testChartSvg(series){
  const items = series.map(t => ({value: t.value, valueLabel: String(t.value), xLabel: fmtDDMM(new Date(t.date))}));
  return barChartSvg(items, {color:'#2CA58D'});
}
function testDeltaLabel(series, meta){
  if(series.length < 2) return '';
  const last = series[series.length-1].value;
  const prev = series[series.length-2].value;
  const diff = Math.round((last - prev) * 100) / 100;
  if(diff === 0) return `<span class="flag" style="background:#EEF1F4;color:var(--ink-soft);">Stable</span>`;
  const improved = meta.lowerBetter ? diff < 0 : diff > 0;
  const cls = improved ? 'faible' : 'eleve';
  const sign = diff > 0 ? '+' : '';
  return `<span class="flag ${cls}">${sign}${diff} ${meta.unit} vs précédent</span>`;
}
function testsSectionHtml(name, editable){
  return `
    <div class="section-label" style="margin-top:28px;">Tests physiques${name ? ' — '+name : ''}</div>
    <p class="bilan-desc">Sprint, détente, profil force-vitesse : suis la progression dans le temps, test par test.</p>
    <div class="bf-row">
      <label>Type de test</label>
      <select id="test-type-select">
        ${TEST_TYPES.map(t => `<option value="${t.id}">${t.label}</option>`).join('')}
      </select>
    </div>
    ${editable ? `<button class="btn-line" id="add-test-btn" style="margin:10px 0 14px;">+ Ajouter un résultat</button>
    <div id="test-form-slot"></div>` : ''}
    <div id="test-chart-slot"></div>
    <div id="test-list-slot"></div>
  `;
}
/*
  Câble la section "Tests physiques" une fois son HTML inséré dans le screen. redraw() doit
  redessiner l'écran parent complet (drawEntrainement/drawMyTraining) pour que les slots existent
  à nouveau après une modification.
*/
function bindTestsSection(clientId, tests, selectedType, editable, redraw){
  const typeSelect = document.getElementById('test-type-select');
  if(!typeSelect) return;
  typeSelect.value = selectedType;
  const renderForSelectedType = () => {
    const meta = testTypeMeta(typeSelect.value);
    const series = testSeriesFor(tests, typeSelect.value);
    const chartSlot = document.getElementById('test-chart-slot');
    chartSlot.innerHTML = series.length ? testChartSvg(series) : `<div class="empty">Aucun résultat pour ce test pour l'instant.</div>`;
    const listSlot = document.getElementById('test-list-slot');
    const sorted = series.slice().reverse();
    listSlot.innerHTML = sorted.length ? `
      ${testDeltaLabel(series, meta) ? `<div style="margin-bottom:10px;">${testDeltaLabel(series, meta)}</div>` : ''}
      ${sorted.map(t => `
        <div class="history-item">
          <div>
            <div class="hi-date">${fmtDate(t.date)}</div>
            <div class="hi-sub">${t.value} ${meta.unit}${t.notes ? ' · '+t.notes : ''}</div>
          </div>
          ${editable ? `<div class="done-links" style="justify-content:flex-end;">
            <button data-edit-test="${t.id}">Modifier</button>
            <button class="danger" data-del-test="${t.id}">Supprimer</button>
          </div>` : ''}
        </div>
      `).join('')}
    ` : '';
    if(editable){
      listSlot.querySelectorAll('[data-edit-test]').forEach(b => {
        b.addEventListener('click', () => {
          const id = b.getAttribute('data-edit-test');
          const t = tests.find(x => x.id === id);
          state.coachTestForm = Object.assign({}, t);
          redraw();
        });
      });
      listSlot.querySelectorAll('[data-del-test]').forEach(b => {
        b.addEventListener('click', async () => {
          const id = b.getAttribute('data-del-test');
          if(!confirm('Supprimer ce résultat ?')) return;
          const newList = tests.filter(x => x.id !== id);
          const ok = await saveTests(clientId, newList);
          if(!ok){ showSaveError(); return; }
          tests.length = 0; tests.push(...newList);
          redraw();
        });
      });
    }
  };
  typeSelect.addEventListener('change', renderForSelectedType);
  renderForSelectedType();

  if(editable){
    const addBtn = document.getElementById('add-test-btn');
    addBtn.textContent = state.coachTestForm ? 'Fermer' : '+ Ajouter un résultat';
    addBtn.addEventListener('click', () => {
      state.coachTestForm = state.coachTestForm ? null : {
        id:null, type: typeSelect.value, date: todayStr(), value:'', notes:''
      };
      redraw();
    });
    renderTestFormSlot(clientId, tests, redraw);
  }
}

    if(!ok){ showSaveError(); return; }
    tests.length = 0; tests.push(...newList);
    state.coachTestForm = null;
    redraw();
  });

function measurementsKey(clientId){ return "measurements:"+clientId; }
async function loadMeasurements(clientId){

  try{ const l = JSON.parse(raw); return Array.isArray(l) ? l : []; }catch(e){ return []; }

async function saveMeasurements(clientId, list){

const MEASURE_FIELDS = [

function measureFieldMeta(id){ return MEASURE_FIELDS.find(f => f.id === id) || MEASURE_FIELDS[0]; }

    const hasAnyValue = MEASURE_FIELDS.some(fld => data[fld.id] !== '');
    if(!hasAnyValue){ alert('Merci de renseigner au moins une valeur (poids, mensuration...).'); return; }

    const newList = f.id ? current.map(m => m.id === f.id ? data : m) : current.concat([data]);
    const ok = await saveMeasurements(state.measureData.clientId, newList);
    if(!ok){ showSaveError(); return; }
    state.measureData.list = newList;
    state.measureForm = null;
    drawPoidsHistory(screen);
  });
}

function trainingChartSvg(buckets){
  const items = buckets.map(b => ({
    value: b.km,
    valueLabel: String(b.km),
    xLabel: 'S'+(b.monday ? isoWeekNumber(b.monday) : '?')
  }));
  return barChartSvg(items, {color:'#3DA9FC'});
}

/*
  Petit graphique en barres générique, réutilisé pour les km de course, le RPE et l'indice Hooper.
  items: [{value, valueLabel, xLabel}]. options.max fixe l'échelle (sinon calculée sur les données).
*/
function barChartSvg(items, options){
  options = options || {};
  const W = 640, H = 220, padL = 30, padB = 34, padT = 16, padR = 12;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const max = options.max || Math.max(1, ...items.map(it => it.value));
  const barW = chartW / items.length * 0.6;
  const gap = chartW / items.length;
  const color = options.color || '#3DA9FC';

  const bars = items.map((it,i) => {
    const h = Math.max(1, (it.value / max) * chartH);
    const x = padL + i*gap + (gap-barW)/2;
    const y = padT + (chartH - h);
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${color}"/>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#122036">${it.valueLabel}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${H-padB+16}" text-anchor="middle" font-size="10" fill="#54627A">${it.xLabel}</text>
    `;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" class="training-chart">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#DDE3E9"/>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#DDE3E9"/>
    ${bars}
  </svg>`;
}

/*
  Graphique en ligne (courbe + points colorés), utilisé pour la tendance Hooper individuelle : plus
  parlant qu'un graphique en barres pour suivre une évolution jour par jour, et chaque point peut
  porter sa propre couleur (ex. sévérité du jour) via item.color.
*/
function lineChartSvg(items, options){
  options = options || {};
  const W = 640, H = 220, padL = 30, padB = 34, padT = 16, padR = 12;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const max = options.max || Math.max(1, ...items.map(it => it.value));
  const color = options.color || '#3DA9FC';
  if(!items.length) return `<svg viewBox="0 0 ${W} ${H}" class="training-chart"></svg>`;

  const stepX = items.length > 1 ? chartW / (items.length-1) : 0;
  const pts = items.map((it,i) => ({
    x: padL + (items.length > 1 ? i*stepX : chartW/2),
    y: padT + (chartH - Math.min(1, it.value/max)*chartH),
    it
  }));
  const linePath = pts.map((p,i) => (i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const areaPath = linePath+` L${pts[pts.length-1].x.toFixed(1)} ${(H-padB).toFixed(1)} L${pts[0].x.toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${p.it.color||color}" stroke="#fff" stroke-width="1.3"/>`).join('');
  const labels = pts.map(p => p.it.xLabel
    ? `<text x="${p.x.toFixed(1)}" y="${H-padB+16}" text-anchor="middle" font-size="10" fill="#54627A">${p.it.xLabel}</text>` : '').join('');

  return `<svg viewBox="0 0 ${W} ${H}" class="training-chart">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#DDE3E9"/>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#DDE3E9"/>
    <path d="${areaPath}" fill="${color}" fill-opacity="0.12" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}
function hooperFlagColor(cls){
  return cls==='eleve' ? '#B8443B' : (cls==='modere' ? '#C98A2C' : '#2E7D4F');

async function computeRpeHistory(clientId){
  const keys = await sList('session:'+clientId+':', true);
  const entries = [];
  await Promise.all(keys.map(async k => {
    const raw = await sGet(k, true);
    if(!raw) return;
    let v; try{ v = JSON.parse(raw); }catch(e){ return; }
    if(v && v.done && v.rpe != null && v.completedAt){
      entries.push({date: v.completedAt, rpe: v.rpe});
    }
  }));
  entries.sort((a,b) => a.date.localeCompare(b.date));
  return entries.slice(-15);
}
function rpeChartSvg(entries){
  const items = entries.map(e => ({value:e.rpe, valueLabel:String(e.rpe), xLabel:fmtDDMM(new Date(e.date))}));
  return barChartSvg(items, {color:'#C98A2C', max:10});
}

async function buildCoachOverview(clientId){
  const program = await loadProgram(clientId);
  const weeks = program.weeks.slice().sort((a,b) => a.n - b.n);
  const prefix = 'session:'+clientId+':';
  const keys = await sList(prefix, true);
  const values = {};
  await Promise.all(keys.map(async k => {
    const raw = await sGet(k, true);
    if(raw){ try{ values[k] = JSON.parse(raw); }catch(e){} }
  }));
  const perWeek = weeks.map(w => {
    let done = 0;
    const rpes = [];
    w.sessions.forEach(d => {
      const v = values[sessionKey(clientId, w.n, d.id)];
      if(v && v.done){ done++; if(v.rpe != null) rpes.push({label:'S'+w.n+' · '+d.label, rpe:v.rpe, date:v.completedAt}); }
    });
    return {n:w.n, done, total:w.sessions.length, meso:w.meso, deload:w.deload, rpes};
  });
  let overallDone = 0;
  const allRpes = [];
  perWeek.forEach(w => { overallDone += w.done; w.rpes.forEach(r => allRpes.push(r)); });
  allRpes.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const total = weeks.reduce((t,w) => t + w.sessions.length, 0);
  state.coachOverview = {clientId, perWeek, overallDone, total, recentRpe: allRpes.slice(0,8)};
}

async function refreshExpandedWeek(clientId){
  const weekN = state.coachExpandedWeek;
  if(weekN == null) return;
  const program = await loadProgram(clientId);
  const week = program.weeks.find(w => w.n === weekN);
  if(!week){ state.coachExpandedData = null; return; }
  const defs = week.sessions;
  const statuses = {};
  await Promise.all(defs.map(async d => { statuses[d.id] = await loadSession(clientId, weekN, d.id); }));
  state.coachExpandedData = {weekN, defs, weeks: program.weeks, statuses};

  state.seancesAddOpen = false;
  await refreshExpandedWeek(clientId);
  drawCoachOverview(screen);
}

/* =========================================================
   COACH — RESSENTI (HOOPER) HISTORY
   ========================================================= */
function hooperIndex(h){ return h.sommeil + h.fatigue + h.stress + h.courbatures; }
function hooperFlag(idx){
  if(idx <= 12) return {cls:'faible', label:'RAS'};
  if(idx <= 18) return {cls:'modere', label:'À surveiller'};
  return {cls:'eleve', label:'Repos conseillé'};
}
function zoneLabel(id){
  const all = FRONT_ZONES.concat(BACK_ZONES);
  const f = all.find(z => z.id===id);
  return f ? f.label : id;
}

/*
  Repère une zone de courbature qui revient sur au moins 2 des 3 derniers ressentis renseignés
  (entries doit être triée du plus récent au plus ancien).
*/
function recurringZone(entries){
  const recent = entries.slice(0, 3);
  const counts = {};
  recent.forEach(e => (e.data.zones||[]).forEach(z => { counts[z] = (counts[z]||0) + 1; }));
  const found = Object.keys(counts).find(z => counts[z] >= 2);
  return found || null;
}
async function lastValidatedSessionDate(clientId){
  const keys = await sList('session:'+clientId+':', true);
  let latest = null;
  await Promise.all(keys.map(async k => {
    const raw = await sGet(k, true);
    if(!raw) return;
    let v; try{ v = JSON.parse(raw); }catch(e){ return; }
    if(v && v.done && v.completedAt){
      if(!latest || v.completedAt > latest) latest = v.completedAt;
    }
  }));
  return latest;
}
function daysSinceDate(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  const today = new Date(todayStr()+'T00:00:00');
  return Math.round((today - d) / 86400000);
}

/*
  Badges de motivation : calculés à la volée à partir des séances validées, sans stockage
  dédié — un badge "débloqué" reste acquis tant que le total ou la meilleure série jamais atteints
  restent au niveau requis (pas de risque de le "reperdre" si la série en cours se casse).
*/
const BADGE_DEFS = [
  {count:5, icon:'🥉', label:'5 séances validées'},
  {count:10, icon:'🥈', label:'10 séances validées'},
  {count:25, icon:'🥇', label:'25 séances validées'},
  {count:50, icon:'🏆', label:'50 séances validées'},
  {count:100, icon:'💎', label:'100 séances validées'}
];
const STREAK_DEFS = [
  {days:3, icon:'🔥', label:'3 jours de suite'},
  {days:7, icon:'🔥', label:'7 jours de suite'},
  {days:14, icon:'🔥', label:'14 jours de suite'},
  {days:30, icon:'🔥', label:'30 jours de suite'}
];
async function computeSessionBadgeStats(clientId){
  const keys = await sList('session:'+clientId+':', true);
  let totalDone = 0;
  const daySet = new Set();
  await Promise.all(keys.map(async k => {
    const raw = await sGet(k, true);
    if(!raw) return;
    let v; try{ v = JSON.parse(raw); }catch(e){ return; }
    if(v && v.done){
      totalDone++;
      if(v.completedAt) daySet.add(v.completedAt);
    }
  }));
  const days = Array.from(daySet).sort();
  let bestStreak = 0, run = 0, prev = null;
  days.forEach(d => {
    if(prev){
      const diff = Math.round((new Date(d+'T00:00:00') - new Date(prev+'T00:00:00')) / 86400000);
      run = diff === 1 ? run + 1 : 1;
    } else {
      run = 1;
    }
    if(run > bestStreak) bestStreak = run;
    prev = d;
  });
  let currentStreak = 0;
  if(days.length){
    const lastDay = days[days.length-1];
    const gapToToday = daysSinceDate(lastDay);
    if(gapToToday != null && gapToToday <= 1){
      currentStreak = 1;
      for(let i = days.length-1; i > 0; i--){
        const diff = Math.round((new Date(days[i]+'T00:00:00') - new Date(days[i-1]+'T00:00:00')) / 86400000);
        if(diff === 1) currentStreak++; else break;
      }
    }
  }
  return {totalDone, currentStreak, bestStreak};
}
function earnedBadges(stats){
  const totalBadges = BADGE_DEFS.filter(b => stats.totalDone >= b.count);
  const streakBadges = STREAK_DEFS.filter(b => stats.bestStreak >= b.days);
  return {totalBadges, streakBadges};
}
function nextMilestoneLine(stats){
  const nextTotal = BADGE_DEFS.find(b => stats.totalDone < b.count);
  const nextStreak = STREAK_DEFS.find(b => stats.bestStreak < b.days);
  const parts = [];
  if(nextTotal) parts.push(`Encore <b>${nextTotal.count - stats.totalDone}</b> séance(s) pour débloquer ${nextTotal.icon} ${nextTotal.label}`);
  if(nextStreak) parts.push(`<b>${nextStreak.days - stats.currentStreak}</b> jour(s) de suite pour débloquer ${nextStreak.icon} ${nextStreak.label}`);
  return parts.join(' · ');
}
function badgesBlockHtml(stats){
  const {totalBadges, streakBadges} = earnedBadges(stats);
  const all = totalBadges.concat(streakBadges);
  return `
    <div class="badges-block">
      <div class="badges-row">
        ${all.length ? all.map(b => `<span class="badge-pill" title="${b.label}">${b.icon} ${b.label}</span>`).join('')
          : '<span class="badges-empty">Pas encore de badge — chaque séance validée te rapproche du premier 🎯</span>'}
      </div>
      <div class="badges-stats">🏅 <b>${stats.totalDone}</b> séance(s) validée(s) au total · 🔥 Série actuelle : <b>${stats.currentStreak}</b> j (record : ${stats.bestStreak} j)</div>
      <div class="badges-next">${nextMilestoneLine(stats)}</div>
    </div>`;
}
function badgesLineHtml(stats){
  const {totalBadges, streakBadges} = earnedBadges(stats);
  const lastBadge = streakBadges[streakBadges.length-1] || totalBadges[totalBadges.length-1];
  return `🏅 ${stats.totalDone} séance(s) validée(s)${lastBadge ? ' · Dernier badge : '+lastBadge.icon+' '+lastBadge.label : ''}${stats.currentStreak >= 2 ? ' · 🔥 Série de '+stats.currentStreak+' j' : ''}`;
}

async function buildHealthOverview(){
  const rows = await Promise.all(state.clients.map(async c => {
    const prefix = 'hooper:'+c.id+':';
    const keys = await sList(prefix, true);
    const entries = [];
    await Promise.all(keys.map(async k => {
      const raw = await sGet(k, true);
      if(raw){ try{ entries.push({date:k.slice(prefix.length), data:JSON.parse(raw)}); }catch(e){} }
    }));
    entries.sort((a,b) => b.date.localeCompare(a.date));
    const latest = entries[0] || null;
    const idx = latest ? hooperIndex(latest.data) : null;
    const recurZone = recurringZone(entries);
    const lastSession = await lastValidatedSessionDate(c.id);
    const inactiveDays = daysSinceDate(lastSession);
    const injuries = await loadInjuries(c.id);
    const activeInjury = injuries.find(i => i.statut !== 'Guérie') || null;
    const badgeStats = await computeSessionBadgeStats(c.id);
    return {
      id:c.id, name:c.name,
      date: latest ? latest.date : null, idx,
      flag: idx!=null ? hooperFlag(idx) : null,
      recurZone: recurZone ? zoneLabel(recurZone) : null,
      inactiveDays,
      activeInjury,
      badgeStats
    };
  }));
  state.healthOverview = rows;
}

async function buildHooperHistory(clientId){
  const prefix = 'hooper:'+clientId+':';
  const keys = await sList(prefix, true);
  const entries = [];
  await Promise.all(keys.map(async k => {
    const raw = await sGet(k, true);
    if(raw){
      try{
        const v = JSON.parse(raw);
        entries.push({date: k.slice(prefix.length), data: v});
      }catch(e){}
    }
  }));
  entries.sort((a,b) => b.date.localeCompare(a.date));
  state.coachHooperHistory = {clientId, entries};
}

/*
  Stats individuelles (7 derniers jours) pour l'en-tête "État de forme" côté coach : nombre de
  réponses, indice moyen, statut du dernier ressenti, taux de réponse. Calculées ici (et non dans
  buildHealthOverview, qui ne garde que le tout dernier ressenti) car elles ont besoin de tout
  l'historique récent du client.
*/
function individualHooperStats(entries){
  const today = new Date(todayStr()+'T00:00:00');
  const last7 = entries.filter(e => {
    const diff = Math.round((today - new Date(e.date+'T00:00:00')) / 86400000);
    return diff >= 0 && diff < 7;
  });
  const avg7 = last7.length ? Math.round(last7.reduce((t,e) => t+hooperIndex(e.data),0)/last7.length*10)/10 : null;
  const latest = entries.length ? entries.slice().sort((a,b) => b.date.localeCompare(a.date))[0] : null;
  const latestIdx = latest ? hooperIndex(latest.data) : null;
  return {
    responseCount7: last7.length,
    avg7,
    latestFlag: latestIdx != null ? hooperFlag(latestIdx) : null,
    latestIdx,
    responseRate7: Math.round((last7.length/7)*100)
  };
}
/* Jours des n derniers jours (aujourd'hui compris) pour lesquels ce client n'a rien renseigné. */
function missingRecentHooperDays(entries, n){
  const has = new Set(entries.map(e => e.date));
  const out = [];
  for(let i=0;i<n;i++){
    const ds = isoDateStr(addDays(new Date(todayStr()+'T00:00:00'), -i));
    if(!has.has(ds)) out.push(ds);
  }
  return out.sort((a,b) => b.localeCompare(a));
}

    if(i>-1) form.draft.zones.splice(i,1); else form.draft.zones.push(id);
    renderCoachBodyMapSlot(screen, clientId);
  }
  slot.querySelectorAll('[data-cbmchip]').forEach(c => c.addEventListener('click', () => toggleZone(c.getAttribute('data-cbmchip'))));
  slot.querySelectorAll('[data-zone]').forEach(z => z.addEventListener('click', () => toggleZone(z.getAttribute('data-zone'))));
}

async function persistBuilderProgram(clientId){
  const ok = await saveProgram(clientId, state.builderProgram.weeks);
  if(!ok){ showSaveError(); return false; }
  invalidateClientCaches(clientId);
  return true;
}

function drawBuilderWeeks(clientId, name){
  const wrap = document.getElementById('builder-weeks');
  if(!wrap) return;
  const weeks = state.builderProgram.weeks.slice().sort((a,b) => a.n - b.n);

  if(!weeks.length){
    wrap.innerHTML = `<div class="empty">Aucune semaine pour l'instant. Ajoute la première semaine ci-dessous.</div>`;
    return;
  }

  wrap.innerHTML = weeks.map(w => `
    <div class="builder-week-card">
      <div class="builder-week-head">
        <div class="builder-week-title">Semaine ${w.n}</div>
        <button class="btn-line danger-line" data-del-week="${w.n}">Supprimer</button>
      </div>
      <div class="builder-session-list">
        ${w.sessions.length ? w.sessions.map(s => `
          <div class="builder-session-row">
            <div>
              <div class="bsr-name">${kindIconOf(s.kind)} ${s.label}</div>
              <div class="bsr-sub">${s.day ? dayLabel(s.day)+' · ' : ''}${s.kind==='renfo' ? (s.exercises||[]).length+' exercice(s)' : (s.km||0)+' '+kindUnitOf(s.kind)}</div>
            </div>
            <div class="bsr-actions">
              <button class="btn-line" data-edit-session="${w.n}|${s.id}">Modifier</button>
              <button class="btn-line danger-line" data-del-session="${w.n}|${s.id}">Supprimer</button>
            </div>
          </div>
        `).join('') : '<div class="empty" style="padding:14px 0;">Pas encore de séance cette semaine-là.</div>'}
      </div>
      ${state.builderFormFor && state.builderFormFor.weekN === w.n
        ? builderFormHtml(w, state.builderFormFor.sessionId)
        : `<button class="btn-line" data-add-session="${w.n}" style="margin-top:10px;">+ Ajouter une séance</button>`}
    </div>
  `).join('');

  wrap.querySelectorAll('[data-del-week]').forEach(b => {
    b.addEventListener('click', async () => {
      if(!confirm('Supprimer cette semaine et toutes ses séances ?')) return;
      const n = parseInt(b.getAttribute('data-del-week'),10);
      state.builderProgram.weeks = state.builderProgram.weeks.filter(x => x.n !== n);
      await persistBuilderProgram(clientId);
      drawBuilderWeeks(clientId, name);
    });
  });
  wrap.querySelectorAll('[data-add-session]').forEach(b => {
    b.addEventListener('click', () => {
      state.builderFormFor = {weekN: parseInt(b.getAttribute('data-add-session'),10), sessionId:null};
      drawBuilderWeeks(clientId, name);
    });
  });
  wrap.querySelectorAll('[data-edit-session]').forEach(b => {
    b.addEventListener('click', () => {
      const parts = b.getAttribute('data-edit-session').split('|');
      state.builderFormFor = {weekN: parseInt(parts[0],10), sessionId: parts[1]};
      drawBuilderWeeks(clientId, name);
    });
  });
  wrap.querySelectorAll('[data-del-session]').forEach(b => {
    b.addEventListener('click', async () => {
      if(!confirm('Supprimer cette séance ?')) return;
      const parts = b.getAttribute('data-del-session').split('|');
      const week = state.builderProgram.weeks.find(w => w.n === parseInt(parts[0],10));
      week.sessions = week.sessions.filter(s => s.id !== parts[1]);
      await persistBuilderProgram(clientId);
      drawBuilderWeeks(clientId, name);
    });
  });
  const openForm = wrap.querySelector('.builder-form');
  if(openForm){
    bindBuilderForm(openForm, {
      weeks: state.builderProgram.weeks,
      clientId,
      onCancel: () => { state.builderFormFor = null; drawBuilderWeeks(clientId, name); },
      onSaved: () => { state.builderFormFor = null; drawBuilderWeeks(clientId, name); }
    });
  }
}

/*
  Réduit une photo prise depuis le téléphone/ordi à une taille raisonnable avant de l'enregistrer
  (sinon des photos en pleine résolution rempliraient très vite le stockage et ralentiraient l'appli).
*/
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read error'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('image error'));
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function bindExerciseRow(row){
  row.querySelector('.ee-remove').addEventListener('click', () => row.remove());
  const fileInput = row.querySelector('.ee-photo-input');
  const photoBtn = row.querySelector('.ee-photo-btn');
  const removeBtn = row.querySelector('.ee-photo-remove');
  const preview = row.querySelector('.ee-photo-preview');
  photoBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if(!file) return;
    const originalLabel = photoBtn.textContent;
    photoBtn.textContent = 'Compression…';
    try{
      const dataUrl = await compressImageFile(file, 900, 0.72);
      preview.setAttribute('src', dataUrl);
      preview.style.display = '';
      removeBtn.style.display = '';
      photoBtn.textContent = 'Changer la photo';
    }catch(e){
      alert("Impossible de charger cette image, réessaie avec une autre.");
      photoBtn.textContent = originalLabel;
    }
  });
  removeBtn.addEventListener('click', () => {
    preview.setAttribute('src', '');
    preview.style.display = 'none';
    removeBtn.style.display = 'none';
    photoBtn.textContent = '📷 Ajouter une photo';
  });
}

/*
  ctx = {weeks, clientId, onCancel(), onSaved()} — permet de réutiliser ce même formulaire
  aussi bien depuis "Mes clients → Créer/éditer les séances" que depuis un ajout rapide
  dans l'onglet "Séances".
*/
function bindBuilderForm(form, ctx){
  if(!form) return;
  const kindSel = form.querySelector('.bf-kind');
  kindSel.addEventListener('change', () => {
    const isRenfo = kindSel.value === 'renfo';
    form.querySelector('.bf-renfo').style.display = isRenfo ? '' : 'none';
    form.querySelector('.bf-course').style.display = isRenfo ? 'none' : '';
    const unit = kindUnitOf(kindSel.value);
    form.querySelector('.bf-km-label').textContent = unit === 'min' ? 'Durée (minutes)' : 'Distance ('+unit+')';
  });
  form.querySelectorAll('.ex-edit-row').forEach(bindExerciseRow);
  const eeAdd = form.querySelector('.ee-add');
  if(eeAdd){
    eeAdd.addEventListener('click', () => {
      const list = form.querySelector('.ee-list');
      const tmp = document.createElement('div');
      tmp.innerHTML = exRowHtml(null).trim();
      const row = tmp.firstChild;
      list.appendChild(row);
      bindExerciseRow(row);
    });
  }
  const librarySelect = form.querySelector('.ee-library-select');
  if(librarySelect){
    librarySelect.addEventListener('change', () => {
      const id = librarySelect.value;
      if(!id) return;
      const ex = (state.exerciseLibrary||[]).find(e => e.id === id);
      librarySelect.value = '';
      if(!ex) return;
      const list = form.querySelector('.ee-list');
      const tmp = document.createElement('div');
      tmp.innerHTML = exRowHtml({name: ex.name, dose:'', how: ex.how, photo: ex.photo}).trim();
      const row = tmp.firstChild;
      list.appendChild(row);
      bindExerciseRow(row);
    });
  }
  form.querySelector('.bf-cancel').addEventListener('click', ctx.onCancel);
  form.querySelector('.bf-save').addEventListener('click', async () => {
    const weekN = parseInt(form.getAttribute('data-week'),10);
    const sessionId = form.getAttribute('data-session') || null;
    const kind = kindSel.value;
    const label = form.querySelector('.bf-label').value.trim() || (kind==='renfo' ? 'Séance' : 'Sortie');
    const note = form.querySelector('.bf-note').value.trim();
    const day = form.querySelector('.bf-day').value || null;
    const durationMin = parseFloat(form.querySelector('.bf-duration').value) || null;
    const week = ctx.weeks.find(w => w.n === weekN);
    let sessionObj;
    if(kind !== 'renfo'){
      const km = parseFloat(form.querySelector('.bf-km').value) || 0;
      sessionObj = {id: sessionId || nextSessionId(week,kind), kind, label, note, day, km, durationMin};
    } else {
      const rawExercises = Array.from(form.querySelectorAll('.ex-edit-row')).map(row => {
        const nm = row.querySelector('.ee-name').value.trim();
        const dose = row.querySelector('.ee-dose').value.trim();
        const how = row.querySelector('.ee-how').value.trim();
        const preview = row.querySelector('.ee-photo-preview');
        const photo = (preview && preview.style.display !== 'none' && preview.getAttribute('src')) ? preview.getAttribute('src') : '';
        return {name: nm || '', dose, how, photo};
      }).filter(e => e.name || e.dose || e.how || e.photo);
      const exercises = rawExercises.map(e => ({name: e.name || 'Exercice', dose: e.dose, how: e.how, photo: e.photo}));
      sessionObj = {id: sessionId || nextSessionId(week,'renfo'), kind:'renfo', label, note, day, exercises, durationMin};

      const lib = state.exerciseLibrary || (state.exerciseLibrary = []);
      let libChanged = false;
      rawExercises.forEach(e => { if(e.name){ upsertExerciseLibrary(lib, e); libChanged = true; } });
      if(libChanged) await saveExerciseLibrary(lib);
    }
    if(sessionId){
      week.sessions = week.sessions.map(s => s.id === sessionId ? sessionObj : s);
    } else {
      week.sessions.push(sessionObj);
    }
    const ok = await saveProgram(ctx.clientId, ctx.weeks);
    if(!ok){ showSaveError(); return; }
    invalidateClientCaches(ctx.clientId);
    ctx.onSaved();
  });
}

      client.code = generateClientCode();

      if(!ok){ client.code = previousCode; showSaveError(); return; }

      const previous = client.allowSelfAdd;

      if(!ok){ client.allowSelfAdd = previous; cb.checked = previous; showSaveError(); return; }
    });
  });
}

/*
  Export / sauvegarde complète : récupère absolument toutes les données partagées (programmes,
  séances, ressentis, blessures, tests, mensurations, nutrition, bibliothèque d'exercices,
  identifiants...) en listant toutes les clés du stockage partagé (préfixe vide = tout), et les
  regroupe dans un seul fichier JSON téléchargeable. Sert de sauvegarde de secours (ex. avant une
  manipulation risquée) et de moyen de migrer les données si besoin.
*/
async function exportAllData(){
  const keys = await sList('', true);
  const data = {};
  await Promise.all(keys.map(async k => {
    const raw = await sGet(k, true);
    if(raw != null) data[k] = raw;
  }));
  return {
    app: 'BluePerf.suivi',
    exportedAt: new Date().toISOString(),
    keyCount: Object.keys(data).length,
    data
  };
}
function downloadJson(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
/*
  Restauration : ré-écrit chaque clé du fichier de sauvegarde dans le stockage partagé. Écrase donc
  toute donnée existante portant la même clé — d'où la confirmation appuyée avant de lancer l'import.
*/
async function importAllData(backup){
  if(!backup || typeof backup.data !== 'object') throw new Error('Format de fichier invalide.');
  const entries = Object.entries(backup.data);
  let ok = 0, fail = 0;
  for(const [key, value] of entries){
    const result = await sSet(key, value, true);
    if(result) ok++; else fail++;
  }
  return {ok, fail, total: entries.length};
}
function renderBackupSection(screen){
  const slot = document.getElementById('backup-section');
  if(!slot) return;
  slot.innerHTML = `
    <div class="section-label" style="margin-top:28px;">Export / sauvegarde complète</div>
    <p class="bilan-desc">Télécharge en un clic toutes les données de l'application (programmes, séances,
      ressentis, blessures, tests physiques, mensurations, nutrition, bibliothèque d'exercices, identifiants)
      dans un seul fichier. À garder précieusement de côté — utile en cas de souci, ou pour restaurer les
      données ailleurs.</p>
    <div class="bf-actions" style="justify-content:flex-start;gap:10px;">
      <button class="btn-primary-sm" id="export-all-btn">⬇ Télécharger la sauvegarde complète</button>
      <button class="btn-line" id="import-all-btn">⬆ Restaurer depuis un fichier</button>
      <input type="file" id="import-all-input" accept="application/json" style="display:none;">
    </div>
    <div id="backup-status" class="save-confirm" style="display:none;margin-top:10px;"></div>
  `;
  const statusEl = document.getElementById('backup-status');
  const showStatus = (msg) => { statusEl.style.display = 'block'; statusEl.textContent = msg; };

  document.getElementById('export-all-btn').addEventListener('click', async () => {
    const btn = document.getElementById('export-all-btn');
    const original = btn.textContent;
    btn.textContent = 'Préparation…';
    btn.disabled = true;
    try{
      const backup = await exportAllData();
      const stamp = todayStr();
      downloadJson(backup, 'blueperf-sauvegarde-'+stamp+'.json');
      showStatus('Sauvegarde téléchargée ✓ ('+backup.keyCount+' éléments)');
    }catch(e){
      showStatus("Erreur pendant l'export. Réessaie.");
    }
    btn.textContent = original;
    btn.disabled = false;
  });

  const fileInput = document.getElementById('import-all-input');
  document.getElementById('import-all-btn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if(!file) return;
    if(!confirm("Restaurer ce fichier va écraser les données existantes portant les mêmes identifiants (clients, séances, etc.). Continuer ?")) return;
    try{
      const text = await file.text();
      const backup = JSON.parse(text);
      const btn = document.getElementById('import-all-btn');
      const original = btn.textContent;
      btn.textContent = 'Restauration…';
      btn.disabled = true;
      const result = await importAllData(backup);
      btn.textContent = original;
      btn.disabled = false;
      showStatus('Restauration terminée : '+result.ok+'/'+result.total+' éléments restaurés'+(result.fail ? ' ('+result.fail+' échec(s))' : '')+'. Recharge la page pour voir les données à jour.');
      // Invalide les caches en mémoire pour refléter les nouvelles données dès que possible.
      state.clients = null;
      state.exerciseLibrary = null;
      state.healthOverview = null;
      state.bilanData = null;
    }catch(e){
      showStatus("Fichier invalide ou illisible : impossible de restaurer.");
    }
  });
}

function nutriBMR(sex, weightKg, heightCm, age){
  const heightM = heightCm / 100;
  const coeff = sex === 'Homme' ? 1.083 : 0.963;
  const mj = coeff * Math.pow(weightKg, 0.48) * Math.pow(heightM, 0.5) * Math.pow(Math.max(age,1), -0.13);
  return mj * 1000 / 4.1855;
}

function nutriCompute(anam, dayType){
  const weight = anam.weight;
  const bmr = nutriBMR(anam.sex, weight, anam.height, anam.age);
  const tdee = bmr * (NUTRI_ACTIVITY_MULT[dayType] || 1.55);
  const proteinG = Math.round(weight * NUTRI_PROTEIN_PER_KG);
  const carbG = Math.round((weight * (NUTRI_CARB_PER_KG[dayType] || 6)) / 5) * 5;
  const proteinKcal = proteinG * 4, carbKcal = carbG * 4;
  let lipG = Math.round((tdee - proteinKcal - carbKcal) / 9);
  const lipFloor = Math.round(weight);
  if(lipG < lipFloor) lipG = lipFloor;
  const kcalTotal = Math.round((proteinKcal + carbKcal + lipG*9) / 10) * 10;
  const waterL = Math.round((weight * 0.035 + (NUTRI_WATER_BONUS[dayType] || 0)) * 10) / 10;

  const ratio = weight / 60;
  const foods = NUTRI_FOOD_BASE[dayType].map(f => {
    if(f.grams == null) return Object.assign({}, f);
    let g = Math.round((f.grams * ratio) / 5) * 5;
    if(g < 5) g = 5;
    return Object.assign({}, f, {grams:g});
  });
  const proteinFoodGrams = Math.round((proteinG / 0.22) / 5) * 5; // ≈22g protéine / 100g viande maigre cuite — repère indicatif
  foods.splice(3, 0, {id:'proteines', icon:'🍗', name:'Protéines (viande, poisson, œufs, légumineuses)', grams:proteinFoodGrams, unit:'g cuit', note:"réparti sur les repas principaux"});

  return {kcal:kcalTotal, prot:proteinG, carb:carbG, lip:lipG, water:waterL, foods, bmr:Math.round(bmr), tdee:Math.round(tdee)};
}

function nutriFoodLabel(f){ return f.grams == null ? f.unit : (f.grams + " " + f.unit); }

function nutriConic(segs){
  let acc = 0; const parts = [];
  segs.forEach(s => { const start=acc, end=acc+s.pct; parts.push(s.color+" "+start+"% "+end+"%"); acc=end; });
  return "conic-gradient("+parts.join(",")+")";
}

  const a = Object.assign({
    age:'', sex:'Femme', height:'', weight:'', objectifs:[],
    seancesSemaine:'', dureeSeance:'', rpeMoyen:6, repasParJour:3, collations:'1 collation',
    aimes:'', evites:'', allergies:'', regime:'Omnivore', sommeil:'', eauLitres:''
  }, anam || {});
  // rétrocompatibilité : les anamnèses enregistrées avant l'ajout du multi-objectifs
  // n'avaient qu'un seul champ texte "objectif"
  if((!a.objectifs || !a.objectifs.length) && anam && anam.objectif){ a.objectifs = [anam.objectif]; }
  if(!Array.isArray(a.objectifs)) a.objectifs = [];

  const readOnly = !isCoachView;

  screen.innerHTML = `
    <div class="nutri-intro">💬 <span><b>Cadre du module —</b> pensé pour des profils sportifs en bonne santé. Aucun profil avec pathologie n'est pris en charge ici : dans ce cas, orienter vers un·e diététicien·ne-nutritionniste ou un médecin du sport.</span></div>

    <div class="nutri-card">
      <h3>Identité &amp; objectif</h3>
      <div class="bf-row"><label>Âge</label><input type="number" id="na-age" value="${a.age}" ${readOnly?'disabled':''}></div>
      <div class="bf-row"><label>Sexe</label>
        <select id="na-sex" ${readOnly?'disabled':''}><option ${a.sex==='Femme'?'selected':''}>Femme</option><option ${a.sex==='Homme'?'selected':''}>Homme</option></select>
      </div>
      <div class="bf-row"><label>Taille (cm)</label><input type="number" id="na-height" value="${a.height}" ${readOnly?'disabled':''}></div>
      <div class="bf-row"><label>Poids actuel (kg)</label><input type="number" step="0.1" id="na-weight" value="${a.weight}" ${readOnly?'disabled':''}></div>
      <div class="bf-row bf-row-col"><label>Objectifs (plusieurs choix possibles)</label>
        <div class="na-check-group" id="na-objectifs">
          ${['Performance / progression sportive','Recomposition corporelle','Prise de masse','Perte de poids','Meilleure récupération'].map((o,i) => `
            <label class="na-check"><input type="checkbox" data-objectif="${o}" ${a.objectifs.includes(o)?'checked':''} ${readOnly?'disabled':''}> ${o}</label>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="nutri-card">
      <h3>Pratique sportive &amp; charge d'entraînement</h3>
      <div class="bf-row"><label>Séances / semaine</label><input type="number" id="na-seances" value="${a.seancesSemaine}" ${readOnly?'disabled':''}></div>
      <div class="bf-row"><label>Durée moyenne / séance</label><input type="text" id="na-duree" value="${a.dureeSeance}" ${readOnly?'disabled':''}></div>
      <div class="bf-row"><label>Intensité perçue habituelle (RPE moyen /10)</label>
        <div class="rpe-row"><input type="range" min="1" max="10" id="na-rpe" value="${a.rpeMoyen}" ${readOnly?'disabled':''}><span class="rpe-val" id="na-rpe-val">${a.rpeMoyen}</span></div>
      </div>
    </div>

    <div class="nutri-card">
      <h3>Habitudes alimentaires</h3>
      <div class="bf-row"><label>Repas / jour</label><input type="number" id="na-repas" value="${a.repasParJour}" ${readOnly?'disabled':''}></div>
      <div class="bf-row"><label>Collations</label>
        <select id="na-collations" ${readOnly?'disabled':''}>
          ${['Aucune','1 collation','2 collations'].map(o => `<option ${a.collations===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>
      <div class="bf-row"><label>Aliments appréciés</label><textarea id="na-aimes" rows="2" ${readOnly?'disabled':''}>${a.aimes}</textarea></div>
      <div class="bf-row"><label>Aliments non désirés (choix personnel, hors allergie)</label><textarea id="na-evites" rows="2" ${readOnly?'disabled':''}>${a.evites}</textarea></div>
      <div class="bf-row"><label>Allergies / intolérances alimentaires</label><textarea id="na-allergies" rows="2" placeholder="Ex : arachides, fruits de mer, gluten…" ${readOnly?'disabled':''}>${a.allergies}</textarea></div>
      <div class="bf-row"><label>Régime / préférence alimentaire</label>
        <select id="na-regime" ${readOnly?'disabled':''}>
          ${['Omnivore','Végétarien','Végan','Sans porc','Sans lactose (choix)'].map(o => `<option ${a.regime===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="nutri-card">
      <h3>Hydratation &amp; sommeil</h3>
      <div class="bf-row"><label>Heures de sommeil / nuit</label><input type="text" id="na-sommeil" value="${a.sommeil}" ${readOnly?'disabled':''}></div>
      <div class="bf-row"><label>Eau consommée (litres / jour)</label><input type="number" step="0.1" min="0" id="na-eau" value="${a.eauLitres}" placeholder="Ex : 1,5" ${readOnly?'disabled':''}></div>
    </div>

    ${isCoachView ? `
      <div class="save-bar">
        <button class="save-btn" id="na-save">Enregistrer et générer le programme</button>
        ${state.nutriAnamSaved ? '<div class="save-confirm">Anamnèse enregistrée ✓</div>' : ''}
      </div>
    ` : `<div class="nutri-tip">Cette anamnèse est renseignée par ton coach. Retrouve ton programme dans l'onglet "Mon programme".</div>`}
  `;

  if(isCoachView){
    const rpeInput = document.getElementById('na-rpe');
    rpeInput.addEventListener('input', () => { document.getElementById('na-rpe-val').textContent = rpeInput.value; });

    document.getElementById('na-save').addEventListener('click', async () => {
      const objectifsChecked = Array.from(document.querySelectorAll('#na-objectifs input[type="checkbox"]:checked')).map(cb => cb.getAttribute('data-objectif'));
      const data = {
        age: parseInt(document.getElementById('na-age').value,10) || 0,
        sex: document.getElementById('na-sex').value,
        height: parseFloat(document.getElementById('na-height').value) || 0,
        weight: parseFloat(document.getElementById('na-weight').value) || 0,
        objectifs: objectifsChecked,
        seancesSemaine: document.getElementById('na-seances').value,
        dureeSeance: document.getElementById('na-duree').value,
        rpeMoyen: parseInt(rpeInput.value,10),
        repasParJour: document.getElementById('na-repas').value,
        collations: document.getElementById('na-collations').value,
        aimes: document.getElementById('na-aimes').value,
        evites: document.getElementById('na-evites').value,
        allergies: document.getElementById('na-allergies').value,
        regime: document.getElementById('na-regime').value,
        sommeil: document.getElementById('na-sommeil').value,
        eauLitres: document.getElementById('na-eau').value,
        updatedAt: new Date().toISOString()
      };
      if(!data.age || !data.height || !data.weight){
        showSaveError();
        return;
      }
      const ok = await saveNutriAnam(clientId, data);
      if(!ok){ showSaveError(); return; }
      state.nutriAnamDraft = data;
      state.nutriAnamSaved = true;
      state.tab = 'nutri-programme';
      render();
    });
  }
}

async function renderNutriProgramme(screen){
  const isCoachView = state.viewAs === 'coach';
  const clientId = effectiveClientId();
  const anam = await getEffectiveNutriAnam(clientId);

  if(!anam || !anam.age || !anam.height || !anam.weight){
    screen.innerHTML = `
      <div class="nutri-empty">
        ${isCoachView
          ? `Complète d'abord l'anamnèse (âge, taille, poids) pour générer le programme nutritionnel de ${clientName(clientId)}.
             <br><button class="btn-primary-sm" id="na-goto">Aller à l'anamnèse</button>`
          : `Ton coach n'a pas encore complété ton profil nutrition. Reviens un peu plus tard !`}
      </div>`;
    const goto = document.getElementById('na-goto');
    if(goto) goto.addEventListener('click', () => { state.tab = 'nutri-anamnese'; render(); });
    return;
  }

  const dayType = await getNutriDaytype(clientId);

  screen.innerHTML = `
    ${nutriDaytypeSelectorHtml(dayType)}
    <div class="daytype-note">Sélectionne le type de journée pour ajuster les quantités (surtout les glucides).</div>
    <div id="nutri-programme-body">${nutriProgrammeBodyHtml(anam, dayType)}</div>
    ${isCoachView ? `<div class="nutri-tip">Les formules utilisées (métabolisme de base, macros, hydratation) sont détaillées dans l'onglet <b>Ressources</b>.</div>` : ''}
  `;

  bindNutriDaytypeSelector(screen, clientId, (newDayType) => {
    document.getElementById('nutri-programme-body').innerHTML = nutriProgrammeBodyHtml(anam, newDayType);
    screen.querySelectorAll('.daytype-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-daytype') === newDayType));
  });
}

async function renderNutriJournal(screen){
  const clientId = effectiveClientId();
  const anam = await getEffectiveNutriAnam(clientId);
  if(!state.nutriJournalDate) state.nutriJournalDate = todayStr();
  const date = state.nutriJournalDate;
  const loadKey = clientId+":"+date;

  if(!anam || !anam.age || !anam.height || !anam.weight){
    screen.innerHTML = `<div class="nutri-empty">Le profil nutrition n'est pas encore complété pour ${clientName(clientId)} — rien à suivre pour le moment.</div>`;
    return;
  }

  if(state.nutriJournalLoadedKey !== loadKey){
    state.nutriJournalEntries = await loadNutriJournal(clientId, date);
    state.nutriJournalLoadedKey = loadKey;
  }

  const dayType = await getNutriDaytype(clientId);
  const r = nutriCompute(anam, dayType);

  function consumedFor(groupId){
    return state.nutriJournalEntries.filter(e => e.groupId === groupId).reduce((s,e) => s+e.grams, 0);
  }
  function friendlyTip(group, consumed){
    const overPct = Math.round((consumed/group.grams)*100) - 100;
    if(overPct < 15) return null;
    return `Objectif pour la prochaine fois : viser plutôt autour de ${group.grams} ${group.unit} pour « ${group.name.toLowerCase()} ». Pas grave pour aujourd'hui, c'est juste un repère à garder en tête.`;
  }

  function groupsHtml(){
    return r.foods.filter(f => f.grams != null).map(group => {
      const consumed = consumedFor(group.id);
      const pct = Math.min(100, Math.round((consumed/group.grams)*100));
      let fillClass = '';
      if(consumed > group.grams*1.15) fillClass = 'over'; else if(consumed > group.grams) fillClass = 'watch';
      const remaining = group.grams - consumed;
      let statusHtml;
      if(remaining > 0) statusHtml = `Il reste environ <b>${remaining} g</b> pour aujourd'hui.`;
      else if(remaining === 0) statusHtml = `<b>Objectif du jour atteint</b> — le reste de la journée est libre sur ce groupe.`;
      else statusHtml = `<b>Repère du jour dépassé</b> — pas grave, on ajuste la prochaine fois.`;
      const tip = friendlyTip(group, consumed);
      return `
        <div class="nutri-journal-group" data-group-card="${group.id}">
          <div class="njg-head"><span class="njg-ic">${group.icon}</span><span class="njg-name">${group.name}</span><span class="njg-target">Repère : ${group.grams} ${group.unit}</span></div>
          <div class="njg-track"><div class="njg-fill ${fillClass}" style="width:${pct}%"></div></div>
          <div class="njg-status">${statusHtml} <span style="color:var(--ink-soft)">(${consumed} g notés)</span></div>
          ${tip ? `<div class="njg-tip">🌱 ${tip}</div>` : ''}
          <div class="njg-add">
            <button class="njg-quick" data-add="${group.id}" data-grams="50">+ 50 g</button>
            <button class="njg-quick" data-add="${group.id}" data-grams="100">+ 100 g</button>
            <button class="njg-quick" data-add="${group.id}" data-grams="200">+ 200 g</button>
            <span class="njg-custom">
              <input type="number" min="1" placeholder="qté" id="njg-custom-${group.id}">
              <button data-addcustom="${group.id}">Ajouter</button>
            </span>
          </div>
        </div>`;
    }).join('');
  }

  function logHtml(){
    if(state.nutriJournalEntries.length === 0) return '<div class="nutri-log-empty">Rien de noté pour l\'instant aujourd\'hui.</div>';
    return state.nutriJournalEntries.slice().reverse().map(e => {
      const group = r.foods.find(f => f.id === e.groupId) || {icon:'🍽️', name:e.groupId};
      if(state.nutriEditingEntryId === e.id){
        return `<div class="nutri-log-row"><span>${group.icon}</span><span class="nl-name">${group.name}</span>
          <input type="number" min="1" class="nl-edit-input" data-edit-input="${e.id}" value="${e.grams}" style="width:60px;">
          <span class="nl-time">${e.time}</span>
          <button class="nl-del" data-edit-save="${e.id}" title="Valider">✓</button>
          <button class="nl-del" data-edit-cancel="${e.id}" title="Annuler">×</button></div>`;
      }
      return `<div class="nutri-log-row"><span>${group.icon}</span><span class="nl-name">${group.name}</span><span class="nl-grams">${e.grams} g</span><span class="nl-time">${e.time}</span><button class="nl-del" data-edit-start="${e.id}" title="Modifier">✎</button><button class="nl-del" data-del="${e.id}" title="Supprimer">×</button></div>`;
    }).join('');
  }

  screen.innerHTML = `
    <div class="nutri-intro">💬 <span>Note ce que tu manges au fil de la journée — l'app t'indique simplement ce qu'il te reste par groupe d'aliment. Aucun message n'est là pour dire que c'était raté : juste un repère pour la prochaine fois.</span></div>
    <div class="bf-row" style="margin-top:14px;"><label>Journée</label><input type="date" id="nj-date" value="${date}" max="${todayStr()}"></div>
    <p class="daytype-note">Type de journée sélectionné dans "Programme" : <b>${NUTRI_DAY_LABELS[dayType]}</b></p>
    <div id="nutri-journal-groups">${groupsHtml()}</div>
    <div class="nutri-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <h3 style="margin:0;">Journal du jour</h3>
        <button class="btn-line" id="nj-reset">Réinitialiser</button>
      </div>
      <div id="nutri-journal-log">${logHtml()}</div>
    </div>
  `;

  document.getElementById('nj-date').addEventListener('change', (e) => {
    state.nutriJournalDate = e.target.value || todayStr();
    renderNutriJournal(screen);
  });

  function rebindGroupButtons(){
    screen.querySelectorAll('[data-add]').forEach(b => {
      b.addEventListener('click', () => addEntry(b.getAttribute('data-add'), parseInt(b.getAttribute('data-grams'),10)));
    });
    screen.querySelectorAll('[data-addcustom]').forEach(b => {
      b.addEventListener('click', () => {
        const gid = b.getAttribute('data-addcustom');
        const input = document.getElementById('njg-custom-'+gid);
        const val = parseInt(input.value,10);
        if(!val || val <= 0) return;
        addEntry(gid, val);
      });
    });
    bindLogButtons();
  }
  function bindLogButtons(){
    screen.querySelectorAll('[data-del]').forEach(b => {
      b.addEventListener('click', () => removeEntry(b.getAttribute('data-del')));
    });
    screen.querySelectorAll('[data-edit-start]').forEach(b => {
      b.addEventListener('click', () => {
        state.nutriEditingEntryId = b.getAttribute('data-edit-start');
        document.getElementById('nutri-journal-log').innerHTML = logHtml();
        bindLogButtons();
      });
    });
    screen.querySelectorAll('[data-edit-cancel]').forEach(b => {
      b.addEventListener('click', () => {
        state.nutriEditingEntryId = null;
        document.getElementById('nutri-journal-log').innerHTML = logHtml();
        bindLogButtons();
      });
    });
    screen.querySelectorAll('[data-edit-save]').forEach(b => {
      b.addEventListener('click', async () => {
        const id = b.getAttribute('data-edit-save');
        const input = screen.querySelector('[data-edit-input="'+id+'"]');
        const val = parseInt(input.value, 10);
        if(!val || val <= 0) return;
        const entry = state.nutriJournalEntries.find(e => e.id === id);
        if(entry) entry.grams = val;
        state.nutriEditingEntryId = null;
        await persistAndRerender();
      });
    });
  }
  rebindGroupButtons();

  async function persistAndRerender(){
    const ok = await saveNutriJournal(clientId, date, state.nutriJournalEntries);
    if(!ok){ showSaveError(); }
    document.getElementById('nutri-journal-groups').innerHTML = groupsHtml();
    document.getElementById('nutri-journal-log').innerHTML = logHtml();
    rebindGroupButtons();
  }

  async function addEntry(groupId, grams){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0'), mm = String(now.getMinutes()).padStart(2,'0');
    state.nutriJournalEntries.push({id:'e'+Date.now()+Math.random().toString(16).slice(2,6), groupId, grams, time:hh+":"+mm});
    await persistAndRerender();
  }
  async function removeEntry(entryId){
    state.nutriJournalEntries = state.nutriJournalEntries.filter(e => e.id !== entryId);
    await persistAndRerender();
  }

  document.getElementById('nj-reset').addEventListener('click', async () => {
    if(!confirm("Réinitialiser le journal de cette journée ?")) return;
    state.nutriJournalEntries = [];
    await persistAndRerender();
  });
}

async function renderNutriRessources(screen){
  screen.innerHTML = `
    <div class="nutri-intro">🧮 <span><b>Onglet réservé au coach —</b> les formules et repères utilisés pour construire les chiffres du programme. Elles servent de base au calcul, à ajuster ensuite au ressenti et au suivi de chaque personne.</span></div>

    <div class="nutri-card">
      <h3>1. Métabolisme de base (BMR) <span class="res-tag">Black &amp; al., 1996</span></h3>
      <p style="font-size:12.5px;color:var(--ink-soft);">Équation en puissance (poids, taille, âge), issue de 574 mesures par eau doublement marquée — enseignée en BTS Diététique.</p>
      <div class="res-formula"><code>Femme : BMR(MJ/j) = 0,963 × P^0,48 × T^0,5 × Â^−0,13
Homme : BMR(MJ/j) = 1,083 × P^0,48 × T^0,5 × Â^−0,13
P = poids (kg)   T = taille (m)   Â = âge (années)
BMR(kcal/j) = BMR(MJ/j) × 1000 ÷ 4,1855</code></div>
      <div class="res-source">Black AE, Coward WA, Cole TJ, Prentice AM. Eur J Clin Nutr, 1996;50(2):72-92.</div>
    </div>

    <div class="nutri-card">
      <h3>2. Dépense totale (TDEE) &amp; coefficients d'activité</h3>
      <div class="res-formula"><code>TDEE = BMR × NAP (niveau d'activité physique)</code></div>
      <table class="res-table"><thead><tr><th>Type de journée (dans ce module)</th><th>Coefficient</th></tr></thead>
        <tbody>
          <tr><td>Repos</td><td>× 1,375</td></tr>
          <tr><td>Entraînement modéré</td><td>× 1,55</td></tr>
          <tr><td>Entraînement intense</td><td>× 1,725</td></tr>
        </tbody>
      </table>
    </div>

    <div class="nutri-card">
      <h3>3. Protéines</h3>
      <div class="res-formula"><code>Protéines (g/j) = poids(kg) × 1,8</code></div>
      <p style="font-size:12.5px;color:var(--ink-soft);">Repère 1,6 à 2,2 g/kg pour une population sportive générale (jusqu'à 2,2-2,5 g/kg en restriction calorique).</p>
      <div class="res-source">ISSN Position Stand, Jäger et al., J Int Soc Sports Nutr, 2017.</div>
    </div>

    <div class="nutri-card">
      <h3>4. Glucides</h3>
      <table class="res-table"><thead><tr><th>Charge d'entraînement</th><th>Repère</th></tr></thead>
        <tbody>
          <tr><td>Repos / faible</td><td>4 g/kg/j (dans ce module)</td></tr>
          <tr><td>Modérée</td><td>6 g/kg/j</td></tr>
          <tr><td>Élevée / intense</td><td>8 g/kg/j</td></tr>
        </tbody>
      </table>
      <div class="res-source">Repères CIO — Burke LM et al., J Sports Sci, 2011.</div>
    </div>

    <div class="nutri-card">
      <h3>5. Lipides &amp; hydratation</h3>
      <div class="res-formula"><code>Lipides (g) = (TDEE − kcal protéines − kcal glucides) ÷ 9, plancher 1 g/kg
Eau (L/j)  = poids(kg) × 0,035 + bonus entraînement (0 / 0,5 / 0,8 L)</code></div>
      <div class="res-source">Repères ANSES / consensus nutrition sportive.</div>
    </div>

    <div class="nutri-card">
      <h3>6. Micronutriments — repères utilisés</h3>
      ${NUTRI_MICROS.map(m => `<div class="micro-row"><span class="mr-name">${m.name}</span><span class="mr-val">${m.val}</span></div>`).join('')}
      <div class="res-source">ANSES — Références Nutritionnelles pour la Population française (2021) / EFSA.</div>
    </div>

    <div class="nutri-tip">Ces formules donnent un point de départ chiffré ; les valeurs affichées pour chaque personne sont à recalculer et ajuster au ressenti et au suivi réel, jamais appliquées à un profil avec pathologie.</div>
  `;
}

/*
  Rend l'app installable (PWA) : une fois le service worker enregistré, le navigateur propose
  d'installer BluePerf.suivi sur l'écran d'accueil (mobile ou ordinateur), et la coquille de l'app
  reste utilisable même hors-ligne ou en connexion instable. Les données restent toujours en ligne
  (voir sw.js : /api/* n'est jamais mis en cache).
*/
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
